<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bloqueado · Stoic</title>
<link rel="stylesheet" href="ui.css">
<style>
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .box{max-width:460px;width:100%;text-align:center}
  .ico{font-size:56px;line-height:1;margin-bottom:8px}
</style>
</head><body>
<div class="box">
  <div class="ico">🏛️</div>
  <h1 id="title">Hoy ya no hay más tiempo para esto</h1>
  <p class="dim" id="site"></p>
  <div class="card">
    <div class="big no" id="nums">—</div>
    <div class="bar over"><i id="fill" style="width:100%"></i></div>
    <p class="sm dim" id="detail"></p>
  </div>
  <p class="dim" id="how"></p>
  <div class="row" style="justify-content:center">
    <button class="ac" id="open">Abrir Stoic</button>
    <button id="recheck">Revisar de nuevo</button>
  </div>
  <p class="sm dimmer" style="margin-top:14px" id="auto">Cuando recuperes tiempo, esta página te regresa sola.</p>
</div>
<script type="module" src="blocked.js"></script>
</body></html>
