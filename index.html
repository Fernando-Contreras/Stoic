/* ═══ STREAKS — 2 colors only ═══ */
function renderStreaks(sk_){
  const card=dv('card mt12');
  const hdr=dv('rowb mb8');
  hdr.appendChild(dv('ctit',t('streaks-title')));
  const editBtn=bt('btn-ghost btn-sm',STATE.editingStreaks?'✕ Done':'✏️ Edit',()=>{STATE.editingStreaks=!STATE.editingStreaks;refresh();});
  hdr.appendChild(editBtn);
  card.appendChild(hdr);

  const mutuallyExclusive={
    earlyBedStreak:'lateStreak',lateStreak:'earlyBedStreak',
    substancesStreak:'substancesPenaltyStreak',substancesPenaltyStreak:'substancesStreak',
    procrastinationStreak:'procrastinationPenaltyStreak',procrastinationPenaltyStreak:'procrastinationStreak',
    macanazoStreak:'macanazoPenaltyStreak',macanazoPenaltyStreak:'macanazoStreak',
  };

  function makeStreakItem(item, cls, numCls){
    const c=dv('skc '+cls);
    if(STATE.editingStreaks){
      // Show current value as editable input
      const cur=sk_[item.k]||0;
      const inp=ip('number','',cur===0?'':cur,'—');
      inp.min=0;inp.style.cssText='width:54px;text-align:center;font-size:1.3rem;font-weight:700;background:transparent;border:none;border-bottom:2px solid var(--ac);color:var(--ac);padding:2px 0;outline:none;';
      const lbl=dv('skl');lbl.textContent=item.l;
      c.appendChild(inp);c.appendChild(lbl);
      let committed=false;
      function commit(){
        if(committed) return;
        committed=true;
        const raw=inp.value.trim();
        if(raw===''){ refresh(); return; }
        const v=parseInt(raw);
        if(isNaN(v)||v<0){ refresh(); return; }

        const fieldMap={
          morningStreak:'morning', flagStreak:'flags',
          workStreak:'work', earlyBedStreak:'early', lateStreak:'late',
          substancesPenaltyStreak:'drugs', procrastinationPenaltyStreak:'internet', macanazoPenaltyStreak:'macanazo',
        };
        const field=fieldMap[item.k];
        const tk=todayKey();

        if(field){
          if(v===0){
            delete STATE.streakOverrides[item.k];
            if(field==='morning') STATE.today.morningCompleted=false;
            else if(field==='flags') STATE.today.flagCompleted=false;
            else if(field==='work'){ if(STATE.today.work) STATE.today.work.workDuration=0; }
            else if(field==='early'){ if(STATE.today.sleep) STATE.today.sleep.sleptEarly=false; }
            else if(field==='late'){ if(STATE.today.sleep) STATE.today.sleep.sleptLate=false; }
            else if(field==='drugs'||field==='internet'||field==='macanazo'){
              STATE.today.penalties=(STATE.today.penalties||[]).filter(p=>p.type!==field);
            }
          } else {
            // STEP 1+2 — mark TODAY so natural includes it; offset is computed afterward (STEP 4 below)
            if(field==='morning') STATE.today.morningCompleted=true;
            else if(field==='flags') STATE.today.flagCompleted=true;
            else if(field==='work'){ if(!STATE.today.work) STATE.today.work={}; if(!STATE.today.work.workDuration||STATE.today.work.workDuration<=0) STATE.today.work.workDuration=1; }
            else if(field==='early'){ if(!STATE.today.sleep) STATE.today.sleep={}; STATE.today.sleep.sleptEarly=true; if(!STATE.today.sleep.sleepDuration) STATE.today.sleep.sleepDuration=1; }
            else if(field==='late'){ if(!STATE.today.sleep) STATE.today.sleep={}; STATE.today.sleep.sleptLate=true; }
            else if(field==='drugs'||field==='internet'||field==='macanazo'){
              if(!STATE.today.penalties) STATE.today.penalties=[];
              const has=STATE.today.penalties.some(p=>p.type===field);
              if(!has) STATE.today.penalties.push({id:'streak-seed-'+Date.now(),type:field,count:field==='internet'?35:1,details:field==='drugs'?{substances:1}:field==='internet'?{minutes:35}:{isPositive:false},timestamp:new Date().toISOString()});
            }

            // STEP 3 — propagate backward ONLY into already-registered days (never invented)
            const sorted=[...STATE.history].filter(h=>!h._gap&&h.date!==tk).sort((a,b)=>a.date.localeCompare(b.date));
            const daysToMark=Math.min(Math.max(0,v-1), sorted.length);
            const startIdx=sorted.length-daysToMark;
            for(let i=startIdx;i<sorted.length;i++){
              const d=sorted[i];
              if(field==='morning'){
                if(!d.streaks) d.streaks=[{type:'morning',count:0,active:false},{type:'flags',count:0,active:false}];
                const ms=d.streaks.find(s=>s.type==='morning'); if(ms){ms.active=true;ms.count=1;}
              } else if(field==='flags'){
                if(!d.streaks) d.streaks=[{type:'morning',count:0,active:false},{type:'flags',count:0,active:false}];
                const fs=d.streaks.find(s=>s.type==='flags'); if(fs){fs.active=true;fs.count=1;}
              } else if(field==='work'){
                if(!d.workDuration||d.workDuration<=0) d.workDuration=1;
              } else if(field==='early'){
                d.sleptEarly=true; if(!d.sleepDuration) d.sleepDuration=1;
              } else if(field==='late'){
                d.sleptLate=true;
              } else if(field==='drugs'||field==='internet'||field==='macanazo'){
                if(!d.penalties) d.penalties=[];
                const has=d.penalties.some(p=>p.type===field);
                if(!has) d.penalties.push({type:field,count:field==='internet'?35:1,points:0,streak:1});
              }
            }
          }
          if(v>0){
            // Compute offset using the natural value AFTER today is marked + history propagated
            const naturalAfter=(CALC.streaks(STATE.history,STATE.today)[item.k])||0;
            STATE.streakOverrides[item.k]=v-naturalAfter;
          }
          S.set(K.HIST,STATE.history);
        }
        S.set(K.STREAK_OVR,STATE.streakOverrides);
        commitAndRefresh();
      }
      inp.onkeydown=e=>{
        if(e.key==='Enter'){commit();inp.blur();}
        else if(e.key==='Escape'){committed=true;STATE.editingStreaks=false;refresh();}
      };
      inp.onblur=()=>commit();
    } else {
      const n=dv('skn '+numCls);n.textContent=String(sk_[item.k]||0);
      const l=dv('skl');l.textContent=item.l;
      c.appendChild(n);c.appendChild(l);
    }
    return c;
  }

  card.appendChild(dv('xs dimmer up ls mb8',t('pos-streaks')));
  const pg=dv('sk-g mb16');
  [{k:'morningStreak',l:t('sk-morning')},{k:'flagStreak',l:t('sk-goals')},{k:'workStreak',l:t('sk-work')},
   {k:'earlyBedStreak',l:t('slept-early')},
   {k:'substancesStreak',l:t('sk-ci')},{k:'procrastinationStreak',l:t('sk-cp')},{k:'macanazoStreak',l:t('sk-co')}]
  .forEach(item=>pg.appendChild(makeStreakItem(item,'pos','ac')));
  card.appendChild(pg);

  card.appendChild(dv('xs dimmer up ls mb8',t('rew-streaks')));
  const ng=dv('sk-g');
  [{k:'substancesPenaltyStreak',l:t('sk-i')},{k:'procrastinationPenaltyStreak',l:t('sk-p')},{k:'macanazoPenaltyStreak',l:t('sk-o')},{k:'lateStreak',l:t('sk-l')}]
  .forEach(item=>ng.appendChild(makeStreakItem(item,'neg','ng')));
  card.appendChild(ng);

  if(STATE.editingStreaks){
    const clearBtn=bt('btn-ghost btn-sm mt10',t('clear-ovr'),()=>{STATE.streakOverrides={};STATE.editingStreaks=false;S.set(K.STREAK_OVR,{});SB.push(STATE.history,STATE.today,STATE.diary,STATE.streakOverrides).catch(()=>{});refresh();});
    clearBtn.style.marginTop='12px';card.appendChild(clearBtn);
  }
  return card;
}

/* Both halves of the calendar row read a day from the same place: history with
   its gaps filled, with anything actually logged laid over it. */
function histMap(){
  const m=new Map(CALC.fillGaps(STATE.history).map(d=>[d.date,d]));
  STATE.history.forEach(d=>m.set(d.date,d));
  return m;
}

/* ═══ CALENDAR — #5 pts visible, #8 flag glow ═══ */
/* Picking a day no longer opens the day underneath the grid; it fills the panel
   beside it, which is where the note now lives. onPick redraws that panel. */
function renderCalendar(onPick){
  const wrap=dv('card');const now=new Date();
  if(!STATE.calYM)STATE.calYM={y:now.getFullYear(),m:now.getMonth()};
  let cY=STATE.calYM.y,cM=STATE.calYM.m;
  const isLight=document.body.classList.contains('light');
  const sBg=isLight
    ? {red:{bg:'#fecaca',txt:'#991b1b'},yellow:{bg:'#fef08a',txt:'#854d0e'},green:{bg:'#bbf7d0',txt:'#14532d'},purple:{bg:'#e9d5ff',txt:'#581c87'},none:{bg:'#e2e8f0',txt:'#94a3b8'}}
    : {red:{bg:'#2e0808',txt:'#fca5a5'},yellow:{bg:'#2e2008',txt:'#fde68a'},green:{bg:'#082e1a',txt:'#6ee7b7'},purple:{bg:'#16082e',txt:'#c4b5fd'},none:{bg:'#111118',txt:'#2a2a3a'}};

  function build(){
    wrap.innerHTML='';
    const hd=dv('rowb mb12');
    const pv=bt('btn-icon','‹',()=>{cM--;if(cM<0){cM=11;cY--;}STATE.calYM={y:cY,m:cM};build();});pv.style.fontSize='20px';
    const nx=bt('btn-icon','›',()=>{cM++;if(cM>11){cM=0;cY++;}STATE.calYM={y:cY,m:cM};build();});nx.style.fontSize='20px';
    hd.appendChild(pv);hd.appendChild(sp('lg w7',capFirst(new Date(cY,cM).toLocaleDateString(STATE.lang==='es'?'es-MX':'en-US',{month:'long',year:'numeric'}))));hd.appendChild(nx);wrap.appendChild(hd);

    // #6: use history with gaps filled for calendar display
    const hMap=histMap();
    const medals=medalsByDate();

    const dim=new Date(cY,cM+1,0).getDate();const fd=new Date(cY,cM,1).getDay();
    const tk=todayKey();
    /* Today is still being lived, so its cell must read from STATE.today
       through CALC.score — the very call the score card makes. It used to
       render whatever stale entry history held for today and score it with
       liveScore, which is built for closed days and recomputes streaks
       differently, so the two disagreed: +186 up top against -295 down here. */
    const liveSk=applyStreakOverrides(CALC.streaks(STATE.history,STATE.today));
    const liveToday=CALC.score(STATE.today,liveSk);
    const cg=dv('cal-g mb10');
    (STATE.lang==='es'?['Do','Lu','Ma','Mi','Ju','Vi','Sa']:['Su','Mo','Tu','We','Th','Fr','Sa']).forEach(d=>cg.appendChild(dv('cal-hd',d)));
    for(let i=0;i<fd;i++)cg.appendChild(dv(''));
    for(let d=1;d<=dim;d++){
      const key=(()=>{const _d=new Date(cY,cM,d);return _d.getFullYear()+'-'+String(_d.getMonth()+1).padStart(2,'0')+'-'+String(_d.getDate()).padStart(2,'0');})();
      const entry=hMap.get(key);
      const isToday=key===tk;
      const status=isToday?liveToday.status:(entry?entry.status:null);
      const bg=status?(sBg[status]||sBg.none):sBg.none;
      const cell=dv(`cal-c${isToday?' today':''}${key===STATE.calSel?' sel':''}`);
      cell.style.background=bg.bg;
      const flagOn=isToday?!!STATE.today.flagCompleted
                          :entry?.streaks?.some(s=>s.type==='flags'&&s.active);
      if(flagOn){
        // #8: prominent ring + icon
        const ring=dv('cal-flag-ring');cell.appendChild(ring);
        cell.appendChild(sp('cal-flag-ico','🏅'));
      }
      /* A medal earned that day, kept on the day it was earned. The flag ring
         says what the day was; this says what the day finished. */
      const won=medals.get(key);
      if(won&&won.length){
        const mk=sp('cal-medal',won.length>1?'🎖️':won[0].kind.icon);
        mk.title=won.map(x=>`${t(x.kind.name)} · ${x.n}`).join('\n');
        cell.appendChild(mk);
      }
      const num=sp('cal-num',String(d));num.style.color=bg.txt;cell.appendChild(num);
      // #5: always show pts if entry exists
      if(isToday||entry){
        const val=isToday?liveToday.total:CALC.liveScore(entry,STATE.history);
        const pts=sp('cal-pts',String(val));pts.style.color=bg.txt;cell.appendChild(pts);
      }
      cell.onclick=()=>{STATE.calSel=key===STATE.calSel?null:key;build();if(onPick)onPick();};
      cg.appendChild(cell);
    }
    wrap.appendChild(cg);
  }
  build();return wrap;
}

/* Which streaks a day of this colour resets — shown against the day itself,
   since the rule holds for any day that lands on that colour. */
function resetEmojis(status){
  if(status==='red')return'💼🔄';
  if(status==='yellow')return'💊🔄';
  if(status==='green')return'💊🌐🔄';
  if(status==='purple')return'💊🌐💦🌙🔄';
  return'';
}
function resetTooltip(status){
  if(status==='red')return t('reset-work');
  if(status==='yellow')return t('reset-indulg');
  if(status==='green')return t('reset-ip');
  if(status==='purple')return t('reset-all');
  return'';
}

/* ═══ DAY PANEL — the day you picked on the calendar ═══
   It holds what used to hang underneath the grid — colour, points, the day's
   line — and gives the note the whole of the room the history list used to
   take. The numbers themselves are edited through ✏, which opens them over
   the page for the same day. */
function renderDayPanel(){
  const wrap=dv('card');
  const key=STATE.calSel;
  const hd=dv('rowb mb12');
  hd.appendChild(sp('ctit',key
    ? capFirst(new Date(key+'T12:00:00').toLocaleDateString(STATE.lang==='es'?'es-MX':'en-US',{weekday:'long',day:'numeric',month:'long'}))
    : t('day-panel')));
  if(key){
    /* It says what it does. A lone pencil is a fine thing to find on a toy and
       a bad thing to hide a day's numbers behind: fixing a day you forgot to
       log is not a flourish, it is the repair you reach for most. */
    const eb=bt('btn-ghost btn-sm',t('edit-hist'),()=>{STATE.histDay=key;render();});
    eb.style.whiteSpace='nowrap';hd.appendChild(eb);
  }
  wrap.appendChild(hd);
  if(!key){wrap.appendChild(dv('sm dimmer ctr mt16 mb16',t('pick-day')));return wrap;}

  const isToday=key===todayKey();
  const entry=histMap().get(key);
  // Today is still being lived, so it is scored from STATE.today through the
  // very call the score card makes, never from a stale history entry.
  const live=isToday?CALC.score(STATE.today,applyStreakOverrides(CALC.streaks(STATE.history,STATE.today))):null;

  if(isToday||entry){
    const status=isToday?live.status:entry.status;
    const dr=dv('rowb');
    const lft=dv('row gap6');
    lft.appendChild(sbadge(status));
    if(isToday){const b=sp('badge s-'+status,t('Today'));lft.appendChild(b);}
    const re=sp('xs dimmer',resetEmojis(status));
    re.title=resetTooltip(status);re.style.cursor='help';lft.appendChild(re);
    dr.appendChild(lft);
    dr.appendChild(sp('lg mo w7 ac',`${isToday?live.total:CALC.liveScore(entry,STATE.history)} pts`));
    wrap.appendChild(dr);
    // Format: 21/28 tasks · 20 🍅 · 🏅 ×37
    const flagActive=isToday?!!STATE.today.flagCompleted:entry.streaks?.some(s=>s.type==='flags'&&s.active);
    const flagStreak=entry?.streaksUsed?.flagStreak||entry?.streaksUsed?.flagstreak||'';
    const parts=[
      `${(isToday?STATE.today.completed:entry.completedTasks)||0}/${(isToday?STATE.today.target:entry.totalTasks)||0} tasks`,
      `${(isToday?STATE.today.pomodoros:entry.pomodoros)||0} 🍅`,
      ...(flagActive?[isToday?'🏅':`🏅 ×${flagStreak||'?'}`]:[])
    ];
    const line=dv('xs dim mt6');line.textContent=parts.join(' · ');wrap.appendChild(line);
    if(!isToday&&entry?._gap)wrap.appendChild(dv('xs ng mt4',t('day-not-logged')));
    // What this day earned, spelled out — the calendar only has room for a mark.
    const won=medalsByDate().get(key)||[];
    won.forEach(w=>wrap.appendChild(dv('xs mt4',
      `<span class="w7" style="color:${w.kind.hue}">${w.kind.icon} ${t(w.kind.name)} · ${w.n}</span>`)));
  } else {
    wrap.appendChild(dv('xs dimmer',t('no-data')));
  }

  // The note: read it formatted, or open it and write. Opening hides the
  // reading copy so the day is not shown twice at once.
  const nb=bt('btn-ghost btn-sm','📝 '+(STATE.diary[key]?t('edit-note'):t('add-note')),()=>{
    wrap.querySelectorAll('.note-prev').forEach(pv=>pv.style.display='none');
    toggleDiaryEditor(wrap,key,nb);
  });
  nb.style.cssText='margin-top:12px;display:block';wrap.appendChild(nb);
  if(STATE.diary[key]){
    const body=noteBody(STATE.diary[key]);
    const folded=!!STATE.diaryFold[key];
    /* The title heads the note and folds it: one click puts the template away
       and leaves the summary, which is the part worth re-reading. A note with
       no summary in it has nothing to fold, so it stays whole. */
    const cut=summaryCut(body);
    const head=dv('row gap6 mt10 note-prev');
    head.style.cssText='cursor:pointer;align-items:baseline';
    if(cut>=0)head.appendChild(sp('sm dimmer',folded?'▸':'▾'));
    const title=noteTitle(STATE.diary[key]);
    head.appendChild(sp(title?'xl w7 ac':'xl w7 dimmer',title||t('day-untitled')));
    head.onclick=()=>{if(cut>=0){STATE.diaryFold[key]=!folded;refresh();}};
    wrap.appendChild(head);
    const preview=dv('sm dim mt8 note-prev');
    preview.style.cssText='white-space:pre-wrap;line-height:1.6';
    preview.innerHTML=diaryToHtml(folded&&cut>=0?body.split('\n').slice(cut).join('\n'):body);
    wrap.appendChild(preview);
  }
  return wrap;
}

/* Where the summary starts in a note — the fold leaves everything from there
   down. Both languages are checked: a note written in Spanish still folds when
   the app is read in English. */
function summaryCut(body){
  const sums=[T.es['tpl-summary'],T.en['tpl-summary']];
  return body.split('\n').findIndex(l=>sums.includes(l.trim()));
}

/* The day's numbers. Saving writes the day, pushes it, and re-renders — the
   panel beside the calendar then reads back what was just saved. */
function renderHistForm(key){
  const e=histMap().get(key);
  const fst={completed:e?.completedTasks||0,target:e?.totalTasks||0,pomodoros:e?.pomodoros||0,workDuration:e?.workDuration||0,
    sleepDuration:e?.sleepDuration||0,napDuration:e?.napDuration||0,sleptEarly:e?.sleptEarly||false,

  g.appendChild(nf(t('pom-lbl'),fst.pomodoros,v=>fst.pomodoros=v));g.appendChild(df(t('work-lbl'),fst.workDuration,v=>fst.workDuration=v));
  g.appendChild(df(t('main-sleep'),fst.sleepDuration,v=>fst.sleepDuration=v));g.appendChild(df(t('nap-lbl'),fst.napDuration,v=>fst.napDuration=v));
  g.appendChild(nf(t('indulg-hash'),fst.substances,v=>fst.substances=v));g.appendChild(df(t('proc-lbl'),fst.procMins,v=>fst.procMins=v));
  g.appendChild(nf(t('org-hash'),fst.macanazoCount,v=>fst.macanazoCount=v));form.appendChild(g);
  const cks=dv('row gap16 mb10');cks.style.flexWrap='wrap';
  function ck(label,val,onChange){const w=dv('row gap6');w.style.cursor='pointer';const c=ip('checkbox','');c.checked=val;c.onchange=()=>onChange(c.checked);w.appendChild(c);w.appendChild(sp('sm',label));w.onclick=ev=>{if(ev.target!==c){c.checked=!c.checked;c.dispatchEvent(new Event('change'));}};return w;}
  cks.appendChild(ck(t('morning-routine'),fst.morningCompleted,v=>fst.morningCompleted=v));cks.appendChild(ck(t('goals-ann'),fst.flagCompleted,v=>fst.flagCompleted=v));cks.appendChild(ck(t('early-bed'),fst.sleptEarly,v=>fst.sleptEarly=v));cks.appendChild(ck(t('late-bed'),fst.sleptLate,v=>fst.sleptLate=v));form.appendChild(cks);
  const sb=bt('btn-ac btn-sm',t('save-btn'),()=>{

    if(fst.procMins>0)pens.push({type:'internet',count:fst.procMins,points:CALC.penBase({type:'internet',details:{minutes:fst.procMins}}),streak:1});
    for(let i=0;i<fst.macanazoCount;i++)pens.push({type:'macanazo',count:1,points:CALC.penBase({type:'macanazo',details:{isPositive:false}}),streak:1});
    const mockDay={completed:fst.completed,target:fst.target,morningCompleted:fst.morningCompleted,flagCompleted:fst.flagCompleted,pomodoros:fst.pomodoros,
      penalties:pens.map(p=>({type:p.type,count:p.count,details:p.type==='drugs'?{substances:p.count}:p.type==='internet'?{minutes:p.count}:{isPositive:false}})),
      sleep:{sleepDuration:fst.sleepDuration,napDuration:fst.napDuration,sleptEarly:fst.sleptEarly,sleptLate:fst.sleptLate||false,earlyBedStreak:1},work:{workDuration:fst.workDuration}};
    const fsk={morningStreak:1,flagStreak:1,substancesPenaltyStreak:1,procrastinationPenaltyStreak:1,macanazoPenaltyStreak:1,lateStreak:1,substancesStreak:0,procrastinationStreak:0,macanazoStreak:0,workStreak:0};
    const sc_=CALC.score(mockDay,fsk);
    upsertHist({date:key,_ts:CLOCK.now(),todayPoints:sc_.total,status:sc_.status,completedTasks:fst.completed,totalTasks:fst.target,pomodoros:fst.pomodoros,sleepDuration:fst.sleepDuration,napDuration:fst.napDuration,sleptEarly:fst.sleptEarly,sleptLate:fst.sleptLate||false,workDuration:fst.workDuration,penalties:pens,_gap:false,
      streaks:[{type:'morning',count:fst.morningCompleted?1:0,active:fst.morningCompleted},{type:'flags',count:fst.flagCompleted?1:0,active:fst.flagCompleted}]},key);
    // Save locally AND push to Supabase immediately
    S.set(K.HIST,STATE.history);
    SB.push(STATE.history,STATE.today,STATE.diary,STATE.streakOverrides).catch(()=>{});
    STATE.histDay=null;
    refresh();
  });form.appendChild(sb);
  return form;
}

/* ═══ STATS — #7 more interesting stats ═══ */
function renderStats(total,sc){
  const wrap=dv('card mt12');let open=true;
  const tog=el('button','sec-t');tog.innerHTML=`<span>${t('stats-title')}</span><span id="st-a">▲</span>`;
  const body=dv('fi');
  tog.onclick=()=>{open=!open;body.style.display=open?'':'none';document.getElementById('st-a').textContent=open?'▲':'▼';};
  wrap.appendChild(tog);

  const isEs=STATE.lang==='es';

  // ── Computed values ──────────────────────────────────────────────────────
  const allPts=STATE.history.filter(d=>!d._gap).map(d=>CALC.liveScore(d,STATE.history));
  const last7=STATE.history.filter(d=>!d._gap).slice(0,7).map(d=>CALC.liveScore(d,STATE.history));
  const best=allPts.length?Math.max(...allPts):0;
  const worst=allPts.length?Math.min(...allPts):0;
  const avg=allPts.length?Math.round(allPts.reduce((a,b)=>a+b,0)/allPts.length):0;
  const avg7=last7.length?Math.round(last7.reduce((a,b)=>a+b,0)/last7.length):0;
  const totalTracked=STATE.history.filter(d=>!d._gap).length;
  const sortedH=[...STATE.history].sort((a,b)=>new Date(a.date)-new Date(b.date));
  /* This week against your own average, as a percentage of it. Two things kept
     it from meaning anything. It divided by a signed average, so with a
     negative one a better week came out negative — an improvement reported as
     a slump. And it divided by however small the average was, so an average of
     +45 against a week of −380 read as −937%: arithmetically true, and no use
     to anyone. Below a hundred points either way the baseline is too small to
     divide by, and the reading is set aside rather than dressed up. */
  const momentum=Math.abs(avg)>=100
    ? Math.max(-300,Math.min(300,Math.round((avg7-avg)/Math.abs(avg)*100)))
    : 0;

  // Streaks
  let bStrk=0,curStrk=0;sortedH.forEach(d=>{if(d.status!=='red'&&!d._gap){curStrk++;bStrk=Math.max(bStrk,curStrk);}else curStrk=0;});
  let pfStrk=0;for(let k=0;k<sortedH.length;k++){if(!sortedH[sortedH.length-1-k].penalties?.length&&!sortedH[sortedH.length-1-k]._gap)pfStrk++;else break;}
  let bestMornStrk=0,curMorn=0;sortedH.forEach(d=>{if(d.morningCompleted&&!d._gap){curMorn++;bestMornStrk=Math.max(bestMornStrk,curMorn);}else curMorn=0;});
  let bestDFStrk=0,curDF=0;sortedH.forEach(d=>{if(!d.penalties?.some(p=>p.type==='drugs')&&!d._gap){curDF++;bestDFStrk=Math.max(bestDFStrk,curDF);}else curDF=0;});

  // Work & focus
  const totalPoms=STATE.history.reduce((s,d)=>s+(d.pomodoros||0),0)+(STATE.today.pomodoros||0);
  const totalWorkMin=STATE.history.reduce((s,d)=>s+(d.workDuration||0),0)+(STATE.today.work?.workDuration||0);
  const workDays=STATE.history.filter(d=>!d._gap&&(d.workDuration||0)>0).length;
  const workPct=totalTracked>0?Math.round(workDays/totalTracked*100):0;
  const pomPerDay=totalTracked>0?Math.round(totalPoms/totalTracked*10)/10:0;
  const totalProcMin=STATE.history.reduce((s,d)=>s+(d.penalties?.filter(p=>p.type==='internet').reduce((a,p)=>a+(p.duration||0),0)||0),0);

  // Sleep
  const totalSleepMin=STATE.history.reduce((s,d)=>s+(d.sleepDuration||0),0)+(STATE.today.sleep?.sleepDuration||0);
  const avgSleepMin=totalTracked>0?Math.round(STATE.history.filter(d=>!d._gap).reduce((s,d)=>s+(d.sleepDuration||0),0)/totalTracked):0;
  const earlyNights=STATE.history.filter(d=>d.sleptEarly).length;
  const lateNights=STATE.history.filter(d=>d.sleptLate).length;

  // Discipline %
  const drugFreeDays=STATE.history.filter(d=>!d.penalties?.some(p=>p.type==='drugs')&&!d._gap).length;
  const dfPct=totalTracked?Math.round(drugFreeDays/totalTracked*100):100;
  const procFreeDays=STATE.history.filter(d=>!d.penalties?.some(p=>p.type==='internet')&&!d._gap).length;
  const procFreePct=totalTracked?Math.round(procFreeDays/totalTracked*100):100;
  const orgFreeDays=STATE.history.filter(d=>!d.penalties?.some(p=>p.type==='macanazo')&&!d._gap).length;
  const orgFreePct=totalTracked?Math.round(orgFreeDays/totalTracked*100):100;
  const totalOrgasms=STATE.history.reduce((s,d)=>s+(d.penalties?.filter(p=>p.type==='macanazo').length||0),0);
  const totalIndulgences=STATE.history.reduce((s,d)=>s+(d.penalties?.filter(p=>p.type==='drugs').reduce((a,p)=>a+(p.count||1),0)||0),0);

  // Day color counts
  const counts={purple:0,green:0,yellow:0,red:0};STATE.history.forEach(d=>counts[d.status]=(counts[d.status]||0)+1);
  const purplePct=totalTracked?Math.round((counts.purple/totalTracked)*100):0;

  // Most productive day EVER (highest workDuration)
  let bestWorkDay=null,bestWorkMin=0;
  sortedH.filter(d=>!d._gap).forEach(d=>{if((d.workDuration||0)>bestWorkMin){bestWorkMin=d.workDuration;bestWorkDay=d.date;}});
  const prodEverStr=bestWorkDay?bestWorkDay.slice(5):'—'; // MM-DD
  const prodEverSub=bestWorkDay?fmtDur(bestWorkMin):(isEs?'Sin datos':'No data');

  // Horniest day EVER (most orgasms in one day)
  let bestOrgDay=null,bestOrgCount=0;
  sortedH.filter(d=>!d._gap).forEach(d=>{const c=d.penalties?.filter(p=>p.type==='macanazo').length||0;if(c>bestOrgCount){bestOrgCount=c;bestOrgDay=d.date;}});
  const hornEverStr=bestOrgDay?bestOrgDay.slice(5):'—';
  const hornEverSub=bestOrgDay?(bestOrgCount+' '+(isEs?'orgasmo(s)':'orgasm(s)')):(isEs?'Sin datos':'No data');

  // Most productive & horniest day OF THE WEEK (by average)
  const dowNames=isEs?['Dom','Lun','Mar','Mié','Jue','Vie','Sáb']:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const dowWork=[],dowOrg=[];for(let k=0;k<7;k++){dowWork.push([]);dowOrg.push([]);}
  sortedH.filter(d=>!d._gap).forEach(d=>{
    const dow=new Date(d.date+'T12:00:00').getDay();
    dowWork[dow].push(d.workDuration||0);
    dowOrg[dow].push(d.penalties?.filter(p=>p.type==='macanazo').length||0);
  });
  let prodDay=-1,prodAvg=0;
  dowWork.forEach((arr,k)=>{if(!arr.length)return;const a=arr.reduce((x,y)=>x+y,0)/arr.length;if(a>prodAvg){prodAvg=a;prodDay=k;}});
  let hornDay=-1,hornAvg=0;
  dowOrg.forEach((arr,k)=>{if(!arr.length)return;const a=arr.reduce((x,y)=>x+y,0)/arr.length;if(a>hornAvg){hornAvg=a;hornDay=k;}});
  const prodDayStr=prodDay>=0?dowNames[prodDay]:'—';
  const prodDaySub=prodDay>=0?('⌀ '+fmtDur(Math.round(prodAvg))):(isEs?'Sin datos':'No data');
  const hornDayStr=hornDay>=0?dowNames[hornDay]:'—';
  const hornDaySub=hornDay>=0?('⌀ '+hornAvg.toFixed(1)):(isEs?'Sin datos':'No data');

  // Insight
  let insight='';
  if(totalTracked<3)insight=isEs?'Sigue registrando días para ver estadísticas personalizadas.':'Keep logging days to see personalized insights.';
  else if(momentum>20)insight=isEs?`🚀 Momentum +${momentum}% — tu última semana supera tu promedio histórico.`:`🚀 Momentum +${momentum}% — your last week beats your all-time average.`;
  else if(momentum<-20)insight=isEs?`📉 Semana difícil (${momentum}%). El progreso no es una línea recta.`:`📉 Tough week (${momentum}%). Progress isn't linear.`;
  else if(dfPct===100)insight=isEs?'🌟 100% de días sin estimulantes. Disciplina consistente.':'🌟 100% stimulant-free days. Consistent discipline.';
  else if(pfStrk>7)insight=isEs?`✨ ${pfStrk} días sin penalizaciones. ¡Racha limpia!`:`✨ ${pfStrk} days with no rewards. Clean streak!`;
  else if(totalPoms>50)insight=isEs?`🍅 ${totalPoms} pomodoros = ${Math.round(totalPoms*25/60)}h de trabajo enfocado.`:`🍅 ${totalPoms} pomodoros = ${Math.round(totalPoms*25/60)}h of focused work.`;
  else insight=isEs?'📊 Construyendo historial. Más datos = mejores estadísticas.':'📊 Building history. More data = better insights.';

  function statCard(label,value,color,sub,size='xl'){
    const s=dv('card2 ctr');const n=dv(size+' w7 mo');n.style.color=color;n.textContent=value;
    s.appendChild(n);s.appendChild(dv('xs dimmer mt4',label));if(sub)s.appendChild(dv('xs dimmer',sub));return s;
  }
  function grid4(...cards){const g=dv('g4 mb10');g.style.gap='8px';cards.forEach(c=>g.appendChild(c));return g;}

  // ── 1. Score highlights ──────────────────────────────────────────────────
  const gA=dv('g4 mb10');gA.style.gap='8px';
  [[t('best-day'),best,'var(--ac)',t('pts-s')],[t('worst-day'),worst,'var(--ac)',t('pts-s')],
   [t('all-avg'),avg,'var(--ac)',t('pts-day')],[t('last7-avg'),avg7,'var(--ac)',t('pts-s')]].forEach(([l,v,c,sub])=>{
    const s=dv('card2 ctr');const n=dv('xxl w7 mo');n.style.color=c;n.textContent=String(v);
    s.appendChild(n);s.appendChild(dv('xs dimmer mt4',l));gA.appendChild(s);
  });body.appendChild(gA);

  // ── 2. Overview ──────────────────────────────────────────────────────────
  body.appendChild(grid4(
    statCard(t('total-days-lbl'),String(totalTracked),'var(--ac)',null),
    statCard(t('best-streak'),bStrk+'d','var(--cp)',isEs?'sin rojo':'non-red'),
    statCard(t('clean-streak'),pfStrk+'d','var(--ac)',isEs?'sin penalizaciones':'no rewards'),
    statCard(isEs?'Días morados':t('purple-days'),purplePct+'%','var(--cp)',counts.purple+'d')
  ));

  // ── 3. Work: Best days ───────────────────────────────────────────────────
  body.appendChild(grid4(
    statCard(isEs?'Día más productivo (ever)':'Most productive day',prodEverStr,'var(--ac)',prodEverSub),
    statCard(isEs?'Día más productivo (semana)':'Most productive day of week',prodDayStr,'var(--ac)',prodDaySub),
    statCard(t('work-total'),fmtDur(totalWorkMin),'var(--ac)',null),
    statCard(t('work-days-lbl'),workPct+'%','var(--ac)',workDays+'d')
  ));

  // ── 4. Work: Focus & Routine ─────────────────────────────────────────────
  body.appendChild(grid4(
    statCard(t('total-poms'),String(totalPoms),'var(--ac)',null),
    statCard(t('poms-day'),String(pomPerDay),'var(--ac)',null),
    statCard(t('best-morn-lbl'),bestMornStrk+'d','var(--ac)',null),
    statCard(t('total-proc-lbl'),fmtDur(totalProcMin),'var(--ng)',null)
  ));

  // ── 5. Orgasms ───────────────────────────────────────────────────────────
  body.appendChild(grid4(
    statCard(isEs?'Día más cachondo (ever)':'Horniest day',hornEverStr,'var(--ng)',hornEverSub),
    statCard(isEs?'Día más cachondo (semana)':'Horniest day of week',hornDayStr,'var(--ng)',hornDaySub),
    statCard(isEs?'Total orgasmos':'Total orgasms',String(totalOrgasms),'var(--ng)',null),
    statCard(t('clean-org'),orgFreePct+'%','var(--ac)',orgFreeDays+'d')
  ));

  // ── 6. Discipline ────────────────────────────────────────────────────────
  body.appendChild(grid4(
    statCard(t('clean-drugs'),dfPct+'%','var(--ac)',drugFreeDays+'d'),
    statCard(t('best-drug-free'),bestDFStrk+'d','var(--cg)',null),
    statCard(isEs?'Total estimulantes':'Total stimulants',String(totalIndulgences),'var(--ng)',null),
    statCard(t('clean-proc'),procFreePct+'%','var(--ac)',procFreeDays+'d')
  ));

  // ── 7. Sleep ─────────────────────────────────────────────────────────────
  body.appendChild(grid4(
    statCard(t('sleep-total'),fmtDur(totalSleepMin),'var(--ac)',null),
    statCard(t('avg-sleep'),fmtDur(avgSleepMin),'var(--ac)',isEs?'por noche':'per night'),
    statCard(t('early-nights'),earlyNights+'d','var(--cg)',null),
    statCard(t('late-nights-lbl'),lateNights+'d','var(--ng)',null)
  ));

  // ── 8. Day color counts ───────────────────────────────────────────────────
  const dr=dv('row gap8 mb10');
  [['purple','🟣'],['green','🟢'],['yellow','🟡'],['red','🔴']].forEach(([s,e])=>dr.appendChild(sp(`badge s-${s}`,`${e} ${counts[s]}d`)));
  body.appendChild(dr);

  // ── 8b. Medals ────────────────────────────────────────────────────────────
  /* The whole collection in one place. The calendar keeps each one on its own
     day, which is the record; this is the shelf. */
  // Each medal carries the day it was won, so the shelf can name the day.
  const allMedals=[...medalsByDate().entries()].flatMap(([d,l])=>l.map(m=>({...m,date:d})));
  const mbox=dv('card2 mb10');
  const mh=dv('rowb mb8');
  mh.appendChild(sp('xs dimmer up ls',t('medals-title')));
  mh.appendChild(sp('md mo w7 ac',String(allMedals.length)));
  mbox.appendChild(mh);
  if(!allMedals.length){
    mbox.appendChild(dv('xs dimmer',t('medals-none')));
  }else{
    const mg=dv('row gap6');mg.style.flexWrap='wrap';
    MEDAL_KINDS.forEach(k=>{
      const mine=allMedals.filter(m=>m.kind.k===k.k).sort((a,b)=>b.n-a.n);
      if(!mine.length)return;
      const chip=dv('row gap4');
      chip.style.cssText=`background:var(--sur2);border:1px solid ${k.hue}55;border-radius:8px;padding:4px 8px;align-items:baseline`;
      chip.title=t(k.name)+'\n'+mine.map(m=>m.n+' — '+m.date).join('\n');
      chip.appendChild(sp('sm',k.icon));
      chip.appendChild(sp('xs mo w7',String(mine[0].n)));
      if(mine.length>1)chip.appendChild(sp('xs dimmer','×'+mine.length));
      mg.appendChild(chip);
    });
    mbox.appendChild(mg);
  }
  body.appendChild(mbox);

  // ── 9. Insight ────────────────────────────────────────────────────────────
  const ib=dv('card2 s-ac fi');ib.appendChild(sp('sm dim',insight));body.appendChild(ib);

  wrap.appendChild(body);return wrap;
}

/* ═══ ONE TASK AND ITS OWN — opened from a parent's title ═══
   The same rows the list draws, so everything works here exactly as it does
   there: ticking, editing, adding another subtask. Only the surroundings are
   gone. Subtasks already finished today are shown too — a family reads wrong
   with half of it missing. */
function renderTaskTreeModal(id){
  const r=reminders().find(x=>x.id===id);
  if(!r){STATE.taskTree=null;return dv('');}
  const close=()=>{STATE.taskTree=null;render();};
  const ov=dv('fi');
  ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:60;'+
    'display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow:auto';
  ov.onclick=e=>{if(e.target===ov)close();};
  const panel=dv('card');
  panel.style.cssText='max-width:640px;width:100%;margin:auto';
  const tk=todayKey();
  const kids=subtasksOf(r.id).sort((a,b)=>a.due.localeCompare(b.due));
  const doneN=kids.filter(k=>k.done||k.completedOn===tk).length;
  const hd=dv('rowb mb12');
  const lft=dv('row gap6');
  lft.appendChild(sp('ctit',t('rem-open-tree')));
  if(kids.length)lft.appendChild(sp('sm mo dim',`${doneN}/${kids.length}`));
  hd.appendChild(lft);hd.appendChild(bt('btn-icon','✕',close));
  panel.appendChild(hd);
  const box=dv('s6');
  box.appendChild(renderReminderRow(r,tk,{prevTop:null,kids:kids.length}));
  kids.forEach(c=>{
    const w=dv('rem-sub');
    w.appendChild(renderReminderRow(c,tk,{prevTop:r.id}));
    box.appendChild(w);
  });
  panel.appendChild(box);
  ov.appendChild(panel);
  return ov;
}

/* ═══ WHERE THE DAY BEGINS — opened from the clock ═══
   Every zone there is, searched by name, because the app is not only for one
   country. It stores the zone rather than "wherever I happen to be", so the
   other device follows to the same one instead of keeping its own. */
function tzList(){
  let all=[];
  try{all=Intl.supportedValuesOf('timeZone')||[];}catch(e){}
  if(!all.length)all=['America/Cancun','America/Mexico_City','America/Mazatlan','America/Tijuana',
    'America/New_York','America/Los_Angeles','America/Bogota','America/Buenos_Aires',
    'Europe/Madrid','Europe/London','Europe/Berlin','Asia/Tokyo','Australia/Sydney','UTC'];
  return all;
}
function renderTZModal(){
  const close=()=>{STATE.showTZ=false;render();};
  const ov=dv('fi');
  ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:60;'+
    'display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow:auto';
  ov.onclick=e=>{if(e.target===ov)close();};
  const panel=dv('card');
  panel.style.cssText='max-width:420px;width:100%;margin:auto';
  const hd=dv('rowb mb4');
  hd.appendChild(sp('ctit',t('tz-title')));
  hd.appendChild(bt('btn-icon','✕',close));
  panel.appendChild(hd);
  panel.appendChild(dv('xs dimmer mb10',t('tz-help')));

  const cur=appTZ(),dev=deviceTZ();
  const q=ip('text','',STATE.tzQuery||'',t('tz-search'));
  q.style.width='100%';
  panel.appendChild(q);

  const box=dv('s6 mt8');
  box.style.cssText='max-height:280px;overflow:auto';
  const draw=()=>{
    box.innerHTML='';
    const needle=(STATE.tzQuery||'').trim().toLowerCase();
    // What you are on and where you are stay at the top, always reachable.
    const pinned=[...new Set([cur,dev])];
    const rest=tzList().filter(z=>!pinned.includes(z)&&
      (!needle||z.toLowerCase().replace(/_/g,' ').includes(needle)));
    const rows=[...pinned,...rest.slice(0,60)];
    rows.forEach(tz=>{
      const on=tz===cur;
      const b=bt(on?'btn-ac btn-sm':'btn-ghost btn-sm',
        tzLabel(tz)+(tz===dev?' · '+t('tz-this-device'):''),
        ()=>{STATE.showTZ=false;STATE.tzQuery='';setAppTZ(tz);});
      b.style.cssText+=';width:100%;text-align:left';
      box.appendChild(b);
    });
    if(!rows.length)box.appendChild(dv('xs dimmer ctr mt8','—'));
  };
  q.oninput=()=>{STATE.tzQuery=q.value;draw();};
  draw();
  panel.appendChild(box);
  panel.appendChild(dv('xs dimmer mt10',t('tz-warn')));
  ov.appendChild(panel);
  return ov;
}

function renderSyncPanel(){
  const card=dv('card fi');
  card.style.cssText='border:1px solid var(--acb);background:var(--acd)';
  const hd=dv('rowb mb12');
  hd.appendChild(sp('ctit',t('sync-title')));
  hd.appendChild(bt('btn-icon','✕',()=>{STATE.showSyncPanel=false;refresh()}));
  card.appendChild(hd);
  /* A device whose clock is out is compensated for silently everywhere else,
     so this is the one place it is said out loud — the numbers stay right
     either way, but a wrong clock is worth knowing about. */
  const off=Math.abs(CLOCK.offMinutes());
  if(CLOCK.checked&&off>=5){
    const w=dv('sm mt2 mb10');w.style.color='var(--cy)';
    w.textContent=t('clock-off').replace('{n}',fmtDur(off)).replace('{dir}',CLOCK.skew<0?t('clock-fast'):t('clock-slow'));
    card.appendChild(w);
  }
  const sbConfigured=!!(window._SUPABASE_URL&&window._SUPABASE_KEY);
  if(!sbConfigured){
    card.appendChild(dv('sm dim','Supabase not configured. Add window._SUPABASE_URL and window._SUPABASE_KEY to the HTML.'));
    return card;
  }
  const hasToken=!!(localStorage.getItem('AUTH_TOKEN'));
  if(hasToken){
    const info=dv('sm cg mb8');info.textContent=t('logged-in');card.appendChild(info);
    const row=dv('row gap8');
    row.appendChild(bt('btn-ac btn-sm',t('pull-cloud'),async()=>{
      // This is a deliberate FORCE pull: it throws local data away and takes the
      // cloud copy instead. That is destructive enough to require a yes, since
      // a cloud copy can easily be older than what is in this browser.
      const remote=await SB.pull();
      if(remote){
        const localDays=(STATE.history||[]).length;
        const cloudDays=(remote.history||[]).length;
        if(!confirm(t('pull-warn').replace('{local}',localDays).replace('{cloud}',cloudDays)))return;
        if(remote.history&&remote.history.length) STATE.history=remote.history.slice(0,MAX_HIST).sort((a,b)=>b.date.localeCompare(a.date));
        if(remote.today) STATE.today={...STATE.today,...remote.today};
        if(remote.diary) STATE.diary=remote.diary;
        if(remote.streak_overrides) STATE.streakOverrides=remote.streak_overrides;
        S.set(K.HIST,STATE.history);S.set(K.TODAY,STATE.today);
        S.set(K.DIARY,STATE.diary);S.set(K.STREAK_OVR,STATE.streakOverrides);
        refresh();alert('✅ Synced from cloud!');
      } else alert('Pull failed or no data.');
    }));
    row.appendChild(bt('btn-ghost btn-sm',t('push-cloud'),async()=>{
      // Deliberate: show what is being replaced before overwriting the cloud.
      const local=(STATE.history||[]).length;
      if(SB.pulledOk&&local<SB.cloudDays){
        if(!confirm(t('push-warn').replace('{local}',local).replace('{cloud}',SB.cloudDays)))return;
      }
      await SB.push(STATE.history,STATE.today,STATE.diary,STATE.streakOverrides,{force:true});
      alert(SB.status==='ok'?t('push-ok'):t('push-fail'));
      refresh();
    }));
    row.appendChild(bt('btn-ng btn-sm',t('log-out'),()=>{
      localStorage.removeItem('AUTH_TOKEN');
      localStorage.removeItem('REFRESH_TOKEN'); // leave no half-session behind
      SB.token='';SB.status='local';
      STATE.showSyncPanel=false;refresh();
    }));
    card.appendChild(row);
    return card;
  }
  // Not logged in — show login form
  card.appendChild(dv('sm dim mb10','Log in with your Supabase account to enable cross-device sync.'));
  const ew=dv('s4 mb8');ew.innerHTML=`<div class="xs dimmer up ls">${t('email-lbl')}</div>`;
  const ei=ip('email','','','you@email.com');ew.appendChild(ei);card.appendChild(ew);
  const pw=dv('s4 mb8');pw.innerHTML=`<div class="xs dimmer up ls">${t('pass-lbl')}</div>`;
  const pi=ip('password','','','password');pw.appendChild(pi);card.appendChild(pw);
  const err=dv('xs ng mb8');card.appendChild(err);
  const loginBtn=bt('btn-ac btn-sm','Log In',async()=>{
    err.textContent='';loginBtn.disabled=true;loginBtn.textContent='Logging in...';
    const res=await SB.login(ei.value.trim(),pi.value);
    if(res.ok){STATE.showSyncPanel=false;refresh();}
    else{err.textContent=res.error||t('login-failed');loginBtn.disabled=false;loginBtn.textContent='Log In';}
  });
  pi.onkeydown=e=>{if(e.key==='Enter')loginBtn.click();};
  card.appendChild(loginBtn);
  return card;
}


/* Opens and closes the note editor for a day.
   Closing it means saving: the typed text is written straight away instead of
   waiting on the 600ms input timer (which could still be pending), and the view
   is re-rendered so the note preview and the button label update on the spot.
   Before this, a saved note only appeared after leaving the day and coming back. */
function toggleDiaryEditor(container,dateKey,button){
  const open=container.querySelector('.diary-wrap');
  if(open){
    const val=diaryValue(open);
    if(val!==null){
      if(val.trim())STATE.diary[dateKey]=val; else delete STATE.diary[dateKey];
      S.set(K.DIARY,STATE.diary);
      SB.push(STATE.history,STATE.today,STATE.diary,STATE.streakOverrides).catch(()=>{});
    }
    open.remove();
    refresh();
    return;
  }
  const dw=renderDiaryFor(dateKey,()=>toggleDiaryEditor(container,dateKey,button));
  dw.className='diary-wrap fi';
  container.appendChild(dw);
  container.querySelector('.diary-area')?.focus();
  if(button)button.textContent='💾 '+t('save-note');
}

/* ═══ DIARY (used inside calendar) ═══ */
/* A starting shape for the day's review. It is only ever offered into an empty
   note — anything already written is left exactly as it is, never merged with
   or replaced by this. The weekly-goal line reflects what is actually still
   open, and the plan line is dropped once there is nothing left to plan. */
function diaryTemplate(){
  const left=goalsOf('week').filter(g=>!g.doneOn).length;
  // → marks the line as a heading of its own. It carries a number that
  // changes, so it can never match the fixed list diaryHeadings holds.
  const weekly='→ '+(left
    ? t('tpl-weekly-left').replace('{n}',left)+'\n'+t('tpl-weekly-plan')+'\n'
    : t('tpl-weekly-done')+'\n');
  return [
    t('tpl-grateful'),'    1. ','    2. ','    3. ','',
    t('tpl-bad'),'','',
    weekly,'',
    t('tpl-why'),'','',
    t('tpl-dream'),'','',
    t('tpl-feel'),'','',
    t('tpl-feel-why'),'','',
    t('tpl-cool'),'','',
    t('tpl-improve'),'','',
    t('tpl-summary'),'','',''
  ].join('\n');
}
/* The template's headings are bolded when a note is read back. The note itself
   stays plain text, so nothing already saved changes shape or risks being
   mangled by a format it was not written in. */
function diaryHeadings(){
  return ['tpl-grateful','tpl-bad','tpl-weekly-plan','tpl-why','tpl-dream',
          'tpl-feel','tpl-feel-why','tpl-cool','tpl-improve','tpl-summary']
    .map(k=>t(k))
    // Wording these two headings once had. Notes already written keep their
    // gold instead of quietly going plain the day the template changes.
    .concat(['1 cosa chida que hice:','1 cosa que puedo mejorar:',
             '1 cool thing I did:','1 thing I can improve:']);
}
function diaryToHtml(text){
  const heads=diaryHeadings();
  const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return esc(text).split('\n').map(line=>{
    const bare=line.trim();
    // '--&gt;' is the arrow the template used to write. Notes already holding
    // it keep their gold.
    return heads.some(h=>bare===h||bare===esc(h))||bare.startsWith('→')||bare.startsWith('--&gt;')
      ? `<span class="w7 ac">${line}</span>` : line;
  }).join('\n');
}

/* A note is one string, and its first line — when it starts with '# ' — is the
   day's title. Keeping the title inside the note means nothing new has to sync
   and every note ever written already reads correctly: it simply has none. */
function noteTitle(text){const m=/^# (.*)(\n|$)/.exec(text||'');return m?m[1]:'';}
function noteBody(text){return (text||'').replace(/^# .*(\n|$)/,'');}
function noteJoin(title,body){const ti=(title||'').trim();return ti?'# '+ti+'\n'+body:body;}
/* What the open editor holds right now, its two fields back as one note. */
function diaryValue(scope){
  const ta=scope.querySelector('.diary-area');if(!ta)return null;
  return noteJoin(scope.querySelector('.diary-title')?.value,ta.value);
}

function renderDiaryFor(dateKey,onSave){
  const wrap=dv('mt10 fi');
  const existing=STATE.diary[dateKey];
  const hasNote=!!(existing&&existing.trim());

  const ti=ip('text','diary-title',noteTitle(existing),t('day-title-ph'));
  ti.style.cssText='width:100%;font-size:22px;font-weight:700;color:var(--ac);margin-bottom:8px';

  const ta=document.createElement('textarea');
  ta.className='diary-area';
  ta.placeholder='Write your thoughts about this day...';
  ta.value=hasNote?noteBody(existing):diaryTemplate();
  ta.style.minHeight='260px';
  /* Whose day this is, and whether it has been touched. Picking another day on
     the calendar tears this editor down, and what was typed has to be written
     before it goes — but an untouched template is not a note and must not be
     saved as one. */
  ta.dataset.day=dateKey;

  let saveTimer=null;
  const touch=()=>{
    ta.dataset.dirty='1';
    clearTimeout(saveTimer);
    saveTimer=setTimeout(()=>{
      const v=diaryValue(wrap);
      if(v.trim()) STATE.diary[dateKey]=v;
      else delete STATE.diary[dateKey];
      S.set(K.DIARY,STATE.diary);
      // Push immediately — no debounce, diary must sync
      SB.push(STATE.history,STATE.today,STATE.diary,STATE.streakOverrides).catch(()=>{});
    },600);
  };
  ta.oninput=touch;ti.oninput=touch;

  // Ctrl/⌘+Enter puts the note down without reaching for the button. Enter on
  // the title line goes to the body, the way a title field should.
  const put=e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();if(onSave)onSave();}};
  ta.onkeydown=put;
  ti.onkeydown=e=>{if(e.key==='Enter'&&!e.ctrlKey&&!e.metaKey){e.preventDefault();ta.focus();}else put(e);};

  wrap.appendChild(ti);wrap.appendChild(ta);
  wrap.appendChild(dv('xs dimmer mt4',t('ctrl-save')));
  return wrap;
}

/* ═══ BOOT ═══ */
/* Register the worker that lets the app open without signal. It needs https
   (or localhost), so opening the file straight off the disk simply skips it —
   and the app runs exactly as it always has. */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{});});
}
loadToday();healRepeatsStuckOnDoneDay();applyTheme();

// On boot: PULL from Supabase first (before pushing ANYTHING).
// Supabase is the single source of truth.
// 1. Load localStorage (local cache / fallback)
// 2. Pull from Supabase — Supabase wins for any day where it has newer data
// 3. Push the merged result back (includes any gap days)
// 4. Render
(async()=>{
  // A restore that just happened wins over whatever the cloud is holding —
  // otherwise the boot pull merges the old cloud days straight back in and the
  // restore silently undoes itself.
  const restoring=localStorage.getItem('st_restore_pending')==='1';
  if(restoring){
    localStorage.removeItem('st_restore_pending');
    if(SB.init()){
      // The restored file is the truth here, even if it holds fewer days.
      try{await SB.push(STATE.history,STATE.today,STATE.diary,STATE.streakOverrides,{force:true});}catch(e){}
    }
    render();
    return;
  }
  if(SB.init()){
    try{
      const remote=await SB.pull();
      if(remote){
        // On boot: Supabase is the single source of truth — only pull, NEVER push.
        // Pushing on boot can overwrite good cloud data with stale/empty local data.
        applyRemote(remote);
        // Save a daily backup on first boot of each day (if logged in) — only mark done if it truly succeeded
        const _bkKey='st_last_backup';
        if(localStorage.getItem(_bkKey)!==todayKey()){
          SB.saveBackup(STATE.history,STATE.today,STATE.diary,STATE.streakOverrides).then(ok=>{
            if(ok) localStorage.setItem(_bkKey,todayKey());
          }).catch(()=>{});
        }
      }
    }catch(e){/* Supabase unreachable — use localStorage fallback, will retry on bgSync */}
  }
  render();
})();
/* One place decides what Escape closes. Every overlay used to assign
   document.onkeydown as it was drawn, so whichever happened to be drawn last
   owned the key — and the one you were actually looking at might not be it.
   Innermost first: what was opened last is what closes first. */
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  const ms=document.querySelector('.ms-ov');
  if(ms){ms.click();return;}
  const open=['taskTree','histDay','showTZ','showRules','showSyncPanel','showGoals'].find(k=>STATE[k]);
  if(!open)return;
  STATE[open]=(open==='histDay'||open==='taskTree')?null:false;
  render();
});

// Start clock ticker once (not inside renderApp to prevent accumulation)
let _lastDay=todayKey();
setInterval(()=>{
  const cl=document.getElementById('clk');
  if(cl)cl.textContent=new Date().toLocaleTimeString(STATE.lang==='es'?'es-MX':'en-US',{timeZone:appTZ(),hour:'2-digit',minute:'2-digit',second:'2-digit'});
  // Pomodoro tick. The clock text is patched in place rather than re-rendering
  // the whole app every second, which would fight anything you are typing.
  const p=STATE.pomo;
  if(p&&p.running){
    const left=pomoRemaining(p);
    const cl2=document.getElementById('pomo-clock');
    if(cl2)cl2.textContent=fmtClock(left);
    if(left<=0){
      const wasFocus=p.phase==='focus';
      pomoFinishPhase(true);
      pomoBeep();
      if(wasFocus&&'Notification' in window&&Notification.permission==='granted'){
        try{new Notification('Stoic',{body:t('pomo-done')});}catch(e){}
      }
      render();
    }
  }
  const nd=todayKey();
  if(nd!==_lastDay){
    _lastDay=nd;
    // New day — save yesterday, reset today, then render
    const sk=CALC.streaks(STATE.history,STATE.today);
    upsertHist(CALC.buildEntry(STATE.today,sk,STATE.today._date||nd),STATE.today._date||nd);
    // Reset today to zero
    STATE.today={
      completed:0,target:0,morningCompleted:false,flagCompleted:false,
      pomodoros:0,penalties:[],
      sleep:{sleepDuration:0,napDuration:0,sleptEarly:false,earlyBedStreak:STATE.today.sleep?.earlyBedStreak||0},
      work:{workDuration:0},_date:nd,_ts:CLOCK.now()
    };
    S.set(K.TODAY,STATE.today);
    S.set(K.HIST,STATE.history);
    SB.push(STATE.history,STATE.today,STATE.diary,STATE.streakOverrides).catch(()=>{});
    // Auto-save daily backup at midnight
    SB.saveBackup(STATE.history,STATE.today,STATE.diary,STATE.streakOverrides).catch(()=>{});
    render();
  }
},1000);
</script>
