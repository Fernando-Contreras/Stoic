/* ═══ #1 FIX: loadToday checks for missed days, fills all gaps ═══ */
function loadToday(){
  const t=S.get(K.TODAY,null);
  if(t){STATE.today={...STATE.today,...t};if(t._penType)STATE.penType=t._penType;
    // t._difficulty may still show up in old synced records — harmless to
    // ignore, since nothing reads STATE.difficulty any more.
    if(t._lang){STATE.lang=t._lang;localStorage.setItem('st_lang',t._lang);}
    // Read before the date is worked out below — it decides what the date is.
    if(t._tz){STATE.tz=t._tz;localStorage.setItem('st_tz',t._tz);}
    if(t._view&&typeof t._view==='object'){STATE.view={...STATE.view,...t._view};S.set('st_view',STATE.view);}
  }
  const tk=todayKey();
  const saved=STATE.today._date||'';
  /* Only ever forward. A day can end; it cannot un-end. If the date reads
     EARLIER than the day in hand — the zone was moved west, or the device
     clock jumped back — rolling over would file the day in hand under a date
     still in the future and hand back an empty one in its place, losing
     everything logged since midnight. The day in hand simply stands until the
     clock genuinely passes it. */
  if(saved&&saved>tk){
    if(!STATE.today._date)STATE.today._date=saved;
    return;
  }
  if(saved&&saved!==tk){
    /* Might have missed multiple days — fill each missing one as a -1000 gap.
       Anchored at noon, local. A bare 'YYYY-MM-DD' is read as UTC midnight,
       which anywhere west of Greenwich is the evening BEFORE — so every gap
       day was written one day early: the first landed back on the day already
       archived and was dropped as a duplicate, and the last day missed was
       never filled at all. Miss three days and only one was ever counted. */
    const savedDate=new Date(saved+'T12:00:00');
    const nowDate=new Date(tk+'T12:00:00');
    const daysDiff=Math.round((nowDate-savedDate)/(1000*60*60*24));
    // save the actual last-used day — keep ORIGINAL _ts so Supabase data always wins
    const sk=CALC.streaks(STATE.history,STATE.today);
    const prevEntry=CALC.buildEntry(STATE.today,sk,saved);
    prevEntry._ts=STATE.today._ts||0; // preserve original ts — prevents overwriting real cloud data
    upsertHist(prevEntry,saved);
    // fill any days between saved and today as gap days
    for(let i=1;i<daysDiff;i++){
      const gapDate=new Date(savedDate);gapDate.setDate(gapDate.getDate()+i);
      const gk=isoDate(gapDate);
      if(!STATE.history.find(h=>h.date===gk)){
        upsertHist({date:gk,_ts:0,todayPoints:-1000,status:'red',completedTasks:0,totalTasks:0,pomodoros:0,penalties:[],streaks:[],workDuration:0,sleepDuration:0,napDuration:0,sleptEarly:false,_gap:true},gk);
        S.set(K.HIST,STATE.history);
        // NOTE: do NOT push here — boot will pull from Supabase first, then push merged result
      }
    }
    // reset today
    STATE.today={completed:0,target:0,morningCompleted:false,flagCompleted:false,
      pomodoros:0,penalties:[],
      sleep:{sleepDuration:0,napDuration:0,sleptEarly:false,earlyBedStreak:STATE.today.sleep?.earlyBedStreak||0},
      work:{workDuration:0},_date:tk};
  }
  if(!STATE.today._date)STATE.today._date=tk;
}

function upsertHist(entry,dk){
  const idx=STATE.history.findIndex(h=>h.date===dk);
  if(idx>=0)STATE.history[idx]={...STATE.history[idx],...entry};
  else STATE.history.unshift(entry);
  STATE.history=STATE.history.slice(0,MAX_HIST);
  S.set(K.HIST,STATE.history); // always persist locally
}

/* save: local + push to Supabase if logged in */
// commit() = user changed something real → bump _ts, push to cloud
function commit(){
  const now=CLOCK.now();
  STATE.today._ts=now;
  STATE._lastSavedAt=now; // we're the writer now — prevent echoing our own push back
  save();
}

function applyStreakOverrides(skRaw){
  // The override stores an OFFSET captured once, at the moment of editing:
  //   offset = (typed value) - (natural value at that exact moment)
  // From then on, every day: displayed = natural(today) + offset.
  // This makes it grow/shrink in lockstep with natural — true streak behavior —
  // while keeping the typed number exact on the day it was set.
  // If natural drops to 0 (streak broke — user skipped the activity), TODAY's
  // streak becomes 0: a broken streak is 0, no exceptions. But the override is
  // RETIRED with a date, never deleted — the days it already applied to keep
  // their points forever (see liveScore). Deleting it used to retroactively
  // strip points from history the moment a streak broke.
  const ovr=STATE.streakOverrides||{};
  const sk={...skRaw};
  let changed=false;

  Object.keys(ovr).forEach(k=>{
    const o=ovr[k];
    if(o===undefined||o===null) return;
    const offset=typeof o==='object'?(o.offset!==undefined?o.offset:0):o;
    const retiredAt=typeof o==='object'?o.retiredAt:null;
    const setOn=typeof o==='object'?o.setOn:null;
    const natural=skRaw[k]||0;

    if(retiredAt){
      sk[k]=natural; // already retired — today runs on the new, natural streak
    } else if(natural===0&&setOn!==todayKey()){
      ovr[k]={offset,setOn,retiredAt:todayKey()}; changed=true; sk[k]=0;
    } else {
      /* Natural counts the days behind today, so on the day a number is typed
         it is often 0 — the day it speaks for has not closed yet. Retiring it
         then would erase the number the moment it was entered, which is what
         made the panel look like it refused to be edited. */
      sk[k]=Math.max(0,natural+offset);
    }
  });

  if(changed){STATE.streakOverrides=ovr;S.set(K.STREAK_OVR,STATE.streakOverrides);}
  return sk;
}

function save(){
  const tk=todayKey();
  STATE.today._date=tk;
  STATE.today._penType=STATE.penType;
  STATE.today._lang=STATE.lang;
  STATE.today._theme=STATE.theme;
  STATE.today._tzOffset=new Date().getTimezoneOffset();
  const sk=applyStreakOverrides(CALC.streaks(STATE.history,STATE.today));
  upsertHist(CALC.buildEntry(STATE.today,sk,tk),tk);
  S.set(K.TODAY,STATE.today);
  S.set(K.HIST,STATE.history);
  S.set(K.DIARY,STATE.diary);
  S.set(K.THEME,STATE.theme);
  S.set(K.STREAK_OVR,STATE.streakOverrides);
  SB.push(STATE.history,STATE.today,STATE.diary,STATE.streakOverrides).catch(()=>{});
}


function applyTheme(){
  document.body.className=STATE.theme==='light'?'light':'';
}
function toggleTheme(){
  STATE.theme=STATE.theme==='light'?'dark':'light';
  S.set(K.THEME,STATE.theme);
  applyTheme();
  refresh();
  SB.push(STATE.history,STATE.today,STATE.diary,STATE.streakOverrides).catch(()=>{});
}

/* ═══ SYNC — Supabase is the single source of truth ═══
   Philosophy: like Facebook — the server has the data,
   devices just read and write to it. No complex merging.
   
   WRITE: every save() pushes full state to Supabase immediately.
   READ:  every 8s, pull from Supabase. If it differs from local,
          take the remote version. Period. No merge logic.
   
   Conflict resolution: last writer wins (highest _ts on today,
   highest _ts per day in history). Simple and predictable.
   ══════════════════════════════════════════════════════════ */

function applyRemote(remote){
  /* ── SYNC PHILOSOPHY ──────────────────────────────────────────────
     Supabase is the SINGLE source of truth.
     Conflict resolution: whoever pushed most recently wins.
     We use remote.saved_at (set by the pushing device at push time)
     vs STATE._lastSavedAt (set locally when WE pushed).
     If remote.saved_at > our last push → remote is newer → take it.
     No complex per-field merging. Simple. Predictable.
     ──────────────────────────────────────────────────────────────── */
  if(!remote) return false;
  let changed=false;
  const tk=todayKey();
  const remoteSavedAt=remote.saved_at||0;
  const localSavedAt=STATE._lastSavedAt||0;
  const remoteIsNewer=remoteSavedAt>localSavedAt;

  // TODAY: remote wins if it was pushed more recently than our last push
  if(remote.today){
    const R=remote.today;
    if(remoteIsNewer){
      /* The settings used to be applied here unconditionally, above this
         check, under the note "settings always sync regardless of who is
         newer". They do not need to ignore it, and ignoring it is what made
         the difficulty buttons bounce back: press one, and a pull already in
         flight — carrying the copy from before the press — put the old value
         straight back a moment later, so it took two presses to stick. The
         view toggles were moved in here for exactly this, one block down,
         with the same symptom described. The settings belong on this side of
         the line too. Another device still wins: its push carries a newer
         saved_at, which is what this check is asking about.

         R._difficulty may still arrive from an old synced record; there is
         nothing left to apply it to, so it is simply not read any more. */
      if(R._theme&&R._theme!==STATE.theme){STATE.theme=R._theme;S.set(K.THEME,R._theme);applyTheme();changed=true;}
      if(R._lang&&R._lang!==STATE.lang){STATE.lang=R._lang;localStorage.setItem('st_lang',R._lang);changed=true;}
      // The zone travels with the settings so both devices keep the same day.
      if(R._tz&&R._tz!==appTZ()){STATE.tz=R._tz;localStorage.setItem('st_tz',R._tz);changed=true;}
      /* How the list is drawn follows you across, but only from a copy that is
         actually newer. Applied unconditionally, like the settings above, the
         cloud's older copy overwrote every toggle within seconds of making it:
         open Done today, and five seconds later it had closed itself again. */
      if(R._view&&typeof R._view==='object'&&JSON.stringify(R._view)!==JSON.stringify(STATE.view)){
        STATE.view={...STATE.view,...R._view};S.set('st_view',STATE.view);changed=true;
      }
      const Rdate=R._date||'';
      if(Rdate&&Rdate<tk){
        // Remote today is from a past date — put it in history
        const existingHist=STATE.history.find(h=>h.date===Rdate);
        if(!existingHist||(R._ts||0)>(existingHist._ts||0)){
          const sk=CALC.streaks(STATE.history,R);
          const entry=CALC.buildEntry(R,sk,Rdate);
          upsertHist(entry,Rdate);
          S.set(K.HIST,STATE.history);
          changed=true;
        }
        // Local today is current date — keep it
      } else {
        // Remote today is current date (or no date) — remote wins entirely
        const merged={...STATE.today,...R};
        // Always union penalties by id so no entry is lost
        const penMap=new Map((STATE.today.penalties||[]).map(p=>[p.id,p]));
        (R.penalties||[]).forEach(p=>{penMap.set(p.id,p);});
        merged.penalties=[...penMap.values()];
        if(JSON.stringify(merged)!==JSON.stringify(STATE.today)){
          STATE.today=merged;S.set(K.TODAY,STATE.today);changed=true;
        }
      }
      // Update our knowledge of what remote has
      STATE._lastSavedAt=remoteSavedAt;
    }
  }

  // HISTORY: per-day merge — remote wins if strictly newer _ts or we have no entry
  if(Array.isArray(remote.history)&&remote.history.length){
    const localMap=new Map((STATE.history||[]).map(d=>[d.date,d]));
    let hChanged=false;
    remote.history.forEach(re=>{
      const le=localMap.get(re.date);
      if(!le||(re._ts||0)>(le._ts||0)){
        localMap.set(re.date,{...re});
        hChanged=true;
      }
    });
    if(hChanged){
      STATE.history=[...localMap.values()].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,MAX_HIST);
      S.set(K.HIST,STATE.history);changed=true;
    }
  }

  // DIARY: union (both devices keep entries, no deletion)
  if(remote.diary){
    const merged={...STATE.diary,...remote.diary};
    /* Except the note open in the editor. Its own keystrokes are pushed as it
       is written, so a pull that crosses that push carries a copy a few words
       behind what is on screen — and remote winning per key would hand those
       words back. Whatever is being typed stays local until it is put down. */
    const openDay=document.querySelector('.diary-area')?.dataset.day;
    if(openDay){
      if(openDay in STATE.diary)merged[openDay]=STATE.diary[openDay];
      else delete merged[openDay];
    }
    if(JSON.stringify(merged)!==JSON.stringify(STATE.diary)){STATE.diary=merged;S.set(K.DIARY,STATE.diary);changed=true;}
  }

  /* STREAK OVERRIDES.
     These decide how historical days are scored, so a device holding a stale
     set reports a wildly different grand total off the very same history — the
     same 76 days swing from -419,819 to +273,169 depending only on these.
     The old merge compared a `since` field that nothing ever writes, so
     ('' > '') was always false and any key already present locally could never
     be corrected from the cloud. A device kept its stale overrides forever.
     They are small and global, like the settings above, so the newer side wins
     outright. When we are the newer side we still adopt keys we simply do not
     have, so nothing is ever lost. */
  /* PLANNER: whichever device edited the list most recently wins it whole.
     Per-item union sounds safer but silently resurrects anything you delete,
     and _ts is bumped on every planner change, so this stays predictable. */
  if(remote.planner&&typeof remote.planner==='object'){
    const lp=STATE.planner||{reminders:[],_ts:0};
    if((remote.planner._ts||0)>(lp._ts||0)){
      const {pomo:_drop,...rest}=remote.planner;   // the pomodoro has its own clock
      STATE.planner={reminders:[],...rest};
      S.set(K.PLANNER,STATE.planner);changed=true;
    }
    // Whichever device touched the timer last owns it, independently of the list.
    const rp=remote.planner.pomo;
    if(rp&&typeof rp==='object'&&(rp._ts||0)>(STATE.pomo._ts||0)){
      STATE.pomo={...STATE.pomo,...rp};
      S.set('st_pomo',STATE.pomo);changed=true;
    }
  }

  if(remote.streak_overrides){
    const ro=remote.streak_overrides, lo=STATE.streakOverrides||{};
    let merged;
    if(remoteIsNewer){
      merged={...ro};
    } else {
      merged={...lo};
      Object.entries(ro).forEach(([k,v])=>{if(lo[k]===undefined)merged[k]=v;});
    }
    if(JSON.stringify(merged)!==JSON.stringify(lo)){
      STATE.streakOverrides=merged;S.set(K.STREAK_OVR,STATE.streakOverrides);changed=true;
    }
  }

  return changed;
}

/* Is the user in the middle of writing something? A redraw throws away the
   field under their hands, and the note editor is the one place where that is
   unmistakable: it closes on its own, mid-sentence. */
function isEditing(){
  const a=document.activeElement;
  if(a&&(a.tagName==='TEXTAREA'||a.tagName==='INPUT'))return true;
  if(document.querySelector('.diary-area'))return true;
  /* Anything open over the page counts too. A redraw rebuilds it from nothing,
     and at one sync every five seconds that reads as the overlay blinking out
     and back while you are looking straight at it. The sync itself still runs
     on time; what it brought is drawn the moment the overlay is closed. */
  /* Picking several tasks counts as well. It is not an overlay, but it is an
     unfinished action held entirely on screen — a redraw underneath it is the
     same interruption an overlay blinking out would be. */
  return ['taskTree','histDay','restoreList','showTZ','showRules','showSyncPanel','showGoals',
          'showAddForm','showRewards','selecting']
    .some(k=>STATE[k]);
}
/* The sync itself never waits — only the redraw does. What the cloud brought
   is already in STATE; this remembers that the screen has yet to show it, so
   the first quiet cycle draws it rather than the change being missed. */
let _redrawOwed=false;
async function bgSync(){
  if(!STATE.authed||!SB.init()) return;
  try{
    const remote=await SB.pull();
    if(applyRemote(remote))_redrawOwed=true;
    if(_redrawOwed&&!isEditing()){_redrawOwed=false;render();}
  }catch(e){/* silent — will retry next cycle */}
}
setInterval(bgSync,5000); // every 5s for fast cross-device sync // every 8s
/* ═══ DOM HELPERS ═══ */
function el(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e}
function dv(c,h){return el('div',c,h)}
function bt(c,t,f){const b=el('button',c,t);b.onclick=f;return b}
function ip(t,c,v,p){const i=document.createElement('input');i.type=t;i.className=c;i.value=v??'';if(p)i.placeholder=p;return i}
function sk(c,opts,v){const s=document.createElement('select');s.className=c;opts.forEach(([ov,l])=>{const o=document.createElement('option');o.value=ov;o.textContent=l;if(ov===v)o.selected=true;s.appendChild(o);});return s}
function sp(c,t){const s=el('span',c);if(t!==undefined)s.textContent=t;return s}
/* For the few places that build a line with innerHTML and need to put your own
   words inside it. A task called "<b>" is a task called "<b>", not bold. */
function escapeHtml(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
/* Let a row leave before anything is written down. The tick itself is instant
   either way — this only holds the redraw back for as long as the row takes to
   go, so the list is not rebuilt out from under the thing that is animating.
   Whoever has asked their system for less motion gets the old instant
   behaviour, and so does a row that is not on the page to animate. */
const DONE_MS=260;   // must match --done-ms
function reducedMotion(){
  try{return window.matchMedia('(prefers-reduced-motion: reduce)').matches;}
  catch(e){return false;}
}
function leaveThen(el,fn){
  if(!el||!el.isConnected||reducedMotion())return fn();
  let done=false;const go=()=>{if(done)return;done=true;fn();};
  /* A transition needs a number to leave from, and the browser has to have
     committed that number before the new one arrives — reading the height back
     is what forces it to. Done on the spot rather than in the next animation
     frame, because frames stop being handed out in a tab nobody is looking at
     and the row would sit there half-marked until one was. */
  el.style.height=el.offsetHeight+'px';
  void el.offsetHeight;
  el.classList.add('done-go');
  el.style.height='0px';
  el.style.paddingTop='0px';el.style.paddingBottom='0px';
  el.style.borderTopWidth='0px';el.style.borderBottomWidth='0px';
  // The row's own animation, not one bubbling up from something inside it.
  const onEnd=e=>{if(e.target!==el)return;el.removeEventListener('animationend',onEnd);go();};
  el.addEventListener('animationend',onEnd);
  /* The animation is what normally ends this. The timer is for when it never
     runs at all — a backgrounded tab, a dropped frame budget — because a tick
     that is never written down is far worse than one that jumps. */
  setTimeout(go,DONE_MS+140);
}
function hr(){const h=document.createElement('hr');h.className='dv';return h}
function sbadge(status){const lb={red:t('Red'),yellow:t('Yellow'),green:t('Green'),purple:t('Purple')};return sp(`badge s-${status}`,lb[status]||status)}

/* ═══ PLANNER (TAB 1) — REMINDERS ══════════════════════════════════════
   Tab 1 owns what you plan; tab 2 owns what you score. Tab 1 feeds tab 2,
   and tab 2 never writes back here — a manual edit over there is a scoring
   decision, not a claim about this list.
   ═══════════════════════════════════════════════════════════════════════ */
function isoDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
/* A date with the year left off, written the way the language writes it:
   month first in English, day first in Spanish. 08/19 and 19/08 are the same
   Tuesday, and only one of them reads as a date to the person looking. */
function fmtShort(dateStr){
  if(!dateStr)return'';
  const[,m,d]=dateStr.split('-');
  return STATE.lang==='es'?`${d}/${m}`:`${m}/${d}`;
}

/* Pressing a view button is a user action like any other, and it has to say
   so. This used to write to localStorage, stash the view into today, and stop
   — never bumping _lastSavedAt, never pushing. The cloud went on holding the
   copy from before the press, and _lastSavedAt went on pointing at some older
   commit, so the next pull looked newer than us and restored that old copy
   over the new one. That is the bounce: press a layout, a tag filter or the
   scope, and a second or two later it flicks back. commit() is the marker
   that says "we are the writer now", which is exactly what a press is. */
function saveView(){S.set('st_view',STATE.view);STATE.today._view=STATE.view;commit();}
function savePlanner(){
  STATE.planner._ts=CLOCK.now();
  S.set(K.PLANNER,STATE.planner);
  commit();
}
function reminders(){return STATE.planner.reminders||(STATE.planner.reminders=[]);}

/* Repeats stay anchored to the original due dates rather than to when you
   actually ticked it, so a task every 5 days keeps landing on its own rhythm
   even if you complete one late. Advancing stops at the first date that is not
   already past, so finishing a long-neglected daily task does not resurrect it
   dozens of times. */
function pad2(n){return String(n).padStart(2,'0');}
function fmtTime(d){return pad2(d.getHours())+':'+pad2(d.getMinutes());}
/* "Now" on the app's own clock. todayKey() decides the date in America/Cancun,
   so anything comparing times against it has to use the same wall clock —
   reading the browser's local time instead put the two an hour apart for most
   of Mexico, and disagreeing about what day it is breaks hourly repeats near
   the end of the day. */
function appNow(){
  return new Date(new Date(CLOCK.now()).toLocaleString('en-US',{timeZone:appTZ()}));
}

/* Advancing a repeat. Day-and-longer repeats move to the first date that is
   not already past. Hourly ones move to the first slot still ahead on the
   clock, so a thing due every three hours can come back several times within
   the same day instead of jumping to tomorrow. */
function advanceDue(due,rep,tk,time){
  const unit=rep.unit||'day',every=Math.max(1,rep.every||1);
  if(unit==='hour'){
    const d=new Date(due+'T'+(time||'00:00')+':00'),now=appNow();
    let guard=0;
    do{d.setHours(d.getHours()+every);guard++;}while(d<=now&&guard<30000);
    return{due:isoDate(d),time:fmtTime(d)};
  }
  const d=new Date(due+'T12:00:00'),today=new Date(tk+'T12:00:00');
  let guard=0;
  // A weekly repeat pinned to particular weekdays walks forward a day at a
  // time to the next one on the list, so "Tuesdays and Fridays" lands on both
  // rather than on a fixed stride from whenever it was last done.
  if(unit==='week'&&Array.isArray(rep.days)&&rep.days.length){
    /* Weekly on chosen weekdays, honouring the "every N weeks" stride: inside
       an active week it hits each listed day in turn, and only once that week
       is spent does it skip ahead N weeks. So Tue+Fri every 4 weeks means both
       days of one week, then nothing for four weeks. */
    const next=from=>{
      const ws=new Date(from);ws.setDate(from.getDate()-from.getDay()); // Sunday
      let best=null;
      rep.days.forEach(dow=>{
        const c=new Date(ws);c.setDate(ws.getDate()+dow);
        if(c>from&&(!best||c<best))best=c;
      });
      if(best)return best;
      const ns=new Date(ws);ns.setDate(ws.getDate()+7*every);
      const c=new Date(ns);c.setDate(ns.getDate()+Math.min(...rep.days));
      return c;
    };
    let cur=d;
    do{cur=next(cur);guard++;}while(cur<=today&&guard<3000);
    return{due:isoDate(cur),time:time||''};
  }
  /* Monthly and yearly steps are clamped to the end of the target month.
     Plain date arithmetic overflows instead: 31 August plus a month lands on
     1 October, skipping September entirely, and 31 January lands on 3 March,
     skipping February. The intended day of the month is remembered, so the
     31st gives 30 September and then 31 October rather than drifting down to
     the 30th forever — and asking for the 31st is exactly how you say "the
     last day of the month". */
  const dom=rep.dom||new Date(due+'T12:00:00').getDate();
  const daysInMonth=(y,m)=>new Date(y,m+1,0).getDate();

  /* Monthly pinned to particular days of the month — the 14th and the 28th,
     say. It takes the next listed day still ahead in the current month, and
     only once they are spent does it skip forward N months. Days past the end
     of a short month clamp to its last day, so the 31st still fires in
     February. */
  if(unit==='month'&&Array.isArray(rep.doms)&&rep.doms.length){
    const days=[...new Set(rep.doms)].sort((a,b)=>a-b);
    const clamp=(y,m,dd)=>Math.min(dd,daysInMonth(y,m));
    const next=from=>{
      const y=from.getFullYear(),m=from.getMonth(),cur=from.getDate();
      for(const dd of days){
        const c=clamp(y,m,dd);
        if(c>cur)return new Date(y,m,c,12,0,0);
      }
      const tm=m+every,ty=y+Math.floor(tm/12),tmm=((tm%12)+12)%12;
      return new Date(ty,tmm,clamp(ty,tmm,days[0]),12,0,0);
    };
    let cur=d;
    do{cur=next(cur);guard++;}while(cur<=today&&guard<3000);
    return{due:isoDate(cur),time:time||''};
  }
  const stepMonths=(dt,months)=>{
    const tm=dt.getMonth()+months;
    const ty=dt.getFullYear()+Math.floor(tm/12);
    const tmm=((tm%12)+12)%12;
    return new Date(ty,tmm,Math.min(dom,daysInMonth(ty,tmm)),12,0,0);
  };
  let cur=d;
  do{
    if(unit==='day')cur.setDate(cur.getDate()+every);
    else if(unit==='week')cur.setDate(cur.getDate()+7*every);
    else if(unit==='month')cur=stepMonths(cur,every);
    else if(unit==='year')cur=stepMonths(cur,12*every);
    guard++;
  }while(cur<=today&&guard<8000);
  return{due:isoDate(cur),time:time||''};
}

/* A repair for days already logged. Advancing used to stop on the first turn
   that was not in the past — and for anything overdue that turn was today, the
   very day it had just been done. The reminder then vanished from the list
   (completed today) while still counting as one of today's unfinished tasks:
   ticking it moved neither number, and the day's tally read 21/35 with ten
   tasks left on screen. Anything still sitting in that state is walked on to
   the turn it should have taken. Its own date is what advances, so nothing is
   invented: the reminder simply stops being due on the day it was finished. */
function healRepeatsStuckOnDoneDay(){
  let fixed=0;
  reminders().forEach(r=>{
    if(!r.repeat||r.repeat.unit==='hour')return;   // hourly ones do come back the same day
    if(r.done||!r.completedOn||!r.due)return;
    if(r.due>r.completedOn)return;                 // already looking ahead
    const nx=advanceDue(r.due,r.repeat,r.completedOn,r.time);
    if(nx.due!==r.due){r.due=nx.due;r.time=nx.time;r._ts=CLOCK.now();fixed++;}
  });
  if(fixed)savePlanner();
  return fixed;
}

/* What tab 2 sees. An unfinished reminder keeps its original date and keeps
   counting, exactly like Apple's — so a pile of overdue tasks does weigh on
   today's numbers, which is what was asked for. */
function plannerTodayStats(){
  const tk=todayKey();
  let total=0,done=0,overdue=0,flagsTotal=0,flagsDone=0;
  /* Every reminder is worth exactly one task a day, however many times it
     comes round inside it. Counting each turn separately pushed an hourly
     habit done ten times to 10/1 — more numerator than denominator, and a
     percentage over 100. Doing it once counts it as done; the tally on the
     row is where the repetitions are recorded. */
  let mornTotal=0,mornDone=0;
  reminders().forEach(r=>{
    const n=doneCount(r,tk);                                  // times ticked today
    const openNow=(!r.done&&r.due&&r.due<=tk)?1:0;            // still pending
    if(!n&&!openNow)return;                                   // finished another day
    /* Done means ticked today AND no longer waiting today. Something every six
       hours with a turn still to come is under way, not finished — counting it
       the moment it was first ticked credited a whole day's habit to its first
       round. */
    const finished=n>0&&!openNow;
    total+=1;
    if(finished)done+=1;
    if(openNow&&r.due<tk)overdue++;
    if(r.flagged){flagsTotal+=1;if(finished)flagsDone+=1;}
    if(r.morning){mornTotal+=1;if(finished)mornDone+=1;}
  });
  return{total,done,overdue,flagsTotal,flagsDone,mornTotal,mornDone,
    // A day with no flags at all is not an annihilated day — otherwise an
    // unplanned day would hand over 100 points times the streak for free.
    annihilated:flagsTotal>0&&flagsDone===flagsTotal,
    /* Same rule for the morning: the routine is done when everything you
       marked as part of it is done, and a day with none marked says nothing
       either way — see syncPlannerToToday, which leaves the tick alone then. */
    morningDone:mornTotal>0&&mornDone===mornTotal};
}

/* Subtasks are ordinary reminders that point at a parent, capped at two levels.
   They ride on the parent's date so they always sit with it in the same group,
   and ticking a parent ticks everything under it, the way Apple's do. */
function subtasksOf(id){return reminders().filter(r=>r.parent===id);}
function isCollapsed(id){return !!(STATE.planner.collapsed||{})[id];}
function toggleCollapse(id){
  STATE.planner.collapsed=STATE.planner.collapsed||{};
  if(STATE.planner.collapsed[id])delete STATE.planner.collapsed[id];
  else STATE.planner.collapsed[id]=true;
  savePlanner();
}
/* Indent and outdent, the way Tab and Shift-Tab work in an outliner: a
   reminder becomes a subtask of the one drawn directly above it. Picking a
   parent from a dropdown was hopeless once the list held a hundred items. */
function indentReminder(id,prevTopId){
  if(!prevTopId)return{ok:false,warn:'no-prev'};
  return updateReminder(id,{parent:prevTopId});
}
function outdentReminder(id){return updateReminder(id,{parent:null});}
/* Tags became a list. Reminders written before that carry a single `tag`
   string, so it is read through here instead of being migrated in place —
   nothing has to be rewritten for old data to keep working. */
function tagsOf(r){
  if(Array.isArray(r.tags))return r.tags;
  return r.tag?[r.tag]:[];
}
function normTags(arr){
  return [...new Set((arr||[]).map(s=>String(s).trim()).filter(Boolean))];
}
function allTags(){
  const set=new Set();
  reminders().forEach(r=>tagsOf(r).forEach(tg=>set.add(tg)));
  return [...set].sort((a,b)=>a.localeCompare(b));
}
/* Two filters mean both of them, not either one. Picking a second tag used to
   WIDEN the list — everything carrying gym or casa — which is the opposite of
   what reaching for another filter is for: you add one to narrow down, and the
   list grew instead. A task has to carry every tag you have picked.

   One rule, read from the three places that filter, so they cannot drift apart
   again: what is still to do, what was finished today, and the archive of what
   was finished before. All three had their own copy of the old one. */
function passesTags(tags){
  const F=STATE.view.tags||[];
  if(!F.length)return true;
  const has=normTags(tags);
  return F.every(tg=>has.includes(tg));
}
function hasTag(r,tg){return tagsOf(r).includes(tg);}
/* Which tags are being filtered on lives in the view, alongside the sort and
   the scope — so it survives a reload and travels to the other device with
   everything else you have set. It used to be held in memory alone and was
   gone the moment the page was refreshed. */
function toggleTagFilter(tg){
  const f=STATE.view.tags||(STATE.view.tags=[]);
  const i=f.indexOf(tg);
  if(i>=0)f.splice(i,1); else f.push(tg);
  saveView();
}

/* A tag box: type a new one, or click one you already use. Used by both the
   create form and the editor so they never drift apart. */
function tagPicker(initial){
  const sel=normTags(initial);
  const wrap=dv('');
  const row=dv('row gap6');
  const inp=ip('text','','',t('rem-tag-ph'));inp.setAttribute('list','st-tags');inp.style.flex='1';
  const chosen=dv('row gap6 mt6');chosen.style.flexWrap='wrap';
  const pool=dv('row gap6 mt6');pool.style.flexWrap='wrap';
  const add=()=>{
    const v=inp.value.trim();
    if(v&&!sel.includes(v))sel.push(v);
    inp.value='';draw();
  };
  inp.onkeydown=e=>{if(e.key==='Enter'||e.key===','){e.preventDefault();add();}};
  row.appendChild(inp);
  const plus=bt('btn-ghost btn-sm','+',add);plus.style.padding='6px 12px';row.appendChild(plus);
  function draw(){
    chosen.innerHTML='';
    sel.forEach(tg=>{
      const c=bt('tagchip',tg+' ✕',()=>{sel.splice(sel.indexOf(tg),1);draw();});
      c.style.cursor='pointer';chosen.appendChild(c);
    });
    pool.innerHTML='';
    allTags().filter(tg=>!sel.includes(tg)).forEach(tg=>{
      const c=bt('tagchip',tg,()=>{sel.push(tg);draw();});
      c.style.cssText+=';opacity:.5;cursor:pointer';pool.appendChild(c);
    });
  }
  draw();
  wrap.appendChild(row);wrap.appendChild(chosen);wrap.appendChild(pool);
  return{el:wrap,get:()=>normTags(sel)};
}
/* How many times this was ticked today. Anything can be done once, but an
   hourly repeat can come round several times, and each of those is a real
   task completed — so the day's count has to see all of them, not just one. */
function doneCount(r,tk){
  return (r.doneLog&&r.doneLog.d===tk)?(r.doneLog.n||0):0;
}
function bumpDone(r,tk,delta){
  if(!r.doneLog||r.doneLog.d!==tk)r.doneLog={d:tk,n:0};
  r.doneLog.n=Math.max(0,r.doneLog.n+delta);
}
/* A log of everything ticked, kept apart from the reminders themselves.
   A repeating reminder never "finishes" — it advances to its next turn — so
   without this its rounds left no trace at all, and anything that vanished by
   accident was gone silently. Each entry is a full snapshot, so a reminder can
   be rebuilt from it even if the original is no longer there. */
const LOG_MAX=200;
function completionLog(){return STATE.planner.log||(STATE.planner.log=[]);}
function logCompletion(r,tk){
  completionLog().unshift({
    logId:uid(),srcId:r.id,date:tk,
    title:r.title,notes:r.notes||'',tags:tagsOf(r).slice(),
    priority:r.priority||0,flagged:!!r.flagged,morning:!!r.morning,
    repeat:r.repeat?JSON.parse(JSON.stringify(r.repeat)):null,
    due:r.due,time:r.time||'',parent:r.parent||null
  });
  STATE.planner.log=completionLog().slice(0,LOG_MAX);
}
function unlogCompletion(r,tk){
  const i=completionLog().findIndex(x=>x.srcId===r.id&&x.date===tk);
  if(i>=0)completionLog().splice(i,1);
}
function setDone(r,tk,on){
  if(on){
    r.completedOn=tk;
    bumpDone(r,tk,1);
    logCompletion(r,tk);   // snapshot taken before the date advances
    if(r.repeat){
      r._prevDue=r.due;r._prevTime=r.time||'';
      const nx=advanceDue(r.due,r.repeat,tk,r.time);
      r.due=nx.due;r.time=nx.time;
      r.done=false;
      /* Something due again in a few hours is never "done for today" — it is
         simply waiting for its next turn. Leaving it pending is what makes one
         tick bring it straight back with the next slot, instead of parking it
         in Done today and vanishing until tomorrow. The tally on the row is
         what records the ones already finished. */
      if(r.repeat.unit==='hour')r.completedOn=null;
    }else r.done=true;
  }else{
    r.completedOn=null;r.done=false;
    bumpDone(r,tk,-1);
    unlogCompletion(r,tk);
    if(r.repeat&&r._prevDue){r.due=r._prevDue;r.time=r._prevTime||'';delete r._prevDue;delete r._prevTime;}
  }
  r._ts=CLOCK.now();
}

/* Undo something from the archive. If the reminder is still around it goes
   back on the list on the date it was logged with; if it is gone — deleted, or
   lost to a bug, which is what this is for — it is rebuilt from the snapshot. */
function restoreFromLog(logId){
  const entry=completionLog().find(x=>x.logId===logId);
  if(!entry)return;
  const r=reminders().find(x=>x.id===entry.srcId);
  if(r){
    r.done=false;r.completedOn=null;
    r.due=entry.due;r.time=entry.time||'';
    delete r._prevDue;delete r._prevTime;
    if(r.doneLog&&r.doneLog.d===entry.date)r.doneLog.n=Math.max(0,r.doneLog.n-1);
    r._ts=CLOCK.now();
  }else{
    reminders().unshift({
      id:entry.srcId||uid(),title:entry.title,notes:entry.notes||'',
      due:entry.due,time:entry.time||'',priority:entry.priority||0,
      flagged:!!entry.flagged,morning:!!entry.morning,tags:normTags(entry.tags),
      parent:reminders().some(x=>x.id===entry.parent)?entry.parent:null,
      repeat:entry.repeat||null,done:false,completedOn:null,
      created:CLOCK.now(),_ts:CLOCK.now()
    });
  }
  STATE.planner.log=completionLog().filter(x=>x.logId!==logId);
  savePlanner();
}
function toggleReminder(id){
  const r=reminders().find(x=>x.id===id);if(!r)return;
  const tk=todayKey();
  const on=r.completedOn!==tk;
  // A parent is ticked on its own. It used to carry its subtasks with it,
  // which breaks the way this is actually used: the parent is a bonus task in
  // its own right — "finish the oldest thing under here" — and its subtasks
  // repeat daily on their own schedule. Closing one must not close the rest.
  setDone(r,tk,on);
  savePlanner();
}
/* Put a finished reminder back on the list. toggleReminder cannot do this: it
   asks whether the thing was ticked TODAY, so on something closed last week it
   reads as "not done yet" and marks it done all over again. */
function reopenReminder(id){
  const r=reminders().find(x=>x.id===id);if(!r)return;
  r.done=false;r.completedOn=null;
  delete r._prevDue;delete r._prevTime;
  r._ts=CLOCK.now();savePlanner();
}
function addReminder(data){
  const parent=data.parent||null;
  const p=parent?reminders().find(x=>x.id===parent):null;
  reminders().unshift({
    id:uid(),title:data.title,notes:(data.notes||'').trim(),
    // A date given wins; a subtask created without one starts on its parent's
    // day as a convenience, never as a rule it cannot escape.
    due:data.due||(p?p.due:todayKey()),
    time:data.time||'',
    priority:data.priority||0,flagged:!!data.flagged,morning:!!data.morning,
    // A subtask starts in its parent's groups unless it is given its own.
    tags:normTags(data.tags&&data.tags.length?data.tags:(p?tagsOf(p):[])),
    parent:p?p.id:null,
    repeat:data.repeat||null, // subtasks keep their own rhythm, like any reminder
    done:false,completedOn:null,
    created:CLOCK.now(),_ts:CLOCK.now()
  });
  savePlanner();
}
/* Everything about a reminder stays editable. Re-parenting is the only move
   with rules attached: two levels is the cap, so something that already has
   subtasks cannot become one, and nothing can be its own parent. A reminder
   that becomes a subtask adopts its parent's date and drops its own repeat,
   since the parent's rhythm is what drives the pair. */
function updateReminder(id,patch){
  const r=reminders().find(x=>x.id===id);if(!r)return{ok:true};
  let warn='';
  if('parent' in patch){
    const np=patch.parent||null;
    if(np){
      const p=reminders().find(x=>x.id===np);
      if(subtasksOf(r.id).length){delete patch.parent;warn='sub-has-kids';}
      else if(!p||p.id===r.id||p.parent){delete patch.parent;warn='sub-bad-parent';}
      // Indenting must not move anything. A subtask keeps its own date, the way
      // dragging one under another in Apple's app leaves its date alone.
    }
  }
  Object.assign(r,patch);
  r._ts=CLOCK.now();
  savePlanner();
  return{ok:!warn,warn};
}
/* Nothing deleted is gone. A parent takes its subtasks with it — otherwise
   they are orphaned and invisible while still counting toward the day — which
   is exactly what makes one wrong press expensive: thirteen tasks can leave on
   a single 🗑. They go to the bin whole, family and all, and come back the same
   way. The last 200 are kept, the way completions are. */
const BIN_MAX=200;
function deletedBin(){return STATE.planner.bin||(STATE.planner.bin=[]);}
function deleteReminder(id){
  const going=reminders().filter(r=>r.id===id||r.parent===id);
  if(going.length){
    deletedBin().unshift({
      binId:uid(),at:CLOCK.now(),
      title:(going.find(r=>r.id===id)||going[0]).title,
      items:JSON.parse(JSON.stringify(going))
    });
    STATE.planner.bin=deletedBin().slice(0,BIN_MAX);
  }
  STATE.planner.reminders=reminders().filter(r=>r.id!==id&&r.parent!==id);
  savePlanner();
}
/* Back onto the list exactly as they left it. An id already in use means the
   same task was restored once already, so a fresh one is minted and any
   subtask pointing at it is pointed at the new one. */
function restoreDeleted(binId){
  const entry=deletedBin().find(x=>x.binId===binId);
  if(!entry)return;
  const taken=new Set(reminders().map(r=>r.id));
  const remap={};
  entry.items.forEach(it=>{if(taken.has(it.id))remap[it.id]=uid();});
  entry.items.forEach(it=>{
    const r={...it};
    if(remap[r.id])r.id=remap[r.id];
    if(r.parent&&remap[r.parent])r.parent=remap[r.parent];
    r._ts=CLOCK.now();
    reminders().unshift(r);
  });
  STATE.planner.bin=deletedBin().filter(x=>x.binId!==binId);
  savePlanner();
}

/* ── HOW TAB 1 FEEDS TAB 2 ──────────────────────────────────────────────
   Your hand still wins, but only until the list itself changes. Each manual
   edit is stamped with the time it was made; the moment the planner is edited
   after that, the planner takes the field back. So a number typed while the
   list was half-written is respected, and editing the list afterwards is
   respected too, without either silently outranking the other forever.

   On top of that the app refuses to help you undercount. It will not report
   fewer tasks than are actually on today's list, will not report fewer done
   than you have actually ticked, and will never let completed exceed the
   target — which is where the 200% came from.

   Typing 0 in the target is the explicit way to say "go back to automatic".
   ──────────────────────────────────────────────────────────────────────── */
function manualHolds(field){
  const at=(STATE.today._manual||{})[field]||0;
  return at>0&&at>=(STATE.planner._ts||0);
}
function markManual(field){
  STATE.today._manual=STATE.today._manual||{};
  STATE.today._manual[field]=CLOCK.now();
}
function syncPlannerToToday(){
  const s=plannerTodayStats();
  const before=JSON.stringify([STATE.today.target,STATE.today.completed,STATE.today.flagCompleted,STATE.today.morningCompleted]);

  // TARGET — a manual 0 means "hand it back to the planner"
  let target=(manualHolds('target')&&STATE.today.target>0)?STATE.today.target:s.total;
  if(target<s.total)target=s.total;
  STATE.today.target=target;

  // COMPLETED — the planner can only ever raise this, never hide work you did
  let done=manualHolds('completed')?(STATE.today.completed||0):s.done;
  if(done<s.done)done=s.done;
  if(done>target)done=target;
  STATE.today.completed=done;

  // FLAGS — adding a new unfinished flagged reminder un-annihilates the day
  STATE.today.flagCompleted=manualHolds('flagCompleted')?!!STATE.today.flagCompleted:s.annihilated;

  /* MORNING — the same idea, driven by the tasks you marked as part of the
     routine. Only when there are some: with none marked the planner has no
     opinion, and imposing one would untick the box for everyone who has always
     ticked it by hand. */
  if(s.mornTotal>0&&!manualHolds('morningCompleted'))STATE.today.morningCompleted=s.morningDone;

  const changed=before!==JSON.stringify([STATE.today.target,STATE.today.completed,STATE.today.flagCompleted,STATE.today.morningCompleted]);
  if(changed)S.set(K.TODAY,STATE.today);
  return changed;
}

/* ═══ POMODORO ═══════════════════════════════════════════════════════════
   One focused minute is one point, so the timer's only job is to measure
   real focused minutes honestly and hand them to tab 2. It only ever adds:
   nothing here can take away pomodoros you logged by hand.
   ═══════════════════════════════════════════════════════════════════════ */
const POMO_UNIT=25; // minutes that make up one pomodoro, whatever your session length
/* The pomodoro travels with everything else. Left unsynced, a session started
   on the phone was invisible on the desktop, the cycle position disagreed
   (three done on one device, "first one" on the other), and two devices could
   each run their own timer and bank the minutes twice.
   startedAt is an absolute timestamp, so a running timer resumes correctly
   wherever it is picked up. */
function savePomo(){
  STATE.pomo._ts=CLOCK.now();
  S.set('st_pomo',STATE.pomo);
  commit();
}
function pomoPhaseLen(p){
  if(p.phase==='focus')return Math.max(1,p.focus)*60;
  if(p.phase==='long')return Math.max(1,p.longBrk)*60;
  return Math.max(1,p.brk)*60;
}
/* Seconds elapsed in the current leg, measured from the wall clock so a
   backgrounded tab or a locked phone keeps counting correctly. */
function pomoElapsed(p){
  return p.running?p.elapsed+Math.floor((CLOCK.now()-p.startedAt)/1000):p.elapsed;
}
function pomoRemaining(p){return Math.max(0,pomoPhaseLen(p)-pomoElapsed(p));}
function pomoRollDay(){
  const p=STATE.pomo,tk=todayKey();
  if(p.day!==tk){p.day=tk;p.minutesToday=0;p.doneInCycle=0;savePomo();}
}
function pomoStart(){
  const p=STATE.pomo;
  if(p.running)return;
  p.running=true;p.startedAt=CLOCK.now();savePomo();
}
function pomoPause(){
  const p=STATE.pomo;
  if(!p.running)return;
  p.elapsed=pomoElapsed(p);p.running=false;p.startedAt=0;
  // Bank the focused minutes done so far, so pausing never loses real work.
  savePomo();
}
function pomoReset(){
  const p=STATE.pomo;
  p.running=false;p.startedAt=0;p.elapsed=0;savePomo();
}
/* Ends the current leg. Focused minutes are banked and pushed to tab 2;
   breaks simply hand back to the next focus session. */
function pomoFinishPhase(auto){
  const p=STATE.pomo;
  pomoRollDay();
  const secs=pomoElapsed(p);
  if(p.phase==='focus'){
    const mins=auto?Math.max(1,p.focus):Math.floor(secs/60);
    if(mins>0){
      p.minutesToday+=mins;
      addPomodoroMinutes(mins);
    }
    p.doneInCycle=(p.doneInCycle+1)%Math.max(1,p.cycle);
    p.phase=p.doneInCycle===0?'long':'short';
  }else{
    p.phase='focus';
  }
  p.running=false;p.startedAt=0;p.elapsed=0;
  savePomo();
}
/* Tab 1 only ever ADDS to tab 2's pomodoro count — it can never subtract,
   so a number you typed by hand in tab 2 is never reduced by the timer. */
function addPomodoroMinutes(mins){
  const add=mins/POMO_UNIT;
  const now=Math.max(0,STATE.today.pomodoros||0);
  STATE.today.pomodoros=Math.round((now+add)*10)/10; // one decimal, never more
  markManual('pomodoros'); // the sum is the truth from here on
  commit();
}
function fmtClock(secs){
  const m=Math.floor(secs/60),s=secs%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
/* ── The bubble that follows the page ──
   The timer lives at the top of tab 1, and the whole reason to run one is to
   go and do something else — which on this app means scrolling down the list
   or crossing to tab 2, and losing sight of the only number still moving.
   The bubble is that number, and nothing more: it appears while a session is
   underway, it disappears the moment the real card is back on screen, and it
   carries no buttons, because a stop button you can hit by accident from
   anywhere on the page is worse than no bubble at all. Pressing it only takes
   you to the card that does have the controls.

   It hangs off <body> rather than inside #root, which render() empties: built
   into the tree it would be destroyed and rebuilt every draw, and a ring that
   restarts its animation every few seconds is exactly the fidget the corner
   of a screen must not have. */
const PP_R=32;                       // ring radius, in the SVG's own 74×74 box
const PP_C=2*Math.PI*PP_R;           // its circumference: the dash length
let _pomoPill=null;
function pomoPillEl(){
  if(_pomoPill&&document.body.contains(_pomoPill))return _pomoPill;
  const b=document.createElement('button');
  b.id='pomo-pill';b.type='button';
  b.innerHTML=
    `<svg viewBox="0 0 74 74" aria-hidden="true">`+
    `<circle class="pp-ring" cx="37" cy="37" r="${PP_R}"></circle>`+
    `<circle class="pp-fill" cx="37" cy="37" r="${PP_R}" stroke-dasharray="${PP_C}" stroke-dashoffset="${PP_C}"></circle>`+
    `</svg>`+
    `<span class="pp-in"><span class="pp-ph"></span><span class="pp-cl">00:00</span></span>`;
  b.onclick=()=>{
    if(STATE.tab!=='plan'){STATE.tab='plan';localStorage.setItem('st_tab','plan');render();}
    const c=document.getElementById('pomo-clock');
    if(c)c.scrollIntoView({behavior:'smooth',block:'center'});
  };
  document.body.appendChild(b);
  _pomoPill=b;
  return b;
}
/* Whether the real clock is in front of you right now. Off screen entirely,
   or scrolled far enough that only an edge of it shows, counts as gone. */
function pomoCardVisible(){
  const c=document.getElementById('pomo-clock');
  if(!c)return false;
  const r=c.getBoundingClientRect();
  if(!r.height)return false;
  const h=window.innerHeight||document.documentElement.clientHeight;
  return r.bottom>8&&r.top<h-8;
}
function syncPomoPill(){
  const p=STATE.pomo;
  // Underway means running, or paused partway through — a session left paused
  // and forgotten is precisely the one worth a reminder in the corner.
  const live=!!p&&(p.running||(p.elapsed||0)>0);
  // Never over a dialog: what is open is what you are dealing with.
  const busy=!!document.querySelector('.ovl')||!STATE.authed;
  const show=live&&!busy&&!pomoCardVisible();
  if(!show){
    if(_pomoPill&&document.body.contains(_pomoPill)){
      _pomoPill.classList.remove('on');
      // Left in the tree, only faded: removing it would cost the ring its
      // state and make the next appearance a jump rather than a fade.
      _pomoPill.style.pointerEvents='none';
    }
    return;
  }
  const el=pomoPillEl();
  const focusing=p.phase==='focus';
  const accent=focusing?'var(--ac)':'var(--cb)';
  const left=pomoRemaining(p);
  const done=1-left/Math.max(1,pomoPhaseLen(p));
  el.querySelector('.pp-cl').textContent=fmtClock(left);
  el.querySelector('.pp-ph').textContent=focusing?'🍅':'☕';
  const fill=el.querySelector('.pp-fill');
  fill.style.stroke=accent;
  fill.style.strokeDashoffset=String(PP_C*(1-Math.min(1,Math.max(0,done))));
  el.style.pointerEvents='auto';
  el.classList.toggle('paused',!p.running);
  const lbl=(focusing?t('pomo-focus'):(p.phase==='long'?t('pomo-long'):t('pomo-short')))+' · '+fmtClock(left);
  el.title=lbl;el.setAttribute('aria-label',t('pomo-title')+': '+lbl);
  el.classList.add('on');
}
/* ── The same clock in the browser tab ──
   The bubble solves losing the timer inside the page; this solves losing it
   behind another tab, which is where a focus session actually gets spent.
   The tab is the one place the app is still visible with the app not on
   screen, so the time goes first, where a strip of tab still shows it, and
   the name after. Unlike the bubble this does not care whether the card is
   on screen — nothing about the tab strip is ever a duplicate of the page.
   Paused says so in words rather than freezing a number that is not moving,
   which reads as a hung tab. */
const PAGE_TITLE='🏛️ Stoic';
let _titleNow=null;
function syncPomoTitle(){
  const p=STATE.pomo;
  const live=!!p&&(p.running||(p.elapsed||0)>0)&&STATE.authed;
  const want=live
    ? (p.phase==='focus'?'🍅 ':'☕ ')+(p.running?fmtClock(pomoRemaining(p)):'⏸ '+fmtClock(pomoRemaining(p)))+' · '+PAGE_TITLE
    : PAGE_TITLE;
  // Only on change: writing document.title every second makes some browsers
  // flash the tab and pushes a history-ish update nobody asked for.
  if(want!==_titleNow){_titleNow=want;document.title=want;}
}
/* A two-tone chime, built in code so the app stays a single file. It rings
   three times over rather than once: a single figure was gone in half a second
   — over before you looked up from the thing it was telling you to stop doing,
   which is the one moment it exists for. Same two notes, three times through,
   so it is longer without being louder or turning into an alarm. */
const POMO_CHIME=[[880,0],[1320,.18]];  // note, and how far into the figure it starts
const POMO_FIGURE=.58;                  // how long one figure runs, tail included
const POMO_RINGS=3;
/* One audio context for the whole session, opened the first time you press a
   pomodoro button and never closed. A context built fresh for each chime was
   born the moment the timer ran out — outside any press, with the phone face
   down — and a browser starts one of those suspended, which is silence. That
   is why the end of a break never made a sound: nothing had been pressed in
   five minutes. Building a new one each time also walked into Safari's cap of
   a handful of contexts per page and then threw, so the chime could die for
   the rest of the day partway through it. */
let _ac=null;
function audioCtx(){
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return null;
  if(!_ac){try{_ac=new AC();}catch(e){return null;}}
  return _ac;
}
/* Called from the press itself. Inside a press is the only moment a browser
   will let audio start, and once started it stays started. */
function unlockAudio(){
  const ctx=audioCtx();
  if(ctx&&ctx.state==='suspended')ctx.resume().catch(()=>{});
}
function pomoBeep(){
  const ctx=audioCtx();if(!ctx)return;
  const ring=()=>{
    try{
      const t0=ctx.currentTime;
      for(let n=0;n<POMO_RINGS;n++)POMO_CHIME.forEach(([f,at0])=>{
        const at=t0+at0+n*POMO_FIGURE;
        const o=ctx.createOscillator(),g=ctx.createGain();
        o.frequency.value=f;o.type='sine';o.connect(g);g.connect(ctx.destination);
        g.gain.setValueAtTime(.0001,at);
        g.gain.exponentialRampToValueAtTime(.35,at+.02);
        g.gain.exponentialRampToValueAtTime(.0001,at+.35);
        o.start(at);o.stop(at+.4);
      });
    }catch(e){/* audio blocked — the visual change is enough */}
  };
  // Suspended is the ordinary state of a tab that has been sitting idle, and
  // waking one takes a moment, so the chime is scheduled once it is awake.
  if(ctx.state==='suspended')ctx.resume().then(ring).catch(()=>{});
  else ring();
}
/* Asked at the moment you start a timer: a press, which is the only time the
   question is allowed to be asked, and the moment the answer starts mattering.
   Nothing in the app had ever asked before, so Notification.permission was
   never anything but 'default' and the one notification that existed — the end
   of a focus leg — could not fire even once. */
function askToNotify(){
  try{
    if('Notification' in window&&Notification.permission==='default')
      Notification.requestPermission().catch(()=>{});
  }catch(e){}
}
function notify(body){
  try{
    if('Notification' in window&&Notification.permission==='granted')
      // One tag, so a run of them replaces rather than stacks up on the phone.
      new Notification('Stoic',{body,tag:'stoic-pomo',icon:'./icons/icon-192.png'});
  }catch(e){}
}

/* ═══ GOALS ═══════════════════════════════════════════════════════════════
   Weekly, quarterly and yearly goals cannot build streaks, so their reward
   comes from finishing early instead: base × the days still left in the
   period. Finish a weekly goal on Sunday and it pays ×7; leave it to
   Saturday and it pays ×1.

   Their points are kept in a separate total. They are large enough that
   landing them on a single day would make that day permanently the best one
   on record and drag every average with it, so the day's own score and the
   daily stats stay untouched.

   The week starts on Sunday, matching the calendar in the score tab.
   ═══════════════════════════════════════════════════════════════════════ */
// Yearly first, then quarterly, then weekly: you derive the shorter goals from
// the longer ones, so reading top-down is how you actually line them up.
const GOAL_KINDS=['week','quarter','year'];
/* One base for all three: the length of the period does the ranking on its
   own. A weekly tops out around 7,000, a quarterly around 92,000, a yearly at
   365,000 — a real hierarchy without a single goal dwarfing months of daily
   scoring. Bases of 10,000 and 100,000 put a yearly goal finished in August at
   13.9 million, which drowned everything else in the app. */
/* ═══ REWARDS ════════════════════════════════════════════════════════════
   The three that shipped — stimulants, procrastination, orgasm — are one
   person's list, and the app is not only for that person. They are now the
   defaults of a list you own: rename them, give them your own icon, change
   what they weigh, drop the ones that mean nothing to you, add your own.

   A reward's weight decides two things at once, and they are the same thing
   said twice: what it costs, and how good a day has to be to forgive it. A
   light one is cheap and a merely decent day wipes the streak; a grave one is
   expensive and only a perfect day will. That is exactly how the original
   three already behaved, so the weights are named after what they mean rather
   than after a number.
   ═══════════════════════════════════════════════════════════════════════ */
const REWARD_TIERS={
  light:  {base:25, resetOn:['yellow','green','purple'], name:'rw-light',  order:1},
  serious:{base:50, resetOn:['green','purple'],          name:'rw-serious',order:2},
  grave:  {base:100,resetOn:['purple'],                  name:'rw-grave',  order:3}
};
const REWARD_MAX=5;
/* The three originals, exactly as they were. Their ids never change: every day
   ever logged refers to them by these, and so does every streak override. */
const REWARD_DEFAULTS=[
  {id:'drugs',   icon:'💊',name:'Estimulantes',   nameEn:'Stimulants',      tier:'light',  builtin:true},
  {id:'internet',icon:'🌐',name:'Procrastinación',nameEn:'Procrastination', tier:'serious',builtin:true,byMinutes:true},
  {id:'macanazo',icon:'💦',name:'Orgasmo',        nameEn:'Orgasm',          tier:'grave',  builtin:true}
];
/* Always the three originals plus whatever you added, and always in order of
   weight — lightest first, so the list reads as the scale it is. The three are
   put back if they ever go missing: they are one of each weight, and without
   all three the scale has no ends. */
function rewards(){
  const p=STATE.planner;
  if(!Array.isArray(p.rewards))p.rewards=[];
  REWARD_DEFAULTS.forEach(d=>{
    if(!p.rewards.some(r=>r.id===d.id))p.rewards.push(JSON.parse(JSON.stringify(d)));
  });
  p.rewards.sort((a,b)=>
    (REWARD_TIERS[a.tier]?.order||9)-(REWARD_TIERS[b.tier]?.order||9)
    ||(a.builtin?0:1)-(b.builtin?0:1));
  return p.rewards;
}
function rewardById(id){return rewards().find(r=>r.id===id)||null;}
// How many logged days would be touched by dropping one — worth saying before.
function daysWithReward(id){
  const inHist=STATE.history.filter(d=>(d.penalties||[]).some(p=>p.type===id)).length;
  const inToday=(STATE.today.penalties||[]).some(p=>p.type===id)?1:0;
  return inHist+inToday;
}
/* Dropping one takes its entries with it. Left behind they belong to nothing:
   they cannot be named, they cannot be priced, and they sat in the day's list
   showing a raw id and scoring zero. The days are re-scored without them,
   which is the honest reading — those points were only ever that reward's. */
function purgeReward(id){
  STATE.planner.rewards=rewards().filter(r=>r.id!==id);
  STATE.today.penalties=(STATE.today.penalties||[]).filter(p=>p.type!==id);
  STATE.history.forEach(d=>{
    if(d.penalties&&d.penalties.some(p=>p.type===id))d.penalties=d.penalties.filter(p=>p.type!==id);
  });
  delete STATE.streakOverrides[penKey(id)];
  delete STATE.streakOverrides[cleanKey(id)];
  S.set(K.HIST,STATE.history);S.set(K.STREAK_OVR,STATE.streakOverrides);
  savePlanner();commit();
}
// What to call one. A built-in still answers to the language until it is renamed.
function rewardName(r){
  if(!r)return'';
  if(r.builtin&&!r.renamed)return STATE.lang==='es'?r.name:(r.nameEn||r.name);
  return r.name;
}
function rewardLabel(r){return (r?.icon?r.icon+' ':'')+rewardName(r);}
/* Whether a built-in is still the thing it shipped as. Some of what the app
   says is written about the thing and not about the slot — "Día más cachondo",
   counted in orgasmo(s), a medal called "Sin orgasmo". That wording is true
   only while the grave one is still Orgasmo; rename it to anything else and
   the flavour is about something it is not, so the plain wording takes over
   ("Día con más X"). Nothing is deleted, only hidden: type the original name
   back in and the flavour comes back with it. The icon is not part of this —
   swapping 💦 for another picture does not change what the thing is. */
function isOriginal(r){return !!(r&&r.builtin&&!r.renamed);}
// The default a built-in was born with, so a rename can be recognised as undone.
function rewardDefault(r){return r&&r.builtin?REWARD_DEFAULTS.find(d=>d.id===r.id)||null:null;}
// Which day colours charge this one at base for the day (see TIER_FORGIVES),
// and what one costs, fixed regardless of anything else going on.
function rewardForgives(r){return tierForgives(r?.tier||'light');}
function rewardCost(r){return Math.round(REWARD_TIERS[r?.tier||'light'].base*CALC.penMult());}
/* Streak keys. The originals keep the names they were stored under so nothing
   already saved has to be migrated; anything you add gets its own pair. */
const LEGACY_PEN={drugs:'substancesPenaltyStreak',internet:'procrastinationPenaltyStreak',macanazo:'macanazoPenaltyStreak'};
const LEGACY_CLEAN={drugs:'substancesStreak',internet:'procrastinationStreak',macanazo:'macanazoStreak'};
function penKey(id){return LEGACY_PEN[id]||('pen_'+id);}
function cleanKey(id){return LEGACY_CLEAN[id]||('clean_'+id);}

const GOAL_BASE={week:1000,quarter:1000,year:1000};
const GOAL_MAX={week:5,quarter:5,year:10};

function periodBounds(kind,dateStr){
  const d=new Date(dateStr+'T12:00:00');
  let start,end;
  if(kind==='week'){
    start=new Date(d);start.setDate(d.getDate()-d.getDay());        // Sunday
    end=new Date(start);end.setDate(start.getDate()+6);
  }else if(kind==='quarter'){
    const q=Math.floor(d.getMonth()/3);
    start=new Date(d.getFullYear(),q*3,1);
    end=new Date(d.getFullYear(),q*3+3,0);
  }else{
    start=new Date(d.getFullYear(),0,1);
    end=new Date(d.getFullYear(),11,31);
  }
  return{id:kind+':'+isoDate(start),start:isoDate(start),end:isoDate(end)};
}
/* Days left counting today, so finishing on the first day of a week pays ×7
   and finishing on the last pays ×1. */
function daysLeftIn(kind,dateStr){
  const{end}=periodBounds(kind,dateStr);
  const a=new Date(dateStr+'T12:00:00'),b=new Date(end+'T12:00:00');
  return Math.max(1,Math.round((b-a)/86400000)+1);
}
function goals(){return STATE.planner.goals||(STATE.planner.goals=[]);}
function goalsOf(kind){
  const now=periodBounds(kind,todayKey()).id;
  // A goal left unfinished follows you into the next period and is paid by
  // what is left of the NEW one, so the clock genuinely restarts.
  return goals().filter(g=>g.kind===kind&&(!g.doneOn||g.period===now));
}
/* The deadline is fixed the day a goal is created and never moves again.
   Paying by the days left in whatever period happens to be current made
   waiting the winning move: a weekly goal ignored all week paid ×2 on Friday
   but ×7 if you let it roll into Monday, and a yearly goal left undone all of
   2026 paid ×365 by finishing it on 2 January. The clock now runs from the
   moment you commit, so finishing sooner always pays more and postponing can
   only ever cost you. */
function goalDeadline(g){
  if(g.deadline)return g.deadline;
  // Goals created before deadlines were stored: derive it from their period.
  const start=(g.period||'').split(':')[1];
  return start?periodBounds(g.kind,start).end:periodBounds(g.kind,todayKey()).end;
}
/* The first day the goal can honestly have been finished: the day it was
   written down, or the day its period opened, whichever is later. Nothing can
   be finished before it was set, and nothing belongs to a period it did not
   live in. */
function goalFloorDate(g){
  const start=(g.period||'').split(':')[1]||periodBounds(g.kind,goalDeadline(g)).start;
  const born=g.created?new Date(g.created).toLocaleDateString('en-CA',{timeZone:appTZ()}):'';
  return born&&born>start?born:start;
}
/* How long the whole period is — the ceiling on what a goal of that kind can
   ever pay. A week can only ever be worth seven days, however the completion
   date is arrived at. */
function goalPeriodLength(g){
  const b=periodBounds(g.kind,goalDeadline(g));
  return Math.round((new Date(b.end+'T12:00:00')-new Date(b.start+'T12:00:00'))/86400000)+1;
}
function goalDaysLeft(g,from){
  const a=new Date((from||g.doneOn||todayKey())+'T12:00:00');
  const b=new Date(goalDeadline(g)+'T12:00:00');
  const days=Math.round((b-a)/86400000)+1;
  /* Floor and ceiling both. Past the deadline pays the floor; and a date from
     before the period — typed by hand, or arriving from a device that let one
     through — cannot pay more than the period itself holds. A weekly goal
     dated a month early once paid thirty-odd thousand for a seven-thousand
     goal, and the payout is recomputed from the date every time it is read, so
     capping it here retires any such number already stored. */
  return Math.max(1,Math.min(goalPeriodLength(g),days));
}
function goalIsLate(g,from){
  return (from||g.doneOn||todayKey())>goalDeadline(g);
}
function goalPoints(g){
  return GOAL_BASE[g.kind]*goalDaysLeft(g);
}
/* Recomputed from the completion date rather than read back from what was
   stored, so changing a base re-values past goals instead of leaving a mix of
   old and new rates on the total forever. */
function goalsTotal(){
  return goals().filter(g=>g.doneOn).reduce((s,g)=>s+goalPoints(g),0);
}
function addGoal(kind,title){
  if(goalsOf(kind).length>=GOAL_MAX[kind])return false;
  const b=periodBounds(kind,todayKey());
  goals().unshift({id:uid(),kind,title,period:b.id,deadline:b.end,
    doneOn:null,points:0,created:CLOCK.now(),_ts:CLOCK.now()});
  savePlanner();return true;
}
function toggleGoal(id){
  const g=goals().find(x=>x.id===id);if(!g)return;
  if(g.doneOn){g.doneOn=null;g.points=0;}
  else{g.doneOn=todayKey();g.points=goalPoints(g);}  // deadline never moves
  g._ts=CLOCK.now();savePlanner();
}
function deleteGoal(id){
  STATE.planner.goals=goals().filter(g=>g.id!==id);savePlanner();
}

/* ═══ QUADRANTS ═══════════════════════════════════════════════════════════
   Priority was three exclamation marks that never answered the question you
   ask when you look at a list: not "how loud is this" but "should I be doing
   it at all". The Eisenhower quadrants answer that, and they answer it in a
   shape — which is why they also get a view of their own.

   The value still lives in the `priority` field so nothing already written
   has to be migrated: 0 is unassigned, 1–4 are the quadrants. An old task
   that carried a !!! lands in 3 rather than nowhere, which is meaningless
   but harmless, and one press puts it where it belongs.

   Only the emoji shows on a row — the words are the tooltip, so the list
   stays a list of task names rather than a list of labels about them. */
const QUAD=[0,1,2,3,4];
const QUAD_EMOJI={0:'',1:'🚨1️⃣',2:'👑2️⃣',3:'🤖3️⃣',4:'🤏🏼4️⃣'};
function quadOf(r){const q=parseInt(r&&r.priority)||0;return q>=1&&q<=4?q:0;}
function quadEmoji(q){return QUAD_EMOJI[q]||'';}
function quadName(q){return q?t('quad-'+q):t('quad-0');}
function quadColor(q){return q===1?'var(--cr)':q===2?'var(--cg)':q===3?'var(--cy)':q===4?'var(--t3)':'var(--t3)';}
// Unassigned sorts last, not first: it is the absence of an answer.
function quadRank(r){const q=quadOf(r);return q||9;}
function weekdayNames(){return t('weekdays').split(',');}
function weekdayFull(){return t('weekdays-full').split(',');}
/* Reads as a sentence rather than as a unit and a number stuck together —
   "3 Mensual" and "12 Cada hora" said nothing. Common weekday sets get their
   own name, since "weekends" beats "Sat, Sun". */
function joinList(arr){
  if(arr.length<=1)return arr.join('');
  return arr.slice(0,-1).join(', ')+' '+t('and')+' '+arr[arr.length-1];
}
function repeatLabel(rep){
  if(!rep)return'';
  const n=Math.max(1,rep.every||1);
  const every=k=>n===1?t('rep-'+k+'-1'):t('rep-'+k+'-n').replace('{n}',n);

  if(rep.unit==='week'&&Array.isArray(rep.days)&&rep.days.length){
    const days=[...new Set(rep.days)].sort((a,b)=>a-b);
    const key=days.join(',');
    const named={'0,6':t('rep-weekends'),'1,2,3,4,5':t('rep-weekdays'),
                 '0,1,2,3,4,5,6':t('rep-everyday')}[key];
    const which=named||joinList(days.map(i=>weekdayFull()[i]));
    return '🔁 '+(n===1?which:t('rep-week-n').replace('{n}',n)+': '+which);
  }
  if(rep.unit==='month'&&Array.isArray(rep.doms)&&rep.doms.length){
    const which=t('rep-on-days')+' '+joinList([...new Set(rep.doms)].sort((a,b)=>a-b).map(String));
    return '🔁 '+(n===1?capFirst(which):t('rep-month-n').replace('{n}',n)+', '+which);
  }
  return '🔁 '+every(rep.unit);
}
/* Seven toggles for a weekly repeat. Empty means the plain "every N weeks"
   stride; picking days switches it to those weekdays. */
function weekdayPicker(initial){
  const sel=new Set(initial||[]);
  const wrap=dv('row gap4 mt6');wrap.style.flexWrap='wrap';
  const names=weekdayNames();
  names.forEach((nm,i)=>{
    const b=bt('btn-xs',nm,()=>{
      sel.has(i)?sel.delete(i):sel.add(i);
      b.className=sel.has(i)?'btn-ac btn-xs':'btn-xs';
      if(!sel.has(i))b.style.cssText='background:none;border:1px solid var(--b2);color:var(--t3)';
      else b.style.cssText='';
      b.style.minWidth='34px';
    });
    b.className=sel.has(i)?'btn-ac btn-xs':'btn-xs';
    if(!sel.has(i))b.style.cssText='background:none;border:1px solid var(--b2);color:var(--t3)';
    b.style.minWidth='34px';
    wrap.appendChild(b);
  });
  return{el:wrap,get:()=>[...sel].sort()};
}
/* The same idea for monthly: pick days of the month. Empty keeps the plain
   "every N months on the same day" behaviour. */
function monthdayPicker(initial){
  const sel=new Set(initial||[]);
  const wrap=dv('mt6');
  wrap.appendChild(dv('xs dimmer up ls mb4',t('rep-pick-days')));
  const grid=dv('row gap4');grid.style.flexWrap='wrap';
  for(let i=1;i<=31;i++){
    const b=bt('btn-xs',String(i),()=>{
      sel.has(i)?sel.delete(i):sel.add(i);
