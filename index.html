<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover lets the page reach under the notch and the home bar, so
     the safe-area insets below have real numbers to work with. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<!-- Rewritten from JS while a pomodoro runs; see syncPomoTitle. -->
<title>🏛️ Stoic</title>
<!-- Browser-tab icon: inline SVG emoji, so it stays single-file and works offline -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏛️%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<!-- Installable: added to a phone's home screen it opens on its own, full
     screen, with its own icon, and starts without signal. -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#09090f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Stoic">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
/* ── #9: zoom — max-width tighter + bigger base font ── */
:root{
  --bg:#09090f;--sur:#111118;--sur2:#17171f;--sur3:#1d1d26;
  --b1:#22222e;--b2:#2c2c3a;--b3:#3a3a4a;
  --t1:#f2f2f8;--t2:#b0b0cc;--t3:#707090;
  /* #10: warmer accent — soft amber-gold instead of cold teal */
  --ac:#d4a017;--ac2:#b8880e;--acd:rgba(212,160,23,.12);--acb:rgba(212,160,23,.28);
  /* negative = red */
  --ng:#f97316;--ngd:rgba(249,115,22,.13);--ngb:rgba(249,115,22,.30);
  /* status */
  --cr:#ff5566;--cy:#f5c842;--cg:#34d399;--cp:#a78bfa;
  /* Rest blue. Sits opposite the amber accent so focus and break read apart at
     a glance, and carries no meaning of its own the way the day colours do. */
  --cb:#5b9df9;
  /* How long a finished task takes to leave. One place, so the CSS and the
     timer that follows it can never drift apart. */
  --done-ms:.26s;
  --rd:rgba(255,85,102,.13);--yd:rgba(245,200,66,.13);--gd:rgba(52,211,153,.13);--pd:rgba(167,139,250,.13);
  --rb:rgba(255,85,102,.30);--yb:rgba(245,200,66,.30);--gb:rgba(52,211,153,.30);--pb:rgba(167,139,250,.30);
  --ff:'Outfit',sans-serif;--mo:'JetBrains Mono',monospace;
}
/* #9: base font 17px, max-width 1100px = natural 125–150% feel */
html,body{background:var(--bg);color:var(--t1);font-family:var(--ff);font-size:20px;min-height:100vh;-webkit-font-smoothing:antialiased;line-height:1.55}
/* A phone's 100vh is the height with the URL bar hidden, so the page is always
   a bar taller than the screen and always slightly scrollable. dvh is the one
   that means what it says; the line above stays for anything that lacks it. */
@supports(min-height:100dvh){html,body{min-height:100dvh}}
#root{max-width:1280px;margin:0 auto;padding:18px 24px 60px}
/* Every overlay in the app opens the same way. It was written out nine times
   as an inline style, which is nine copies no rule could reach — and a phone
   needs to reach them, to open them as sheets off the bottom edge instead. */
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:60;
  display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow:auto}
/* Likewise the tab switcher: described here so a phone can move it to the
   bottom of the screen, where a thumb already is. */
.tabbar{justify-content:center;border:1px solid var(--b2);border-radius:11px;
  padding:3px;background:var(--sur2);max-width:420px;margin-left:auto;margin-right:auto;
  /* It sticks to the top on a big screen for the same reason it sits at the
     bottom on a phone: the score tab is a long page, and having to scroll all
     the way back up to reach the other tab is the kind of small friction that
     stops you looking. The phone rule below overrides this to fixed. */
  position:sticky;top:0;z-index:40}
/* A centred pill leaves the page showing on both sides of it, and content
   sliding through that gap is what makes a sticky bar look broken. This is
   the band behind it: the page background, full width, behind the pill. */
.tabbar::before{content:'';position:absolute;left:50%;transform:translateX(-50%);
  width:100vw;top:-14px;bottom:-10px;background:var(--bg);z-index:-1}
.apphdr{padding:20px 0 16px}
.ms-shelf{flex-wrap:wrap;justify-content:center}

/* ── TYPOGRAPHY ── */
.mo{font-family:var(--mo)}
.xs{font-size:14px}.sm{font-size:16px}.md{font-size:18px}.lg{font-size:21px}.xl{font-size:26px}.xxl{font-size:32px}.xxxl{font-size:46px}
.w3{font-weight:300}.w4{font-weight:400}.w5{font-weight:500}.w6{font-weight:600}.w7{font-weight:700}.w8{font-weight:800}
.dim{color:var(--t2)}.dimmer{color:var(--t3)}
.ac{color:var(--ac)}.ng{color:var(--ng)}
.cr{color:var(--cr)}.cy{color:var(--cy)}.cg{color:var(--cg)}.cp{color:var(--cp)}.cb{color:var(--cb)}
.up{text-transform:uppercase}.ls{letter-spacing:.07em}
.ctr{text-align:center}

/* ── LAYOUT ── */
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.rem-sub{margin-left:22px;border-left:2px solid var(--b2);padding-left:8px}
.tagchip{display:inline-flex;align-items:center;padding:1px 7px;border-radius:99px;font-size:10px;font-weight:700;letter-spacing:.04em;background:var(--pd);color:var(--cp);border:1px solid var(--pb);text-transform:uppercase}
.row{display:flex;align-items:center}
.rowb{display:flex;align-items:center;justify-content:space-between}
.col{display:flex;flex-direction:column}
.gap4{gap:4px}.gap6{gap:6px}.gap8{gap:8px}.gap10{gap:10px}.gap12{gap:12px}.gap16{gap:16px}
.f1{flex:1}.w100{width:100%}
.mt4{margin-top:4px}.mt6{margin-top:6px}.mt8{margin-top:8px}.mt10{margin-top:10px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}
.mb4{margin-bottom:4px}.mb6{margin-bottom:6px}.mb8{margin-bottom:8px}.mb10{margin-bottom:10px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}
.s4{display:flex;flex-direction:column;gap:4px}
.s6{display:flex;flex-direction:column;gap:6px}
.s8{display:flex;flex-direction:column;gap:8px}
.s10{display:flex;flex-direction:column;gap:10px}
.s12{display:flex;flex-direction:column;gap:12px}

/* ── CARD ── */
.card{background:var(--sur);border:1px solid var(--b1);border-radius:16px;padding:22px}
.card2{background:var(--sur2);border:1px solid var(--b1);border-radius:12px;padding:14px}
.card3{background:var(--sur3);border:1px solid var(--b1);border-radius:8px;padding:10px}
.ctit{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin-bottom:14px}
hr.dv{border:none;border-top:1px solid var(--b1);margin:12px 0}

/* ── STATUS ── */
.s-red{background:var(--rd);border-color:var(--rb);color:var(--cr)}
.s-yellow{background:var(--yd);border-color:var(--yb);color:var(--cy)}
.s-green{background:var(--gd);border-color:var(--gb);color:var(--cg)}
.s-purple{background:var(--pd);border-color:var(--pb);color:var(--cp)}
.s-ac{background:var(--acd);border-color:var(--acb);color:var(--ac)}

/* ── BADGE ── */
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border:1px solid}

/* ── INPUTS ── */
input[type=text],input[type=number],input[type=email],input[type=password],select{
  background:var(--sur2);border:1px solid var(--b2);border-radius:8px;
  color:var(--t1);font-family:var(--ff);font-size:16px;padding:10px 14px;
  outline:none;transition:border-color .15s,box-shadow .15s;width:100%
}
input:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--acd)}
input[type=checkbox]{accent-color:var(--ac);width:16px;height:16px;cursor:pointer;flex-shrink:0}
input[type=number]::-webkit-inner-spin-button{opacity:.3}

/* ── BUTTONS ── */
button{cursor:pointer;font-family:var(--ff);font-size:15px;font-weight:600;border-radius:9px;border:none;padding:10px 18px;transition:all .15s;line-height:1.3}
.btn-ac{background:var(--ac);color:#ffffff;font-weight:800}
.btn-ac:hover{background:var(--ac2);transform:translateY(-1px)}
.btn-ghost{background:var(--sur2);color:var(--t2);border:1px solid var(--b2)}
.btn-ghost:hover{color:var(--t1);border-color:var(--b3)}
.btn-ng{background:var(--ngd);color:var(--ng);border:1px solid var(--ngb)}
.btn-ng:hover{background:rgba(255,85,102,.22)}
.btn-icon{background:none;padding:4px 7px;color:var(--t3);border:none;border-radius:6px}
.btn-icon:hover{color:var(--t1);background:var(--sur3)}
.btn-sm{padding:6px 12px;font-size:13px}
.btn-xs{padding:3px 8px;font-size:12px;border-radius:5px}

/* ── TOGGLE ── */
.tog{display:flex;align-items:center;gap:12px;cursor:pointer;padding:13px 16px;border-radius:12px;border:1px solid var(--b1);background:var(--sur2);transition:all .15s;user-select:none}
.tog:hover{border-color:var(--b2)}
.tog.on{border-color:var(--ac);background:var(--acd)}
.tog.on .tt{color:var(--ac);font-weight:600}
.tt{font-size:16px;color:var(--t2)}
.ts{font-size:12px;color:var(--t3);margin-top:2px}

/* ── PROGRESS ── */
.prog{height:6px;border-radius:3px;background:var(--sur2);overflow:hidden}
.prog-f{height:100%;border-radius:3px;transition:width .3s}

/* ── STREAKS ── */
.sk-g{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.skc{border-radius:12px;padding:16px 12px;text-align:center;border:1px solid}
.skc.pos{background:var(--acd);border-color:var(--acb)}
.skc.neg{background:var(--ngd);border-color:var(--ngb)}
.skn{font-size:34px;font-weight:700;line-height:1;font-family:var(--mo)}
.skl{font-size:10px;color:var(--t3);margin-top:4px;text-transform:uppercase;letter-spacing:.06em}

/* ── CALENDAR ── */
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-c{aspect-ratio:.9;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;border:1px solid transparent;transition:all .12s;position:relative;overflow:hidden}
.cal-c:hover{filter:brightness(1.2)}
.cal-c.today{border-color:var(--ac)!important;box-shadow:0 0 0 1px var(--ac)}
.cal-c.sel{border-color:#fff!important}
.cal-num{font-size:14px;font-weight:800;position:relative;z-index:1}
.cal-pts{font-size:10px;font-weight:600;opacity:.95;margin-top:1px;font-family:var(--mo);position:relative;z-index:1}
/* #8: flag glow overlay */
.cal-flag-ring{position:absolute;inset:0;border-radius:6px;border:2px solid gold;box-shadow:inset 0 0 8px rgba(255,200,0,.3),0 0 8px rgba(255,200,0,.4);pointer-events:none;z-index:2}
.cal-flag-ico{position:absolute;top:1px;right:2px;font-size:14px;z-index:3;line-height:1}
.cal-medal{position:absolute;top:1px;left:2px;font-size:12px;z-index:3;line-height:1;filter:drop-shadow(0 0 4px rgba(255,255,255,.25))}
.cal-hd{text-align:center;font-size:9px;color:var(--t3);padding:3px 0;text-transform:uppercase;letter-spacing:.05em}

/* ── GOAL TILES ──
   They grow under the pointer. A timed wave asked to be noticed whether or not
   you were looking anywhere near it; this answers the eye that is already
   there, and says plainly that the tile can be pressed. */
.goal-tile{transition:transform .16s cubic-bezier(.34,1.4,.64,1),border-color .16s}
.goal-tile:hover{transform:scale(1.09);border-color:var(--ac)!important}
.goal-tile:active{transform:scale(1.02)}
@media(prefers-reduced-motion:reduce){.goal-tile{transition:border-color .16s}.goal-tile:hover{transform:none}}

/* ── MILESTONE ──
   Over the whole page, gone in a few seconds, once ever. */
.ms-ov{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;cursor:pointer;
  background:radial-gradient(circle at 50% 44%,rgba(0,0,0,.5),rgba(0,0,0,.88));animation:msIn .45s ease both}
.ms-ov.out{animation:msOut .6s ease both}
@keyframes msIn{from{opacity:0}to{opacity:1}}
@keyframes msOut{to{opacity:0}}
.ms-card{position:relative;text-align:center;animation:msPop .75s cubic-bezier(.2,1.5,.4,1) both}
@keyframes msPop{0%{transform:scale(.62);opacity:0}62%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
.ms-ico{font-size:62px;line-height:1;filter:drop-shadow(0 0 26px var(--ms));animation:msFloat 2.8s ease-in-out infinite}
@keyframes msFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.ms-n{font-family:var(--mo);font-size:84px;font-weight:800;line-height:1;letter-spacing:-.04em;
  color:var(--ms);text-shadow:0 0 44px var(--ms);margin-top:4px}
.ms-w{font-size:20px;font-weight:700;letter-spacing:.34em;text-transform:uppercase;color:#fff;opacity:.96;margin-top:10px}
.ms-sub{font-size:12px;letter-spacing:.06em;color:rgba(255,255,255,.5);margin-top:14px}
.ms-spark{position:absolute;left:50%;top:42%;font-size:17px;pointer-events:none;animation:msSpark 1.6s ease-out forwards}
@keyframes msSpark{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}
  100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.15);opacity:0}}
@media(prefers-reduced-motion:reduce){.ms-card,.ms-ico,.ms-spark{animation:none}.ms-spark{display:none}}

/* ── PENALTY ITEM ── */
.pen-it{background:var(--sur2);border:1px solid var(--ngb);border-radius:8px;padding:9px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}

/* ── ALL, AT A GLANCE ──
   As many across as the width allows, and every name readable. */
.rem-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.rem-chip{background:var(--sur2);border:1px solid var(--b1);border-radius:9px;padding:8px 10px;
  cursor:pointer;transition:border-color .14s,transform .14s,background .14s}
.rem-chip:hover{border-color:var(--ac);transform:translateY(-1px)}
.rem-chip.late{border-color:var(--rb)}
.rem-chip.sel{border-color:var(--ac);background:var(--acd)}
/* Something with tasks inside it wears a spine, so a project never reads as
   one more loose task — least of all when what is inside is out of sight. */
.rem-chip.parent{border-left:3px solid var(--cp);padding-left:8px}
.rem-chip-t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.35}
@media(prefers-reduced-motion:reduce){.rem-chip:hover{transform:none}}

/* ── THE QUADRANTS ──
   Two by two, and it stays two by two on a phone. The whole point of this
   view is the shape: which half of the cross a task is sitting in is the
   thing you are reading, and a stack of four boxes is not a cross. Narrow
   just means smaller boxes. */
/* minmax(0,1fr), not 1fr. A plain 1fr will not shrink below the widest
   unbreakable thing inside it, so one long task name in the right-hand
   column quietly made that column wider than the left and the cross came out
   lopsided — which on a phone, where there is no slack, was most of the
   width. A floor of 0 says the two halves are equal and the text wraps. */
.quad-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:stretch}
.quad-cell{border:1px solid var(--b1);border-radius:12px;padding:10px;background:var(--sur2);
  display:flex;flex-direction:column;gap:6px;min-height:110px;min-width:0}
/* Same reason one level down: a chip is a flex item and would otherwise
   refuse to be narrower than the longest word on it. */
.quad-cell .rem-chip,.quad-cell .rem-chip>*{min-width:0}
/* break-word, not anywhere: anywhere splits ordinary words to fill the line
   ("Responde / r correos"), which is unreadable. This breaks only a word that
   could not fit on a line of its own. */
.quad-cell .rem-chip-t{overflow-wrap:break-word}
/* Each quadrant is tinted by what it asks of you: the one to do now reads
   loudest, the one to drop barely reads at all. */
.quad-cell.q1{border-color:var(--rb);background:var(--rd)}
.quad-cell.q2{border-color:var(--gb);background:var(--gd)}
.quad-cell.q3{border-color:var(--yb);background:var(--yd)}
.quad-cell.q4{opacity:.72}
/* The rest of the box, clickable, and quiet until you go near it: a ＋ on
   every empty quadrant all the time would turn the cross into a form. */
.quad-add{flex:1;min-height:26px;border-radius:9px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  color:var(--t3);font-size:16px;opacity:0;transition:opacity .14s,background .14s}
.quad-add:hover,.quad-add:focus-visible{opacity:1;background:var(--sur3)}
/* Nothing hovers on a touch screen, so there it is always faintly there. */
@media(hover:none){.quad-add{opacity:.5}}
.quad-h{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.quad-h .qn{font-size:15px}
.quad-cell .rem-chip{padding:6px 8px}
@media(max-width:700px){
  .quad-grid{gap:6px}
  .quad-cell{padding:7px;min-height:88px;border-radius:10px}
  .quad-cell .rem-chip{padding:5px 6px}
  /* Half a phone's width is about 165px, and "importante, no urgente" wrapped
     over three lines of it before a single task showed. The emoji already
     carries which box this is, so the description goes and the instruction —
     one word, and the half that tells you what to do — stays. */
  .quad-h .qname{display:none}
  .quad-do{margin-top:-2px}
  /* Both rows the same height, or the cross is not a cross. */
  .quad-grid{grid-auto-rows:1fr}
}

/* ── HISTORY ROW ── */
.hr-row{padding:9px 12px;border-radius:8px;border:1px solid var(--b1);background:var(--sur2);cursor:pointer;transition:border-color .15s}
.hr-row:hover{border-color:var(--b2)}
.hr-row.ed{border-color:var(--ac);background:var(--acd)}

/* ── SECTION TOGGLE ── */
.sec-t{width:100%;display:flex;align-items:center;justify-content:space-between;background:none;border:none;padding:0 0 14px;color:var(--t3);cursor:pointer;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.sec-t:hover{color:var(--t2)}

/* ── MISC ── */
.circ{transform:rotate(-90deg)}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--cg);display:inline-block;animation:pulse 2s ease infinite}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes fi{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.fi{animation:fi .18s ease}
/* Ticking one off. The row used to blink out of existence between one frame
   and the next, which is no way to mark the one press the day is actually for.
   It leans back, slides out to the right and fades, and the list closes over
   the space it left — the box collapses on the same curve, so nothing below it
   jumps. Kept to 260ms: long enough to read as a thing leaving, short enough
   that the next row is under your thumb before you look for it. */
@keyframes doneGo{
  0%  {opacity:1;transform:translateX(0) scale(1)}
  26% {opacity:1;transform:translateX(-6px) scale(1.02)}
  100%{opacity:0;transform:translateX(40px) scale(.95)}
}
.done-go{
  animation:doneGo var(--done-ms) cubic-bezier(.36,0,.5,1) forwards;
  transition:height var(--done-ms) cubic-bezier(.36,0,.5,1),
             padding var(--done-ms) cubic-bezier(.36,0,.5,1),
             border-width var(--done-ms) cubic-bezier(.36,0,.5,1),
             margin var(--done-ms) cubic-bezier(.36,0,.5,1);
  overflow:hidden;pointer-events:none;
}
@media(prefers-reduced-motion:reduce){.done-go{animation:none;transition:none}}
/* Celebration for a day whose flags are all down */
@keyframes pop{0%{transform:scale(.7);opacity:0}55%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes shine{0%,100%{box-shadow:0 0 0 0 rgba(212,160,23,.35)}50%{box-shadow:0 0 22px 4px rgba(212,160,23,.35)}}
.celebrate{animation:pop .45s cubic-bezier(.2,1.3,.4,1),shine 2.4s ease-in-out .45s infinite}
@keyframes confetti{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(46px) rotate(220deg);opacity:0}}
.confetti span{position:absolute;top:0;font-size:13px;animation:confetti 1.5s ease-in forwards}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--b2);border-radius:3px}

@media(max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}.sk-g{grid-template-columns:repeat(2,1fr)}}
@media(max-width:580px){.g4{grid-template-columns:1fr}.g2{grid-template-columns:1fr}.xxxl{font-size:30px}.xxl{font-size:24px}}
/* One column is right for the four cards you type into. It is wrong for the
   stat tiles, which are a number and a caption each and were stacking forty
   deep — the whole reason the score tab read as a mile of scrolling on a
   phone. The tiles say so themselves now, and stay two across. */
@media(max-width:580px){.g4.tiles{grid-template-columns:repeat(2,1fr)}}

   A running pomodoro is the one number in the app that changes while you are
   looking somewhere else, so it is the one thing worth following you down the
   page. It shows up only while a session is underway and only while the real
   card is off screen: with the card in front of you the bubble would be the
   same clock twice, which is clutter, not help. Nothing on it is a control —
   pressing it only takes you back to the card that does have the controls. */
#pomo-pill{
  position:fixed;z-index:60;right:18px;bottom:18px;
  width:74px;height:74px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--sur);border:1px solid var(--b2);
  box-shadow:0 6px 22px rgba(0,0,0,.34);
  cursor:pointer;padding:0;
  /* It arrives and leaves rather than blinking in and out. */
  opacity:0;transform:scale(.82);
  transition:opacity .22s ease,transform .22s cubic-bezier(.2,.9,.3,1.3);
  -webkit-tap-highlight-color:transparent;
}
#pomo-pill.on{opacity:1;transform:scale(1)}
/* Paused, it stays legible but stops asking for attention. */
#pomo-pill.paused{opacity:.62}
#pomo-pill.paused.on{opacity:.62}
#pomo-pill svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
#pomo-pill .pp-ring{fill:none;stroke:var(--b2);stroke-width:4}
/* No transition on the ring. Over a 25-minute leg it advances a fifteen-
   hundredth of the circle per second — a step nobody can see — while a
   transition retriggered every second leaves the page animating forever,
   which is a compositor that never sleeps for no visible gain. */
#pomo-pill .pp-fill{fill:none;stroke-width:4;stroke-linecap:round}
#pomo-pill .pp-in{position:relative;text-align:center;line-height:1.1}
#pomo-pill .pp-ph{font-size:13px;display:block}
#pomo-pill .pp-cl{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.2px}

}

/* ═══════════════════════════════════════════════════════════════════════
   ── PHONE ──
   Everything below this line is inside a phone-width query and cannot be
   reached by a desktop browser. The layout on a big screen is untouched,
   to the pixel; what changes here is only what a thumb has to deal with.
   ═══════════════════════════════════════════════════════════════════════ */
@media(max-width:700px){
  /* The tabs go to the bottom edge, where a thumb already rests, and stay
     there while the page scrolls under them. This is most of what separates
     "a website on a phone" from "an app". */
  .tabbar{
    position:fixed;left:0;right:0;bottom:0;top:auto;z-index:50;
    max-width:none;margin:0;border-radius:0;border:none;
    border-top:1px solid var(--b2);background:var(--sur);
    /* Every env() carries a 0px fallback. Without one, a browser that does not
       know the function throws the whole declaration away — and that is the
       declaration holding the bar off the bottom of the screen. */
    padding:7px 12px calc(7px + env(safe-area-inset-bottom,0px));
    gap:8px;box-shadow:0 -8px 24px rgba(0,0,0,.30);
  }
  .tabbar button{padding:11px 8px;font-size:15px;border-radius:10px}
  /* The bar is full width down here; the band behind it would only be a
     second background over the same pixels. */
  .tabbar::before{display:none}
  /* Room at the bottom so the last row of the page is not sitting under the
     bar, and room at the sides for a rounded screen held in landscape. */
  #root{
    padding:10px 16px calc(84px + env(safe-area-inset-bottom,0px));
    padding-left:calc(16px + env(safe-area-inset-left,0px));
    padding-right:calc(16px + env(safe-area-inset-right,0px));
  }

  /* Overlays become sheets: anchored to the bottom edge, rounded only at the
     top, sized to their content up to most of the screen. A centred box with
     20px of backdrop showing all round is a desktop dialog on a phone. */
  .ovl{padding:0;align-items:flex-end}
  .ovl>*{
    max-width:none!important;width:100%!important;margin:0!important;
    border-radius:20px 20px 0 0!important;
    /* The cap and the scroll are !important because one panel — the goals one
       — carries max-height:none in an inline style, which a plain rule cannot
       reach. Uncapped, it grew taller than the screen; and a flex child that
       overflows a flex-end container overflows UPWARDS, past the origin, where
       no scrollbar can follow it. The top of the sheet and its ✕ were simply
       gone, with the page behind it frozen: a modal you have to restart the
       app to escape. Nothing may be taller than the screen it opens on. */
    max-height:88vh!important;
    overflow-y:auto!important;
    /* Scrolling the sheet to its end must not start dragging the page behind. */
    overscroll-behavior:contain;
    padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))!important;
  }
  /* dvh is the honest height on a phone; vh above is the fallback. */
  @supports(max-height:88dvh){.ovl>*{max-height:88dvh!important}}
  /* A card inside a card inside a sheet was three sets of padding deep, and
     the goals modal is exactly that. The inner ones give theirs back. */
  .ovl .card .card{padding:12px}

  /* Anything you have to hit with a finger. The icon buttons were sized for a
     mouse pointer, and the tick box for finishing a task — the press this
     whole app exists for — was 16 pixels square. */
  .btn-icon{padding:9px 11px;font-size:17px}
  input[type=checkbox]{width:22px;height:22px}
  .btn-sm{padding:9px 14px;font-size:14px}
  /* Safari zooms the whole page in when it focuses a field under 16px, and
     then leaves you zoomed. The text fields were already 16; these two were
     never in that rule and were the ones doing it. */
  input[type=date],input[type=time],textarea{font-size:16px}
  /* The header was taking a third of the first screen before a single number
     appeared on it, and its row of switches ran off the side rather than
     wrapping. */
  .apphdr{padding:8px 0 10px}
  .apphdr .row{flex-wrap:wrap;justify-content:center}
  .card{padding:16px;border-radius:14px}
  .card2{padding:12px}
  /* A grey flash on every tap is a browser telling on itself. The buttons
     answer with their own press instead. */
  body{-webkit-tap-highlight-color:transparent}
  button:active{transform:scale(.97)}
  .rem-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}

  /* A task row was giving its own words about a third of the width. The tick
     box, three tool buttons and their gaps came off the top first, and the
     title, the note and the dates were left to wrap inside what was left —
     four words to a line, a paragraph turned into a column. The tools drop to
     a line of their own now, so the task gets the whole width to say what it
     is. The flex-basis is what forces the wrap: shrinking is what flex would
     rather do, and shrinking is the thing being fixed. */
  .rem-row{flex-wrap:wrap}
  .rem-row>.rem-mid{flex:1 1 200px;min-width:0}
  .rem-row>.rem-tools{width:100%;justify-content:flex-end;margin-top:2px}

  /* The seven medals wrapped into 3-3-1, which left Ataraxia by itself at the
     bottom looking like a leftover rather than the summit. Turned up the other
     way — 1-3-3, the one alone at the top — the shelf reads as a climb, and
     the row you are on is the one at your feet. */
  .ms-shelf{display:grid;grid-template-columns:repeat(3,1fr);justify-items:center;gap:8px}
  .ms-shelf>*{grid-row:3}                       /* the seven are a fixed list */
  .ms-shelf>:nth-child(1){grid-column:1}
  .ms-shelf>:nth-child(2){grid-column:2}
  .ms-shelf>:nth-child(3){grid-column:3}
  .ms-shelf>:nth-child(4){grid-row:2;grid-column:1}
  .ms-shelf>:nth-child(5){grid-row:2;grid-column:2}
  .ms-shelf>:nth-child(6){grid-row:2;grid-column:3}
  .ms-shelf>:nth-child(7){grid-row:1;grid-column:2}
}
@media(max-width:700px) and (prefers-reduced-motion:reduce){button:active{transform:none}}

  if(!min)return'0m';const h=Math.floor(min/60),m=min%60;
  if(!h)return m+'m';if(!m)return h+'h';return h+'h'+m+'m';
}
/* ═══ THE CLOCK THIS APP RUNS ON ═════════════════════════════════════════
   Which timezone a device is set to never mattered: the date is always read
   in America/Cancun, and Date.now() is the same instant everywhere on earth.
   A phone in Tokyo and a laptop in Cancún already agree about what day it is.

   A device whose CLOCK is actually wrong is the real hazard, and it is not a
   small one. Every stamp this app writes comes from the device, and every
   conflict is settled by whoever claims the later moment — so a phone running
   three hours fast wins every sync it ever takes part in, and its older copy
   overwrites the newer one from the other device, silently. The same wrong
   clock rolls the day over early, closing a day that still has hours left in
   it, and it reads the login token as expired hours before it is.

   Supabase stamps every reply with its own time, so the difference between
   that and this device is measured and carried into every reading afterwards.
   Both devices then agree, whatever their own clocks say. With no cloud there
   is nothing to disagree with, the difference stays zero, and everything below
   behaves exactly as it always has.
   ═══════════════════════════════════════════════════════════════════════ */
const CLOCK={
  skew:Number(localStorage.getItem('st_clock_skew')||0)||0,
  checked:false,
  /* Given a moment that came from the server. The reading arrives a fraction
     of a second late and is counted in whole seconds, so anything under a
     minute is treated as agreement — a difference that kept twitching would
     reorder stamps written moments apart. Anything past a month is nonsense
     rather than a clock, and the device is believed instead. */
  sync(serverMs){
    if(!serverMs)return;
    const server=typeof serverMs==='number'?serverMs:Date.parse(serverMs);
    if(!server)return;
    const diff=server-Date.now();
    if(Math.abs(diff)>30*24*3600*1000)return;
    this.checked=true;
    const next=Math.abs(diff)<60000?0:diff;
    if(next!==this.skew){
      this.skew=next;
      try{localStorage.setItem('st_clock_skew',String(next));}catch(e){}
    }
  },
  now(){return Date.now()+this.skew;},
  // How far out the device is, in minutes — for saying so out loud.
  offMinutes(){return Math.round(this.skew/60000);}
};

/* Where the day begins and ends. One zone for the whole account, not one per
   device: that is what stops a laptop and a phone from disagreeing about what
   day it is, which is the thing that would really break — two devices each
   closing a different day, each filing the same work under a different date.

   It is a setting rather than a constant because you can move. Travelling two
   hours west without it means the day ends at 10pm where you are standing, and
   the hours you lose are hours of scoring. Change it and both devices follow,
   because it rides along with the language and the theme.

   Change it during the day. In the couple of hours where the two zones do not
   even agree on the date, a change can only move the boundary forward, never
   reopen a day already closed — see loadToday. */
const TZ_HOME='America/Cancun';
function appTZ(){return localStorage.getItem('st_tz')||TZ_HOME;}
function setAppTZ(tz){
  localStorage.setItem('st_tz',tz);
  STATE.tz=tz;
  STATE.today._tz=tz;      // rides to the other device with the other settings
  commitAndRefresh();
}
// What this device is actually set to — offered as one of the choices.
function deviceTZ(){
  try{return Intl.DateTimeFormat().resolvedOptions().timeZone||TZ_HOME;}catch(e){return TZ_HOME;}
}
/* A zone written the way a person would say it, and how far it is from home
   right now — which is the part that actually answers "does my day move?" */
function tzLabel(tz){
  const city=tz.split('/').pop().replace(/_/g,' ');
  const off=tzOffsetHours(tz)-tzOffsetHours(TZ_HOME);
  return off?`${city} (${off>0?'+':''}${off}h)`:city;
}
function tzOffsetHours(tz){
  try{
    const d=new Date(CLOCK.now());
    const s=d.toLocaleString('en-US',{timeZone:tz,hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
    const u=d.toLocaleString('en-US',{timeZone:'UTC',hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
    return Math.round((Date.parse(s)-Date.parse(u))/3600000);
  }catch(e){return 0;}
}

function todayKey(){
  return new Date(CLOCK.now()).toLocaleDateString('en-CA',{timeZone:appTZ()});
}

function capFirst(s){return s?s.charAt(0).toUpperCase()+s.slice(1):s;}

/* ═══════════════════════════════════════════════════════════════════════
   THE TWO RULES THAT DECIDE WHETHER THE SCORE MEANS ANYTHING
   ═══════════════════════════════════════════════════════════════════════

   1. No run multiplies more than seven, for you or against you.

   Work paid minutes × the run, early bed paid sleep × the run, and neither
   had a ceiling. Day 32 of a work streak paid thirty-two times what day 1
   paid for the very same five hours, so the total grew faster the longer it
   went and could not fall no matter how the week actually went. Measured on
   one real account: 1,383,924 points of positives against 113,005 of
   penalties — eight per cent. Even on hard, where penalties cost ten times
   as much, they only reached eighty per cent. Procrastinating could not
   show up in the number, arithmetically, at any difficulty.

   Seven, because a week is the unit this app already thinks in — the stats
   compare your last seven days against your average — and because past a
   week the habit is the reward, not the multiplier. The run itself still
   counts up on the streaks page, and a hundred days is still a hundred
   days. It just stops paying like a hundred.

   The cap is deliberately symmetric. A penalty that compounded forever
   would be the same runaway pointing the other way.

   2. One game, not three.

   Difficulty modes used to multiply what a reward cost — ×1, ×5, ×10 — and
   then a later pass also stopped colours forgiving reward runs on hard,
   which let those multipliers climb to seven on top of that. Two effects
   stacked on one axis: hard came out roughly fifty times harsher than easy,
   not ten. On one real account easy read +221,235 and hard read −1,446,730
   for the same months. Easy could not be lost and hard could not be won,
   and neither of those is a difficulty — they are two different broken
   games, and a third knob (which month you are looking at, below) made a
   fourth. Three sliders calibrating one number was already too many; there
   is one now.

   The price list is fixed: a reward costs what a reward costs, the same
   every day, and falling never gets cheaper or more expensive depending on
   a setting. Nothing a colour does forgives a reward run either — the only
   way one ends is by not doing the thing. A red day ends every positive
   run. That is the whole rulebook.
   ═══════════════════════════════════════════════════════════════════════ */
/* A flat ceiling answered the runaway and created a new hole: past day seven
   the run paid nothing extra, so there was no reason left to keep one going
   except the medals. A streak that stops meaning anything is not a streak.

   The square root keeps both ends honest. It never stops growing, so day 100
   is always worth more than day 8 — and it grows slowly enough that it cannot
   run away: over a year the cumulative rises as N^1.5 rather than the N^2 that
   broke this in the first place. It is also sayable out loud, which a cap at
   least had going for it: a hundred days pays ten, four hundred pays twenty. */
const CURVE_K=1;      // day 100 pays ×10, day 400 pays ×20 — see streakMult
const PEN_CAP=7;      // the most a penalty run may ever multiply by
const PEN_RATE=5;     // what a reward costs
// What a positive run of n days multiplies by. Never below 1.
function streakMult(n){return Math.max(1,CURVE_K*Math.sqrt(Math.max(1,n||1)));}
/* And what it multiplies by on a given day — which is the same thing, unless
   the day went red.

   A red day used to END every positive run. That was one rule and easy to
   hold, but it was not true: a work run counts days you worked, and you did
   work — the day being red is a statement about how much of your list you
   closed, which is a different axis entirely. Ninety days of work erased by
   one afternoon that got away from you is not a correction, it is a fine. It
   was not even applied evenly: a day with its flags down cannot be red, so
   the flag run was immune to the rule by construction while every other run
   paid it.

   So a red day no longer ends a run — it makes that day pay base, exactly the
   way a good day makes a reward charge base. One rule with two faces: a run
   counts what you actually did, and the day's colour decides what that run is
   worth THAT DAY. The bad day still costs real points (a ninety-day work run
   pays about 2,850 on a normal day and 300 on a red one) without costing the
   ninety days as well. */
function posMult(n,status){return status==='red'?1:streakMult(n);}
// What that run pays at n days — the number the rules quote.
function multAt(n){return Math.round(streakMult(n)*10)/10;}
function capPenStreak(n){return Math.min(PEN_CAP,Math.max(1,n||1));}
/* A good day used to END a reward run, and then for a while nothing ended one
   but breaking it. Both were wrong in the same way: a run is a fact about what
   you have been doing, and one good day does not undo ten days of doing it —
   but it should still be worth something on the day you earn it.

   So a colour no longer touches the run at all. What it buys is a discount on
   that one day: the reward is charged its base price with no multiplier, and
   tomorrow the run picks up exactly where it was. Day 10 of a habit on a
   purple day costs base; day 11 costs base × the full run again.

   Which colour earns the discount depends on what the thing weighs — the
   heavier the indulgence, the better the day has to be to earn it. That is
   the same gradient the old reset table had, doing something worth doing. */
const TIER_FORGIVES={
  light:  ['yellow','green','purple'],
  serious:['green','purple'],
  grave:  ['purple']
};
function tierForgives(tier){return TIER_FORGIVES[tier]||[];}
/* The three that shipped are one of each weight, and the late night behaves
   like the heaviest — so they all answer the same table rather than carrying
   the colours written out beside them in four different places. */
const BUILTIN_TIER={drugs:'light',internet:'serious',macanazo:'grave',late:'grave'};
function builtinForgives(kind){return tierForgives(BUILTIN_TIER[kind]||'light');}

/* ═══ CALC — SINGLE SOURCE OF TRUTH ═══ */
const CALC={
  status(pct,flag){
    let s=pct>=100?'purple':pct>=85?'green':pct>=50?'yellow':'red';
    if(flag){const u={red:'yellow',yellow:'green',green:'purple',purple:'purple'};s=u[s];}
    return s;
  },
  colorBonus(s){return{purple:60,green:30,yellow:10,red:0}[s]||0},
  /* One price list. What a thing costs you is a fact about the thing. */
  penBase(p){
    const mult=PEN_RATE;
    if(p.type==='drugs')return Math.round(-25*mult*(p.details?.substances||1));
    if(p.type==='internet')return Math.round(-1*mult*(p.details?.minutes||0));
    if(p.type==='macanazo')return p.details?.isPositive?100:Math.round(-100*mult);
    // Anything you add costs by the weight you gave it, times how many.
    const r=(typeof rewardById==='function')?rewardById(p.type):null;
    if(r)return Math.round(-REWARD_TIERS[r.tier].base*mult*(p.count||1));
    return 0;
  },
  // Renamed from diffMult — there is no difficulty left for it to read.
  penMult(){return PEN_RATE;},
  // single source of truth for the procrastination-penalty multiplier —
  // was previously duplicated 3x with mismatched thresholds/fallbacks
  procMult(procMins,streak){
    return procMins>30?capPenStreak(streak):1;
  },
  streaks(history,today){
    const tk=todayKey();
    // #1 FIX: exclude today from history scan entirely
    const hist=[...history].filter(d=>d.date!==tk).sort((a,b)=>new Date(a.date)-new Date(b.date));
    const hasPen=(d,t)=>d.penalties?.some(p=>p.type===t)||false;
    const hasSt=(d,t)=>d.streaks?.some(s=>s.type===t&&s.active)||false;
    function pStrk(type,resetOn){let c=0;for(let i=hist.length-1;i>=0;i--){if(!hasPen(hist[i],type))break;if(resetOn.includes(hist[i].status))break;c++;}return c;}
    function aStrk(type){let c=0;for(let i=hist.length-1;i>=0;i--){if(hasPen(hist[i],type))break;c++;}return c;}
    /* Each of these counts one thing and nothing else: days in a row you did
       it. A red day no longer breaks them — see posMult, where the red day
       pays base instead. The only run a colour still ends is the non-red run
       below, because that is literally what that one counts.

       (wStrk used to stop at red without ever checking whether you had worked
       on the days it counted, so it read the same as the non-red run and paid
       for days you had not worked. It asks the question its name promises
       now, which is also what the historical recompute always asked.) */
    function sStrk(type){let c=0;for(let i=hist.length-1;i>=0;i--){if(!hasSt(hist[i],type))break;c++;}return c;}
    function wStrk(){let c=0;for(let i=hist.length-1;i>=0;i--){if(!((hist[i].workDuration||0)>0))break;c++;}return c;}
    function pomStrk(){let c=0;for(let i=hist.length-1;i>=0;i--){if(!((hist[i].pomodoros||0)>0))break;c++;}return c;}
    function eStrk(){let c=0;for(let i=hist.length-1;i>=0;i--){if(!hist[i].sleptEarly)break;c++;}return c;}
    function cStrk(){let c=0;for(let i=hist.length-1;i>=0;i--){if(hist[i].status==='red'||hist[i]._gap)break;c++;}return c;}
    function lStrk(resetOn){let c=0;for(let i=hist.length-1;i>=0;i--){if(!hist[i].sleptLate||(resetOn||[]).includes(hist[i].status))break;c++;}return c;}
    const tD=today.penalties.some(p=>p.type==='drugs');
    const tN=today.penalties.some(p=>p.type==='internet');
    const tM=today.penalties.some(p=>p.type==='macanazo');
    const tLate=today.sleep?.sleptLate||false;

    /* No colour ends a reward run any more — see TIER_FORGIVES. A run counts
       what you have actually been doing, and one good day does not undo that.
       What the good day buys is a discount on itself, and that is applied
       where the day is priced (score / liveParts), not here. Red still cuts
       the work streak (handled in wStrk), the one rule that survived. */
    return{
      substancesPenaltyStreak:      pStrk('drugs',[])    + (tD?1:0),
      procrastinationPenaltyStreak: pStrk('internet',[]) + (tN?1:0),
      macanazoPenaltyStreak:        pStrk('macanazo',[]) + (tM?1:0),
      lateStreak:                   lStrk([])            + (tLate?1:0),
      // Positive streaks: unaffected by day color
      substancesStreak:tD?0:aStrk('drugs'),
      procrastinationStreak:tN?0:aStrk('internet'),
      macanazoStreak:tM?0:aStrk('macanazo'),
      morningStreak:sStrk('morning')+(today.morningCompleted?1:0),
      flagStreak:sStrk('flags')+(today.flagCompleted?1:0),
      workStreak:wStrk()+(today.work?.workDuration>0?1:0),
      pomoStreak:pomStrk()+((today.pomodoros||0)>0?1:0),
      earlyBedStreak:eStrk()+(today.sleep?.sleptEarly?1:0),
      colorStreak:cStrk(),
      /* Anything you added to the list gets the same pair of runs the three
         originals have, under its own name — how many days in a row you have
         had it, and how many in a row you have not. Neither breaks by colour;
         its weight only says which colour discounts a day of it. */
      ...(typeof rewards==='function'?rewards().reduce((acc,r)=>{
        if(r.builtin)return acc;
        const hadToday=today.penalties.some(p=>p.type===r.id);
        acc[penKey(r.id)]=pStrk(r.id,[])+(hadToday?1:0);
        acc[cleanKey(r.id)]=hadToday?0:aStrk(r.id);
        return acc;
      },{}):{})
    };
  },
  score(day,sk){
    const{completed=0,target=0,morningCompleted=false,flagCompleted=false,pomodoros=0,penalties=[],sleep={},work={}}=day;
    const s=sk||{morningStreak:0,flagStreak:0,substancesPenaltyStreak:1,procrastinationPenaltyStreak:1,macanazoPenaltyStreak:1};
    /* The day's colour has to be known before anything is priced: it decides
       both what a reward is charged and what a positive run is paid. */
    const pct=target>0?Math.round(completed/target*100):0;
    const status=this.status(pct,flagCompleted);
    // Every run is read through the curve — see streakMult — and through the
    // day, which pays base when the day went red. See posMult.
    const pm=n=>posMult(n,status);
    /* Finished tasks were the one positive with no run behind them: a flat
       +1 each, which on a real month came to about one per cent of everything
       earned. They ride the flag run now — the days you got your three most
       important things down — so being consistent about what matters makes
       everything else you finish count for more. */
    const base=Math.round(completed*pm(s.flagStreak));
    const mB=morningCompleted?Math.round(25*pm(s.morningStreak)):0;
    const fB=flagCompleted?Math.round(100*pm(s.flagStreak)):0;
    // Same curve as everything else — a day with pomodoros logged on top of
    // yesterday's and the day before's pays more than one on its own.
    const pom=Math.round(pomodoros*25*pm(s.pomoStreak));
    const wrk=Math.round((work.workDuration||0)*pm(s.workStreak));
    const earlyBedStreak=pm(s.earlyBedStreak);
    const slp=Math.round((sleep.sleepDuration||0)+(sleep.napDuration||0)+(sleep.sleptEarly?(sleep.sleepDuration||0)*earlyBedStreak:0));
    const freeToday=kind=>builtinForgives(kind).includes(status);
    const latePen=sleep.sleptLate
      ?-100*this.penMult()*(freeToday('late')?1:capPenStreak(s.lateStreak)):0;
    const procMins=penalties.filter(p=>p.type==='internet').reduce((a,p)=>a+(p.details?.minutes||0),0);
    // A run never shrinks; a good day only stops it being charged for today.
    const pen=penalties.reduce((sum,p)=>{
      const b=this.penBase(p);let mult=1;
      if(p.type==='drugs')mult=freeToday('drugs')?1:capPenStreak(s.substancesPenaltyStreak);
      else if(p.type==='internet')mult=freeToday('internet')?1:this.procMult(procMins,s.procrastinationPenaltyStreak);
      else if(p.type==='macanazo')mult=freeToday('macanazo')?1:capPenStreak(s.macanazoPenaltyStreak);
      // Yours multiply by their own run, and are discounted by their own weight.
      else if(typeof penKey==='function'){
        const r=(typeof rewardById==='function')?rewardById(p.type):null;
        mult=(r&&rewardForgives(r).includes(status))?1:capPenStreak(s[penKey(p.type)]);
      }
      return sum+b*mult;
    },0);
    const col=Math.round(this.colorBonus(status)*streakMult(s.colorStreak));
    const total=base+mB+fB+pom+wrk+slp+pen+col+latePen;
    return{total,base,status,pct,mB,fB,pom,wrk,slp,pen,col,latePen};
  },
  /* #2 FIX: histTotal must exclude today to avoid double-count.
     And it counts the gaps. A day never logged is worth −1,000 and shows that
     way on the calendar — but the total only ever added up the days actually
     stored, so a month logged on the 1st and again on the 24th read −800 on
     the calendar's twenty-two red squares and −1,000 in the corner. Gaps are
     written into history when the app is open to see a day turn over; a day
     backdated through Edit History leaves them unwritten, and they existed
     only as something the calendar drew. The same filled-in list scores both
     now, so the squares and the corner cannot disagree. */
  histTotal(history){
    const tk=todayKey();
    const filled=this.fillGaps(history);
    const map=new Map(filled.map(d=>[d.date,d]));
    history.forEach(d=>map.set(d.date,d));   // anything real wins over a gap
    return [...map.values()].filter(h=>h.date!==tk).reduce((s,d)=>s+this.liveScore(d,history),0);
  },
  /* Same arithmetic as histTotal, bounded to one stretch of dates rather than
     the whole of history. This is what makes a monthly score possible without
     inventing a second scoring system — a month is just the range you ask
     for, still excluding today (the caller adds today's live number back in
     only when today actually falls inside the range being shown). */
  rangeTotal(history,from,to){
    const tk=todayKey();
    const filled=this.fillGaps(history);
    const map=new Map(filled.map(d=>[d.date,d]));
    history.forEach(d=>map.set(d.date,d));
    return [...map.values()].filter(h=>h.date!==tk&&h.date>=from&&h.date<=to)
      .reduce((s,d)=>s+this.liveScore(d,history),0);
  },
  /* recompute a stored day's score using the current price list and curve —
     touching either rewrites every day that ever used it */
  // Count consecutive qualifying REGISTERED days ending at idx (inclusive).
  // Only looks at real, registered history entries — never invents or assumes anything
  // about unregistered days. resetStatuses = day colors that break the chain.
  streakAtDay(sortedHist, idx, checkFn, resetStatuses){
    let count=0;
    for(let i=idx;i>=0;i--){
      const d=sortedHist[i];
      if(resetStatuses && resetStatuses.includes(d.status)) break;
      if(!checkFn(d)) break;
      count++;
    }
    return count;
  },
  /* A stored day, taken apart into where its points came from. liveScore is
     the sum of these and nothing else, so the two can never disagree about a
     day — and the stats can finally say which of these is the number that
     grew, instead of leaving you to guess from a single total. */
  liveParts(e, allHistory){
    const zero={base:0,mB:0,fB:0,pom:0,wrk:0,slp:0,col:0,latePen:0,pen:0};
    if(e._gap)return{...zero,gap:e.todayPoints||-1000};
    /* Whether this day was good enough to be charged at base — it never
       shortens the run, only this one day's bill. See TIER_FORGIVES. */
    const st=e.status||'red';
    const subsFree  =builtinForgives('drugs').includes(st);
    const procFree  =builtinForgives('internet').includes(st);
    const macFree   =builtinForgives('macanazo').includes(st);
    const lateFree  =builtinForgives('late').includes(st);

    // Default to the streak that was saved at the time (fallback if no history array given)
    let morningStreak=e.streaksUsed?.morningStreak||1;
    let flagStreak=e.streaksUsed?.flagStreak||1;
    let workStreak=e.streaksUsed?.workStreak||1;
    let pomoStreak=e.streaksUsed?.pomoStreak||1;
    let earlyBedStreak=e.streaksUsed?.earlyBedStreak||1;
    let lateStreak=e.streaksUsed?.lateStreak||1;
    let subsStreak=e.streaksUsed?.substancesPenaltyStreak||1;
    let procStreak=e.streaksUsed?.procrastinationPenaltyStreak||1;
    let macStreak=e.streaksUsed?.macanazoPenaltyStreak||1;
    /* CALC.score multiplies the colour bonus by the non-red streak, and this
       did not — so a day was worth one number while you lived it and another
       once it became history. Measured across 76 real days, 75 of them
       disagreed. The multiplier is reconstructed here from the days before it,
       the same rule CALC.streaks uses. */
    let colorMult=1;

    // If we have the full history, recompute the REAL streak at this exact day
    // by counting backward through REGISTERED days only (no invented days, no gaps assumed).
    if(allHistory && allHistory.length){
      const sorted=[...allHistory].filter(d=>!d._gap).sort((a,b)=>a.date.localeCompare(b.date));
      const idx=sorted.findIndex(d=>d.date===e.date);
      if(idx>=0){
        /* No colour breaks any run, positive or otherwise — each counts days
           you did the thing, and the day's colour only changes what it is
           worth or charged on that day. See posMult and TIER_FORGIVES. */
        morningStreak=this.streakAtDay(sorted,idx,d=>d.streaks?.some(s=>s.type==='morning'&&s.active))||1;
        flagStreak=this.streakAtDay(sorted,idx,d=>d.streaks?.some(s=>s.type==='flags'&&s.active))||1;
        workStreak=this.streakAtDay(sorted,idx,d=>(d.workDuration||0)>0)||1;
        pomoStreak=this.streakAtDay(sorted,idx,d=>(d.pomodoros||0)>0)||1;
        earlyBedStreak=this.streakAtDay(sorted,idx,d=>d.sleptEarly)||1;
        lateStreak=this.streakAtDay(sorted,idx,d=>d.sleptLate)||1;
        subsStreak=this.streakAtDay(sorted,idx,d=>d.penalties?.some(p=>p.type==='drugs'))||1;
        procStreak=this.streakAtDay(sorted,idx,d=>d.penalties?.some(p=>p.type==='internet'))||1;
        macStreak=this.streakAtDay(sorted,idx,d=>d.penalties?.some(p=>p.type==='macanazo'))||1;
        // Consecutive non-red days BEFORE this one — gaps are already excluded
        // from `sorted`, and the day itself never counts toward its own streak.
        colorMult=Math.max(1,this.streakAtDay(sorted,idx-1,d=>d.status!=='red'));
        // Apply streakOverrides offset so historical days reflect the real streak
        // e.g. if user set goals=8 (offset=4), yesterday shows ×8 not ×4.
        // IMPORTANT: once a streak breaks it is RETIRED with a date (see
        // applyStreakOverrides) rather than deleted. Days BEFORE that date keep
        // the offset forever — points already earned are never taken away — while
        // days after it score naturally, since they belong to a brand new streak.
        const _ovr=(typeof STATE!=='undefined'?STATE.streakOverrides:{})||{};
        function _applyOvr(key,val){
          const o=_ovr[key];if(o===undefined||o===null)return val;
          const off=typeof o==='object'?(o.offset!==undefined?o.offset:0):o;
          const retiredAt=typeof o==='object'?o.retiredAt:null;
          if(retiredAt&&e.date>=retiredAt)return val; // new streak — no offset
          return val>0?Math.max(1,val+off):val;
        }
        morningStreak=_applyOvr('morningStreak',morningStreak);
        flagStreak=_applyOvr('flagStreak',flagStreak);
        workStreak=_applyOvr('workStreak',workStreak);
        pomoStreak=_applyOvr('pomoStreak',pomoStreak);
        earlyBedStreak=_applyOvr('earlyBedStreak',earlyBedStreak);
        lateStreak=_applyOvr('lateStreak',lateStreak);
        subsStreak=_applyOvr('substancesPenaltyStreak',subsStreak);
        procStreak=_applyOvr('procrastinationPenaltyStreak',procStreak);
        macStreak=_applyOvr('macanazoPenaltyStreak',macStreak);
      }
    }

    // Read through the curve AND through the day, exactly as CALC.score does.
    const pm=n=>posMult(n,st);
    const parts={
      base:Math.round((e.completedTasks||0)*pm(flagStreak)),
      mB:((e.streaks?.some(s=>s.type==='morning'&&s.active))?Math.round(25*pm(morningStreak)):0),
      fB:((e.streaks?.some(s=>s.type==='flags'&&s.active))?Math.round(100*pm(flagStreak)):0),
      pom:Math.round((e.pomodoros||0)*25*pm(pomoStreak)),
      wrk:Math.round((e.workDuration||0)*pm(workStreak)),
      slp:Math.round((e.sleepDuration||0)+(e.napDuration||0)+(e.sleptEarly?(e.sleepDuration||0)*pm(earlyBedStreak):0)),
      col:Math.round(this.colorBonus(e.status)*streakMult(colorMult)),
      /* A good enough night still costs the base — it used to cost nothing at
         all, which is not what "charged at base" means. */
      latePen:(e.sleptLate?-100*this.penMult()*(lateFree?1:capPenStreak(lateStreak)):0),
      pen:0
    };

    parts.pen=(e.penalties||[]).reduce((sum,p)=>{
      const det=p.type==='drugs'?{substances:p.count}:p.type==='internet'?{minutes:p.count}:{isPositive:false};
      const b=this.penBase({type:p.type,details:det,count:p.count});
      let mult=1;
      if(p.type==='drugs') mult=subsFree?1:capPenStreak(subsStreak);
      else if(p.type==='internet') mult=procFree?1:capPenStreak(procStreak);
      else if(p.type==='macanazo') mult=macFree?1:capPenStreak(macStreak);
      /* One you added. Its run through history is counted here the same way
         the three above are, and its own weight says which colour discounts a
         day of it — so a past day is re-scored by what was true then, not by
         what its streak happens to be today. */
      else if(typeof rewardById==='function'){
        const r=rewardById(p.type);
        if(r&&!rewardForgives(r).includes(st)&&Array.isArray(allHistory)){
          const sorted=[...allHistory].filter(h=>!h._gap).sort((a,b)=>a.date.localeCompare(b.date));
          const idx=sorted.findIndex(h=>h.date===e.date);
          if(idx>=0)mult=capPenStreak(this.streakAtDay(sorted,idx,
            d=>d.penalties?.some(x=>x.type===p.type)));
        }
      }
      return sum+b*mult;
    },0);
    return parts;
  },
  // The day's number is the sum of its parts and nothing besides.
  liveScore(e, allHistory){
    const p=this.liveParts(e,allHistory);
    if(p.gap!==undefined)return p.gap;
    return p.base+p.mB+p.fB+p.pom+p.wrk+p.slp+p.col+p.latePen+p.pen;
  },
  buildEntry(today,streaks,date){
    const sc=this.score(today,streaks);
    return{date,_ts:CLOCK.now(),todayPoints:sc.total,status:sc.status,
      completedTasks:today.completed,totalTasks:today.target,pomodoros:today.pomodoros,
      penalties:today.penalties.map(p=>({type:p.type,count:p.count,points:this.penBase(p),streak:1})),
      streaks:[{type:'morning',count:today.morningCompleted?1:0,active:today.morningCompleted},{type:'flags',count:today.flagCompleted?1:0,active:today.flagCompleted}],
      sleepDuration:today.sleep?.sleepDuration||0,napDuration:today.sleep?.napDuration||0,
      sleptEarly:today.sleep?.sleptEarly||false,sleptLate:today.sleep?.sleptLate||false,workDuration:today.work?.workDuration||0,
      streaksUsed:{...streaks}};
  },
  /* #6: fill missing days between first and last history entry as red -1000 */
  fillGaps(history){
    // Only fill gaps BETWEEN real logged days (ignore gap-only entries when finding bounds)
    const realDays=history.filter(d=>!d._gap).map(d=>d.date).sort();
    if(realDays.length<2)return history;
    const map=new Map(history.map(d=>[d.date,d]));
    const start=new Date(realDays[0]+'T12:00:00'),end=new Date(realDays[realDays.length-1]+'T12:00:00');
    const result=[];
    for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){
      const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      result.push(map.get(k)||{date:k,todayPoints:-1000,status:'red',completedTasks:0,totalTasks:0,pomodoros:0,penalties:[],streaks:[],workDuration:0,sleepDuration:0,napDuration:0,sleptEarly:false,_gap:true});
    }
    return result;
  }
};
