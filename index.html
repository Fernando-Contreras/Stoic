  const sk_=applyStreakOverrides(sk_raw);
  // earlyBedStreak for display only — read from sk_ but don't mutate STATE here
  const sc=CALC.score(STATE.today,sk_);
  /* ═══ THE HEADLINE NUMBER IS A MONTH, NOT A LIFETIME ═══
     A running lifetime total has three properties that no amount of
     recalibrating the arithmetic can fix. It remembers forever, so three
     good months ago are still sitting in a number that is supposed to say
     how you are doing right now. It gets harder to move the deeper it goes —
     recovering from six figures in the red takes the same iron discipline as
     never slipping at all, so there is no difference left between "trying"
     and "not trying" once you are far enough under. And it has no scale: a
     good day is +0.9% of a total in the hundred-thousands, which is not a
     number a person can feel. On the account that prompted this, easy read
     +221,235 the same week hard read −1,446,730 for identical behaviour —
     the total was already telling two different stories about one person.

     A month resets on its own on the 1st, whatever happened in August. It is
     always close enough to zero that a single day moves it by a percentage
     worth noticing. And a closed month becomes a fact you can compare against
     the next one — which is the actual question ("am I doing better than I
     was"), the one the lifetime number was never able to answer no matter
     how its multipliers were tuned. Browsing an old month is free: the
     arithmetic per day never changed, only which stretch of days is being

      if(!dump||typeof dump!=='object'||!dump.st_hist){alert(t('import-bad'));return;}
      let incoming=0;
      try{incoming=(JSON.parse(dump.st_hist)||[]).length;}catch{alert(t('import-bad'));return;}
      const current=(STATE.history||[]).length;
      if(!confirm(t('import-warn').replace('{n}',current)))return;
      // A restore must be exact. Writing the file's keys over the existing ones
      // left anything not present in the file behind, so the result was a blend
      // of two states rather than the file.
      try{localStorage.clear();}catch{}
      Object.entries(dump).forEach(([k,v])=>{try{localStorage.setItem(k,v);}catch{}});
      // The reload right after used to pull from the cloud and merge those days
      // straight back in, quietly undoing the restore. This flag tells the next
      // boot that this file is the truth: push it up instead of pulling down.
      localStorage.setItem('st_restore_pending','1');
      alert(t('import-ok').replace('{n}',incoming));
      location.reload();
    };
    picker.click();
  }));

  bottomWrap.appendChild(dv('xs dimmer ctr',t('backup-note')));

  bottomWrap.appendChild(bt('btn-ghost btn-sm',t('logout'),()=>{S.set(K.AUTH,false);STATE.authed=false;render();}));
  wrap.appendChild(bottomWrap);
  return wrap;
}

/* One line for what a thing pays today, used by the four cards that pay by a
   run. It used to read "+300 pts · racha: 42d", which parses as 300 times 42:
   the streak stood there looking like something still to be applied, when the
   number in front of it already had it in. So the chain is written out in the
   order it happens — the run, the multiplier it earns, the points that come
   out — and the total is last, where an answer belongs.
   On a red day the multiplier is 1 by design, and a 42-day run showing ×1
   with no explanation reads as a bug, so the day says so itself. */
function ptsLine(pts,streakDays,status){
  const m=Math.round(posMult(streakDays,status)*10)/10;
  const chain=`${t('run-lbl')} ${streakDays}d · ×${m} · +${Math.round(pts*posMult(streakDays,status)).toLocaleString()} ${t('pts-s')}`;
  return status==='red'&&streakDays>1?`${chain} · 🔴 ${t('red-base')}`:chain;
}

/* ═══ PENALTY CARD — #3 keep type, #4 enter = add ═══ */
function renderPenCard(sk_,todayStatus){
  const card=dv('card');
  card.style.borderColor='var(--ngb)';
  /* Read through the same cap AND the same day-discount CALC.score charges by,
     or this total says one thing while the score says another. */
  const freeToday=kind=>builtinForgives(kind).includes(todayStatus);
  const penMultFor=(p,procMins)=>{
    if(p.type==='drugs')return freeToday('drugs')?1:capPenStreak(sk_.substancesPenaltyStreak);
    if(p.type==='internet')return freeToday('internet')?1:CALC.procMult(procMins,sk_.procrastinationPenaltyStreak);
    if(p.type==='macanazo')return freeToday('macanazo')?1:capPenStreak(sk_.macanazoPenaltyStreak);
    const r=rewardById(p.type);
    return (r&&rewardForgives(r).includes(todayStatus))?1:capPenStreak(sk_[penKey(p.type)]);
  };
  const penPts=STATE.today.penalties.reduce((sum,p)=>{
    const b=CALC.penBase(p);const procMins=STATE.today.penalties.filter(x=>x.type==='internet').reduce((s,x)=>s+(x.details?.minutes||0),0);
    return sum+b*penMultFor(p,procMins);
  },0);
  const tr=dv('rowb mb10');
  tr.appendChild(sp('ctit',t('rewards-lbl')));
  const trr=dv('row gap6');
  if(penPts!==0)trr.appendChild(sp('md mo w7 ng',String(penPts)));
  // The list is yours to change, and this is where you go to change it.
  const edB=bt('btn-icon','⚙');edB.title=t('rw-edit');
  edB.onclick=()=>{STATE.showRewards=true;render();};
  trr.appendChild(edB);
  tr.appendChild(trr);card.appendChild(tr);

  // The picker is built from your list, whatever is on it.
  const list_=rewards();
  if(!list_.some(r=>r.id===STATE.penType))STATE.penType=list_[0]?.id||'drugs';
  const tEl=sk('mb8',list_.map(r=>[r.id,rewardLabel(r)]),STATE.penType);
  tEl.onchange=()=>{STATE.penType=tEl.value;updateDet();};
  card.appendChild(tEl);

  const dw=dv('mb8');
  const si=ip('number','',1,t('num-subs'));si.min=1;
  const pi=ip('text','','',t('eg-time'));
  const errD=dv('xs ng mb8');

  function doAdd(){
    errD.textContent='';
    const type=tEl.value;
    const r=rewardById(type);
    if(type==='drugs'){
      const n=parseInt(si.value)||0;if(n<1){errD.textContent=t('min-1');return;}
      STATE.today.penalties.push({id:uid(),type:'drugs',count:n,details:{substances:n},timestamp:new Date().toISOString()});
      si.value='1';
    }else if(type==='internet'||r?.byMinutes){
      const res=parseDur(pi.value);if(res.v===null){errD.textContent=res.err;return;}if(res.v===0){errD.textContent=t('enter-time');return;}
      STATE.today.penalties.push({id:uid(),type,count:res.v,details:{minutes:res.v},timestamp:new Date().toISOString()});
      pi.value='';
    }else if(type==='macanazo'){
      STATE.today.penalties.push({id:uid(),type:'macanazo',count:1,details:{isPositive:false},timestamp:new Date().toISOString()});
    }else{
      // One of yours: how many, and that is all it needs.
      const n=parseInt(si.value)||1;
      STATE.today.penalties.push({id:uid(),type,count:Math.max(1,n),details:{},timestamp:new Date().toISOString()});
      si.value='1';
    }
    // #3: do NOT reset tEl — keep selection
    commitAndRefresh();
  }
  // #4: enter key support for all penalty inputs
  si.onkeydown=e=>{if(e.key==='Enter')doAdd();};
  pi.onkeydown=e=>{if(e.key==='Enter')doAdd();};

  // Minutes for the ones measured in minutes, a count for the ones counted,
  // and nothing at all for the one that only ever happens once.
  function updateDet(){
    dw.innerHTML='';
    const r=rewardById(tEl.value);
    if(tEl.value==='internet'||r?.byMinutes)dw.appendChild(pi);
    else if(tEl.value!=='macanazo')dw.appendChild(si);
  }
  updateDet();card.appendChild(dw);card.appendChild(errD);
  const ab=bt('btn-ng btn-sm w100',t('add-btn'),doAdd);ab.style.width='100%';card.appendChild(ab);

  if(STATE.today.penalties.length){
    const list=dv('s6 mt12');
    const procMinsTotal=STATE.today.penalties.filter(x=>x.type==='internet').reduce((s,x)=>s+(x.details?.minutes||0),0);
    STATE.today.penalties.forEach(p=>{
      const base=CALC.penBase(p);
      const mult=penMultFor(p,procMinsTotal);
      const actual=base*mult;
      const rw=rewardById(p.type);
      /* Every line asks the list for its name. The three originals used to be
         written out here instead, so renaming one left today's own log calling
         it by the name it no longer has. */
      const lbl=!rw?p.type
        :p.type==='drugs'?`${rewardLabel(rw)} ×${p.details?.substances||1}`
        :p.type==='internet'?`${rewardLabel(rw)} ${fmtDur(p.details?.minutes||0)}`
        :rewardLabel(rw)+(p.count>1?' ×'+p.count:'');
      const row=dv('pen-it');
      const info=dv('f1');
      // Show label + breakdown: base × streak = actual
      const breakdown = mult>1 ? `<span class="xs dimmer">${base} × ${mult} ${t('streak-lbl')}</span>` : `<span class="xs dimmer">${t('base-lbl')}</span>`;
      info.innerHTML=`<div class="md dim">${lbl}</div><div class="row gap6 mt2">${breakdown}<span class="sm mo w7 ng">${actual}</span></div>`;
      const rm=bt('btn-icon','🗑',()=>{STATE.today.penalties=STATE.today.penalties.filter(x=>x.id!==p.id);commitAndRefresh();});
      rm.title=t('sel-del');
      row.appendChild(info);row.appendChild(rm);list.appendChild(row);
    });card.appendChild(list);
  }
  return card;
}

/* ═══ STREAKS — 2 colors only ═══ */
function renderStreaks(sk_){
  const card=dv('card mt12');
  const hdr=dv('rowb mb8');
  hdr.appendChild(dv('ctit',t('streaks-title')));
  const editBtn=bt('btn-ghost btn-sm',STATE.editingStreaks?'✕ '+t('edit-done'):'✏️ '+t('rem-edit'),()=>{STATE.editingStreaks=!STATE.editingStreaks;refresh();});
  hdr.appendChild(editBtn);
  card.appendChild(hdr);

  const mutuallyExclusive={
    earlyBedStreak:'lateStreak',lateStreak:'earlyBedStreak',
    substancesStreak:'substancesPenaltyStreak',substancesPenaltyStreak:'substancesStreak',
    procrastinationStreak:'procrastinationPenaltyStreak',procrastinationPenaltyStreak:'procrastinationStreak',
    macanazoStreak:'macanazoPenaltyStreak',macanazoPenaltyStreak:'macanazoStreak',
  };

  function makeStreakItem(item, cls, numCls){
    const c=dv('skc '+cls);
    if(STATE.editingStreaks){
      // Show current value as editable input
      const cur=sk_[item.k]||0;
      const inp=ip('number','',cur===0?'':cur,'—');
      inp.min=0;inp.style.cssText='width:54px;text-align:center;font-size:1.3rem;font-weight:700;background:transparent;border:none;border-bottom:2px solid var(--ac);color:var(--ac);padding:2px 0;outline:none;';
      const lbl=dv('skl');lbl.textContent=item.l;
      c.appendChild(inp);c.appendChild(lbl);
      let committed=false;
      function commit(){
        if(committed) return;
        committed=true;
        const raw=inp.value.trim();
        if(raw===''){ refresh(); return; }
        const v=parseInt(raw);
        if(isNaN(v)||v<0){ refresh(); return; }

        /* A number you type is a claim about days already gone, and nothing
           more. It used to be made true by force: setting the morning streak
           to 80 rewrote the last 79 days of your history, marking each one as
           a morning done. That moved hundreds of thousands of points, and it
           could not be taken back — typing the old number again marked fewer
           days but unmarked none, so the way back was never the way you came.

           Nothing here touches history or today now. The number is held beside
           the real streak as the distance between them, and from that day on
           the two move together: do the thing tomorrow and it reads 81, miss
           it and the streak is broken and reads 0, which is what a broken
           streak is. Type it again whenever you like — the distance is worked
           out afresh each time, so it can always be corrected. */
        if(v===0){
          delete STATE.streakOverrides[item.k];
        }else{
          const natural=(CALC.streaks(STATE.history,STATE.today)[item.k])||0;
          STATE.streakOverrides[item.k]={offset:v-natural,setOn:todayKey()};
        }
        S.set(K.STREAK_OVR,STATE.streakOverrides);
        commitAndRefresh();
      }
      inp.onkeydown=e=>{
        if(e.key==='Enter'){commit();inp.blur();}
        else if(e.key==='Escape'){committed=true;STATE.editingStreaks=false;refresh();}
      };
      inp.onblur=()=>commit();
    } else {
      const n=dv('skn '+numCls);n.textContent=String(sk_[item.k]||0);
      const l=dv('skl');l.textContent=item.l;
      c.appendChild(n);c.appendChild(l);
      /* A clean streak counts the days behind you, because a day is only clean
         once it is over — counting today early would mean the number goes DOWN
         the moment you log honestly, which is no way to ask anyone to log
         honestly. Anyone can add one. */
    }
    return c;
  }

  /* The streak lists are built from your rewards, so one you add brings its
     own pair of runs with it and one you drop takes them away. */
  const rwItems=rewards();
  card.appendChild(dv('xs dimmer up ls mb8',t('pos-streaks')));
  const pg=dv('sk-g mb16');
  [{k:'morningStreak',l:t('sk-morning')},{k:'flagStreak',l:t('sk-goals')},{k:'workStreak',l:t('sk-work')},
   {k:'pomoStreak',l:t('sk-pom')},{k:'earlyBedStreak',l:t('slept-early')},
   ...rwItems.map(r=>({k:cleanKey(r.id),l:t('sk-without')+' '+rewardName(r)}))]
  .forEach(item=>pg.appendChild(makeStreakItem(item,'pos','ac')));
  card.appendChild(pg);

  card.appendChild(dv('xs dimmer up ls mb8',t('rew-streaks')));
  const ng=dv('sk-g');
  [...rwItems.map(r=>({k:penKey(r.id),l:rewardLabel(r)})),{k:'lateStreak',l:t('sk-l')}]
  .forEach(item=>ng.appendChild(makeStreakItem(item,'neg','ng')));
  card.appendChild(ng);

  if(STATE.editingStreaks){
    const clearBtn=bt('btn-ghost btn-sm mt10',t('clear-ovr'),()=>{STATE.streakOverrides={};STATE.editingStreaks=false;S.set(K.STREAK_OVR,{});SB.push(STATE.history,STATE.today,STATE.diary,STATE.streakOverrides).catch(()=>{});refresh();});
    clearBtn.style.marginTop='12px';card.appendChild(clearBtn);
  }
  return card;
}

/* Both halves of the calendar row read a day from the same place: history with
   its gaps filled, with anything actually logged laid over it. */
function histMap(){
  const m=new Map(CALC.fillGaps(STATE.history).map(d=>[d.date,d]));
  STATE.history.forEach(d=>m.set(d.date,d));
  return m;
}

/* ═══ CALENDAR — #5 pts visible, #8 flag glow ═══ */
/* Picking a day no longer opens the day underneath the grid; it fills the panel
   beside it, which is where the note now lives. onPick redraws that panel. */
function renderCalendar(onPick){
  const wrap=dv('card');const now=new Date();
  if(!STATE.calYM)STATE.calYM={y:now.getFullYear(),m:now.getMonth()};
  let cY=STATE.calYM.y,cM=STATE.calYM.m;
  const isLight=document.body.classList.contains('light');
  const sBg=isLight
    ? {red:{bg:'#fecaca',txt:'#991b1b'},yellow:{bg:'#fef08a',txt:'#854d0e'},green:{bg:'#bbf7d0',txt:'#14532d'},purple:{bg:'#e9d5ff',txt:'#581c87'},none:{bg:'#e2e8f0',txt:'#94a3b8'}}
    : {red:{bg:'#2e0808',txt:'#fca5a5'},yellow:{bg:'#2e2008',txt:'#fde68a'},green:{bg:'#082e1a',txt:'#6ee7b7'},purple:{bg:'#16082e',txt:'#c4b5fd'},none:{bg:'#111118',txt:'#2a2a3a'}};

  function build(){
    wrap.innerHTML='';
    const hd=dv('rowb mb12');
    const pv=bt('btn-icon','‹',()=>{cM--;if(cM<0){cM=11;cY--;}STATE.calYM={y:cY,m:cM};build();});pv.style.fontSize='20px';
    const nx=bt('btn-icon','›',()=>{cM++;if(cM>11){cM=0;cY++;}STATE.calYM={y:cY,m:cM};build();});nx.style.fontSize='20px';
    hd.appendChild(pv);hd.appendChild(sp('lg w7',capFirst(new Date(cY,cM).toLocaleDateString(STATE.lang==='es'?'es-MX':'en-US',{month:'long',year:'numeric'}))));hd.appendChild(nx);wrap.appendChild(hd);

    // #6: use history with gaps filled for calendar display
    const hMap=histMap();
    const medals=medalsByDate();

    const dim=new Date(cY,cM+1,0).getDate();const fd=new Date(cY,cM,1).getDay();
    const tk=todayKey();
    /* Today is still being lived, so its cell must read from STATE.today
       through CALC.score — the very call the score card makes. It used to
       render whatever stale entry history held for today and score it with
       liveScore, which is built for closed days and recomputes streaks
       differently, so the two disagreed: +186 up top against -295 down here. */
    const liveSk=applyStreakOverrides(CALC.streaks(STATE.history,STATE.today));
    const liveToday=CALC.score(STATE.today,liveSk);
    const cg=dv('cal-g mb10');
    (STATE.lang==='es'?['Do','Lu','Ma','Mi','Ju','Vi','Sa']:['Su','Mo','Tu','We','Th','Fr','Sa']).forEach(d=>cg.appendChild(dv('cal-hd',d)));
    for(let i=0;i<fd;i++)cg.appendChild(dv(''));
    for(let d=1;d<=dim;d++){
      const key=(()=>{const _d=new Date(cY,cM,d);return _d.getFullYear()+'-'+String(_d.getMonth()+1).padStart(2,'0')+'-'+String(_d.getDate()).padStart(2,'0');})();
      const entry=hMap.get(key);
      const isToday=key===tk;
      const status=isToday?liveToday.status:(entry?entry.status:null);
      const bg=status?(sBg[status]||sBg.none):sBg.none;
      const cell=dv(`cal-c${isToday?' today':''}${key===STATE.calSel?' sel':''}`);
      cell.style.background=bg.bg;
      const flagOn=isToday?!!STATE.today.flagCompleted
                          :entry?.streaks?.some(s=>s.type==='flags'&&s.active);
      if(flagOn){
        // #8: prominent ring + icon
        const ring=dv('cal-flag-ring');cell.appendChild(ring);
        cell.appendChild(sp('cal-flag-ico','🏅'));
      }
      /* A medal earned that day, kept on the day it was earned. The flag ring
         says what the day was; this says what the day finished. */
      const won=medals.get(key);
      if(won&&won.length){
        // The highest one wears the day; the rest are named in the tooltip.
        const top=won.reduce((a,b)=>b.n>a.n?b:a);
        const mk=sp('cal-medal',tierOf(top.n).icon);
        mk.title=won.map(x=>`${t('ms-'+tierOf(x.n).word)} ${x.n} — ${medalName(x.kind)}`).join('\n');
        cell.appendChild(mk);
      }
      const num=sp('cal-num',String(d));num.style.color=bg.txt;cell.appendChild(num);
      // #5: always show pts if entry exists
      if(isToday||entry){
        const val=isToday?liveToday.total:CALC.liveScore(entry,STATE.history);
        const pts=sp('cal-pts',String(val));pts.style.color=bg.txt;cell.appendChild(pts);
      }
      cell.onclick=()=>{STATE.calSel=key===STATE.calSel?null:key;build();if(onPick)onPick();};
      cg.appendChild(cell);
    }
    wrap.appendChild(cg);
  }
  build();return wrap;
}

/* What a day of this colour buys you. It used to say which streaks the colour
   RESET, which stopped being true on both sides: a colour no longer ends a
   reward run, and red no longer ends a positive one. What a colour does now
   is set the price of that one day, so that is what it says. Which rewards go
   cheap follows TIER_FORGIVES exactly — light, then medium, then everything —
   and the emoji are the built-in rewards at each weight. */
function discEmojis(status){
  if(status==='red')return'⤵️';
  if(status==='yellow')return'💊💸';
  if(status==='green')return'💊🌐💸';
  if(status==='purple')return'💊🌐💦🌙💸';
  return'';
}
function discTooltip(status){
  if(status==='red')return t('disc-red');
  if(status==='yellow')return t('disc-light');
  if(status==='green')return t('disc-med');
  if(status==='purple')return t('disc-all');
  return'';
}

/* ═══ DAY PANEL — the day you picked on the calendar ═══
   It holds what used to hang underneath the grid — colour, points, the day's
   line — and gives the note the whole of the room the history list used to
   take. The numbers themselves are edited through ✏, which opens them over
   the page for the same day. */
function renderDayPanel(){
  const wrap=dv('card');
  const key=STATE.calSel;
  const hd=dv('rowb mb12');

    ? capFirst(new Date(key+'T12:00:00').toLocaleDateString(STATE.lang==='es'?'es-MX':'en-US',{weekday:'long',day:'numeric',month:'long'}))
    : t('day-panel')));
  if(key){
    /* It says what it does. A lone pencil is a fine thing to find on a toy and
       a bad thing to hide a day's numbers behind: fixing a day you forgot to
       log is not a flourish, it is the repair you reach for most. */
    const eb=bt('btn-ghost btn-sm',t('edit-hist'),()=>{STATE.histDay=key;render();});
    eb.style.whiteSpace='nowrap';hd.appendChild(eb);
  }
  wrap.appendChild(hd);
  if(!key){wrap.appendChild(dv('sm dimmer ctr mt16 mb16',t('pick-day')));return wrap;}

  const isToday=key===todayKey();
  const entry=histMap().get(key);
  // Today is still being lived, so it is scored from STATE.today through the
  // very call the score card makes, never from a stale history entry.
  const live=isToday?CALC.score(STATE.today,applyStreakOverrides(CALC.streaks(STATE.history,STATE.today))):null;

  if(isToday||entry){
    const status=isToday?live.status:entry.status;
    const dr=dv('rowb');
    const lft=dv('row gap6');
    lft.appendChild(sbadge(status));
    // t('Today') is not a key — it fell through to the literal "Today" in both
    // languages. The key is today-lbl.
    if(isToday){const b=sp('badge s-'+status,t('today-lbl'));lft.appendChild(b);}
    const re=sp('xs dimmer',discEmojis(status));
    re.title=discTooltip(status);re.style.cursor='help';lft.appendChild(re);
    dr.appendChild(lft);
    dr.appendChild(sp('lg mo w7 ac',`${isToday?live.total:CALC.liveScore(entry,STATE.history)} pts`));
    wrap.appendChild(dr);
    // Format: 21/28 tasks · 20 🍅 · 🏅 ×37
    const flagActive=isToday?!!STATE.today.flagCompleted:entry.streaks?.some(s=>s.type==='flags'&&s.active);
    const flagStreak=entry?.streaksUsed?.flagStreak||entry?.streaksUsed?.flagstreak||'';
    const parts=[
      `${(isToday?STATE.today.completed:entry.completedTasks)||0}/${(isToday?STATE.today.target:entry.totalTasks)||0} ${t('tasks-lbl')}`,
      `${(isToday?STATE.today.pomodoros:entry.pomodoros)||0} 🍅`,
      ...(flagActive?[isToday?'🏅':`🏅 ×${flagStreak||'?'}`]:[])
    ];
    const line=dv('xs dim mt6');line.textContent=parts.join(' · ');wrap.appendChild(line);
    if(!isToday&&entry?._gap)wrap.appendChild(dv('xs ng mt4',t('day-not-logged')));
    // What this day earned, spelled out — the calendar only has room for a mark.
    const won=medalsByDate().get(key)||[];
    won.forEach(w=>{const ti=tierOf(w.n);wrap.appendChild(dv('xs mt4',
      `<span class="w7" style="color:${ti.hue}">${ti.icon} ${t('ms-'+ti.word)} ${w.n}</span>`+
      `<span class="dimmer"> — ${medalName(w.kind)}</span>`));});
  } else {
    wrap.appendChild(dv('xs dimmer',t('no-data')));
  }

  // The note: read it formatted, or open it and write. Opening hides the
  // reading copy so the day is not shown twice at once.
  const nb=bt('btn-ghost btn-sm','📝 '+(STATE.diary[key]?t('edit-note'):t('add-note')),()=>{
    wrap.querySelectorAll('.note-prev').forEach(pv=>pv.style.display='none');
    toggleDiaryEditor(wrap,key,nb);
  });
  nb.style.cssText='margin-top:12px;display:block';wrap.appendChild(nb);
  if(STATE.diary[key]){
    const body=noteBody(STATE.diary[key]);
    const folded=!!STATE.diaryFold[key];
    /* The title heads the note and folds it: one click puts the template away
       and leaves the summary, which is the part worth re-reading. A note with
       no summary in it has nothing to fold, so it stays whole. */
    const cut=summaryCut(body);
    const head=dv('row gap6 mt10 note-prev');
    head.style.cssText='cursor:pointer;align-items:baseline';
    if(cut>=0)head.appendChild(sp('sm dimmer',folded?'▸':'▾'));
    const title=noteTitle(STATE.diary[key]);
    head.appendChild(sp(title?'xl w7 ac':'xl w7 dimmer',title||t('day-untitled')));
    head.onclick=()=>{if(cut>=0){STATE.diaryFold[key]=!folded;refresh();}};
    wrap.appendChild(head);
    const preview=dv('sm dim mt8 note-prev');
    preview.style.cssText='white-space:pre-wrap;line-height:1.6';
    preview.innerHTML=diaryToHtml(folded&&cut>=0?body.split('\n').slice(cut).join('\n'):body);
    wrap.appendChild(preview);
  }
  return wrap;
}

/* Where the summary starts in a note — the fold leaves everything from there
   down. Both languages are checked: a note written in Spanish still folds when
   the app is read in English. */
function summaryCut(body){
  const sums=[T.es['tpl-summary'],T.en['tpl-summary']];
  return body.split('\n').findIndex(l=>sums.includes(l.trim()));
}

/* ═══ STATS — #7 more interesting stats ═══ */
function renderStats(total,sc){
  const wrap=dv('card mt12');let open=true;
  const tog=el('button','sec-t');tog.innerHTML=`<span>${t('stats-title')}</span><span id="st-a">▲</span>`;
  const body=dv('fi');
  /* Its own scroll. Every stat added used to push the page taller, so the more
     there was to read the further everything below it sat — the reset button
     ended up a screen and a half down. It scrolls inside itself now, and the
     page stays the length it was. */
  body.style.cssText='max-height:62vh;overflow-y:auto;padding-right:6px';
  tog.onclick=()=>{open=!open;body.style.display=open?'':'none';document.getElementById('st-a').textContent=open?'▲':'▼';};
  wrap.appendChild(tog);

  const isEs=STATE.lang==='es';

  // ── Computed values ──────────────────────────────────────────────────────
  const realDays=STATE.history.filter(d=>!d._gap);
  const allPts=realDays.map(d=>CALC.liveScore(d,STATE.history));
  const last7=realDays.slice(0,7).map(d=>CALC.liveScore(d,STATE.history));
  const best=allPts.length?Math.max(...allPts):0;
  const worst=allPts.length?Math.min(...allPts):0;
  /* Which day a number came from. A record is worth more when you can see when
     it happened — and a hover is where that belongs, since the tile has room
     for the number and nothing else. */
  const dayOfPts=v=>{const i=allPts.indexOf(v);return i>=0?realDays[i].date:'';};
  const fmtD=d=>d?capFirst(new Date(d+'T12:00:00').toLocaleDateString(isEs?'es-MX':'en-US',{weekday:'short',day:'numeric',month:'short'})):'';
  // The run of days a best streak was made of, named by where it ended.
  const spanOf=(len,endDate)=>{
    if(!len||!endDate)return '';
    const e=new Date(endDate+'T12:00:00'),s=new Date(e);s.setDate(s.getDate()-(len-1));
    return fmtD(isoDate(s))+' → '+fmtD(endDate);
  };
  const avg=allPts.length?Math.round(allPts.reduce((a,b)=>a+b,0)/allPts.length):0;
  const avg7=last7.length?Math.round(last7.reduce((a,b)=>a+b,0)/last7.length):0;
  const totalTracked=STATE.history.filter(d=>!d._gap).length;
  const sortedH=[...STATE.history].sort((a,b)=>new Date(a.date)-new Date(b.date));
  /* This week against your own average, as a percentage of it. Two things kept
     it from meaning anything. It divided by a signed average, so with a
     negative one a better week came out negative — an improvement reported as
     a slump. And it divided by however small the average was, so an average of
     +45 against a week of −380 read as −937%: arithmetically true, and no use
     to anyone. Below a hundred points either way the baseline is too small to
     divide by, and the reading is set aside rather than dressed up. */
  const momentum=Math.abs(avg)>=100
    ? Math.max(-300,Math.min(300,Math.round((avg7-avg)/Math.abs(avg)*100)))
    : 0;

  // Streaks — each remembers the day its best run ended, so it can be dated.
  let bStrk=0,curStrk=0,bStrkEnd='';sortedH.forEach(d=>{if(d.status!=='red'&&!d._gap){curStrk++;if(curStrk>bStrk){bStrk=curStrk;bStrkEnd=d.date;}}else curStrk=0;});
  let pfStrk=0;for(let k=0;k<sortedH.length;k++){if(!sortedH[sortedH.length-1-k].penalties?.length&&!sortedH[sortedH.length-1-k]._gap)pfStrk++;else break;}
  /* A logged day records the morning routine inside its streaks, never as a
     morningCompleted field — that name belongs to today alone. This read the
     field, found nothing on any day, and so has reported a best morning streak
     of zero for as long as the stat has existed. */
  const didMorning=d=>!!d.streaks?.some(s=>s.type==='morning'&&s.active);
  let bestMornStrk=0,curMorn=0,mornEnd='';sortedH.forEach(d=>{if(didMorning(d)&&!d._gap){curMorn++;if(curMorn>bestMornStrk){bestMornStrk=curMorn;mornEnd=d.date;}}else curMorn=0;});
  let bestDFStrk=0,curDF=0,dfEnd='';sortedH.forEach(d=>{if(!d.penalties?.some(p=>p.type==='drugs')&&!d._gap){curDF++;if(curDF>bestDFStrk){bestDFStrk=curDF;dfEnd=d.date;}}else curDF=0;});

  // Work & focus
  const totalPoms=STATE.history.reduce((s,d)=>s+(d.pomodoros||0),0)+(STATE.today.pomodoros||0);
  const totalWorkMin=STATE.history.reduce((s,d)=>s+(d.workDuration||0),0)+(STATE.today.work?.workDuration||0);
  const workDays=STATE.history.filter(d=>!d._gap&&(d.workDuration||0)>0).length;
  const workPct=totalTracked>0?Math.round(workDays/totalTracked*100):0;
  const pomPerDay=totalTracked>0?Math.round(totalPoms/totalTracked*10)/10:0;
  /* Minutes wasted are kept in the penalty's count, the way every stored
     penalty keeps its number. This looked for a `duration` that nothing has
     ever written, so the total read zero however much was logged. */
  const totalProcMin=STATE.history.reduce((s,d)=>s+(d.penalties?.filter(p=>p.type==='internet').reduce((a,p)=>a+(p.count||p.details?.minutes||0),0)||0),0);

  // Sleep
  const totalSleepMin=STATE.history.reduce((s,d)=>s+(d.sleepDuration||0),0)+(STATE.today.sleep?.sleepDuration||0);
  const avgSleepMin=totalTracked>0?Math.round(STATE.history.filter(d=>!d._gap).reduce((s,d)=>s+(d.sleepDuration||0),0)/totalTracked):0;
  const earlyNights=STATE.history.filter(d=>d.sleptEarly).length;
  const lateNights=STATE.history.filter(d=>d.sleptLate).length;

  /* The advice at the bottom talks about two of the built-ins by name, and any
     of them can be renamed, so it asks the list rather than saying the word. */
  const rwDrugs=rewardById('drugs'),rwProc=rewardById('internet');
  const nmDrugs=rewardName(rwDrugs),nmProc=rewardName(rwProc);

  /* Two things the page kept implying and never actually said: how often the
     day's flags went down, and how often a day carried no reward at all.
     The first is the one people reach for when they read "Completion" and
     find a number lower than they expected — Completion is about tasks, and
     a day's colour is bumped a whole level by the flags, so plenty of green
     days sit on a task figure well under half. Two different questions,
     answered separately now. */
  const flagDays=realDays.filter(d=>d.streaks?.some(s=>s.type==='flags'&&s.active)).length;
  const flagPct=totalTracked?Math.round(flagDays/totalTracked*100):0;
  const cleanDaysAll=realDays.filter(d=>!(d.penalties||[]).length).length;
  const cleanPct=totalTracked?Math.round(cleanDaysAll/totalTracked*100):0;

  // Discipline %
  const drugFreeDays=STATE.history.filter(d=>!d.penalties?.some(p=>p.type==='drugs')&&!d._gap).length;
  const dfPct=totalTracked?Math.round(drugFreeDays/totalTracked*100):100;
  const procFreeDays=STATE.history.filter(d=>!d.penalties?.some(p=>p.type==='internet')&&!d._gap).length;
  const procFreePct=totalTracked?Math.round(procFreeDays/totalTracked*100):100;
  const orgFreeDays=STATE.history.filter(d=>!d.penalties?.some(p=>p.type==='macanazo')&&!d._gap).length;
  const orgFreePct=totalTracked?Math.round(orgFreeDays/totalTracked*100):100;
  const totalOrgasms=STATE.history.reduce((s,d)=>s+(d.penalties?.filter(p=>p.type==='macanazo').length||0),0);
  const totalIndulgences=STATE.history.reduce((s,d)=>s+(d.penalties?.filter(p=>p.type==='drugs').reduce((a,p)=>a+(p.count||1),0)||0),0);

  // Day color counts
  const counts={purple:0,green:0,yellow:0,red:0};STATE.history.forEach(d=>counts[d.status]=(counts[d.status]||0)+1);
  const purplePct=totalTracked?Math.round((counts.purple/totalTracked)*100):0;

  // Most productive day EVER (highest workDuration)
  let bestWorkDay=null,bestWorkMin=0;
  sortedH.filter(d=>!d._gap).forEach(d=>{if((d.workDuration||0)>bestWorkMin){bestWorkMin=d.workDuration;bestWorkDay=d.date;}});
  const prodEverStr=bestWorkDay?fmtShort(bestWorkDay):'—';
  const prodEverSub=bestWorkDay?fmtDur(bestWorkMin):(isEs?'Sin datos':'No data');

  /* The peak day for the grave reward, and what it is called. The tile was
     written about Orgasmo — "Día más cachondo", counted in "orgasmo(s)" — and
     that reward is renameable, so the joke could end up being about a habit it
     has nothing to do with. The numbers are the same either way; only the
     wording is held back until the name earns it. See isOriginal(). */
  const grave=rewardById('macanazo');
  const graveLbl=rewardLabel(grave);           // raw, for the hover title
  const graveEsc=escapeHtml(graveLbl);         // for the tiles, which use innerHTML
  const graveFun=isOriginal(grave);
  let bestOrgDay=null,bestOrgCount=0;
  sortedH.filter(d=>!d._gap).forEach(d=>{const c=d.penalties?.filter(p=>p.type==='macanazo').length||0;if(c>bestOrgCount){bestOrgCount=c;bestOrgDay=d.date;}});
  const hornEverStr=bestOrgDay?fmtShort(bestOrgDay):'—';
  const hornEverSub=bestOrgDay
    ?(graveFun?bestOrgCount+' '+(isEs?'orgasmo(s)':'orgasm(s)'):bestOrgCount+' × '+graveEsc)
    :(isEs?'Sin datos':'No data');
  const hornEverLbl=graveFun?(isEs?'Día más cachondo (ever)':'Horniest day')
    :(isEs?'Día con más '+graveEsc:'Peak day for '+graveEsc);
  const hornDowLbl=graveFun?(isEs?'Día más cachondo (semana)':'Horniest day of week')
    :(isEs?'Día con más '+graveEsc+' (semana)':'Peak weekday for '+graveEsc);

  // Most productive & horniest day OF THE WEEK (by average)
  const dowNames=isEs?['Dom','Lun','Mar','Mié','Jue','Vie','Sáb']:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const dowFull=isEs?['domingos','lunes','martes','miércoles','jueves','viernes','sábados']:['Sundays','Mondays','Tuesdays','Wednesdays','Thursdays','Fridays','Saturdays'];
  const dowWork=[],dowOrg=[];for(let k=0;k<7;k++){dowWork.push([]);dowOrg.push([]);}
  sortedH.filter(d=>!d._gap).forEach(d=>{
    const dow=new Date(d.date+'T12:00:00').getDay();
    dowWork[dow].push(d.workDuration||0);
    dowOrg[dow].push(d.penalties?.filter(p=>p.type==='macanazo').length||0);
  });
  let prodDay=-1,prodAvg=0;
  dowWork.forEach((arr,k)=>{if(!arr.length)return;const a=arr.reduce((x,y)=>x+y,0)/arr.length;if(a>prodAvg){prodAvg=a;prodDay=k;}});
  let hornDay=-1,hornAvg=0;
  dowOrg.forEach((arr,k)=>{if(!arr.length)return;const a=arr.reduce((x,y)=>x+y,0)/arr.length;if(a>hornAvg){hornAvg=a;hornDay=k;}});
  const prodDayStr=prodDay>=0?dowNames[prodDay]:'—';
  const prodDaySub=prodDay>=0?('⌀ '+fmtDur(Math.round(prodAvg))):(isEs?'Sin datos':'No data');
  const hornDayStr=hornDay>=0?dowNames[hornDay]:'—';
  const hornDaySub=hornDay>=0?('⌀ '+hornAvg.toFixed(1)):(isEs?'Sin datos':'No data');

  // Insight
  let insight='';
  if(totalTracked<3)insight=isEs?'Sigue registrando días para ver estadísticas personalizadas.':'Keep logging days to see personalized insights.';
  else if(momentum>20)insight=isEs?`🚀 Momentum +${momentum}% — tu última semana supera tu promedio histórico.`:`🚀 Momentum +${momentum}% — your last week beats your all-time average.`;
  else if(momentum<-20)insight=isEs?`📉 Semana difícil (${momentum}%). El progreso no es una línea recta.`:`📉 Tough week (${momentum}%). Progress isn't linear.`;
  else if(dfPct===100)insight=isEs?`🌟 100% de tus días sin ${nmDrugs}. Disciplina consistente.`:`🌟 100% of your days without ${nmDrugs}. Consistent discipline.`;
  else if(pfStrk>7)insight=isEs?`✨ ${pfStrk} días sin penalizaciones. ¡Racha limpia!`:`✨ ${pfStrk} days with no rewards. Clean streak!`;
  else if(totalPoms>50)insight=isEs?`🍅 ${totalPoms} pomodoros = ${Math.round(totalPoms*25/60)}h de trabajo enfocado.`:`🍅 ${totalPoms} pomodoros = ${Math.round(totalPoms*25/60)}h of focused work.`;
  else insight=isEs?'📊 Construyendo historial. Más datos = mejores estadísticas.':'📊 Building history. More data = better insights.';

  /* `when` is what the hover says: the day a record was set, or the run a best
     streak was made of. Only for the numbers that have one — a percentage over
     all your days has no date to give, and inventing one would say nothing. */
  function statCard(label,value,color,sub,size='xl',when){
    const s=dv('card2 ctr');const n=dv(size+' w7 mo');n.style.color=color;n.textContent=value;
    s.appendChild(n);s.appendChild(dv('xs dimmer mt4',label));if(sub)s.appendChild(dv('xs dimmer',sub));
    if(when){s.title=when;s.style.cursor='help';}
    return s;
  }
  /* `tiles` says these are read-only stat tiles rather than the four cards you
     type into, so a phone can keep them two across instead of stacking them. */
  function grid4(...cards){const g=dv('g4 tiles mb10');g.style.gap='8px';cards.forEach(c=>g.appendChild(c));return g;}

  // ── 8b. Medals ────────────────────────────────────────────────────────────
  /* The whole collection in one place. The calendar keeps each one on its own
     day, which is the record; this is the shelf. */
  // Each medal carries the day it was won, so the shelf can name the day.
  const allMedals=[...medalsByDate().entries()].flatMap(([d,l])=>l.map(m=>({...m,date:d})));
  const mbox=dv('card2 mb10');
  const mh=dv('rowb mb8');
  mh.appendChild(sp('xs dimmer up ls',t('medals-title')));
  mh.appendChild(sp('md mo w7 ac',String(allMedals.length)));
  mbox.appendChild(mh);
  /* All seven, always on the shelf. The ones not yet won stand in silhouette,
     so what is still ahead is as plain as what is behind — and 200 is visibly
     not the end of it. */
  // .ms-shelf so a phone can lay the seven out as a climb rather than a wrap.
  const mg=dv('row gap8 ms-shelf');
  MILESTONES.forEach(ti=>{
    const won=allMedals.filter(m=>m.n===ti.n).sort((a,b)=>a.date.localeCompare(b.date));
    const slot=dv('ctr');
    slot.style.cssText='width:76px;padding:6px 2px;border-radius:10px;'+
      (won.length?`background:${ti.hue}14;border:1px solid ${ti.hue}55`:'border:1px dashed var(--b2)');
    const ico=dv('',ti.icon);
    ico.style.cssText='font-size:26px;line-height:1.1'+
      (won.length?`;filter:drop-shadow(0 0 10px ${ti.hue}88)`:';filter:grayscale(1) brightness(.45);opacity:.4');
    slot.appendChild(ico);
    const n=dv('xs mo w7',String(ti.n));
    n.style.color=won.length?ti.hue:'var(--t3)';
    slot.appendChild(n);
    const w=dv('xs',t('ms-'+ti.word));
    w.style.cssText='font-size:9px;letter-spacing:.04em;'+(won.length?'color:var(--t2)':'color:var(--t3);opacity:.5');
    slot.appendChild(w);
    if(won.length>1)slot.appendChild(dv('xs dimmer','×'+won.length));
    slot.title=won.length
      ? won.map(m=>`${medalName(m.kind)} — ${m.date}`).join('\n')
      : t('medals-locked');
    mg.appendChild(slot);
  });
  mbox.appendChild(mg);
  if(!allMedals.length)mbox.appendChild(dv('xs dimmer ctr mt8',t('medals-none')));
  body.appendChild(mbox);

  // ── 1. Score highlights ──────────────────────────────────────────────────
  const gA=dv('g4 tiles mb10');gA.style.gap='8px';
  /* The colours mean something now. Green is a number you want to see, orange
     is one that costs you, purple is the rare kind, and gold is a plain fact
     that is neither. Everything used to be gold, which said nothing at all. */
  /* The two averages moved up into the Momentum row, where they mean
     something next to each other. Rather than leave the hole they left in the
     middle of the page, two numbers that were missing fill it: the median,
     which one enormous day cannot drag the way the mean can, and how often a
     day finished above zero at all. */
  const sortedPts=[...allPts].sort((a,b)=>a-b);
  const median=sortedPts.length
    ? (sortedPts.length%2?sortedPts[(sortedPts.length-1)/2]
       :Math.round((sortedPts[sortedPts.length/2-1]+sortedPts[sortedPts.length/2])/2)):0;
  const posDays=allPts.filter(v=>v>0).length;
  const posPct=allPts.length?Math.round(posDays/allPts.length*100):0;
  [[t('best-day'),best,'var(--cg)',fmtD(dayOfPts(best))],
   [t('worst-day'),worst,'var(--ng)',fmtD(dayOfPts(worst))],
   [isEs?'Día mediano':'Median day',median,median>0?'var(--cg)':'var(--ng)',
    isEs?'La mitad de tus días quedan arriba de esto y la mitad abajo. Un solo día enorme no lo mueve, como sí mueve al promedio.'
        :'Half your days land above this and half below. One enormous day cannot drag it the way it drags the mean.'],
   [isEs?'Días en positivo':'Days in the black',posPct+'%',posPct>=50?'var(--cg)':'var(--ng)',
    isEs?posDays+' de '+allPts.length+' días cerraron arriba de cero':posDays+' of '+allPts.length+' days closed above zero']
  ].forEach(([l,v,c,when])=>{
    const s=dv('card2 ctr');const n=dv('xxl w7 mo');n.style.color=c;n.textContent=String(v);
    s.appendChild(n);s.appendChild(dv('xs dimmer mt4',l));
    if(when){s.title=when;s.style.cursor='help';}
    gA.appendChild(s);
  });

  /* ── Where the total actually comes from ─────────────────────────────────
     One number cannot tell you which of eight sources built it, and the
     source that built most of it is not usually the one you would name. This
     is the same arithmetic the total is — every stored day taken apart and
     the parts added back up — just not collapsed into a single figure. */
  const SRC=[['src-work','💼','wrk'],['src-sleep','😴','slp'],['src-flags','🏁','fB'],
             ['src-morning','🌞','mB'],['src-pom','🍅','pom'],['src-color','🎨','col'],
             ['src-tasks','✅','base'],['src-rewards','🤤','pen'],['src-late','🌙','latePen']];
  const srcTot={};SRC.forEach(([,,k])=>srcTot[k]=0);
  let gapTot=0;
  // The same day list the total adds up: gaps filled in, real days laid over.
  [...histMap().values()].filter(d=>d.date!==todayKey()).forEach(d=>{
    const p=CALC.liveParts(d,STATE.history);
    if(p.gap!==undefined){gapTot+=p.gap;return;}
    SRC.forEach(([,,k])=>srcTot[k]+=p[k]||0);
  });
  SRC.forEach(([,,k])=>srcTot[k]+=sc[k]||0);   // and today, as it stands
  const srcBox=dv('card2 mb10');
  srcBox.appendChild(dv('xs dimmer up ls mb8',t('src-title')));
  const pos=SRC.filter(([,,k])=>srcTot[k]>0).sort((a,b)=>srcTot[b[2]]-srcTot[a[2]]);
  const neg=SRC.filter(([,,k])=>srcTot[k]<0).sort((a,b)=>srcTot[a[2]]-srcTot[b[2]]);
  const posSum=pos.reduce((s,[,,k])=>s+srcTot[k],0);
  if(!pos.length&&!neg.length&&!gapTot)srcBox.appendChild(dv('xs dimmer',t('src-none')));
  else{
    const line=(icon,label,val,share,color)=>{
      const row=dv('row gap8');row.style.alignItems='center';
      row.appendChild(sp('sm',icon));
      const mid=dv('f1');
      mid.appendChild(dv('xs dim',label));
      // The bar is the share of the positives, so the big one is obvious at
      // a glance rather than needing the numbers read and compared.
      const track=dv('');track.style.cssText='height:5px;border-radius:3px;background:var(--b1);margin-top:3px;overflow:hidden';
      const fill=dv('');fill.style.cssText=`height:100%;width:${Math.max(1,Math.round(share*100))}%;background:${color}`;
      track.appendChild(fill);mid.appendChild(track);
      row.appendChild(mid);
      const n=sp('sm mo w7',(val>0?'+':'')+val.toLocaleString());
      n.style.cssText='color:'+color+';min-width:96px;text-align:right';
      row.appendChild(n);
      if(share>0){const pc=sp('xs dimmer mo',Math.round(share*100)+'%');pc.style.cssText='min-width:34px;text-align:right';row.appendChild(pc);}
      return row;
    };
    const list=dv('s6');
    pos.forEach(([key,icon,k])=>list.appendChild(
      line(icon,t(key),srcTot[k],posSum?srcTot[k]/posSum:0,'var(--cg)')));
    const negSum=neg.reduce((s,[,,k])=>s+srcTot[k],0)+gapTot;
    neg.forEach(([key,icon,k])=>list.appendChild(
      line(icon,t(key),srcTot[k],negSum?srcTot[k]/negSum:0,'var(--ng)')));
    if(gapTot)list.appendChild(line('📅',t('src-gaps'),gapTot,negSum?gapTot/negSum:0,'var(--ng)'));
    srcBox.appendChild(list);
    /* The one line that answers the question this whole panel exists for:
       how much of what you do is being cancelled by what you indulge. */
    if(posSum>0)srcBox.appendChild(dv('xs dimmer mt8 ctr',
      `${(-negSum).toLocaleString()} / ${posSum.toLocaleString()} · ${Math.round(-negSum/posSum*100)}%`));
    srcBox.appendChild(dv('xs dimmer mt6',
      t('cap-note').replace('{n}',multAt(100)).replace('{p}',PEN_CAP)));
  }
  body.appendChild(srcBox);

  /* ── Momentum: the one row that answers "how am I doing", as opposed to
     "how have I ever done" ─────────────────────────────────────────────────
     The total is an odometer — months of history drown any single week, by
     construction. This is the speedometer, and it was buried in a sentence
     at the bottom of the page where the number it names never appeared.
     Where you stand right now sits beside it: a best streak says what you
     are capable of, the one you are on says what you are doing. */
  let curNonRed=0;
  for(let k=sortedH.length-1;k>=0;k--){const d=sortedH[k];if(d._gap||d.status==='red')break;curNonRed++;}
  const momCol=momentum>0?'var(--cg)':(momentum<0?'var(--ng)':'var(--ac)');
  body.appendChild(grid4(
    statCard(isEs?'Momentum':'Momentum',(momentum>0?'+':'')+momentum+'%',momCol,
      isEs?'últimos 7 vs siempre':'last 7 vs all-time','xl',
      momentum===0&&Math.abs(avg)<100
        ?(isEs?'Tu promedio es aún muy chico para dividir entre él sin decir tonterías.'
              :'Your average is still too small to divide by without saying nonsense.')
        :(isEs?'Qué tanto tu última semana supera (o no) tu promedio de siempre.'
              :'How far your last week beats — or misses — your all-time average.')),
    statCard(t('last7-avg'),String(avg7),avg7>avg?'var(--cg)':(avg7<avg?'var(--ng)':'var(--ac)'),
      isEs?'por día':'per day'),
    statCard(t('all-avg'),String(avg),'var(--ac)',isEs?'por día':'per day'),
    statCard(isEs?'Racha actual':'Current streak',curNonRed+'d','var(--cp)',isEs?'sin rojo':'non-red','xl',
      curNonRed?spanOf(curNonRed,sortedH[sortedH.length-1].date):'')
  ));

  // ── Records and overview ─────────────────────────────────────────────────
  body.appendChild(gA);
  body.appendChild(grid4(
    statCard(t('total-days-lbl'),String(totalTracked),'var(--ac)',null),
    statCard(t('best-streak'),bStrk+'d','var(--cp)',isEs?'sin rojo':'non-red','xl',spanOf(bStrk,bStrkEnd)),
    statCard(t('clean-streak'),pfStrk+'d','var(--cg)',isEs?'sin recompensas':'no rewards'),
    statCard(isEs?'Días morados':t('purple-days'),purplePct+'%','var(--cp)',counts.purple+'d')
  ));

  // ── 3. Work: Best days ───────────────────────────────────────────────────
  body.appendChild(grid4(
    statCard(isEs?'Día más productivo (ever)':'Most productive day',prodEverStr,'var(--cg)',prodEverSub,'xl',
      bestWorkDay?(isEs?fmtD(bestWorkDay)+' — '+fmtDur(bestWorkMin)+' de trabajo registrado, más que cualquier otro día':fmtD(bestWorkDay)+' — '+fmtDur(bestWorkMin)+' of work logged, more than any other day'):''),
    statCard(isEs?'Más trabajo (semana)':'Most worked weekday',prodDayStr,'var(--ac)',prodDaySub,'xl',prodDay>=0?(isEs?'Minutos de trabajo, promediados sobre todos tus '+dowFull[prodDay]:'Minutes worked, averaged across every '+dowFull[prodDay]):''),
    statCard(t('work-total'),fmtDur(totalWorkMin),'var(--ac)',null),
    statCard(t('work-days-lbl'),workPct+'%',workPct>=50?'var(--cg)':'var(--ng)',workDays+'d')
  ));

  // ── 4. Work: Focus & Routine ─────────────────────────────────────────────
  body.appendChild(grid4(
    statCard(t('total-poms'),String(totalPoms),'var(--ac)',null),
    statCard(t('poms-day'),String(pomPerDay),'var(--ac)',null),
    statCard(t('best-morn-lbl'),bestMornStrk+'d','var(--cg)',null,'xl',spanOf(bestMornStrk,mornEnd)),
    statCard(t('total-proc-lbl'),fmtDur(totalProcMin),'var(--ng)',null)
  ));

  // ── 5. The grave reward, its peak day and its peak weekday ───────────────
  body.appendChild(grid4(
    statCard(hornEverLbl,hornEverStr,'var(--ng)',hornEverSub,'xl',fmtD(bestOrgDay)),
    statCard(hornDowLbl,hornDayStr,'var(--ng)',hornDaySub,'xl',hornDay>=0?(isEs?(graveFun?'Orgasmos':graveLbl)+', promediados sobre todos tus '+dowFull[hornDay]:(graveFun?'Orgasms':graveLbl)+', averaged across every '+dowFull[hornDay]):''),
    /* This row used to be padded out with a second copy of Total
       procrastination and a second copy of Days logged, both of which have
       their own place on this page. Two numbers that earn the space instead:
       how often the day's flags actually went down, and how often the day
       carried no reward at all. */
    statCard(isEs?'Días con banderas':'Days with flags',flagPct+'%',
      flagPct>=70?'var(--cg)':'var(--ac)',flagDays+'d','xl',
      isEs?'Días en que exterminaste tus banderas — esto no mira tus tareas.'
          :'Days you annihilated your flags — this does not look at your tasks.'),
    statCard(isEs?'Días limpios':'Clean days',cleanPct+'%',
      cleanPct>=50?'var(--cg)':'var(--ng)',cleanDaysAll+'d','xl',
      isEs?'Días sin una sola recompensa registrada.':'Days with no reward logged at all.')
  ));

  /* ── 6. One row per reward, whatever your list holds ──────────────────────
     The three that shipped were written into these tiles by name, so anything
     you added to the list scored, streaked and showed on the calendar while
     being invisible here. Read from the list instead. */
  const lastDay=sortedH.length?sortedH[sortedH.length-1].date:'';
  const rwStats=rewards().map(r=>{
    const has=d=>(d.penalties||[]).some(p=>p.type===r.id);
    const total=realDays.reduce((s,d)=>s+((d.penalties||[]).filter(p=>p.type===r.id)
      .reduce((a,p)=>a+(r.byMinutes?1:(p.count||1)),0)),0);
    const cleanDays=realDays.filter(d=>!has(d)).length;
    const pct=totalTracked?Math.round(cleanDays/totalTracked*100):100;
    let best=0,cur=0,end='';
    sortedH.forEach(d=>{if(!d._gap&&!has(d)){cur++;if(cur>best){best=cur;end=d.date;}}else cur=0;});
    // Where the run stands right now, which is a different question from the
    // best one ever: the best says what you are capable of, this one says what
    // you are doing. Counted from the last day you closed, like every other
    // current streak on this page.
    let now=0;
    for(let k=sortedH.length-1;k>=0;k--){const d=sortedH[k];if(d._gap||has(d))break;now++;}
    return{r,total,pct,cleanDays,best,end,now};
  });
  /* Four tiles per reward, so each one owns a whole row of the grid and its
     numbers stay together at every width. It used to be two, and the second
     stacked the total over a "racha limpia 9d" subtitle: two numbers with
     nothing to do with each other, one of them explaining the wrong one. Each
     tile answers one question now — how many, how many days without, the
     longest run without, the run you are on. */
  const rwGrid=dv('g4 tiles mb10');rwGrid.style.gap='8px';
  rwStats.forEach(x=>{
    const nm=escapeHtml(rewardLabel(x.r));   // the tiles render their label as HTML
    rwGrid.appendChild(statCard(nm,String(x.total),
      x.total?'var(--ng)':'var(--cg)',
      x.r.byMinutes?(isEs?'registros':'entries'):(isEs?'veces':'times')));
    rwGrid.appendChild(statCard(`${t('sk-without')} ${nm}`,x.pct+'%',
      x.pct>=70?'var(--cg)':'var(--ng)',x.cleanDays+'d'));
    rwGrid.appendChild(statCard(isEs?'Mejor racha limpia':'Best clean run',x.best+'d',
      'var(--cp)',nm,'xl',spanOf(x.best,x.end)));
    rwGrid.appendChild(statCard(isEs?'Racha limpia actual':'Current clean run',x.now+'d',
      x.now?'var(--cg)':'var(--ng)',nm,'xl',x.now?spanOf(x.now,lastDay):''));
  });
  const rwBlock=rwGrid;

  // ── 7. Sleep ─────────────────────────────────────────────────────────────
  body.appendChild(grid4(
    statCard(t('sleep-total'),fmtDur(totalSleepMin),'var(--ac)',null),
    statCard(t('avg-sleep'),fmtDur(avgSleepMin),avgSleepMin>=420?'var(--cg)':'var(--ng)',isEs?'por noche':'per night'),
    statCard(t('early-nights'),earlyNights+'d','var(--cg)',null),
    statCard(t('late-nights-lbl'),lateNights+'d','var(--ng)',null)
  ));

  // ── 7b. More of the same day, from other angles ──────────────────────────
  // The current non-red run moved up to the Momentum row and is not recounted.
  let curMornNow=0;
  for(let k=sortedH.length-1;k>=0;k--){const d=sortedH[k];if(d._gap||!didMorning(d))break;curMornNow++;}
  // Counted the same way the total counts them: filled in, whether or not the
  // app happened to be open on the day they were missed.
  const gapDays=[...histMap().values()].filter(d=>d._gap&&d.date!==todayKey()).length;
  const tasksDone=realDays.reduce((s,d)=>s+(d.completedTasks||0),0);
  // How much of what you set yourself you actually close, averaged over days
  // that had anything to close.
  const withTarget=realDays.filter(d=>(d.totalTasks||0)>0);
  const hitPct=withTarget.length
    ? Math.round(withTarget.reduce((s,d)=>s+Math.min(1,(d.completedTasks||0)/d.totalTasks),0)/withTarget.length*100):0;
  body.appendChild(grid4(
    statCard(isEs?'Racha matutina actual':'Current morning streak',curMornNow+'d',
      curMornNow?'var(--cg)':'var(--ng)',null,'xl',
      curMornNow?spanOf(curMornNow,sortedH[sortedH.length-1].date):''),
    statCard(isEs?'Días sin registrar':'Days not logged',String(gapDays),gapDays?'var(--ng)':'var(--cg)',
      gapDays?(isEs?'−1,000 c/u':'−1,000 each'):null),
    statCard(isEs?'Tareas completadas':'Tasks completed',String(tasksDone),'var(--ac)',null),
    /* Said as what it is. "Completion / of your daily target" was read as
       covering the flags too, and it never has: it is the share of the day's
       TASK target you closed. The flags bump the day's colour up a whole
       level on their own, so a run of green days can sit on a task figure
       well under half without anything being wrong. Days with flags, up in
       the row above, is the number that question was actually asking for. */
    statCard(isEs?'Cumplimiento de tareas':'Task completion',hitPct+'%',
      hitPct>=85?'var(--cg)':(hitPct>=50?'var(--ac)':'var(--ng)'),
      isEs?'de tu meta de tareas':'of your task target','xl',
      isEs?'Cuánto de tu meta de TAREAS cierras, en promedio. No mira tus banderas — esas suben el color del día por su cuenta.'
          :'How much of your TASK target you close, on average. It does not look at your flags — those lift the day’s colour on their own.')
  ));

  /* Which weekday actually scores, averaged across every one of them. The
     productive-day tiles above measure work; this one measures the whole day. */
  const dowPts=[];for(let k=0;k<7;k++)dowPts.push([]);
  realDays.forEach(d=>dowPts[new Date(d.date+'T12:00:00').getDay()].push(CALC.liveScore(d,STATE.history)));
  let bestDow=-1,bestDowAvg=-Infinity,worstDow=-1,worstDowAvg=Infinity;
  dowPts.forEach((arr,k)=>{
    if(!arr.length)return;
    const a=arr.reduce((x,y)=>x+y,0)/arr.length;
    if(a>bestDowAvg){bestDowAvg=a;bestDow=k;}
    if(a<worstDowAvg){worstDowAvg=a;worstDow=k;}
  });
  const totalNaps=STATE.history.reduce((s,d)=>s+(d.napDuration||0),0);
  const goalsDone=goals().filter(g=>g.doneOn).length;
  body.appendChild(grid4(
    statCard(isEs?'Mejor día por puntos':'Best weekday by points',bestDow>=0?dowNames[bestDow]:'—','var(--cg)',
      bestDow>=0?'⌀ '+Math.round(bestDowAvg):null,'xl',
      bestDow>=0?(isEs?'Puntos del día, promediados sobre todos tus '+dowFull[bestDow]:'Points for the day, averaged across every '+dowFull[bestDow]):''),
    statCard(isEs?'Peor día por puntos':'Worst weekday by points',worstDow>=0?dowNames[worstDow]:'—','var(--ng)',
      worstDow>=0?'⌀ '+Math.round(worstDowAvg):null,'xl',
      worstDow>=0?(isEs?'Puntos del día, promediados sobre todos tus '+dowFull[worstDow]:'Points for the day, averaged across every '+dowFull[worstDow]):''),
    statCard(isEs?'Siestas':'Naps',fmtDur(totalNaps),'var(--ac)',null),
    statCard(isEs?'Metas logradas':'Goals achieved',String(goalsDone),'var(--ac)',
      goalsTotal()?'+'+goalsTotal().toLocaleString():null)
  ));

  // Last of the tiles, so its ragged end is the end of the tiles.
  body.appendChild(rwBlock);

  // ── 8. Day color counts ───────────────────────────────────────────────────
  const dr=dv('row gap8 mb10');
  [['purple','🟣'],['green','🟢'],['yellow','🟡'],['red','🔴']].forEach(([s,e])=>dr.appendChild(sp(`badge s-${s}`,`${e} ${counts[s]}d`)));
  body.appendChild(dr);

  // ── 9. Insight ────────────────────────────────────────────────────────────
  const ib=dv('card2 s-ac fi');ib.appendChild(sp('sm dim',insight));body.appendChild(ib);

  /* ── 10. What to do about it ───────────────────────────────────────────────
     Statistics say what happened; these say what to do next, and they are read
     off the same numbers rather than made up. Each one is worth points you are
     currently leaving on the table, and the ones worth most are said first —
     an unlogged day costs a thousand, so it outranks every habit below it.
     Only what is actually true of you appears, and only three at a time: a
     list of everything you could improve is a list nobody acts on. */
  const tips=[];
  const add=(w,icon,es,en)=>tips.push({w,icon,text:isEs?es:en});
  if(totalTracked>=3){
    if(gapDays>0)add(100,'📅',
      `Tienes ${gapDays} día(s) sin registrar, y cada uno cuenta como −1,000 y día rojo. Puedes arreglarlos desde el calendario con Editar Historial.`,
      `You have ${gapDays} unlogged day(s), and each counts as −1,000 and a red day. Fix them from the calendar with Edit History.`);
    if(bestMornStrk===0||curMornNow===0)add(85,'🌅',
      'La rutina matutina es el punto más barato del día: +25 × tu racha, todos los días, por algo que probablemente ya haces. Márcala.',
      'The morning routine is the cheapest point of the day: +25 × your streak, every day, for something you probably already do. Tick it.');
    if(lateNights>totalTracked*0.25)add(80,'🌙',
      `Te desvelaste ${lateNights} de ${totalTracked} días. El trasnoche cuesta × tu racha de desvelo, así que dos seguidos duelen más que dos separados — y un día morado te lo cobra a precio base.`,
      `You stayed up late on ${lateNights} of ${totalTracked} days. It costs × your late-night streak, so two in a row hurt more than two apart — and a purple day charges it at base.`);
    if(avgSleepMin>0&&avgSleepMin<420)add(75,'😴',
      `Duermes ${fmtDur(avgSleepMin)} en promedio. Cada minuto vale +1, así que media hora más son ~30 pts diarios — casi 1,000 al mes, sin hacer nada extra. Y la racha de dormir temprano es la forma más rentable de sacar puntos que hay.`,
      `You sleep ${fmtDur(avgSleepMin)} on average. Every minute is +1, so half an hour more is ~30 pts a day — nearly 1,000 a month for nothing extra. And the early-bed streak is the most profitable run of points there is.`);
    if(procFreePct<70)add(70,rwProc?.icon||'🌐',
      `Caíste en ${nmProc} en ${100-procFreePct}% de tus días. Los primeros 30 minutos no llevan multiplicador: si vas a caer, que sea corto.`,
      `You logged ${nmProc} on ${100-procFreePct}% of your days. The first 30 minutes carry no multiplier: if you are going to slip, keep it short.`);
    if(workPct<50)add(65,'💼',
      `Solo registraste trabajo en ${workPct}% de tus días. La racha de trabajo multiplica cada minuto, y basta con no romperla.`,
      `You logged work on only ${workPct}% of your days. The work streak multiplies every minute, and it only needs to stay alive.`);
    if(dfPct<70)add(60,rwDrugs?.icon||'💊',
      `${100-dfPct}% de tus días llevan ${nmDrugs}, y cuestan × los días seguidos que llevas. Cortar uno solo rompe el multiplicador.`,
      `${100-dfPct}% of your days carry ${nmDrugs}, and they cost × how many days in a row you have had them. Breaking one day breaks the multiplier.`);
    if(pomPerDay<2)add(55,'🍅',
      `Vas en ${pomPerDay} pomodoros por día. Cada uno son +25 pts y 25 minutos: tres al día son +75, todos los días.`,
      `You average ${pomPerDay} pomodoros a day. Each is +25 pts for 25 minutes: three a day is +75, every day.`);
    if(counts.green>0&&purplePct<20)add(50,'🟣',
      `Llegas a verde seguido pero solo ${purplePct}% de tus días son morados. Una tarea más cierra el día completo — y un día morado te cobra CUALQUIER recompensa a precio base, hasta la más pesada.`,
      `You reach green often but only ${purplePct}% of your days are purple. One more task closes the day — and a purple day charges ANY reward at base price, even the heaviest.`);
    if(goalsOf('week').filter(g=>!g.doneOn).length)add(45,'📅',
      `Tienes metas semanales abiertas. Se pagan por los días que queden: cerrarlas hoy vale más que cerrarlas mañana, siempre.`,
      `You have weekly goals open. They pay by the days still left: closing one today is worth more than closing it tomorrow, always.`);
    if(momentum<-20)add(40,'📉',
      'Tu última semana va por debajo de tu promedio. No hace falta un día perfecto para darle la vuelta: basta con no cerrar ninguno en rojo. Cumplir tus metas del día te garantiza un día ganado.',
      'Your last week is running below your average. It does not take a perfect day to turn it around: it takes not closing one in red. Annihilating the goals of the day guarantees you the day.');
    if(hitPct<50&&withTarget.length>=3)add(35,'🎯',
      `Cierras ${hitPct}% de tu meta diaria en promedio. Una meta pequeña completada vale más que cien grandes sin completar: el color del día sale del porcentaje, no del número.`,
      `You close ${hitPct}% of your daily target on average. One small target finished is worth more than a hundred big ones left open: the day's colour comes from the percentage, not the count.`);
  }
  tips.sort((a,b)=>b.w-a.w);
  const tbox=dv('card2 mt10');
  const th=dv('rowb mb8');
  th.appendChild(sp('xs dimmer up ls',t('tips-title')));
  tbox.appendChild(th);
  if(!tips.length){
    tbox.appendChild(dv('xs dimmer',t('tips-none')));
  }else{
    const tl=dv('s6');
    tips.slice(0,3).forEach(x=>{
      const row=dv('row gap8');row.style.alignItems='flex-start';
      row.appendChild(sp('md',x.icon));
      row.appendChild(dv('sm dim f1',escapeHtml(x.text)));
      tl.appendChild(row);
    });
    tbox.appendChild(tl);
  }
  body.appendChild(tbox);

  wrap.appendChild(body);return wrap;
}

function renderRulesModal(){
  const close=()=>{STATE.showRules=false;render();};
  const ov=dv('fi');
  ov.classList.add('ovl');
  ov.onclick=e=>{if(e.target===ov)close();};
  const panel=renderRules(close);
  panel.style.cssText='max-width:900px;width:100%;margin:auto';
  ov.appendChild(panel);
  return ov;
}

/* ═══ YOUR REWARDS — the list itself ═══
   Renaming one is free. Changing what it weighs is not: every stored day is
   re-scored from the current weights each time it is read, so a light habit
   made grave makes every past day of it cost four times as much. That is
   said out loud rather than discovered. The three originals cannot have
   their weight changed at all — their arithmetic is what months of history
   was written against. */
function renderRewardsModal(){
  const close=()=>{STATE.showRewards=false;render();};
  const ov=dv('fi');
  ov.classList.add('ovl');
  ov.onclick=e=>{if(e.target===ov)close();};
  const panel=dv('card');
  panel.style.cssText='max-width:560px;width:100%;margin:auto';
  ov.appendChild(panel);

  const draw=()=>{
    panel.innerHTML='';
    const hd=dv('rowb mb4');
    const lft=dv('row gap6');
    lft.appendChild(sp('ctit',t('rw-title')));
    lft.appendChild(sp('sm mo dim',`${rewards().length}/${REWARD_MAX}`));
    hd.appendChild(lft);hd.appendChild(bt('btn-icon','✕',close));
    panel.appendChild(hd);
    panel.appendChild(dv('xs dimmer mb12',t('rw-help')));

    const box=dv('s6');
    rewards().forEach(r=>{
      const row=dv('');
      row.style.cssText='background:var(--sur2);border:1px solid var(--b1);border-radius:10px;padding:9px 11px';
      const top=dv('row gap6');top.style.flexWrap='wrap';
      const ico=ip('text','',r.icon||'','🙂');
      ico.style.cssText='flex:0 0 46px;text-align:center';
      ico.onchange=()=>{r.icon=ico.value.slice(0,3);savePlanner();draw();};
      const nm=ip('text','',rewardName(r),'');
      nm.style.cssText='flex:1;min-width:120px';
      /* Typing the original name back in undoes the rename outright rather than
         setting the same word as a new one, so everything that only speaks for
         the original — its flavoured stats, its medal — comes back with it. */
      nm.onchange=()=>{
        const v=nm.value.trim();if(!v)return draw();
        const d=rewardDefault(r);
        if(d&&[d.name,d.nameEn].some(n=>n&&n.toLowerCase()===v.toLowerCase())){
          r.name=d.name;delete r.renamed;
        }else{r.name=v;r.renamed=true;}
        savePlanner();draw();
      };
      top.appendChild(ico);top.appendChild(nm);
      /* The three originals show their weight and cannot change it — a control
         that refuses to move is worse than no control, so they get a label. */
      if(r.builtin){
        const lbl=sp('xs dimmer',t(REWARD_TIERS[r.tier].name));
        lbl.style.cssText='flex:0 0 90px;text-align:center;cursor:help';
        lbl.title=t('rw-locked');
        top.appendChild(lbl);
      }else{
        const tierSel=sk('',Object.keys(REWARD_TIERS).map(k=>[k,t(REWARD_TIERS[k].name)]),r.tier);
        tierSel.style.cssText='flex:0 0 120px';
        // Only worth asking about once there is something to re-score. On a
        // reward you have never logged, changing the weight costs nothing.
        tierSel.onchange=()=>{
          if(daysWithReward(r.id)&&!confirm(t('rw-tier-warn')))return draw();
          r.tier=tierSel.value;savePlanner();draw();
        };
        top.appendChild(tierSel);
        const del=bt('btn-icon','🗑',()=>{
          const days=daysWithReward(r.id);
          if(!confirm(t('rw-del-warn').replace('{n}',rewardName(r))
            .replace('{d}',days)))return;
          purgeReward(r.id);
          if(STATE.penType===r.id)STATE.penType=(rewards()[0]||{}).id||'drugs';
          draw();
        });
        del.title=t('rw-del');
        top.appendChild(del);
      }
      row.appendChild(top);
      // What it costs. How a run ends is the same for every reward, so it is
      // said once, under the whole list, instead of five times over.
      row.appendChild(dv('xs dimmer mt4',
        r.byMinutes?t('rw-per-min').replace('{r}',PEN_RATE):`−${rewardCost(r).toLocaleString()}`));
      box.appendChild(row);
    });
    panel.appendChild(box);
    /* The weights differ in what they cost AND in how good a day has to be to
       get one at base price — which is the whole reason there are weights.
       This says both, per weight, rather than repeating one sentence. */
    const legend=dv('xs dimmer mt8');
    legend.innerHTML=t('rw-clears-flat')+'<br>'+Object.keys(REWARD_TIERS).map(k=>
      `<span class="w6">${t(REWARD_TIERS[k].name)}</span> ${tierForgives(k).map(s=>({yellow:'🟡',green:'🟢',purple:'🟣'})[s]).join('')}`).join(' · ');
    panel.appendChild(legend);

    if(rewards().length<REWARD_MAX){
      const add=dv('row gap6 mt10');add.style.flexWrap='wrap';
      const ni=ip('text','','',t('rw-new'));ni.style.cssText='flex:1;min-width:140px';
      const ti_=sk('',Object.keys(REWARD_TIERS).map(k=>[k,t(REWARD_TIERS[k].name)]),'light');
      ti_.style.cssText='flex:0 0 130px';
      const go=()=>{
        const v=ni.value.trim();if(!v)return;
        rewards().push({id:'rw_'+uid(),icon:'⚠️',name:v,tier:ti_.value,renamed:true});
        savePlanner();draw();
      };
      ni.onkeydown=e=>{if(e.key==='Enter')go();};
      add.appendChild(ni);add.appendChild(ti_);add.appendChild(bt('btn-ac btn-sm',t('rw-add'),go));
      panel.appendChild(add);
    }else panel.appendChild(dv('xs dimmer ctr mt10',t('rw-full')));
    panel.appendChild(dv('xs dimmer mt10',t('rw-note')));
  };
  draw();
  return ov;
}

/* ═══ RESET — everything, and asked for twice ═══
   It used to clear the scoring and leave the task list, the goals and the bin
   standing, while calling itself a permanent erasure of all your data. Now it
   does what it says: everything you have entered goes. What stays is what is
   not data — the language, the theme, the zone, and your session, so you
   are not thrown out of the app you just emptied.

   Two presses, with the backup offered between them, because the cloud copy
   is what makes this survivable and it is worth taking one on the way past. */
function wipeEverything(){
  const tk=todayKey();
  STATE.history=[];
  STATE.today={completed:0,target:0,morningCompleted:false,flagCompleted:false,pomodoros:0,penalties:[],
    sleep:{sleepDuration:0,napDuration:0,sleptEarly:false,earlyBedStreak:0},work:{workDuration:0},_date:tk,_manual:{}};
  STATE.diary={};
  STATE.streakOverrides={};
  STATE.planner={reminders:[],goals:[],log:[],bin:[],collapsed:{},_ts:CLOCK.now()};
  STATE.pomo={focus:25,brk:5,longBrk:15,cycle:4,running:false,phase:'focus',startedAt:0,elapsed:0,doneInCycle:0,minutesToday:0,day:''};
  STATE.calSel=null;STATE.calYM=null;STATE.scoreYM=null;STATE.histDay=null;STATE.diaryFold={};
  STATE.selected=[];STATE.selecting=false;STATE.bulkUndo=null;
  [K.TODAY,K.HIST,K.DIARY,K.STREAK_OVR,K.PLANNER,'st_pomo','st_milestones','st_last_backup']
    .forEach(k=>localStorage.removeItem(k));
  commit();savePlanner();
}
function renderResetModal(){
  const close=()=>{STATE.showReset=0;render();};
  const ov=dv('fi');
  /* The only overlay that had written its own out by hand rather than sharing
     the class, because its backdrop is a shade darker — so it was the only one
     left as a centred desktop dialog on a phone while every other opened as a
     sheet. It shares the class now and keeps its darker ground on top. */
  ov.classList.add('ovl');
  ov.style.background='rgba(0,0,0,.72)';
  ov.onclick=e=>{if(e.target===ov)close();};
  const panel=dv('card');
  panel.style.cssText='max-width:460px;width:100%;margin:auto;border-color:var(--ngb);background:var(--sur)';
  const hd=dv('rowb mb10');
  hd.appendChild(sp('ctit ng',t('danger-zone')));
  hd.appendChild(bt('btn-icon','✕',close));
  panel.appendChild(hd);

  if(STATE.showReset===1){
    panel.appendChild(dv('sm dim mb10',t('reset-what')));
    panel.appendChild(dv('xs dimmer mb12',t('reset-keeps')));
    const row=dv('row gap8');row.style.flexWrap='wrap';
    const bk=bt('btn-ac btn-sm',t('reset-backup'),async()=>{
      bk.disabled=true;bk.textContent='…';
      const ok=await SB.saveBackup(STATE.history,STATE.today,STATE.diary,STATE.streakOverrides);
      bk.disabled=false;bk.textContent=ok?t('reset-backup-ok'):t('reset-backup-fail');
      if(ok)localStorage.setItem('st_last_backup',todayKey());
    });
    row.appendChild(bk);
    row.appendChild(bt('btn-ng btn-sm',t('reset-continue'),()=>{STATE.showReset=2;render();}));
    row.appendChild(bt('btn-ghost btn-sm',t('cancel'),close));
    panel.appendChild(row);
  }else{
    // Second ask. The wording changes so it cannot be pressed through on muscle
    // memory, and the safe way out is the one that looks like a button.
    panel.appendChild(dv('md ng w6 mb10',t('reset-sure')));
    panel.appendChild(dv('xs dimmer mb12',t('reset-sure-sub')));
    const row=dv('row gap8');row.style.flexWrap='wrap';
    row.appendChild(bt('btn-ac btn-sm f1',t('cancel'),close));
    row.appendChild(bt('btn-ng btn-sm',t('yes-delete'),()=>{
      wipeEverything();STATE.showReset=0;render();
    }));
    panel.appendChild(row);
  }
  ov.appendChild(panel);
  return ov;
}

/* ═══ RESTORE A DAY — pick it off the list ═══ */
function renderRestoreModal(){
  const close=()=>{STATE.restoreList=null;render();};
  const ov=dv('fi');
  ov.classList.add('ovl');
  ov.onclick=e=>{if(e.target===ov)close();};
  const panel=dv('card');
  panel.style.cssText='max-width:420px;width:100%;margin:auto';
  const hd=dv('rowb mb4');
  hd.appendChild(sp('ctit',t('restore-from')));
  hd.appendChild(bt('btn-icon','✕',close));
  panel.appendChild(hd);
  panel.appendChild(dv('xs dimmer mb10',t('restore-help')));
  const box=dv('s6');box.style.cssText='max-height:320px;overflow:auto';
  (STATE.restoreList||[]).forEach(b=>{
    // One date, written out. It used to print the same day twice, in two
    // different formats, side by side.
    const label=capFirst(new Date(b.backup_date+'T12:00:00')
      .toLocaleDateString(STATE.lang==='es'?'es-MX':'en-US',{weekday:'short',day:'numeric',month:'long',year:'numeric'}));
    const row=bt('btn-ghost btn-sm',label,async()=>{
      if(!confirm(t('restore-warn').replace('{d}',label)))return;
      const bk=await SB.restoreBackup(b.backup_date);
      if(!bk){alert(t('backup-none'));return;}
      if(bk.history) STATE.history=bk.history;
      if(bk.today) STATE.today=bk.today;
      if(bk.diary) STATE.diary=bk.diary;
      if(bk.streak_overrides) STATE.streakOverrides=bk.streak_overrides;
      // The task list rides in backups now, so a restore brings it back too.
      if(bk.planner&&typeof bk.planner==='object'){
        const{pomo:_p,...rest}=bk.planner;
        STATE.planner={reminders:[],...rest};
        S.set(K.PLANNER,STATE.planner);
      }
      S.set(K.HIST,STATE.history);S.set(K.TODAY,STATE.today);
      S.set(K.DIARY,STATE.diary);S.set(K.STREAK_OVR,STATE.streakOverrides);
      SB.push(STATE.history,STATE.today,STATE.diary,STATE.streakOverrides,{force:true}).catch(()=>{});
      STATE.restoreList=null;
      alert(t('backup-restored'));refresh();
    });
    row.style.cssText+=';width:100%;text-align:left';
    box.appendChild(row);
  });
  panel.appendChild(box);
  ov.appendChild(panel);
  return ov;
}

/* ═══ ONE TASK AND ITS OWN — opened from a parent's title ═══
   The same rows the list draws, so everything works here exactly as it does
   there: ticking, editing, adding another subtask. Only the surroundings are
   gone. Subtasks already finished today are shown too — a family reads wrong
   with half of it missing. */
function renderTaskTreeModal(id){
  if(!reminders().some(x=>x.id===id)){STATE.taskTree=null;return dv('');}
  // Closing redraws the page, which has been standing still behind the
  // overlay while its own rows were being ticked and edited.
  const close=()=>{STATE.taskTree=null;STATE.editingRem=null;render();};
  const ov=dv('fi');
  ov.classList.add('ovl');
  ov.onclick=e=>{if(e.target===ov)close();};
  const panel=dv('card');
  panel.style.cssText='max-width:640px;width:100%;margin:auto';
  ov.appendChild(panel);
  const draw=()=>{
    panel.innerHTML='';
    const r=reminders().find(x=>x.id===id);
    if(!r){close();return;}
    const tk=todayKey();
    const kids=subtasksOf(r.id).sort((a,b)=>a.due.localeCompare(b.due));
    const doneN=kids.filter(k=>k.done||k.completedOn===tk).length;
    const hd=dv('rowb mb12');
    const lft=dv('row gap6');
    // A task with no subtasks is not a family; it is just this task, in full.
    lft.appendChild(sp('ctit',kids.length?t('rem-open-tree'):t('rem-detail')));
    if(kids.length)lft.appendChild(sp('sm mo dim',`${doneN}/${kids.length}`));
    hd.appendChild(lft);
    const rgt=dv('row gap6');
    /* Picking several works in here too. A family is exactly where you want it
       — thirteen steps that all need pushing a week, chosen and moved without
       leaving the window they live in. */
    if(kids.length){
      const selBtn=bt(STATE.selecting?'btn-ac btn-sm':'btn-ghost btn-sm','☑',()=>{
        STATE.selecting=!STATE.selecting;STATE.selected=[];draw();
      });
      selBtn.title=t('sel-mode');rgt.appendChild(selBtn);
    }
    rgt.appendChild(bt('btn-icon','✕',close));
    hd.appendChild(rgt);
    panel.appendChild(hd);
    if(STATE.selecting&&kids.length)panel.appendChild(renderBulkBar([r.id,...kids.map(k=>k.id)],draw));
    const box=dv('s6');
    box.appendChild(renderReminderRow(r,tk,{prevTop:null,kids:kids.length,redraw:draw,keepsDone:true}));
    kids.forEach(c=>{
      const w=dv('rem-sub');
      w.appendChild(renderReminderRow(c,tk,{prevTop:r.id,redraw:draw,keepsDone:true}));
      box.appendChild(w);
    });
    panel.appendChild(box);
  };
  draw();
  return ov;
}

/* ═══ WHERE THE DAY BEGINS — opened from the clock ═══
   Every zone there is, searched by name, because the app is not only for one
   country. It stores the zone rather than "wherever I happen to be", so the
   other device follows to the same one instead of keeping its own. */
function tzList(){
  let all=[];
  try{all=Intl.supportedValuesOf('timeZone')||[];}catch(e){}
  if(!all.length)all=['America/Cancun','America/Mexico_City','America/Mazatlan','America/Tijuana',
    'America/New_York','America/Los_Angeles','America/Bogota','America/Buenos_Aires',
    'Europe/Madrid','Europe/London','Europe/Berlin','Asia/Tokyo','Australia/Sydney','UTC'];
  return all;
}
function renderTZModal(){
  const close=()=>{STATE.showTZ=false;render();};
  const ov=dv('fi');
  ov.classList.add('ovl');
  ov.onclick=e=>{if(e.target===ov)close();};
  const panel=dv('card');
  panel.style.cssText='max-width:420px;width:100%;margin:auto';
  const hd=dv('rowb mb4');
  hd.appendChild(sp('ctit',t('tz-title')));
  hd.appendChild(bt('btn-icon','✕',close));
  panel.appendChild(hd);
  panel.appendChild(dv('xs dimmer mb10',t('tz-help')));

  const cur=appTZ(),dev=deviceTZ();
  const q=ip('text','',STATE.tzQuery||'',t('tz-search'));
  q.style.width='100%';
  panel.appendChild(q);

  const box=dv('s6 mt8');
  box.style.cssText='max-height:280px;overflow:auto';
  const draw=()=>{
    box.innerHTML='';
    const needle=(STATE.tzQuery||'').trim().toLowerCase();
    // What you are on and where you are stay at the top, always reachable.
    const pinned=[...new Set([cur,dev])];
    const rest=tzList().filter(z=>!pinned.includes(z)&&
      (!needle||z.toLowerCase().replace(/_/g,' ').includes(needle)));
    const rows=[...pinned,...rest.slice(0,60)];
    rows.forEach(tz=>{
      const on=tz===cur;
      const b=bt(on?'btn-ac btn-sm':'btn-ghost btn-sm',
        tzLabel(tz)+(tz===dev?' · '+t('tz-this-device'):''),
        ()=>{STATE.showTZ=false;STATE.tzQuery='';setAppTZ(tz);});
      b.style.cssText+=';width:100%;text-align:left';
      box.appendChild(b);
    });
    if(!rows.length)box.appendChild(dv('xs dimmer ctr mt8','—'));
  };
  q.oninput=()=>{STATE.tzQuery=q.value;draw();};
  draw();
  panel.appendChild(box);
  panel.appendChild(dv('xs dimmer mt10',t('tz-warn')));
  ov.appendChild(panel);
  return ov;
}
