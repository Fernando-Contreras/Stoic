<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Stoic</title>
<!-- Browser-tab icon: inline SVG emoji, so it stays single-file and works offline -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏛️%3C/text%3E%3C/svg%3E">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
/* ── #9: zoom — max-width tighter + bigger base font ── */
:root{
  --bg:#09090f;--sur:#111118;--sur2:#17171f;--sur3:#1d1d26;
  --b1:#22222e;--b2:#2c2c3a;--b3:#3a3a4a;
  --t1:#f2f2f8;--t2:#b0b0cc;--t3:#707090;
  /* #10: warmer accent — soft amber-gold instead of cold teal */
  --ac:#d4a017;--ac2:#b8880e;--acd:rgba(212,160,23,.12);--acb:rgba(212,160,23,.28);
  /* negative = red */
  --ng:#f97316;--ngd:rgba(249,115,22,.13);--ngb:rgba(249,115,22,.30);
  /* status */
  --cr:#ff5566;--cy:#f5c842;--cg:#34d399;--cp:#a78bfa;
  /* Rest blue. Sits opposite the amber accent so focus and break read apart at
     a glance, and carries no meaning of its own the way the day colours do. */
  --cb:#5b9df9;
  --rd:rgba(255,85,102,.13);--yd:rgba(245,200,66,.13);--gd:rgba(52,211,153,.13);--pd:rgba(167,139,250,.13);
  --rb:rgba(255,85,102,.30);--yb:rgba(245,200,66,.30);--gb:rgba(52,211,153,.30);--pb:rgba(167,139,250,.30);
  --ff:'Outfit',sans-serif;--mo:'JetBrains Mono',monospace;
}
/* #9: base font 17px, max-width 1100px = natural 125–150% feel */
html,body{background:var(--bg);color:var(--t1);font-family:var(--ff);font-size:20px;min-height:100vh;-webkit-font-smoothing:antialiased;line-height:1.55}
#root{max-width:1280px;margin:0 auto;padding:18px 24px 60px}

/* ── TYPOGRAPHY ── */
.mo{font-family:var(--mo)}
.xs{font-size:14px}.sm{font-size:16px}.md{font-size:18px}.lg{font-size:21px}.xl{font-size:26px}.xxl{font-size:32px}.xxxl{font-size:46px}
.w3{font-weight:300}.w4{font-weight:400}.w5{font-weight:500}.w6{font-weight:600}.w7{font-weight:700}.w8{font-weight:800}
.dim{color:var(--t2)}.dimmer{color:var(--t3)}
.ac{color:var(--ac)}.ng{color:var(--ng)}
.cr{color:var(--cr)}.cy{color:var(--cy)}.cg{color:var(--cg)}.cp{color:var(--cp)}.cb{color:var(--cb)}
.up{text-transform:uppercase}.ls{letter-spacing:.07em}
.ctr{text-align:center}

/* ── LAYOUT ── */
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.rem-sub{margin-left:22px;border-left:2px solid var(--b2);padding-left:8px}
.tagchip{display:inline-flex;align-items:center;padding:1px 7px;border-radius:99px;font-size:10px;font-weight:700;letter-spacing:.04em;background:var(--pd);color:var(--cp);border:1px solid var(--pb);text-transform:uppercase}
.row{display:flex;align-items:center}
.rowb{display:flex;align-items:center;justify-content:space-between}
.col{display:flex;flex-direction:column}
.gap4{gap:4px}.gap6{gap:6px}.gap8{gap:8px}.gap10{gap:10px}.gap12{gap:12px}.gap16{gap:16px}
.f1{flex:1}.w100{width:100%}
.mt4{margin-top:4px}.mt6{margin-top:6px}.mt8{margin-top:8px}.mt10{margin-top:10px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}
.mb4{margin-bottom:4px}.mb6{margin-bottom:6px}.mb8{margin-bottom:8px}.mb10{margin-bottom:10px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}
.s4{display:flex;flex-direction:column;gap:4px}
.s6{display:flex;flex-direction:column;gap:6px}
.s8{display:flex;flex-direction:column;gap:8px}
.s10{display:flex;flex-direction:column;gap:10px}
.s12{display:flex;flex-direction:column;gap:12px}

/* ── CARD ── */
.card{background:var(--sur);border:1px solid var(--b1);border-radius:16px;padding:22px}
.card2{background:var(--sur2);border:1px solid var(--b1);border-radius:12px;padding:14px}
.card3{background:var(--sur3);border:1px solid var(--b1);border-radius:8px;padding:10px}
.ctit{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin-bottom:14px}
hr.dv{border:none;border-top:1px solid var(--b1);margin:12px 0}

/* ── STATUS ── */
.s-red{background:var(--rd);border-color:var(--rb);color:var(--cr)}
.s-yellow{background:var(--yd);border-color:var(--yb);color:var(--cy)}
.s-green{background:var(--gd);border-color:var(--gb);color:var(--cg)}
.s-purple{background:var(--pd);border-color:var(--pb);color:var(--cp)}
.s-ac{background:var(--acd);border-color:var(--acb);color:var(--ac)}

/* ── BADGE ── */
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border:1px solid}

/* ── INPUTS ── */
input[type=text],input[type=number],input[type=email],input[type=password],select{
  background:var(--sur2);border:1px solid var(--b2);border-radius:8px;
  color:var(--t1);font-family:var(--ff);font-size:16px;padding:10px 14px;
  outline:none;transition:border-color .15s,box-shadow .15s;width:100%
}
input:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--acd)}
input[type=checkbox]{accent-color:var(--ac);width:16px;height:16px;cursor:pointer;flex-shrink:0}
input[type=number]::-webkit-inner-spin-button{opacity:.3}

/* ── BUTTONS ── */
button{cursor:pointer;font-family:var(--ff);font-size:15px;font-weight:600;border-radius:9px;border:none;padding:10px 18px;transition:all .15s;line-height:1.3}
.btn-ac{background:var(--ac);color:#ffffff;font-weight:800}
.btn-ac:hover{background:var(--ac2);transform:translateY(-1px)}
.btn-ghost{background:var(--sur2);color:var(--t2);border:1px solid var(--b2)}
.btn-ghost:hover{color:var(--t1);border-color:var(--b3)}
.btn-ng{background:var(--ngd);color:var(--ng);border:1px solid var(--ngb)}
.btn-ng:hover{background:rgba(255,85,102,.22)}
.btn-icon{background:none;padding:4px 7px;color:var(--t3);border:none;border-radius:6px}
.btn-icon:hover{color:var(--t1);background:var(--sur3)}
.btn-sm{padding:6px 12px;font-size:13px}
.btn-xs{padding:3px 8px;font-size:12px;border-radius:5px}

/* ── TOGGLE ── */
.tog{display:flex;align-items:center;gap:12px;cursor:pointer;padding:13px 16px;border-radius:12px;border:1px solid var(--b1);background:var(--sur2);transition:all .15s;user-select:none}
.tog:hover{border-color:var(--b2)}
.tog.on{border-color:var(--ac);background:var(--acd)}
.tog.on .tt{color:var(--ac);font-weight:600}
.tt{font-size:16px;color:var(--t2)}
.ts{font-size:12px;color:var(--t3);margin-top:2px}

/* ── PROGRESS ── */
.prog{height:6px;border-radius:3px;background:var(--sur2);overflow:hidden}
.prog-f{height:100%;border-radius:3px;transition:width .3s}

/* ── STREAKS ── */
.sk-g{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.skc{border-radius:12px;padding:16px 12px;text-align:center;border:1px solid}
.skc.pos{background:var(--acd);border-color:var(--acb)}
.skc.neg{background:var(--ngd);border-color:var(--ngb)}
.skn{font-size:34px;font-weight:700;line-height:1;font-family:var(--mo)}
.skl{font-size:10px;color:var(--t3);margin-top:4px;text-transform:uppercase;letter-spacing:.06em}

/* ── CALENDAR ── */
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-c{aspect-ratio:.9;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;border:1px solid transparent;transition:all .12s;position:relative;overflow:hidden}
.cal-c:hover{filter:brightness(1.2)}
.cal-c.today{border-color:var(--ac)!important;box-shadow:0 0 0 1px var(--ac)}
.cal-c.sel{border-color:#fff!important}
.cal-num{font-size:14px;font-weight:800;position:relative;z-index:1}
.cal-pts{font-size:10px;font-weight:600;opacity:.95;margin-top:1px;font-family:var(--mo);position:relative;z-index:1}
/* #8: flag glow overlay */
.cal-flag-ring{position:absolute;inset:0;border-radius:6px;border:2px solid gold;box-shadow:inset 0 0 8px rgba(255,200,0,.3),0 0 8px rgba(255,200,0,.4);pointer-events:none;z-index:2}
.cal-flag-ico{position:absolute;top:1px;right:2px;font-size:14px;z-index:3;line-height:1}
.cal-medal{position:absolute;top:1px;left:2px;font-size:12px;z-index:3;line-height:1;filter:drop-shadow(0 0 4px rgba(255,255,255,.25))}
.cal-hd{text-align:center;font-size:9px;color:var(--t3);padding:3px 0;text-transform:uppercase;letter-spacing:.05em}

/* ── GOAL TILES ──
   They grow under the pointer. A timed wave asked to be noticed whether or not
   you were looking anywhere near it; this answers the eye that is already
   there, and says plainly that the tile can be pressed. */
.goal-tile{transition:transform .16s cubic-bezier(.34,1.4,.64,1),border-color .16s}
.goal-tile:hover{transform:scale(1.09);border-color:var(--ac)!important}
.goal-tile:active{transform:scale(1.02)}
@media(prefers-reduced-motion:reduce){.goal-tile{transition:border-color .16s}.goal-tile:hover{transform:none}}

/* ── MILESTONE ──
   Over the whole page, gone in a few seconds, once ever. */
.ms-ov{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;cursor:pointer;
  background:radial-gradient(circle at 50% 44%,rgba(0,0,0,.5),rgba(0,0,0,.88));animation:msIn .45s ease both}
.ms-ov.out{animation:msOut .6s ease both}
@keyframes msIn{from{opacity:0}to{opacity:1}}
@keyframes msOut{to{opacity:0}}
.ms-card{position:relative;text-align:center;animation:msPop .75s cubic-bezier(.2,1.5,.4,1) both}
@keyframes msPop{0%{transform:scale(.62);opacity:0}62%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
.ms-ico{font-size:62px;line-height:1;filter:drop-shadow(0 0 26px var(--ms));animation:msFloat 2.8s ease-in-out infinite}
@keyframes msFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.ms-n{font-family:var(--mo);font-size:84px;font-weight:800;line-height:1;letter-spacing:-.04em;
  color:var(--ms);text-shadow:0 0 44px var(--ms);margin-top:4px}
.ms-w{font-size:20px;font-weight:700;letter-spacing:.34em;text-transform:uppercase;color:#fff;opacity:.96;margin-top:10px}
.ms-sub{font-size:12px;letter-spacing:.06em;color:rgba(255,255,255,.5);margin-top:14px}
.ms-spark{position:absolute;left:50%;top:42%;font-size:17px;pointer-events:none;animation:msSpark 1.6s ease-out forwards}
@keyframes msSpark{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}
  100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.15);opacity:0}}
@media(prefers-reduced-motion:reduce){.ms-card,.ms-ico,.ms-spark{animation:none}.ms-spark{display:none}}

/* ── PENALTY ITEM ── */
.pen-it{background:var(--sur2);border:1px solid var(--ngb);border-radius:8px;padding:9px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}

/* ── HISTORY ROW ── */
.hr-row{padding:9px 12px;border-radius:8px;border:1px solid var(--b1);background:var(--sur2);cursor:pointer;transition:border-color .15s}
.hr-row:hover{border-color:var(--b2)}
.hr-row.ed{border-color:var(--ac);background:var(--acd)}

/* ── SECTION TOGGLE ── */
.sec-t{width:100%;display:flex;align-items:center;justify-content:space-between;background:none;border:none;padding:0 0 14px;color:var(--t3);cursor:pointer;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.sec-t:hover{color:var(--t2)}

/* ── MISC ── */
.circ{transform:rotate(-90deg)}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--cg);display:inline-block;animation:pulse 2s ease infinite}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes fi{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.fi{animation:fi .18s ease}
/* Celebration for a day whose flags are all down */
@keyframes pop{0%{transform:scale(.7);opacity:0}55%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes shine{0%,100%{box-shadow:0 0 0 0 rgba(212,160,23,.35)}50%{box-shadow:0 0 22px 4px rgba(212,160,23,.35)}}
.celebrate{animation:pop .45s cubic-bezier(.2,1.3,.4,1),shine 2.4s ease-in-out .45s infinite}
@keyframes confetti{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(46px) rotate(220deg);opacity:0}}
.confetti span{position:absolute;top:0;font-size:13px;animation:confetti 1.5s ease-in forwards}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--b2);border-radius:3px}

@media(max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}.sk-g{grid-template-columns:repeat(2,1fr)}}
@media(max-width:580px){.g4{grid-template-columns:1fr}.g2{grid-template-columns:1fr}.xxxl{font-size:30px}.xxl{font-size:24px}}

/* ── LIGHT MODE ── */
body.light{--bg:#f4f4f0;--sur:#ffffff;--sur2:#efefeb;--sur3:#e5e5e0;--b1:#ddddd8;--b2:#cacac4;--b3:#b0b0aa;--t1:#1a1a1a;--t2:#555550;--t3:#888880}
body.light .cal-c{filter:none}
body.light .cal-c:hover{filter:brightness(.92)}
body.light .cal-c[data-status=none]{background:#e8e8e4!important}
body.light .cal-c:hover{filter:brightness(.95)}
/* ── DIARY ── */
.diary-area{width:100%;min-height:90px;resize:vertical;background:var(--sur2);border:1px solid var(--b2);border-radius:8px;color:var(--t1);font-family:var(--ff);font-size:15px;padding:10px 14px;outline:none;transition:border-color .15s;line-height:1.6}
.diary-area:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--acd)}
</style>

window._SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF1cHVrd3dwZWJuYXdidGRiaWJzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExNDQ0MDgsImV4cCI6MjA5NjcyMDQwOH0.IuQgej-fGMIDVuXOR0jjH_YgrTJJtRZKsKRPfZScCZY';

<script>
/* ═══ STOIC by JuanFer — single file, vanilla JS, no frameworks ═══
   Single source of truth: CALC object.
   Auto-midnight reset. Auto-save on every change.
   ════════════════════════════════════════════════════════════════ */

const S={
  get(k,fb=null){try{const v=localStorage.getItem(k);return v?JSON.parse(v):fb}catch{return fb}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
};
const K={TODAY:'st_today',HIST:'st_hist',AUTH:'st_auth',DIARY:'st_diary',THEME:'st_theme',STREAK_OVR:'st_streak_ovr',PLANNER:'st_planner'};
/* History cap. This used to be 200 days (~6.5 months) and it did not just hide
   older days — it deleted them from localStorage AND pushed the truncated list
   back to Supabase, destroying them in both places. This app is meant to be kept
   for years and doubles as a diary, so the cap is now a runaway-data guard only
   (~54 years), never something a real user can reach. */
const MAX_HIST=20000;

/* ── SUPABASE SYNC ──────────────────────────────────────────────────
   Uses window._SUPABASE_URL and window._SUPABASE_KEY if set.
   Table: stoic_data (user_id uuid PK, history jsonb, today jsonb)
   Falls back to localStorage silently if not configured.
   ────────────────────────────────────────────────────────────────── */
const SB={
  url: null, key: null, token: null,
  init(){
    // Accept URL with or without trailing /rest/v1/
    const raw = window._SUPABASE_URL||'';
    this.url = raw.replace(/\/rest\/v1\/?$/,'').replace(/\/+$/,'');
    this.key = window._SUPABASE_KEY||'';
    this.token = localStorage.getItem('AUTH_TOKEN')||'';
    return !!(this.url && this.key && this.token);
  },
  headers(){
    return {'Content-Type':'application/json','apikey':this.key,'Authorization':`Bearer ${this.token}`};
  },
  /* A push replaces the cloud row outright — there is no merging on the server.
     So a device holding a stale or partial copy can wipe good data for every
     other device just by being used. Two rules stop that:
       1. Never push before this session has successfully pulled. If we could not
          read the cloud, we have no idea what we would be destroying.
       2. Never silently push fewer days than the cloud last had.
     Deliberate acts — the Push button, restoring a file — pass force:true. */
  pulledOk:false,
  cloudDays:0,
  blocked:'',
  async push(history, today, diary, streakOverrides, opts){
    opts=opts||{};
    if(!this.init()) return;
    if(!await this.ensureFresh()) return;
    if(!opts.force){
      if(!this.pulledOk){this.status='error';this.blocked='never-pulled';return;}
      if((history||[]).length<this.cloudDays){this.status='error';this.blocked='would-shrink';return;}
    }
    this.blocked='';
    try{
      const res=await fetch(`${this.url}/rest/v1/stoic_data`, {
        method:'POST',
        headers:{...this.headers(),'Prefer':'resolution=merge-duplicates,return=minimal'},
        body:JSON.stringify({
          user_id: this.userId(),
          history: history,
          today: today,
          diary: diary||{},
          streak_overrides: streakOverrides||{},
          // The planner rides inside streak_overrides' sibling column only if the
          // database has it. Sending an unknown column makes PostgREST reject the
          // whole write, which would take the rest of the save down with it — so
          // it is added conditionally, and its absence is reported, never hidden.
          // The pomodoro rides inside the planner column rather than needing a
          // second one, so no further database change is required.
          ...(SB.hasPlannerColumn?{planner:{...(STATE.planner||{reminders:[]}),pomo:STATE.pomo}}:{}),
          saved_at: CLOCK.now(),
          updated_at: new Date().toISOString()
        })
      });
      if(!res.ok){const t=await res.text();console.warn('Push failed:',res.status,t);this.status='error';}
      else {this.status='ok';this.cloudDays=(history||[]).length;}
    }catch(e){console.warn('Supabase push failed',e);this.status='error';}
  },
  // null = we have not asked yet. Set on the first pull, so a database that
  // predates the planner keeps working instead of failing every write.
  hasPlannerColumn:null,
  async pull(){
    if(!this.init()) return null;
    if(!await this.ensureFresh()) return null;
    const base='history,today,diary,streak_overrides,saved_at';
    try{
      const tryPlanner=this.hasPlannerColumn!==false;
      let r=await fetch(`${this.url}/rest/v1/stoic_data?select=${tryPlanner?base+',planner':base}&limit=1`,{headers:this.headers()});
      if(!r.ok&&tryPlanner&&r.status===400){
        // A missing column is a schema gap, not a broken connection. Remember it
        // and carry on with everything else rather than reporting a sync failure.
        this.hasPlannerColumn=false;
        r=await fetch(`${this.url}/rest/v1/stoic_data?select=${base}&limit=1`,{headers:this.headers()});
      }else if(r.ok&&tryPlanner)this.hasPlannerColumn=true;
      /* A 401 means the token lapsed after all. ensureFresh renews ahead of
         time by comparing the expiry against this device's clock, so a clock
         running slow reads a dead token as good for hours yet and every call
         quietly fails. Being told no by the server is the one reading that
         cannot be wrong: renew on it, retry once, and the renewal also brings
         back the server's time, which is what was wrong to begin with. */
      if(r.status===401&&await this.refresh()){
        r=await fetch(`${this.url}/rest/v1/stoic_data?select=${this.hasPlannerColumn===false?base:base+',planner'}&limit=1`,{headers:this.headers()});
      }
      if(!r.ok){console.warn('Pull failed:',r.status);this.status='error';return null;}
      const rows=await r.json();
      this.status='ok';
      // We have now read the cloud, so pushing is safe and we know its size.
      this.pulledOk=true;
      this.cloudDays=(rows&&rows.length&&Array.isArray(rows[0].history))?rows[0].history.length:0;
      return rows&&rows.length?rows[0]:null;

/* ═══ THE CLOCK THIS APP RUNS ON ═════════════════════════════════════════
   Which timezone a device is set to never mattered: the date is always read
   in America/Cancun, and Date.now() is the same instant everywhere on earth.
   A phone in Tokyo and a laptop in Cancún already agree about what day it is.

   A device whose CLOCK is actually wrong is the real hazard, and it is not a
   small one. Every stamp this app writes comes from the device, and every
   conflict is settled by whoever claims the later moment — so a phone running
   three hours fast wins every sync it ever takes part in, and its older copy
   overwrites the newer one from the other device, silently. The same wrong
   clock rolls the day over early, closing a day that still has hours left in
   it, and it reads the login token as expired hours before it is.

   Supabase stamps every reply with its own time, so the difference between
   that and this device is measured and carried into every reading afterwards.
   Both devices then agree, whatever their own clocks say. With no cloud there
   is nothing to disagree with, the difference stays zero, and everything below
   behaves exactly as it always has.
   ═══════════════════════════════════════════════════════════════════════ */
const CLOCK={
  skew:Number(localStorage.getItem('st_clock_skew')||0)||0,
  checked:false,
  /* Given a moment that came from the server. The reading arrives a fraction
     of a second late and is counted in whole seconds, so anything under a
     minute is treated as agreement — a difference that kept twitching would
     reorder stamps written moments apart. Anything past a month is nonsense
     rather than a clock, and the device is believed instead. */
  sync(serverMs){
    if(!serverMs)return;
    const server=typeof serverMs==='number'?serverMs:Date.parse(serverMs);
    if(!server)return;
    const diff=server-Date.now();
    if(Math.abs(diff)>30*24*3600*1000)return;
    this.checked=true;
    const next=Math.abs(diff)<60000?0:diff;
    if(next!==this.skew){
      this.skew=next;
      try{localStorage.setItem('st_clock_skew',String(next));}catch(e){}
    }
  },
  now(){return Date.now()+this.skew;},
  // How far out the device is, in minutes — for saying so out loud.
  offMinutes(){return Math.round(this.skew/60000);}
};

/* Where the day begins and ends. One zone for the whole account, not one per
   device: that is what stops a laptop and a phone from disagreeing about what
   day it is, which is the thing that would really break — two devices each
   closing a different day, each filing the same work under a different date.

   It is a setting rather than a constant because you can move. Travelling two
   hours west without it means the day ends at 10pm where you are standing, and
   the hours you lose are hours of scoring. Change it and both devices follow,
   because it rides along with the language and the theme.

   Change it during the day. In the couple of hours where the two zones do not
   even agree on the date, a change can only move the boundary forward, never
   reopen a day already closed — see loadToday. */
const TZ_HOME='America/Cancun';
function appTZ(){return localStorage.getItem('st_tz')||TZ_HOME;}
function setAppTZ(tz){
  localStorage.setItem('st_tz',tz);
  STATE.tz=tz;
  STATE.today._tz=tz;      // rides to the other device with the other settings
  commitAndRefresh();
}
// What this device is actually set to — offered as one of the choices.
function deviceTZ(){
  try{return Intl.DateTimeFormat().resolvedOptions().timeZone||TZ_HOME;}catch(e){return TZ_HOME;}
}
/* A zone written the way a person would say it, and how far it is from home
   right now — which is the part that actually answers "does my day move?" */
function tzLabel(tz){
  const city=tz.split('/').pop().replace(/_/g,' ');
  const off=tzOffsetHours(tz)-tzOffsetHours(TZ_HOME);
  return off?`${city} (${off>0?'+':''}${off}h)`:city;
}
function tzOffsetHours(tz){
  try{
    const d=new Date(CLOCK.now());
    const s=d.toLocaleString('en-US',{timeZone:tz,hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
    const u=d.toLocaleString('en-US',{timeZone:'UTC',hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
    return Math.round((Date.parse(s)-Date.parse(u))/3600000);
  }catch(e){return 0;}
}

function todayKey(){
  return new Date(CLOCK.now()).toLocaleDateString('en-CA',{timeZone:appTZ()});
}

function t(k){return T[STATE?.lang||'en']?.[k]??T.en[k]??k}
function toggleLang(){STATE.lang=STATE.lang==='en'?'es':'en';localStorage.setItem('st_lang',STATE.lang);refresh();SB.push(STATE.history,STATE.today,STATE.diary,STATE.streakOverrides).catch(()=>{});}
function capFirst(s){return s?s.charAt(0).toUpperCase()+s.slice(1):s;}

/* ═══ CALC — SINGLE SOURCE OF TRUTH ═══ */
const CALC={
  status(pct,flag){
    let s=pct>=100?'purple':pct>=85?'green':pct>=50?'yellow':'red';
    if(flag){const u={red:'yellow',yellow:'green',green:'purple',purple:'purple'};s=u[s];}
    return s;
  },
  colorBonus(s){return{purple:60,green:30,yellow:10,red:0}[s]||0},
  penBase(p){
    const diff=(typeof STATE!=='undefined'?STATE.difficulty:null)||'easy';
    const mult=diff==='hard'?10:diff==='medium'?5:1;
    if(p.type==='drugs')return Math.round(-25*mult*(p.details?.substances||1));
    if(p.type==='internet')return Math.round(-1*mult*(p.details?.minutes||0));
    if(p.type==='macanazo')return p.details?.isPositive?100:Math.round(-100*mult);
    return 0;
  },
  diffMult(){
    const diff=(typeof STATE!=='undefined'?STATE.difficulty:null)||'easy';
    return diff==='hard'?10:diff==='medium'?5:1;
  },
  // single source of truth for the procrastination-penalty multiplier —
  // was previously duplicated 3x with mismatched thresholds/fallbacks
  procMult(procMins,streak){
    return procMins>30?Math.max(1,streak||1):1;
  },
  streaks(history,today){
    const tk=todayKey();
    // #1 FIX: exclude today from history scan entirely
    const hist=[...history].filter(d=>d.date!==tk).sort((a,b)=>new Date(a.date)-new Date(b.date));
    const hasPen=(d,t)=>d.penalties?.some(p=>p.type===t)||false;
    const hasSt=(d,t)=>d.streaks?.some(s=>s.type===t&&s.active)||false;
    function pStrk(type,resetOn){let c=0;for(let i=hist.length-1;i>=0;i--){if(!hasPen(hist[i],type))break;if(resetOn.includes(hist[i].status))break;c++;}return c;}
    function aStrk(type){let c=0;for(let i=hist.length-1;i>=0;i--){if(hasPen(hist[i],type))break;c++;}return c;}
    function sStrk(type){let c=0;for(let i=hist.length-1;i>=0;i--){if(!hasSt(hist[i],type))break;c++;}return c;}
    function wStrk(){let c=0;for(let i=hist.length-1;i>=0;i--){if(hist[i].status==='red')break;c++;}return c;}
    function eStrk(){let c=0;for(let i=hist.length-1;i>=0;i--){if(!hist[i].sleptEarly)break;c++;}return c;}
    function cStrk(){let c=0;for(let i=hist.length-1;i>=0;i--){if(hist[i].status==='red'||hist[i]._gap)break;c++;}return c;}
    function lStrk(){let c=0;for(let i=hist.length-1;i>=0;i--){if(!hist[i].sleptLate||hist[i].status==='purple')break;c++;}return c;}
    const tD=today.penalties.some(p=>p.type==='drugs');
    const tN=today.penalties.some(p=>p.type==='internet');
    const tM=today.penalties.some(p=>p.type==='macanazo');
    const tLate=today.sleep?.sleptLate||false;

    // Calculate today's status to know which streaks reset TODAY
    const pct=today.target>0?Math.round((today.completed||0)/today.target*100):0;
    const todayStatus=CALC.status(pct, today.flagCompleted||false);

    // Rules:
    // Yellow+ → resets Substances
    // Green+  → resets Substances + Procrastination
    // Purple  → resets Substances + Procrastination + Orgasm + Slept Late
    // Red     → cuts Work streak (handled in wStrk)
    const todayResetsSubstances = ['yellow','green','purple'].includes(todayStatus);
    const todayResetsProcrast   = ['green','purple'].includes(todayStatus);
    const todayResetsMacanazo   = todayStatus==='purple';
    const todayResetsLate       = todayStatus==='purple';  // ONLY purple

    return{
      substancesPenaltyStreak:      todayResetsSubstances ? 0 : pStrk('drugs',['yellow','green','purple']) + (tD?1:0),
      procrastinationPenaltyStreak: todayResetsProcrast   ? 0 : pStrk('internet',['green','purple']) + (tN?1:0),
      macanazoPenaltyStreak:        todayResetsMacanazo   ? 0 : pStrk('macanazo',['purple']) + (tM?1:0),
      lateStreak:                   todayResetsLate        ? 0 : lStrk() + (tLate?1:0),
      // Positive streaks: unaffected by day color
      substancesStreak:tD?0:aStrk('drugs'),
      procrastinationStreak:tN?0:aStrk('internet'),
      macanazoStreak:tM?0:aStrk('macanazo'),
      morningStreak:sStrk('morning')+(today.morningCompleted?1:0),
      flagStreak:sStrk('flags')+(today.flagCompleted?1:0),
      workStreak:wStrk()+(today.work?.workDuration>0?1:0),
      earlyBedStreak:eStrk()+(today.sleep?.sleptEarly?1:0),
      colorStreak:cStrk(),
    };
  },
  score(day,sk){
    const{completed=0,target=0,morningCompleted=false,flagCompleted=false,pomodoros=0,penalties=[],sleep={},work={}}=day;
    const s=sk||{morningStreak:0,flagStreak:0,substancesPenaltyStreak:1,procrastinationPenaltyStreak:1,macanazoPenaltyStreak:1};
    const base=completed;
    const mB=morningCompleted?25*Math.max(1,s.morningStreak):0;
    const fB=flagCompleted?100*Math.max(1,s.flagStreak):0;
    const pom=pomodoros*25;
    const wrk=(work.workDuration||0)*Math.max(1,s.workStreak);
    const earlyBedStreak=Math.max(1,s.earlyBedStreak||1);
    const slp=(sleep.sleepDuration||0)+(sleep.napDuration||0)+(sleep.sleptEarly?(sleep.sleepDuration||0)*earlyBedStreak:0);
    const latePen=sleep.sleptLate?-100*this.diffMult()*Math.max(1,s.lateStreak||1):0;
    const procMins=penalties.filter(p=>p.type==='internet').reduce((a,p)=>a+(p.details?.minutes||0),0);
    const pen=penalties.reduce((sum,p)=>{
      const b=this.penBase(p);let mult=1;
      if(p.type==='drugs')mult=Math.max(1,s.substancesPenaltyStreak);
      else if(p.type==='internet')mult=this.procMult(procMins,s.procrastinationPenaltyStreak);
      else if(p.type==='macanazo')mult=Math.max(1,s.macanazoPenaltyStreak);
      return sum+b*mult;
    },0);
    const pct=target>0?Math.round(completed/target*100):0;
    const status=this.status(pct,flagCompleted);
    const col=this.colorBonus(status)*Math.max(1,s.colorStreak||0);
    const total=base+mB+fB+pom+wrk+slp+pen+col+latePen;
    return{total,base,status,pct,mB,fB,pom,wrk,slp,pen,col,latePen};
  },
  // #2 FIX: histTotal must exclude today to avoid double-count
  histTotal(history){
    const tk=todayKey();
    return history.filter(h=>h.date!==tk).reduce((s,d)=>s+this.liveScore(d,history),0);
  },
  /* recompute a stored day's score using CURRENT difficulty (penalties scale with mode) */
  // Count consecutive qualifying REGISTERED days ending at idx (inclusive).
  // Only looks at real, registered history entries — never invents or assumes anything
  // about unregistered days. resetStatuses = day colors that break the chain.
  streakAtDay(sortedHist, idx, checkFn, resetStatuses){
    let count=0;
    for(let i=idx;i>=0;i--){
      const d=sortedHist[i];
      if(resetStatuses && resetStatuses.includes(d.status)) break;
      if(!checkFn(d)) break;
      count++;
    }
    return count;
  },
  liveScore(e, allHistory){
    if(e._gap)return e.todayPoints||-1000;
    const st=e.status||'red';
    const subsReset  =['yellow','green','purple'].includes(st);
    const procReset  =['green','purple'].includes(st);
    const macReset   = st==='purple';
    const lateReset  = st==='purple';

    // Default to the streak that was saved at the time (fallback if no history array given)
    let morningStreak=e.streaksUsed?.morningStreak||1;
    let flagStreak=e.streaksUsed?.flagStreak||1;
    let workStreak=e.streaksUsed?.workStreak||1;
    let earlyBedStreak=e.streaksUsed?.earlyBedStreak||1;
    let lateStreak=e.streaksUsed?.lateStreak||1;
    let subsStreak=e.streaksUsed?.substancesPenaltyStreak||1;
    let procStreak=e.streaksUsed?.procrastinationPenaltyStreak||1;
    let macStreak=e.streaksUsed?.macanazoPenaltyStreak||1;
    /* CALC.score multiplies the colour bonus by the non-red streak, and this
       did not — so a day was worth one number while you lived it and another
       once it became history. Measured across 76 real days, 75 of them
       disagreed. The multiplier is reconstructed here from the days before it,
       the same rule CALC.streaks uses. */
    let colorMult=1;

    // If we have the full history, recompute the REAL streak at this exact day
    // by counting backward through REGISTERED days only (no invented days, no gaps assumed).
    if(allHistory && allHistory.length){
      const sorted=[...allHistory].filter(d=>!d._gap).sort((a,b)=>a.date.localeCompare(b.date));
      const idx=sorted.findIndex(d=>d.date===e.date);
      if(idx>=0){
        morningStreak=this.streakAtDay(sorted,idx,d=>d.streaks?.some(s=>s.type==='morning'&&s.active))||1;
        flagStreak=this.streakAtDay(sorted,idx,d=>d.streaks?.some(s=>s.type==='flags'&&s.active))||1;
        workStreak=this.streakAtDay(sorted,idx,d=>(d.workDuration||0)>0,['red'])||1;
        earlyBedStreak=this.streakAtDay(sorted,idx,d=>d.sleptEarly)||1;
        lateStreak=this.streakAtDay(sorted,idx,d=>d.sleptLate,['purple'])||1;
        subsStreak=this.streakAtDay(sorted,idx,d=>d.penalties?.some(p=>p.type==='drugs'),['yellow','green','purple'])||1;
        procStreak=this.streakAtDay(sorted,idx,d=>d.penalties?.some(p=>p.type==='internet'),['green','purple'])||1;
        macStreak=this.streakAtDay(sorted,idx,d=>d.penalties?.some(p=>p.type==='macanazo'),['purple'])||1;
        // Consecutive non-red days BEFORE this one — gaps are already excluded
        // from `sorted`, and the day itself never counts toward its own streak.
        colorMult=Math.max(1,this.streakAtDay(sorted,idx-1,d=>d.status!=='red'));
        // Apply streakOverrides offset so historical days reflect the real streak
        // e.g. if user set goals=8 (offset=4), yesterday shows ×8 not ×4.
        // IMPORTANT: once a streak breaks it is RETIRED with a date (see
        // applyStreakOverrides) rather than deleted. Days BEFORE that date keep
        // the offset forever — points already earned are never taken away — while
        // days after it score naturally, since they belong to a brand new streak.
        const _ovr=(typeof STATE!=='undefined'?STATE.streakOverrides:{})||{};
        function _applyOvr(key,val){
          const o=_ovr[key];if(o===undefined||o===null)return val;
          const off=typeof o==='object'?(o.offset!==undefined?o.offset:0):o;
          const retiredAt=typeof o==='object'?o.retiredAt:null;
          if(retiredAt&&e.date>=retiredAt)return val; // new streak — no offset
          return val>0?Math.max(1,val+off):val;
        }
        morningStreak=_applyOvr('morningStreak',morningStreak);
        flagStreak=_applyOvr('flagStreak',flagStreak);
        workStreak=_applyOvr('workStreak',workStreak);
        earlyBedStreak=_applyOvr('earlyBedStreak',earlyBedStreak);
        lateStreak=_applyOvr('lateStreak',lateStreak);
        subsStreak=_applyOvr('substancesPenaltyStreak',subsStreak);
        procStreak=_applyOvr('procrastinationPenaltyStreak',procStreak);
        macStreak=_applyOvr('macanazoPenaltyStreak',macStreak);
      }
    }

    const pos=(e.completedTasks||0)
      +((e.streaks?.some(s=>s.type==='morning'&&s.active))?25*morningStreak:0)
      +((e.streaks?.some(s=>s.type==='flags'&&s.active))?100*flagStreak:0)
      +((e.pomodoros||0)*25)
      +((e.workDuration||0)*workStreak)
      +((e.sleepDuration||0)+(e.napDuration||0)+(e.sleptEarly?(e.sleepDuration||0)*earlyBedStreak:0))
      +(this.colorBonus(e.status)*colorMult)
      +(e.sleptLate&&!lateReset?-100*this.diffMult()*lateStreak:0);

    const pen=(e.penalties||[]).reduce((sum,p)=>{
      const det=p.type==='drugs'?{substances:p.count}:p.type==='internet'?{minutes:p.count}:{isPositive:false};
      const b=this.penBase({type:p.type,details:det});
      let mult=1;
      if(p.type==='drugs'&&!subsReset) mult=subsStreak;
      else if(p.type==='internet'&&!procReset) mult=procStreak;
      else if(p.type==='macanazo'&&!macReset) mult=macStreak;
      return sum+b*mult;
    },0);
    return pos+pen;
  },
  buildEntry(today,streaks,date){
    const sc=this.score(today,streaks);
    return{date,_ts:CLOCK.now(),todayPoints:sc.total,status:sc.status,
      completedTasks:today.completed,totalTasks:today.target,pomodoros:today.pomodoros,
      penalties:today.penalties.map(p=>({type:p.type,count:p.count,points:this.penBase(p),streak:1})),
      streaks:[{type:'morning',count:today.morningCompleted?1:0,active:today.morningCompleted},{type:'flags',count:today.flagCompleted?1:0,active:today.flagCompleted}],
      sleepDuration:today.sleep?.sleepDuration||0,napDuration:today.sleep?.napDuration||0,
      sleptEarly:today.sleep?.sleptEarly||false,sleptLate:today.sleep?.sleptLate||false,workDuration:today.work?.workDuration||0,
      streaksUsed:{...streaks}};
  },
  /* #6: fill missing days between first and last history entry as red -1000 */
  fillGaps(history){
    // Only fill gaps BETWEEN real logged days (ignore gap-only entries when finding bounds)
    const realDays=history.filter(d=>!d._gap).map(d=>d.date).sort();
    if(realDays.length<2)return history;
    const map=new Map(history.map(d=>[d.date,d]));
    const start=new Date(realDays[0]+'T12:00:00'),end=new Date(realDays[realDays.length-1]+'T12:00:00');
    const result=[];
    for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){
      const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      result.push(map.get(k)||{date:k,todayPoints:-1000,status:'red',completedTasks:0,totalTasks:0,pomodoros:0,penalties:[],streaks:[],workDuration:0,sleepDuration:0,napDuration:0,sleptEarly:false,_gap:true});
    }
    return result;
  }
};

/* ═══ #1 FIX: loadToday checks for missed days, fills all gaps ═══ */
function loadToday(){
  const t=S.get(K.TODAY,null);
  if(t){STATE.today={...STATE.today,...t};if(t._penType)STATE.penType=t._penType;
    if(t._difficulty){STATE.difficulty=t._difficulty;localStorage.setItem('st_difficulty',t._difficulty);}
    if(t._lang){STATE.lang=t._lang;localStorage.setItem('st_lang',t._lang);}
    // Read before the date is worked out below — it decides what the date is.
    if(t._tz){STATE.tz=t._tz;localStorage.setItem('st_tz',t._tz);}
  }
  const tk=todayKey();
  const saved=STATE.today._date||'';
  /* Only ever forward. A day can end; it cannot un-end. If the date reads
     EARLIER than the day in hand — the zone was moved west, or the device
     clock jumped back — rolling over would file the day in hand under a date
     still in the future and hand back an empty one in its place, losing
     everything logged since midnight. The day in hand simply stands until the
     clock genuinely passes it. */
  if(saved&&saved>tk){
    if(!STATE.today._date)STATE.today._date=saved;
    return;
  }
  if(saved&&saved!==tk){
    /* Might have missed multiple days — fill each missing one as a -1000 gap.
       Anchored at noon, local. A bare 'YYYY-MM-DD' is read as UTC midnight,
       which anywhere west of Greenwich is the evening BEFORE — so every gap
       day was written one day early: the first landed back on the day already
       archived and was dropped as a duplicate, and the last day missed was
       never filled at all. Miss three days and only one was ever counted. */
    const savedDate=new Date(saved+'T12:00:00');
    const nowDate=new Date(tk+'T12:00:00');
    const daysDiff=Math.round((nowDate-savedDate)/(1000*60*60*24));
    // save the actual last-used day — keep ORIGINAL _ts so Supabase data always wins
    const sk=CALC.streaks(STATE.history,STATE.today);
    const prevEntry=CALC.buildEntry(STATE.today,sk,saved);
    prevEntry._ts=STATE.today._ts||0; // preserve original ts — prevents overwriting real cloud data
    upsertHist(prevEntry,saved);
    // fill any days between saved and today as gap days
    for(let i=1;i<daysDiff;i++){
      const gapDate=new Date(savedDate);gapDate.setDate(gapDate.getDate()+i);
      const gk=isoDate(gapDate);
      if(!STATE.history.find(h=>h.date===gk)){
        upsertHist({date:gk,_ts:0,todayPoints:-1000,status:'red',completedTasks:0,totalTasks:0,pomodoros:0,penalties:[],streaks:[],workDuration:0,sleepDuration:0,napDuration:0,sleptEarly:false,_gap:true},gk);
        S.set(K.HIST,STATE.history);
        // NOTE: do NOT push here — boot will pull from Supabase first, then push merged result
      }
    }
    // reset today
    STATE.today={completed:0,target:0,morningCompleted:false,flagCompleted:false,
      pomodoros:0,penalties:[],
      sleep:{sleepDuration:0,napDuration:0,sleptEarly:false,earlyBedStreak:STATE.today.sleep?.earlyBedStreak||0},
      work:{workDuration:0},_date:tk};
  }
  if(!STATE.today._date)STATE.today._date=tk;
}

function upsertHist(entry,dk){
  const idx=STATE.history.findIndex(h=>h.date===dk);
  if(idx>=0)STATE.history[idx]={...STATE.history[idx],...entry};
  else STATE.history.unshift(entry);
  STATE.history=STATE.history.slice(0,MAX_HIST);
  S.set(K.HIST,STATE.history); // always persist locally
}

/* save: local + push to Supabase if logged in */
// commit() = user changed something real → bump _ts, push to cloud
function commit(){
  const now=CLOCK.now();
  STATE.today._ts=now;
  STATE._lastSavedAt=now; // we're the writer now — prevent echoing our own push back
  save();
}

function applyStreakOverrides(skRaw){
  // The override stores an OFFSET captured once, at the moment of editing:
  //   offset = (typed value) - (natural value at that exact moment)
  // From then on, every day: displayed = natural(today) + offset.
  // This makes it grow/shrink in lockstep with natural — true streak behavior —
  // while keeping the typed number exact on the day it was set.
  // If natural drops to 0 (streak broke — user skipped the activity), TODAY's
  // streak becomes 0: a broken streak is 0, no exceptions. But the override is
  // RETIRED with a date, never deleted — the days it already applied to keep
  // their points forever (see liveScore). Deleting it used to retroactively
  // strip points from history the moment a streak broke.
  const ovr=STATE.streakOverrides||{};
  const sk={...skRaw};
  let changed=false;

  Object.keys(ovr).forEach(k=>{
    const o=ovr[k];
    if(o===undefined||o===null) return;
    const offset=typeof o==='object'?(o.offset!==undefined?o.offset:0):o;
    const retiredAt=typeof o==='object'?o.retiredAt:null;
    const natural=skRaw[k]||0;

    if(retiredAt){
      sk[k]=natural; // already retired — today runs on the new, natural streak
    } else if(natural===0){
      ovr[k]={offset,retiredAt:todayKey()}; changed=true; sk[k]=0;
    } else {
      sk[k]=natural+offset;
    }
  });

  if(changed){STATE.streakOverrides=ovr;S.set(K.STREAK_OVR,STATE.streakOverrides);}
  return sk;
}

function save(){
  const tk=todayKey();
  STATE.today._date=tk;
  STATE.today._penType=STATE.penType;
  STATE.today._difficulty=STATE.difficulty;
  STATE.today._lang=STATE.lang;
  STATE.today._theme=STATE.theme;
  STATE.today._tzOffset=new Date().getTimezoneOffset();
  const sk=applyStreakOverrides(CALC.streaks(STATE.history,STATE.today));
  upsertHist(CALC.buildEntry(STATE.today,sk,tk),tk);
  S.set(K.TODAY,STATE.today);
  S.set(K.HIST,STATE.history);
  S.set(K.DIARY,STATE.diary);
  S.set(K.THEME,STATE.theme);
  S.set(K.STREAK_OVR,STATE.streakOverrides);
  SB.push(STATE.history,STATE.today,STATE.diary,STATE.streakOverrides).catch(()=>{});
}


function applyTheme(){
  document.body.className=STATE.theme==='light'?'light':'';
}
function toggleTheme(){
  STATE.theme=STATE.theme==='light'?'dark':'light';
  S.set(K.THEME,STATE.theme);
  applyTheme();
  refresh();
  SB.push(STATE.history,STATE.today,STATE.diary,STATE.streakOverrides).catch(()=>{});
}

/* ═══ SYNC — Supabase is the single source of truth ═══
   Philosophy: like Facebook — the server has the data,
   devices just read and write to it. No complex merging.
   
   WRITE: every save() pushes full state to Supabase immediately.
   READ:  every 8s, pull from Supabase. If it differs from local,
          take the remote version. Period. No merge logic.
   
   Conflict resolution: last writer wins (highest _ts on today,
   highest _ts per day in history). Simple and predictable.
   ══════════════════════════════════════════════════════════ */

function applyRemote(remote){
  /* ── SYNC PHILOSOPHY ──────────────────────────────────────────────
     Supabase is the SINGLE source of truth.
     Conflict resolution: whoever pushed most recently wins.
     We use remote.saved_at (set by the pushing device at push time)
     vs STATE._lastSavedAt (set locally when WE pushed).
     If remote.saved_at > our last push → remote is newer → take it.
     No complex per-field merging. Simple. Predictable.
     ──────────────────────────────────────────────────────────────── */
  if(!remote) return false;
  let changed=false;
  const tk=todayKey();
  const remoteSavedAt=remote.saved_at||0;
  const localSavedAt=STATE._lastSavedAt||0;
  const remoteIsNewer=remoteSavedAt>localSavedAt;

  // TODAY: remote wins if it was pushed more recently than our last push
  if(remote.today){
    const R=remote.today;
    // Settings always sync regardless of who is newer
    if(R._difficulty&&R._difficulty!==STATE.difficulty){STATE.difficulty=R._difficulty;localStorage.setItem('st_difficulty',R._difficulty);changed=true;}
    if(R._theme&&R._theme!==STATE.theme){STATE.theme=R._theme;S.set(K.THEME,R._theme);applyTheme();changed=true;}
    if(R._lang&&R._lang!==STATE.lang){STATE.lang=R._lang;localStorage.setItem('st_lang',R._lang);changed=true;}
    // The zone travels with the settings so both devices keep the same day.
    if(R._tz&&R._tz!==appTZ()){STATE.tz=R._tz;localStorage.setItem('st_tz',R._tz);changed=true;}

    if(remoteIsNewer){
      const Rdate=R._date||'';
      if(Rdate&&Rdate<tk){
        // Remote today is from a past date — put it in history
        const existingHist=STATE.history.find(h=>h.date===Rdate);
        if(!existingHist||(R._ts||0)>(existingHist._ts||0)){
          const sk=CALC.streaks(STATE.history,R);
          const entry=CALC.buildEntry(R,sk,Rdate);
          upsertHist(entry,Rdate);
          S.set(K.HIST,STATE.history);
          changed=true;
        }
        // Local today is current date — keep it
      } else {
        // Remote today is current date (or no date) — remote wins entirely
        const merged={...STATE.today,...R};
        // Always union penalties by id so no entry is lost
        const penMap=new Map((STATE.today.penalties||[]).map(p=>[p.id,p]));
        (R.penalties||[]).forEach(p=>{penMap.set(p.id,p);});
        merged.penalties=[...penMap.values()];
        if(JSON.stringify(merged)!==JSON.stringify(STATE.today)){
          STATE.today=merged;S.set(K.TODAY,STATE.today);changed=true;
        }
      }
      // Update our knowledge of what remote has
      STATE._lastSavedAt=remoteSavedAt;
    }
  }

  // HISTORY: per-day merge — remote wins if strictly newer _ts or we have no entry
  if(Array.isArray(remote.history)&&remote.history.length){
    const localMap=new Map((STATE.history||[]).map(d=>[d.date,d]));
    let hChanged=false;
    remote.history.forEach(re=>{
      const le=localMap.get(re.date);
      if(!le||(re._ts||0)>(le._ts||0)){
        localMap.set(re.date,{...re});
        hChanged=true;
      }
    });
    if(hChanged){
      STATE.history=[...localMap.values()].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,MAX_HIST);
      S.set(K.HIST,STATE.history);changed=true;
    }
  }

  // DIARY: union (both devices keep entries, no deletion)
  if(remote.diary){
    const merged={...STATE.diary,...remote.diary};
    /* Except the note open in the editor. Its own keystrokes are pushed as it
       is written, so a pull that crosses that push carries a copy a few words
       behind what is on screen — and remote winning per key would hand those
       words back. Whatever is being typed stays local until it is put down. */
    const openDay=document.querySelector('.diary-area')?.dataset.day;
    if(openDay){
      if(openDay in STATE.diary)merged[openDay]=STATE.diary[openDay];
      else delete merged[openDay];
    }
    if(JSON.stringify(merged)!==JSON.stringify(STATE.diary)){STATE.diary=merged;S.set(K.DIARY,STATE.diary);changed=true;}
  }

  /* STREAK OVERRIDES.
     These decide how historical days are scored, so a device holding a stale
     set reports a wildly different grand total off the very same history — the
     same 76 days swing from -419,819 to +273,169 depending only on these.
     The old merge compared a `since` field that nothing ever writes, so
     ('' > '') was always false and any key already present locally could never
     be corrected from the cloud. A device kept its stale overrides forever.
     They are small and global, like the settings above, so the newer side wins
     outright. When we are the newer side we still adopt keys we simply do not
     have, so nothing is ever lost. */
  /* PLANNER: whichever device edited the list most recently wins it whole.
     Per-item union sounds safer but silently resurrects anything you delete,
     and _ts is bumped on every planner change, so this stays predictable. */
  if(remote.planner&&typeof remote.planner==='object'){
    const lp=STATE.planner||{reminders:[],_ts:0};
    if((remote.planner._ts||0)>(lp._ts||0)){
      const {pomo:_drop,...rest}=remote.planner;   // the pomodoro has its own clock
      STATE.planner={reminders:[],...rest};
      S.set(K.PLANNER,STATE.planner);changed=true;
    }
    // Whichever device touched the timer last owns it, independently of the list.
    const rp=remote.planner.pomo;
    if(rp&&typeof rp==='object'&&(rp._ts||0)>(STATE.pomo._ts||0)){
      STATE.pomo={...STATE.pomo,...rp};
      S.set('st_pomo',STATE.pomo);changed=true;
    }
  }

  if(remote.streak_overrides){
    const ro=remote.streak_overrides, lo=STATE.streakOverrides||{};
    let merged;
    if(remoteIsNewer){
      merged={...ro};
    } else {
      merged={...lo};
      Object.entries(ro).forEach(([k,v])=>{if(lo[k]===undefined)merged[k]=v;});
    }
    if(JSON.stringify(merged)!==JSON.stringify(lo)){
      STATE.streakOverrides=merged;S.set(K.STREAK_OVR,STATE.streakOverrides);changed=true;
    }
  }

  return changed;
}

/* Is the user in the middle of writing something? A redraw throws away the
   field under their hands, and the note editor is the one place where that is
   unmistakable: it closes on its own, mid-sentence. */
function isEditing(){
  const a=document.activeElement;
  if(a&&(a.tagName==='TEXTAREA'||a.tagName==='INPUT'))return true;
  return !!document.querySelector('.diary-area');
}
/* The sync itself never waits — only the redraw does. What the cloud brought
   is already in STATE; this remembers that the screen has yet to show it, so
   the first quiet cycle draws it rather than the change being missed. */
let _redrawOwed=false;
async function bgSync(){
  if(!STATE.authed||!SB.init()) return;
  try{
    const remote=await SB.pull();
    if(applyRemote(remote))_redrawOwed=true;
    if(_redrawOwed&&!isEditing()){_redrawOwed=false;render();}
  }catch(e){/* silent — will retry next cycle */}
}
setInterval(bgSync,5000); // every 5s for fast cross-device sync // every 8s
/* ═══ DOM HELPERS ═══ */
function el(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e}
function dv(c,h){return el('div',c,h)}
function bt(c,t,f){const b=el('button',c,t);b.onclick=f;return b}
function ip(t,c,v,p){const i=document.createElement('input');i.type=t;i.className=c;i.value=v??'';if(p)i.placeholder=p;return i}
function sk(c,opts,v){const s=document.createElement('select');s.className=c;opts.forEach(([ov,l])=>{const o=document.createElement('option');o.value=ov;o.textContent=l;if(ov===v)o.selected=true;s.appendChild(o);});return s}
function sp(c,t){const s=el('span',c);if(t!==undefined)s.textContent=t;return s}
function hr(){const h=document.createElement('hr');h.className='dv';return h}
function sbadge(status){const lb={red:t('Red'),yellow:t('Yellow'),green:t('Green'),purple:t('Purple')};return sp(`badge s-${status}`,lb[status]||status)}

/* ═══ PLANNER (TAB 1) — REMINDERS ══════════════════════════════════════
   Tab 1 owns what you plan; tab 2 owns what you score. Tab 1 feeds tab 2,
   and tab 2 never writes back here — a manual edit over there is a scoring
   decision, not a claim about this list.
   ═══════════════════════════════════════════════════════════════════════ */
function isoDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

function saveView(){S.set('st_view',STATE.view);}
function savePlanner(){
  STATE.planner._ts=CLOCK.now();
  S.set(K.PLANNER,STATE.planner);
  commit();
}
function reminders(){return STATE.planner.reminders||(STATE.planner.reminders=[]);}

/* Repeats stay anchored to the original due dates rather than to when you
   actually ticked it, so a task every 5 days keeps landing on its own rhythm
   even if you complete one late. Advancing stops at the first date that is not
   already past, so finishing a long-neglected daily task does not resurrect it
   dozens of times. */
function pad2(n){return String(n).padStart(2,'0');}
function fmtTime(d){return pad2(d.getHours())+':'+pad2(d.getMinutes());}
/* "Now" on the app's own clock. todayKey() decides the date in America/Cancun,
   so anything comparing times against it has to use the same wall clock —
   reading the browser's local time instead put the two an hour apart for most
   of Mexico, and disagreeing about what day it is breaks hourly repeats near
   the end of the day. */
function appNow(){
  return new Date(new Date(CLOCK.now()).toLocaleString('en-US',{timeZone:appTZ()}));
}

/* Advancing a repeat. Day-and-longer repeats move to the first date that is
   not already past. Hourly ones move to the first slot still ahead on the
   clock, so a thing due every three hours can come back several times within
   the same day instead of jumping to tomorrow. */
function advanceDue(due,rep,tk,time){
  const unit=rep.unit||'day',every=Math.max(1,rep.every||1);
  if(unit==='hour'){
    const d=new Date(due+'T'+(time||'00:00')+':00'),now=appNow();
    let guard=0;
    do{d.setHours(d.getHours()+every);guard++;}while(d<=now&&guard<30000);
    return{due:isoDate(d),time:fmtTime(d)};
  }
  const d=new Date(due+'T12:00:00'),today=new Date(tk+'T12:00:00');
  let guard=0;
  // A weekly repeat pinned to particular weekdays walks forward a day at a
  // time to the next one on the list, so "Tuesdays and Fridays" lands on both
  // rather than on a fixed stride from whenever it was last done.
  if(unit==='week'&&Array.isArray(rep.days)&&rep.days.length){
    /* Weekly on chosen weekdays, honouring the "every N weeks" stride: inside
       an active week it hits each listed day in turn, and only once that week
       is spent does it skip ahead N weeks. So Tue+Fri every 4 weeks means both
       days of one week, then nothing for four weeks. */
    const next=from=>{
      const ws=new Date(from);ws.setDate(from.getDate()-from.getDay()); // Sunday
      let best=null;
      rep.days.forEach(dow=>{
        const c=new Date(ws);c.setDate(ws.getDate()+dow);
        if(c>from&&(!best||c<best))best=c;
      });
      if(best)return best;
      const ns=new Date(ws);ns.setDate(ws.getDate()+7*every);
      const c=new Date(ns);c.setDate(ns.getDate()+Math.min(...rep.days));
      return c;
    };
    let cur=d;
    do{cur=next(cur);guard++;}while(cur<=today&&guard<3000);
    return{due:isoDate(cur),time:time||''};
  }
  /* Monthly and yearly steps are clamped to the end of the target month.
     Plain date arithmetic overflows instead: 31 August plus a month lands on
     1 October, skipping September entirely, and 31 January lands on 3 March,
     skipping February. The intended day of the month is remembered, so the
     31st gives 30 September and then 31 October rather than drifting down to
     the 30th forever — and asking for the 31st is exactly how you say "the
     last day of the month". */
  const dom=rep.dom||new Date(due+'T12:00:00').getDate();
  const daysInMonth=(y,m)=>new Date(y,m+1,0).getDate();

  /* Monthly pinned to particular days of the month — the 14th and the 28th,
     say. It takes the next listed day still ahead in the current month, and
     only once they are spent does it skip forward N months. Days past the end
     of a short month clamp to its last day, so the 31st still fires in
     February. */
  if(unit==='month'&&Array.isArray(rep.doms)&&rep.doms.length){
    const days=[...new Set(rep.doms)].sort((a,b)=>a-b);
    const clamp=(y,m,dd)=>Math.min(dd,daysInMonth(y,m));
    const next=from=>{
      const y=from.getFullYear(),m=from.getMonth(),cur=from.getDate();
      for(const dd of days){
        const c=clamp(y,m,dd);
        if(c>cur)return new Date(y,m,c,12,0,0);
      }
      const tm=m+every,ty=y+Math.floor(tm/12),tmm=((tm%12)+12)%12;
      return new Date(ty,tmm,clamp(ty,tmm,days[0]),12,0,0);
    };
    let cur=d;
    do{cur=next(cur);guard++;}while(cur<=today&&guard<3000);
    return{due:isoDate(cur),time:time||''};
  }
  const stepMonths=(dt,months)=>{
    const tm=dt.getMonth()+months;
    const ty=dt.getFullYear()+Math.floor(tm/12);
    const tmm=((tm%12)+12)%12;
    return new Date(ty,tmm,Math.min(dom,daysInMonth(ty,tmm)),12,0,0);
  };
  let cur=d;
  do{
    if(unit==='day')cur.setDate(cur.getDate()+every);
    else if(unit==='week')cur.setDate(cur.getDate()+7*every);
    else if(unit==='month')cur=stepMonths(cur,every);
    else if(unit==='year')cur=stepMonths(cur,12*every);
    guard++;
  }while(cur<=today&&guard<8000);
  return{due:isoDate(cur),time:time||''};
}

/* A repair for days already logged. Advancing used to stop on the first turn
   that was not in the past — and for anything overdue that turn was today, the
   very day it had just been done. The reminder then vanished from the list
   (completed today) while still counting as one of today's unfinished tasks:
   ticking it moved neither number, and the day's tally read 21/35 with ten
   tasks left on screen. Anything still sitting in that state is walked on to
   the turn it should have taken. Its own date is what advances, so nothing is
   invented: the reminder simply stops being due on the day it was finished. */
function healRepeatsStuckOnDoneDay(){
  let fixed=0;
  reminders().forEach(r=>{
    if(!r.repeat||r.repeat.unit==='hour')return;   // hourly ones do come back the same day
    if(r.done||!r.completedOn||!r.due)return;
    if(r.due>r.completedOn)return;                 // already looking ahead
    const nx=advanceDue(r.due,r.repeat,r.completedOn,r.time);
    if(nx.due!==r.due){r.due=nx.due;r.time=nx.time;r._ts=CLOCK.now();fixed++;}
  });
  if(fixed)savePlanner();
  return fixed;
}

/* What tab 2 sees. An unfinished reminder keeps its original date and keeps
   counting, exactly like Apple's — so a pile of overdue tasks does weigh on
   today's numbers, which is what was asked for. */
function plannerTodayStats(){
  const tk=todayKey();
  let total=0,done=0,overdue=0,flagsTotal=0,flagsDone=0;
  /* Every reminder is worth exactly one task a day, however many times it
     comes round inside it. Counting each turn separately pushed an hourly
     habit done ten times to 10/1 — more numerator than denominator, and a
     percentage over 100. Doing it once counts it as done; the tally on the
     row is where the repetitions are recorded. */
  reminders().forEach(r=>{
    const n=doneCount(r,tk);                                  // times ticked today
    const openNow=(!r.done&&r.due&&r.due<=tk)?1:0;            // still pending
    if(!n&&!openNow)return;                                   // finished another day
    /* Done means ticked today AND no longer waiting today. Something every six
       hours with a turn still to come is under way, not finished — counting it
       the moment it was first ticked credited a whole day's habit to its first
       round. */
    const finished=n>0&&!openNow;
    total+=1;
    if(finished)done+=1;
    if(openNow&&r.due<tk)overdue++;
    if(r.flagged){flagsTotal+=1;if(finished)flagsDone+=1;}
  });
  return{total,done,overdue,flagsTotal,flagsDone,
    // A day with no flags at all is not an annihilated day — otherwise an
    // unplanned day would hand over 100 points times the streak for free.
    annihilated:flagsTotal>0&&flagsDone===flagsTotal};
}

/* Subtasks are ordinary reminders that point at a parent, capped at two levels.
   They ride on the parent's date so they always sit with it in the same group,
   and ticking a parent ticks everything under it, the way Apple's do. */
function subtasksOf(id){return reminders().filter(r=>r.parent===id);}
function isCollapsed(id){return !!(STATE.planner.collapsed||{})[id];}
function toggleCollapse(id){
  STATE.planner.collapsed=STATE.planner.collapsed||{};
  if(STATE.planner.collapsed[id])delete STATE.planner.collapsed[id];
  else STATE.planner.collapsed[id]=true;
  savePlanner();
}
/* Indent and outdent, the way Tab and Shift-Tab work in an outliner: a
   reminder becomes a subtask of the one drawn directly above it. Picking a
   parent from a dropdown was hopeless once the list held a hundred items. */
function indentReminder(id,prevTopId){
  if(!prevTopId)return{ok:false,warn:'no-prev'};
  return updateReminder(id,{parent:prevTopId});
}
function outdentReminder(id){return updateReminder(id,{parent:null});}
/* Tags became a list. Reminders written before that carry a single `tag`
   string, so it is read through here instead of being migrated in place —
   nothing has to be rewritten for old data to keep working. */
function tagsOf(r){
  if(Array.isArray(r.tags))return r.tags;
  return r.tag?[r.tag]:[];
}
function normTags(arr){
  return [...new Set((arr||[]).map(s=>String(s).trim()).filter(Boolean))];
}
function allTags(){
  const set=new Set();
  reminders().forEach(r=>tagsOf(r).forEach(tg=>set.add(tg)));
  return [...set].sort((a,b)=>a.localeCompare(b));
}
function hasTag(r,tg){return tagsOf(r).includes(tg);}
function toggleTagFilter(tg){
  const f=STATE.tagFilters||(STATE.tagFilters=[]);
  const i=f.indexOf(tg);
  if(i>=0)f.splice(i,1); else f.push(tg);
}

/* A tag box: type a new one, or click one you already use. Used by both the
   create form and the editor so they never drift apart. */
function tagPicker(initial){
  const sel=normTags(initial);
  const wrap=dv('');
  const row=dv('row gap6');
  const inp=ip('text','','',t('rem-tag-ph'));inp.setAttribute('list','st-tags');inp.style.flex='1';
  const chosen=dv('row gap6 mt6');chosen.style.flexWrap='wrap';
  const pool=dv('row gap6 mt6');pool.style.flexWrap='wrap';
  const add=()=>{
    const v=inp.value.trim();
    if(v&&!sel.includes(v))sel.push(v);
    inp.value='';draw();
  };
  inp.onkeydown=e=>{if(e.key==='Enter'||e.key===','){e.preventDefault();add();}};
  row.appendChild(inp);
  const plus=bt('btn-ghost btn-sm','+',add);plus.style.padding='6px 12px';row.appendChild(plus);
  function draw(){
    chosen.innerHTML='';
    sel.forEach(tg=>{
      const c=bt('tagchip',tg+' ✕',()=>{sel.splice(sel.indexOf(tg),1);draw();});
      c.style.cursor='pointer';chosen.appendChild(c);
    });
    pool.innerHTML='';
    allTags().filter(tg=>!sel.includes(tg)).forEach(tg=>{
      const c=bt('tagchip',tg,()=>{sel.push(tg);draw();});
      c.style.cssText+=';opacity:.5;cursor:pointer';pool.appendChild(c);
    });
  }
  draw();
  wrap.appendChild(row);wrap.appendChild(chosen);wrap.appendChild(pool);
  return{el:wrap,get:()=>normTags(sel)};
}
/* How many times this was ticked today. Anything can be done once, but an
   hourly repeat can come round several times, and each of those is a real
   task completed — so the day's count has to see all of them, not just one. */
function doneCount(r,tk){
  return (r.doneLog&&r.doneLog.d===tk)?(r.doneLog.n||0):0;
}
function bumpDone(r,tk,delta){
  if(!r.doneLog||r.doneLog.d!==tk)r.doneLog={d:tk,n:0};
  r.doneLog.n=Math.max(0,r.doneLog.n+delta);
}
/* A log of everything ticked, kept apart from the reminders themselves.
   A repeating reminder never "finishes" — it advances to its next turn — so
   without this its rounds left no trace at all, and anything that vanished by
   accident was gone silently. Each entry is a full snapshot, so a reminder can
   be rebuilt from it even if the original is no longer there. */
const LOG_MAX=200;
function completionLog(){return STATE.planner.log||(STATE.planner.log=[]);}
function logCompletion(r,tk){
  completionLog().unshift({
    logId:uid(),srcId:r.id,date:tk,
    title:r.title,notes:r.notes||'',tags:tagsOf(r).slice(),
    priority:r.priority||0,flagged:!!r.flagged,
    repeat:r.repeat?JSON.parse(JSON.stringify(r.repeat)):null,
    due:r.due,time:r.time||'',parent:r.parent||null
  });
  STATE.planner.log=completionLog().slice(0,LOG_MAX);
}
function unlogCompletion(r,tk){
  const i=completionLog().findIndex(x=>x.srcId===r.id&&x.date===tk);
  if(i>=0)completionLog().splice(i,1);
}
function setDone(r,tk,on){
  if(on){
    r.completedOn=tk;
    bumpDone(r,tk,1);
    logCompletion(r,tk);   // snapshot taken before the date advances
    if(r.repeat){
      r._prevDue=r.due;r._prevTime=r.time||'';
      const nx=advanceDue(r.due,r.repeat,tk,r.time);
      r.due=nx.due;r.time=nx.time;
      r.done=false;
      /* Something due again in a few hours is never "done for today" — it is
         simply waiting for its next turn. Leaving it pending is what makes one
         tick bring it straight back with the next slot, instead of parking it
         in Done today and vanishing until tomorrow. The tally on the row is
         what records the ones already finished. */
      if(r.repeat.unit==='hour')r.completedOn=null;
    }else r.done=true;
  }else{
    r.completedOn=null;r.done=false;
    bumpDone(r,tk,-1);
    unlogCompletion(r,tk);
    if(r.repeat&&r._prevDue){r.due=r._prevDue;r.time=r._prevTime||'';delete r._prevDue;delete r._prevTime;}
  }
  r._ts=CLOCK.now();
}

/* Undo something from the archive. If the reminder is still around it goes
   back on the list on the date it was logged with; if it is gone — deleted, or
   lost to a bug, which is what this is for — it is rebuilt from the snapshot. */
function restoreFromLog(logId){
  const entry=completionLog().find(x=>x.logId===logId);
  if(!entry)return;
  const r=reminders().find(x=>x.id===entry.srcId);
  if(r){
    r.done=false;r.completedOn=null;
    r.due=entry.due;r.time=entry.time||'';
    delete r._prevDue;delete r._prevTime;
    if(r.doneLog&&r.doneLog.d===entry.date)r.doneLog.n=Math.max(0,r.doneLog.n-1);
    r._ts=CLOCK.now();
  }else{
    reminders().unshift({
      id:entry.srcId||uid(),title:entry.title,notes:entry.notes||'',
      due:entry.due,time:entry.time||'',priority:entry.priority||0,
      flagged:!!entry.flagged,tags:normTags(entry.tags),
      parent:reminders().some(x=>x.id===entry.parent)?entry.parent:null,
      repeat:entry.repeat||null,done:false,completedOn:null,
      created:CLOCK.now(),_ts:CLOCK.now()
    });
  }
  STATE.planner.log=completionLog().filter(x=>x.logId!==logId);
  savePlanner();
}
function toggleReminder(id){
  const r=reminders().find(x=>x.id===id);if(!r)return;
  const tk=todayKey();
  const on=r.completedOn!==tk;
  // A parent is ticked on its own. It used to carry its subtasks with it,
  // which breaks the way this is actually used: the parent is a bonus task in
  // its own right — "finish the oldest thing under here" — and its subtasks
  // repeat daily on their own schedule. Closing one must not close the rest.
  setDone(r,tk,on);
  savePlanner();
}
/* Put a finished reminder back on the list. toggleReminder cannot do this: it
   asks whether the thing was ticked TODAY, so on something closed last week it
   reads as "not done yet" and marks it done all over again. */
function reopenReminder(id){
  const r=reminders().find(x=>x.id===id);if(!r)return;
  r.done=false;r.completedOn=null;
  delete r._prevDue;delete r._prevTime;
  r._ts=CLOCK.now();savePlanner();
}
function addReminder(data){
  const parent=data.parent||null;
  const p=parent?reminders().find(x=>x.id===parent):null;
  reminders().unshift({
    id:uid(),title:data.title,notes:(data.notes||'').trim(),
    // A date given wins; a subtask created without one starts on its parent's
    // day as a convenience, never as a rule it cannot escape.
    due:data.due||(p?p.due:todayKey()),
    time:data.time||'',
    priority:data.priority||0,flagged:!!data.flagged,
    // A subtask starts in its parent's groups unless it is given its own.
    tags:normTags(data.tags&&data.tags.length?data.tags:(p?tagsOf(p):[])),
    parent:p?p.id:null,
    repeat:data.repeat||null, // subtasks keep their own rhythm, like any reminder
    done:false,completedOn:null,
    created:CLOCK.now(),_ts:CLOCK.now()
  });
  savePlanner();
}
/* Everything about a reminder stays editable. Re-parenting is the only move
   with rules attached: two levels is the cap, so something that already has
   subtasks cannot become one, and nothing can be its own parent. A reminder
   that becomes a subtask adopts its parent's date and drops its own repeat,
   since the parent's rhythm is what drives the pair. */
function updateReminder(id,patch){
  const r=reminders().find(x=>x.id===id);if(!r)return{ok:true};
  let warn='';
  if('parent' in patch){
    const np=patch.parent||null;
    if(np){
      const p=reminders().find(x=>x.id===np);
      if(subtasksOf(r.id).length){delete patch.parent;warn='sub-has-kids';}
      else if(!p||p.id===r.id||p.parent){delete patch.parent;warn='sub-bad-parent';}
      // Indenting must not move anything. A subtask keeps its own date, the way
      // dragging one under another in Apple's app leaves its date alone.
    }
  }
  Object.assign(r,patch);
  r._ts=CLOCK.now();
  savePlanner();
  return{ok:!warn,warn};
}
function deleteReminder(id){
  // Deleting a parent takes its subtasks, otherwise they are orphaned and
  // invisible while still counting toward the day.
  STATE.planner.reminders=reminders().filter(r=>r.id!==id&&r.parent!==id);
  savePlanner();
}

/* ── HOW TAB 1 FEEDS TAB 2 ──────────────────────────────────────────────
   Your hand still wins, but only until the list itself changes. Each manual
   edit is stamped with the time it was made; the moment the planner is edited
   after that, the planner takes the field back. So a number typed while the
   list was half-written is respected, and editing the list afterwards is
   respected too, without either silently outranking the other forever.

   On top of that the app refuses to help you undercount. It will not report
   fewer tasks than are actually on today's list, will not report fewer done
   than you have actually ticked, and will never let completed exceed the
   target — which is where the 200% came from.

   Typing 0 in the target is the explicit way to say "go back to automatic".
   ──────────────────────────────────────────────────────────────────────── */
function manualHolds(field){
  const at=(STATE.today._manual||{})[field]||0;
  return at>0&&at>=(STATE.planner._ts||0);
}
function markManual(field){
  STATE.today._manual=STATE.today._manual||{};
  STATE.today._manual[field]=CLOCK.now();
}
function syncPlannerToToday(){
  const s=plannerTodayStats();
  const before=JSON.stringify([STATE.today.target,STATE.today.completed,STATE.today.flagCompleted]);

  // TARGET — a manual 0 means "hand it back to the planner"
  let target=(manualHolds('target')&&STATE.today.target>0)?STATE.today.target:s.total;
  if(target<s.total)target=s.total;
  STATE.today.target=target;

  // COMPLETED — the planner can only ever raise this, never hide work you did
  let done=manualHolds('completed')?(STATE.today.completed||0):s.done;
  if(done<s.done)done=s.done;
  if(done>target)done=target;
  STATE.today.completed=done;

  // FLAGS — adding a new unfinished flagged reminder un-annihilates the day
  STATE.today.flagCompleted=manualHolds('flagCompleted')?!!STATE.today.flagCompleted:s.annihilated;

  const changed=before!==JSON.stringify([STATE.today.target,STATE.today.completed,STATE.today.flagCompleted]);
  if(changed)S.set(K.TODAY,STATE.today);
  return changed;
}

/* ═══ POMODORO ═══════════════════════════════════════════════════════════
   One focused minute is one point, so the timer's only job is to measure
   real focused minutes honestly and hand them to tab 2. It only ever adds:
   nothing here can take away pomodoros you logged by hand.
   ═══════════════════════════════════════════════════════════════════════ */
const POMO_UNIT=25; // minutes that make up one pomodoro, whatever your session length
/* The pomodoro travels with everything else. Left unsynced, a session started
   on the phone was invisible on the desktop, the cycle position disagreed
   (three done on one device, "first one" on the other), and two devices could
   each run their own timer and bank the minutes twice.
   startedAt is an absolute timestamp, so a running timer resumes correctly
   wherever it is picked up. */
function savePomo(){
  STATE.pomo._ts=CLOCK.now();
  S.set('st_pomo',STATE.pomo);
  commit();
}
function pomoPhaseLen(p){
  if(p.phase==='focus')return Math.max(1,p.focus)*60;
  if(p.phase==='long')return Math.max(1,p.longBrk)*60;
  return Math.max(1,p.brk)*60;
}
/* Seconds elapsed in the current leg, measured from the wall clock so a
   backgrounded tab or a locked phone keeps counting correctly. */
function pomoElapsed(p){
  return p.running?p.elapsed+Math.floor((CLOCK.now()-p.startedAt)/1000):p.elapsed;
}
function pomoRemaining(p){return Math.max(0,pomoPhaseLen(p)-pomoElapsed(p));}
function pomoRollDay(){
  const p=STATE.pomo,tk=todayKey();
  if(p.day!==tk){p.day=tk;p.minutesToday=0;p.doneInCycle=0;savePomo();}
}
function pomoStart(){
  const p=STATE.pomo;
  if(p.running)return;
  p.running=true;p.startedAt=CLOCK.now();savePomo();
}
function pomoPause(){
  const p=STATE.pomo;
  if(!p.running)return;
  p.elapsed=pomoElapsed(p);p.running=false;p.startedAt=0;
  // Bank the focused minutes done so far, so pausing never loses real work.
  savePomo();
}
function pomoReset(){
  const p=STATE.pomo;
  p.running=false;p.startedAt=0;p.elapsed=0;savePomo();
}
/* Ends the current leg. Focused minutes are banked and pushed to tab 2;
   breaks simply hand back to the next focus session. */
function pomoFinishPhase(auto){
  const p=STATE.pomo;
  pomoRollDay();
  const secs=pomoElapsed(p);
  if(p.phase==='focus'){
    const mins=auto?Math.max(1,p.focus):Math.floor(secs/60);
    if(mins>0){
      p.minutesToday+=mins;
      addPomodoroMinutes(mins);
    }
    p.doneInCycle=(p.doneInCycle+1)%Math.max(1,p.cycle);
    p.phase=p.doneInCycle===0?'long':'short';
  }else{
    p.phase='focus';
  }
  p.running=false;p.startedAt=0;p.elapsed=0;
  savePomo();
}
/* Tab 1 only ever ADDS to tab 2's pomodoro count — it can never subtract,
   so a number you typed by hand in tab 2 is never reduced by the timer. */
function addPomodoroMinutes(mins){
  const add=mins/POMO_UNIT;
  const now=Math.max(0,STATE.today.pomodoros||0);
  STATE.today.pomodoros=Math.round((now+add)*10)/10; // one decimal, never more
  markManual('pomodoros'); // the sum is the truth from here on
  commit();
}
function fmtClock(secs){
