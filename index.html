}
/* A short two-tone chime, built in code so the app stays a single file. */
function pomoBeep(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    const ctx=new AC();
    [[880,0],[1320,.18]].forEach(([f,at])=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.frequency.value=f;o.type='sine';o.connect(g);g.connect(ctx.destination);
      g.gain.setValueAtTime(.0001,ctx.currentTime+at);
      g.gain.exponentialRampToValueAtTime(.35,ctx.currentTime+at+.02);
      g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+at+.35);
      o.start(ctx.currentTime+at);o.stop(ctx.currentTime+at+.4);
    });
    setTimeout(()=>{try{ctx.close();}catch{}},1200);
  }catch(e){/* audio blocked — the visual change is enough */}
}

/* ═══ GOALS ═══════════════════════════════════════════════════════════════
   Weekly, quarterly and yearly goals cannot build streaks, so their reward
   comes from finishing early instead: base × the days still left in the
   period. Finish a weekly goal on Sunday and it pays ×7; leave it to
   Saturday and it pays ×1.

   Their points are kept in a separate total. They are large enough that
   landing them on a single day would make that day permanently the best one
   on record and drag every average with it, so the day's own score and the
   daily stats stay untouched.

   The week starts on Sunday, matching the calendar in the score tab.
   ═══════════════════════════════════════════════════════════════════════ */
// Yearly first, then quarterly, then weekly: you derive the shorter goals from
// the longer ones, so reading top-down is how you actually line them up.
const GOAL_KINDS=['week','quarter','year'];
/* One base for all three: the length of the period does the ranking on its
   own. A weekly tops out around 7,000, a quarterly around 92,000, a yearly at
   365,000 — a real hierarchy without a single goal dwarfing months of daily
   scoring. Bases of 10,000 and 100,000 put a yearly goal finished in August at
   13.9 million, which drowned everything else in the app. */
const GOAL_BASE={week:1000,quarter:1000,year:1000};
const GOAL_MAX={week:5,quarter:5,year:10};

function periodBounds(kind,dateStr){
  const d=new Date(dateStr+'T12:00:00');
  let start,end;
  if(kind==='week'){
    start=new Date(d);start.setDate(d.getDate()-d.getDay());        // Sunday
    end=new Date(start);end.setDate(start.getDate()+6);
  }else if(kind==='quarter'){
    const q=Math.floor(d.getMonth()/3);
    start=new Date(d.getFullYear(),q*3,1);
    end=new Date(d.getFullYear(),q*3+3,0);
  }else{
    start=new Date(d.getFullYear(),0,1);
    end=new Date(d.getFullYear(),11,31);
  }
  return{id:kind+':'+isoDate(start),start:isoDate(start),end:isoDate(end)};
}
/* Days left counting today, so finishing on the first day of a week pays ×7
   and finishing on the last pays ×1. */
function daysLeftIn(kind,dateStr){
  const{end}=periodBounds(kind,dateStr);
  const a=new Date(dateStr+'T12:00:00'),b=new Date(end+'T12:00:00');
  return Math.max(1,Math.round((b-a)/86400000)+1);
}
function goals(){return STATE.planner.goals||(STATE.planner.goals=[]);}
function goalsOf(kind){
  const now=periodBounds(kind,todayKey()).id;
  // A goal left unfinished follows you into the next period and is paid by
  // what is left of the NEW one, so the clock genuinely restarts.
  return goals().filter(g=>g.kind===kind&&(!g.doneOn||g.period===now));
}
/* The deadline is fixed the day a goal is created and never moves again.
   Paying by the days left in whatever period happens to be current made
   waiting the winning move: a weekly goal ignored all week paid ×2 on Friday
   but ×7 if you let it roll into Monday, and a yearly goal left undone all of
   2026 paid ×365 by finishing it on 2 January. The clock now runs from the
   moment you commit, so finishing sooner always pays more and postponing can
   only ever cost you. */
function goalDeadline(g){
  if(g.deadline)return g.deadline;
  // Goals created before deadlines were stored: derive it from their period.
  const start=(g.period||'').split(':')[1];
  return start?periodBounds(g.kind,start).end:periodBounds(g.kind,todayKey()).end;
}
/* The first day the goal can honestly have been finished: the day it was
   written down, or the day its period opened, whichever is later. Nothing can
   be finished before it was set, and nothing belongs to a period it did not
   live in. */
function goalFloorDate(g){
  const start=(g.period||'').split(':')[1]||periodBounds(g.kind,goalDeadline(g)).start;
  const born=g.created?new Date(g.created).toLocaleDateString('en-CA',{timeZone:appTZ()}):'';
  return born&&born>start?born:start;
}
/* How long the whole period is — the ceiling on what a goal of that kind can
   ever pay. A week can only ever be worth seven days, however the completion
   date is arrived at. */
function goalPeriodLength(g){
  const b=periodBounds(g.kind,goalDeadline(g));
  return Math.round((new Date(b.end+'T12:00:00')-new Date(b.start+'T12:00:00'))/86400000)+1;
}
function goalDaysLeft(g,from){
  const a=new Date((from||g.doneOn||todayKey())+'T12:00:00');
  const b=new Date(goalDeadline(g)+'T12:00:00');
  const days=Math.round((b-a)/86400000)+1;
  /* Floor and ceiling both. Past the deadline pays the floor; and a date from
     before the period — typed by hand, or arriving from a device that let one
     through — cannot pay more than the period itself holds. A weekly goal
     dated a month early once paid thirty-odd thousand for a seven-thousand
     goal, and the payout is recomputed from the date every time it is read, so
     capping it here retires any such number already stored. */
  return Math.max(1,Math.min(goalPeriodLength(g),days));
}
function goalIsLate(g,from){
  return (from||g.doneOn||todayKey())>goalDeadline(g);
}
function goalPoints(g){
  return GOAL_BASE[g.kind]*goalDaysLeft(g);
}
/* Recomputed from the completion date rather than read back from what was
   stored, so changing a base re-values past goals instead of leaving a mix of
   old and new rates on the total forever. */
function goalsTotal(){
  return goals().filter(g=>g.doneOn).reduce((s,g)=>s+goalPoints(g),0);
}
function addGoal(kind,title){
  if(goalsOf(kind).length>=GOAL_MAX[kind])return false;
  const b=periodBounds(kind,todayKey());
  goals().unshift({id:uid(),kind,title,period:b.id,deadline:b.end,
    doneOn:null,points:0,created:CLOCK.now(),_ts:CLOCK.now()});
  savePlanner();return true;
}
function toggleGoal(id){
  const g=goals().find(x=>x.id===id);if(!g)return;
  if(g.doneOn){g.doneOn=null;g.points=0;}
  else{g.doneOn=todayKey();g.points=goalPoints(g);}  // deadline never moves
  g._ts=CLOCK.now();savePlanner();
}
function deleteGoal(id){
  STATE.planner.goals=goals().filter(g=>g.id!==id);savePlanner();
}

const PRIO=[['0','—'],['1','!'],['2','!!'],['3','!!!']];

function weekdayNames(){return t('weekdays').split(',');}
function weekdayFull(){return t('weekdays-full').split(',');}
/* Reads as a sentence rather than as a unit and a number stuck together —
   "3 Mensual" and "12 Cada hora" said nothing. Common weekday sets get their
   own name, since "weekends" beats "Sat, Sun". */
function joinList(arr){
  if(arr.length<=1)return arr.join('');
  return arr.slice(0,-1).join(', ')+' '+t('and')+' '+arr[arr.length-1];
}
function repeatLabel(rep){
  if(!rep)return'';
  const n=Math.max(1,rep.every||1);
  const every=k=>n===1?t('rep-'+k+'-1'):t('rep-'+k+'-n').replace('{n}',n);

  if(rep.unit==='week'&&Array.isArray(rep.days)&&rep.days.length){
    const days=[...new Set(rep.days)].sort((a,b)=>a-b);
    const key=days.join(',');
    const named={'0,6':t('rep-weekends'),'1,2,3,4,5':t('rep-weekdays'),
                 '0,1,2,3,4,5,6':t('rep-everyday')}[key];
    const which=named||joinList(days.map(i=>weekdayFull()[i]));
    return '🔁 '+(n===1?which:t('rep-week-n').replace('{n}',n)+': '+which);
  }
  if(rep.unit==='month'&&Array.isArray(rep.doms)&&rep.doms.length){
    const which=t('rep-on-days')+' '+joinList([...new Set(rep.doms)].sort((a,b)=>a-b).map(String));
    return '🔁 '+(n===1?capFirst(which):t('rep-month-n').replace('{n}',n)+', '+which);
  }
  return '🔁 '+every(rep.unit);
}

    const box=dv('s6');
    tops.forEach((p,i)=>{
      const kids=kidsFor(p);
      // In a flat list "the row above" is not a parent candidate, so the
      // indent arrow is left out rather than nesting things at random.
      box.appendChild(renderReminderRow(p,tk,{prevTop:V.flat?null:(i>0?tops[i-1].id:null),kids:kids.length}));
      if(kids.length&&!isCollapsed(p.id)){
        kids.forEach(c=>{
          const w=dv('rem-sub');
          w.appendChild(renderReminderRow(c,tk,{prevTop:p.id}));
          box.appendChild(w);
        });
      }
    });
    card.appendChild(box);
  }
  /* One list rather than three columns. The date on each row already says
     where it falls — red overdue, amber today — so splitting them apart only
     scattered the day across three places. Oldest first, and within the same
     date the higher priority leads. */
  /* Filters are judged per reminder, subtasks included. A parent that passes
     used to drag its whole brood on screen regardless of their own dates and
     tags, so a December dentist appointment showed up under "Today" filtered
     to "urgent" purely because its parent qualified.
     A parent is shown when it passes on its own OR still has a subtask that
     does — so a matching subtask is never stranded out of reach — and only
     the subtasks that pass are drawn beneath it. */
  // The chosen order applies to subtasks as well, sorted within their parent.
  const order={
    'date-asc':(a,b)=>a.due===b.due?(b.priority-a.priority):a.due.localeCompare(b.due),
    'date-desc':(a,b)=>a.due===b.due?(b.priority-a.priority):b.due.localeCompare(a.due),
    'prio':(a,b)=>b.priority-a.priority||a.due.localeCompare(b.due),
    // numeric:true so hand-numbered titles read 1, 2, 10 rather than 1, 10, 2,
    // and sensitivity:'base' so accents and case do not split the order.
    'alpha':(a,b)=>(a.title||'').localeCompare(b.title||'',undefined,{numeric:true,sensitivity:'base'}),
  }[V.sort]||((a,b)=>a.due.localeCompare(b.due));
  const F=STATE.tagFilters||[];
  const passes=r=>(V.scope==='all'||r.due<=tk)&&
                  (!F.length||tagsOf(r).some(tg=>F.includes(tg)));
  const openKids=p=>subtasksOf(p.id).filter(c=>!c.done&&c.completedOn!==tk);
  const shownKids=p=>openKids(p).filter(passes).sort(order);
  /* A parent earns its place on its own merit only. It used to be pulled onto
     the screen by any subtask that passed, so a project dated 2027 sat at the
     top of a list scoped to today just because one daily step lived under it.
     Now a subtask whose parent is filtered out simply stands on its own row. */
  let tops,kidsFor;
  if(V.flat){
    // Flat: every row stands alone, judged and placed purely by the sort.
    tops=open.filter(passes).sort(order);
    kidsFor=()=>[];
  }else{
    const topRows=open.filter(r=>!r.parent&&passes(r));
    const topIds=new Set(topRows.map(r=>r.id));
    const loose=open.filter(r=>r.parent&&passes(r)&&!topIds.has(r.parent));
    tops=[...topRows,...loose].sort(order);
    kidsFor=r=>topIds.has(r.id)?shownKids(r):[];
  }
  /* Everything the filters are keeping out of sight — subtasks included — and
     how many of the rows on show are overdue. The overdue tally used to read
     top rows only while the count beside it read every row, so the same header
     answered "3 overdue" out of "10" while six of them were late. */
  const shownIds=new Set();
  let nOver=0;
  tops.forEach(p=>{
    shownIds.add(p.id);if(p.due<tk)nOver++;
    kidsFor(p).forEach(c=>{shownIds.add(c.id);if(c.due<tk)nOver++;});
  });
  const hidden=open.length-shownIds.size;
  const card=dv('card');
  const h=dv('rowb mb10');
  const left=dv('row gap8');
  // Both lists fold, so a long day can be pushed out of the way to reach what
  // is below it.
  left.style.cssText='cursor:pointer;user-select:none;flex:1';
  left.onclick=()=>{V.closedOpen=!V.closedOpen;saveView();render();};
  left.appendChild(sp('sm dimmer',V.closedOpen?'▶':'▼'));
  left.appendChild(sp('ctit',t('rem-open-h')));
  if(nOver)left.appendChild(sp('xs cr w6',`${nOver} ${nOver===1?t('rem-overdue-1'):t('rem-overdue')}`));
  left.appendChild(sp('xs dimmer',String(shownIds.size)));
  h.appendChild(left);
  const addBtn=bt(STATE.showAddForm?'btn-ghost btn-sm':'btn-ac btn-sm',STATE.showAddForm?'✕':'＋',()=>{
    STATE.showAddForm=!STATE.showAddForm;render();
  });
  addBtn.title=t('rem-new');
  h.appendChild(addBtn);
  card.appendChild(h);
  if(!V.closedOpen){
    card.appendChild(ctrl);
    if(tagBar)card.appendChild(tagBar);
    if(STATE.showAddForm)card.appendChild(form);
    fillCard(card,tops,kidsFor);
    if(hidden>0)card.appendChild(dv('xs dimmer ctr mt8',
      `${hidden} ${hidden===1?t('view-hidden-1'):t('view-hidden')}`));
  }
  wrap.appendChild(card);

  // Same rule for what was finished today: the tag filter applies per row here
  // too. Scope is not applied — anything ticked today belongs to today.
  const tagOk=r=>!(STATE.tagFilters||[]).length||tagsOf(r).some(tg=>STATE.tagFilters.includes(tg));
  // Same rule here: a subtask ticked today shows up even when its parent is
  // not done, standing on its own row instead of going missing.
  const doneAll=list.filter(r=>r.completedOn===tk&&tagOk(r));
  const doneTopIds=new Set(doneAll.filter(r=>!r.parent).map(r=>r.id));
  const doneKids=p=>doneTopIds.has(p.id)
    ? subtasksOf(p.id).filter(c=>c.completedOn===tk&&tagOk(c)).sort(order) : [];
  const doneTops=[
    ...doneAll.filter(r=>!r.parent),
    ...doneAll.filter(r=>r.parent&&!doneTopIds.has(r.parent))
  ].sort(order);
  if(doneTops.length){
    const card=dv('card mt12');
    const h=dv('rowb mb10');
    const shown=new Set();
    doneTops.forEach(p=>{shown.add(p.id);doneKids(p).forEach(c=>shown.add(c.id));});
    // The whole heading folds it, not the arrow alone — the arrow is small and
    // sits where a finger does not.
    const dleft=dv('row gap8');
    dleft.style.cssText='cursor:pointer;user-select:none;flex:1';
    dleft.onclick=()=>{V.closedDone=!V.closedDone;saveView();render();};
    const foldDone=sp('sm dimmer',V.closedDone?'▶':'▼');
    dleft.appendChild(foldDone);
    dleft.appendChild(sp('ctit cg',t('rem-done-h')));
    h.appendChild(dleft);
    h.appendChild(sp('xs dimmer',String(shown.size)));
    card.appendChild(h);
    if(!V.closedDone)fillCard(card,doneTops,doneKids);
    wrap.appendChild(card);
  }

  /* Everything finished on an earlier day, newest first and capped, so the
     archive stays browsable without the page carrying years of it.
     Note: only reminders that close for good land here. A repeating one never
     "finishes" — it advances to its next turn — so its past rounds are not
     individually recorded. */
  const ARCHIVE_MAX=LOG_MAX;
  const past=completionLog()
    .filter(x=>x.date!==tk&&(!(STATE.tagFilters||[]).length||
      normTags(x.tags).some(tg=>STATE.tagFilters.includes(tg))))
    .sort((a,b)=>b.date.localeCompare(a.date));
  if(past.length){
    const card=dv('card mt12');
    const h=dv('rowb mb10');
    const pleft=dv('row gap8');
    const openPast=!!V.openPast;   // closed until asked for; it is an archive
    const foldPast=bt('btn-icon',openPast?'▼':'▶',()=>{
      V.openPast=!openPast;saveView();render();
    });
    foldPast.style.cssText='padding:2px 4px;font-size:11px;color:var(--t3)';
    pleft.appendChild(foldPast);
    pleft.appendChild(sp('ctit dim',t('rem-past-h')));
    h.appendChild(pleft);
    h.appendChild(sp('xs dimmer',String(past.length)));
    card.appendChild(h);
    if(openPast){
      const box=dv('s6');
      past.slice(0,ARCHIVE_MAX).forEach(x=>{
        const gone=!reminders().some(r=>r.id===x.srcId);
        const row=dv('row gap8');
        row.style.cssText='background:var(--sur2);border:1px solid var(--b1);border-radius:8px;padding:7px 10px;align-items:flex-start';
        const mid=dv('f1');
        const tt=sp('sm',x.title);tt.style.color='var(--t3)';tt.style.textDecoration='line-through';
        mid.appendChild(tt);
        const meta=[`✓ ${x.date}`];
        if(x.due&&x.due!==x.date)meta.push(`${t('rem-was-due')} ${x.due}`);
        if(x.repeat)meta.push(repeatLabel(x.repeat));
        normTags(x.tags).forEach(tg=>meta.push(tg));
        if(gone)meta.push(`<span class="cy">${t('rem-gone')}</span>`);
        mid.appendChild(dv('xs dimmer mt2',meta.join(' · ')));
        row.appendChild(mid);
        const undo=bt('btn-icon','↺',()=>{restoreFromLog(x.logId);render();});
        undo.title=t('rem-reopen');
        row.appendChild(undo);
        row.appendChild(bt('btn-icon','✕',()=>{
          // Only the record goes; the reminder itself is left alone.
          STATE.planner.log=completionLog().filter(y=>y.logId!==x.logId);
          savePlanner();render();
        }));
        box.appendChild(row);
      });
      card.appendChild(box);
      if(past.length>ARCHIVE_MAX)card.appendChild(dv('xs dimmer ctr mt8',
        t('rem-past-more').replace('{n}',ARCHIVE_MAX)));
    }
    wrap.appendChild(card);
  }

  if(!list.length)wrap.appendChild(dv('card ctr dim sm mt12',t('rem-empty')));

  /* Goals open over the page instead of living beneath the list, where they
     pushed the day's work off screen. Everything about them still happens
     here — adding, ticking, deleting. */
  if(STATE.showGoals){
    const close=()=>{STATE.showGoals=false;render();};
    const ov=dv('fi');
    ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:60;'+
      'display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow:auto';
    ov.onclick=e=>{if(e.target===ov)close();};
    const panel=dv('card');
    panel.style.cssText='max-width:1100px;width:100%;margin:auto;max-height:none';
    const hd=dv('rowb mb4');
    hd.appendChild(sp('ctit',t('goals-title')));
    hd.appendChild(bt('btn-icon','✕',close));
    panel.appendChild(hd);
    panel.appendChild(renderGoals());
    ov.appendChild(panel);
    wrap.appendChild(ov);
  }
  return wrap;
}

/* The panel redraws itself rather than asking the whole page to. Stepping a
   completion date through a full render tore the overlay down and built it
   again for every press — the goals blinked out and back, once per click. */
function renderGoals(){
  const shell=dv('');
  const draw=()=>{shell.innerHTML='';shell.appendChild(buildGoals(draw));};
  draw();
  return shell;
}
function buildGoals(redraw){
  const wrap=dv('');
  const tk=todayKey();
  const tot=goalsTotal();
  if(tot)wrap.appendChild(dv('md mo ac w7 ctr mb10','+'+tot.toLocaleString()+' '+t('goal-earned')));

  const grid=dv('g3');
  GOAL_KINDS.forEach(kind=>{
    const card=dv('card');
    const list=goalsOf(kind);
    const max=GOAL_MAX[kind];
    const left=daysLeftIn(kind,tk);
    const h=dv('rowb mb6');
    h.appendChild(sp('ctit',t('goal-'+kind)));
    h.appendChild(sp('xs dimmer',`${list.length}/${max}`));
    card.appendChild(h);
    // What one finished right now would be worth — the incentive, in numbers.
    card.appendChild(dv('xs dim mb10',
      `${GOAL_BASE[kind].toLocaleString()} × ${left} ${left===1?t('goal-day'):t('goal-days')} = <span class="ac w6">${(GOAL_BASE[kind]*left).toLocaleString()}</span>`));

    if(!list.length)card.appendChild(dv('xs dimmer ctr','—'));
    const box=dv('s6');
    list.forEach(g=>{
      const row=dv('row gap8');
      row.style.cssText='background:var(--sur2);border:1px solid '+(g.doneOn?'var(--gb)':'var(--b1)')+';border-radius:10px;padding:9px 11px;align-items:flex-start';
      const cb=ip('checkbox','');cb.checked=!!g.doneOn;cb.style.marginTop='2px';
      cb.onchange=()=>{toggleGoal(g.id);redraw();};
      row.appendChild(cb);
      const mid=dv('f1');
      /* The wording is editable in place. Rewriting a goal used to mean
         deleting it and typing it again, which threw away the deadline it was
         committed to — and with it the whole point of having one. */
      const tt=sp('sm',g.title);
      tt.style.cssText='cursor:text';tt.title=t('goal-edit');
      if(g.doneOn){tt.style.textDecoration='line-through';tt.style.color='var(--t3)';}
      tt.onclick=()=>{
        const inp=ip('text','',g.title,'');inp.style.width='100%';
        const put=()=>{const v=inp.value.trim();if(v&&v!==g.title){g.title=v;g._ts=CLOCK.now();savePlanner();}redraw();};
        inp.onkeydown=e=>{if(e.key==='Enter')put();if(e.key==='Escape')redraw();};
        inp.onblur=put;
        mid.replaceChild(inp,tt);inp.focus();inp.select();
      };
      mid.appendChild(tt);
      if(g.doneOn){
        /* When it was finished, not when it was ticked. Remembering to tick a
           goal two days after doing it used to cost the two days: the payout
           reads the completion date, and the completion date was whenever you
           happened to remember. Now that date can be told the truth — no
           earlier than the day the goal was set, no later than today. */
        /* Stepped a day at a time rather than typed. A date field commits the
           instant the browser thinks it has read a whole date, so a half-typed
           day was saved and scored before the rest of it arrived — and typing
           a date outside the period paid for days the goal never had. Arrows
           cannot say anything out of range, and the year is not shown because
           there is only ever one it could be. */
        const floor=goalFloorDate(g);
        const shift=n=>{
          const d=new Date(g.doneOn+'T12:00:00');d.setDate(d.getDate()+n);
          const v=isoDate(d);
          if(v<floor||v>tk)return;
          g.doneOn=v;g.points=goalPoints(g);g._ts=CLOCK.now();savePlanner();redraw();
        };
        const dr=dv('row gap4 mt2');dr.style.alignItems='center';
        dr.appendChild(sp('xs cg',`+${goalPoints(g).toLocaleString()} ·`));
        const back=bt('btn-icon','‹',()=>shift(-1));
        const fwd=bt('btn-icon','›',()=>shift(1));
        [back,fwd].forEach(b=>{b.style.cssText='padding:0 5px;font-size:14px;line-height:1';b.title=t('goal-done-when');});
        const lbl=sp('xs cg mo',g.doneOn.slice(5).replace('-','/'));
        lbl.title=t('goal-done-when');
        back.disabled=g.doneOn<=floor;fwd.disabled=g.doneOn>=tk;
        [back,fwd].forEach(b=>{if(b.disabled)b.style.opacity='.25';});
        dr.appendChild(back);dr.appendChild(lbl);dr.appendChild(fwd);
        mid.appendChild(dr);
      }else{
        // What it is worth today, and what tomorrow costs — the whole point of
        // the rule is only obvious when both numbers are on screen.
        const late=goalIsLate(g,tk);
        const now=GOAL_BASE[kind]*goalDaysLeft(g,tk);
        if(late){
          mid.appendChild(dv('xs cy mt2',`${t('goal-past-due')} ${goalDeadline(g)} · ${t('goal-worth')} ${now.toLocaleString()}`));
        }else{
          const morning=new Date(tk+'T12:00:00');morning.setDate(morning.getDate()+1);
          const tomorrow=GOAL_BASE[kind]*goalDaysLeft(g,isoDate(morning));
          mid.appendChild(dv('xs mt2',
            `<span class="ac w6">${t('goal-worth')} ${now.toLocaleString()}</span>`+
            (tomorrow<now?` <span class="dimmer">· ${t('goal-tomorrow')} ${tomorrow.toLocaleString()}</span>`:'')));
        }
      }
      row.appendChild(mid);
      row.appendChild(bt('btn-icon','✕',()=>{
        if(confirm(t('rem-del-warn').replace('{t}',g.title))){deleteGoal(g.id);redraw();}
      }));
      box.appendChild(row);
    });
    card.appendChild(box);

    if(list.length<max){
      const gi=ip('text','','',t('goal-new'));gi.style.marginTop='8px';
      const add=()=>{
        const v=gi.value.trim();if(!v)return;
        addGoal(kind,v);redraw();
      };
      gi.onkeydown=e=>{if(e.key==='Enter')add();};
      card.appendChild(gi);
      const b=bt('btn-ghost btn-sm w100 mt6',t('goal-add'),add);b.style.width='100%';
      card.appendChild(b);
    }else card.appendChild(dv('xs dimmer ctr mt8',t('goal-full')));
    grid.appendChild(card);
  });
  wrap.appendChild(grid);
  wrap.appendChild(dv('xs dimmer ctr mt8',t('goal-note')));
  return wrap;
}

function renderPomoCard(){
  pomoRollDay();
  const p=STATE.pomo;
  const card=dv('card');
  const focusing=p.phase==='focus';
  /* Focus is amber, rest is blue. Green collided with a green day, and tying
     rest to the day's colour was worse: the day colours mean "how you are
     doing", so seeing one on a break invites a connection that is not there.
     Blue means nothing else in this app, which is exactly the point. */
  const rest='var(--cb)';
  const accent=focusing?'var(--ac)':rest;
  const head=dv('rowb mb6');
  head.appendChild(sp('ctit',t('pomo-title')));
  head.appendChild(sp('xs dimmer',`${(p.minutesToday/POMO_UNIT).toFixed(1)} 🍅 · ${p.minutesToday} min`));
  card.appendChild(head);

  const phaseLbl=focusing?t('pomo-focus'):(p.phase==='long'?t('pomo-long'):t('pomo-short'));
  const ph=dv('ctr');
  ph.innerHTML=`<div class="xs up ls" style="color:${accent}">${phaseLbl}</div>`;
  card.appendChild(ph);

  const clock=dv('ctr xxxl w8 mo');
  clock.id='pomo-clock';
  clock.style.color=accent;
  clock.textContent=fmtClock(pomoRemaining(p));
  card.appendChild(clock);

  const bar=dv('prog mt8');const fill=dv('prog-f');
  const pct=100-Math.round(pomoRemaining(p)/pomoPhaseLen(p)*100);
  fill.style.cssText=`width:${pct}%;background:${accent}`;
  bar.appendChild(fill);card.appendChild(bar);

  const dots=dv('row gap4 mt8');dots.style.justifyContent='center';
  for(let i=0;i<Math.max(1,p.cycle);i++){
    const d=dv('');
    d.style.cssText=`width:8px;height:8px;border-radius:50%;background:${i<p.doneInCycle?'var(--ac)':'var(--b2)'}`;
    dots.appendChild(d);
  }
  card.appendChild(dots);

  const ctr=dv('row gap8 mt10');
  ctr.appendChild(bt(p.running?'btn-ghost btn-sm f1':'btn-ac btn-sm f1',p.running?'⏸ '+t('pomo-pause'):'▶ '+t('pomo-start'),()=>{
    p.running?pomoPause():pomoStart();render();
  }));
  ctr.appendChild(bt('btn-ghost btn-sm',t('pomo-reset'),()=>{pomoReset();render();}));
  ctr.appendChild(bt('btn-ghost btn-sm',t('pomo-skip'),()=>{
    // Ends the leg early. A focus leg still banks the minutes truly worked.
    pomoFinishPhase(false);render();
  }));
  card.appendChild(ctr);

  /* durations */
  const cfg=dv('row gap6 mt10');cfg.style.flexWrap='wrap';
  [['focus',t('pomo-focus'),'var(--ac)'],['brk',t('pomo-short'),rest],['longBrk',t('pomo-long'),rest]].forEach(([key,lbl,col])=>{
    const w=dv('s4');w.style.flex='1';w.style.minWidth='72px';
    w.innerHTML=`<div class="xs dimmer up ls" style="color:${col}">${lbl}</div>`;
    const i=ip('number','',p[key],'');i.min=1;i.max=180;
    i.onchange=()=>{p[key]=Math.min(180,Math.max(1,parseInt(i.value)||1));savePomo();render();};
    w.appendChild(i);cfg.appendChild(w);
  });
  card.appendChild(cfg);
  card.appendChild(dv('xs dimmer mt6',t('pomo-note')));
  return card;
}

/* Notes hold real paragraphs, so they get a textarea rather than a one-line
   input — Enter inside one must make a new line, not submit anything. */
function taEl(v,ph){
  const x=document.createElement('textarea');
  x.className='diary-area';x.style.minHeight='58px';
  x.value=v||'';x.placeholder=ph||'';
  return x;
}

function renderReminderEditor(r){
  const box=dv('fi mt8');
  box.style.cssText='background:var(--sur3);border:1px solid var(--b2);border-radius:8px;padding:10px';
  const ti=ip('text','',r.title,t('rem-what'));
  const no=taEl(r.notes||'',t('rem-notes-ph'));no.style.marginTop='6px';
  box.appendChild(ti);box.appendChild(no);

  const picker=tagPicker(tagsOf(r));
  picker.el.style.marginTop='6px';
  box.appendChild(picker.el);

  const r2=dv('row gap6 mt6');r2.style.flexWrap='wrap';
  const di=ip('date','',r.due,'');di.style.flex='1';di.style.minWidth='130px';
  const hi=ip('time','',r.time||'','');hi.style.flex='0 0 110px';hi.title=t('rem-time');
  r2.appendChild(di);r2.appendChild(hi);box.appendChild(r2);

  const r3=dv('row gap6 mt6');r3.style.flexWrap='wrap';
  const pi=sk('',PRIO.map(([v,l])=>[v,`${t('rem-prio')} ${l}`]),String(r.priority||0));pi.style.flex='1';pi.style.minWidth='110px';
  box.appendChild(r3);

  /* Choosing a parent by searching. The indent arrow only reaches the row
     directly above, which is no help once sorting has put the two far apart,
     and dragging needs both on screen at once — hopeless in a list of a
     hundred. Type a few letters instead and pick from what matches. */
  const pRow=dv('mt8');
  const cur=r.parent?reminders().find(x=>x.id===r.parent):null;
  if(cur){
    const line=dv('row gap6');
    line.appendChild(sp('xs dimmer',t('rem-parent-is')));
    const chip=sp('tagchip',cur.title.slice(0,34));
    line.appendChild(chip);
    line.appendChild(bt('btn-ghost btn-xs','⤴ '+t('rem-outdent'),()=>{
      outdentReminder(r.id);STATE.editingRem=null;render();
    }));
    pRow.appendChild(line);
  }else if(subtasksOf(r.id).length){
    pRow.appendChild(dv('xs dimmer',t('rem-has-kids')));
  }else{
    const si=ip('text','','',t('rem-parent-search'));
    const res=dv('row gap6 mt6');res.style.flexWrap='wrap';
    si.oninput=()=>{
      const q=si.value.trim().toLowerCase();
      res.innerHTML='';
      if(!q)return;
      const hits=reminders().filter(x=>!x.parent&&x.id!==r.id&&
        ((x.title||'').toLowerCase().includes(q)||(x.notes||'').toLowerCase().includes(q)));
      if(!hits.length){res.appendChild(sp('xs dimmer',t('rem-parent-none')));return;}
      hits.slice(0,10).forEach(x=>{
        res.appendChild(bt('btn-ghost btn-xs','↳ '+x.title.slice(0,34),()=>{
          const out=updateReminder(r.id,{parent:x.id});
          if(!out.ok){alert(out.warn==='sub-has-kids'?t('rem-has-kids'):t('rem-bad-parent'));return;}
          STATE.editingRem=null;render();
        }));
      });
    };
    si.onkeydown=e=>{if(e.key==='Enter')e.preventDefault();};
    pRow.appendChild(si);pRow.appendChild(res);
  }
  box.appendChild(pRow);

  const r4=dv('row gap6 mt6');r4.style.flexWrap='wrap';

function renderReminderRow(r,tk,opts){
  opts=opts||{};
  const doneToday=r.completedOn===tk;
  const late=!doneToday&&r.due<tk;
  const kids=opts.kids||0;
  const row=dv('row gap10');
  row.style.cssText='background:var(--sur2);border:1px solid '+(late?'var(--rb)':'var(--b1)')+';border-radius:10px;padding:10px 12px;align-items:flex-start';

  /* Drag to nest, on anything with a pointer. The buttons below do the same
     job for touch, so this is an accelerator and never the only way. */
  row.draggable=true;
  row.ondragstart=e=>{e.dataTransfer.setData('text/plain',r.id);e.dataTransfer.effectAllowed='move';row.style.opacity='.4';};
  row.ondragend=()=>{row.style.opacity='';row.style.outline='';};
  row.ondragover=e=>{
    const id=STATE._dragId;
    if(id&&id!==r.id&&!r.parent){e.preventDefault();row.style.outline='2px solid var(--ac)';}
  };
  row.ondragleave=()=>{row.style.outline='';};
  row.ondrop=e=>{
    e.preventDefault();row.style.outline='';
    const id=e.dataTransfer.getData('text/plain');
    if(!id||id===r.id||r.parent)return;
    const res=updateReminder(id,{parent:r.id});
    if(!res.ok)alert(res.warn==='sub-has-kids'?t('rem-has-kids'):t('rem-bad-parent'));
    render();
  };
  row.addEventListener('dragstart',()=>{STATE._dragId=r.id;});

  // Collapse arrow — only where there is something to hide.
  if(kids){
    const ar=bt('btn-icon',isCollapsed(r.id)?'▶':'▼',()=>{toggleCollapse(r.id);render();});
    ar.style.cssText='padding:2px 4px;font-size:11px;color:var(--t3)';
    ar.title=isCollapsed(r.id)?t('rem-expand'):t('rem-collapse');
    row.appendChild(ar);
  }

  const cb=ip('checkbox','');cb.checked=doneToday;cb.style.marginTop='3px';
  cb.onchange=()=>{toggleReminder(r.id);render();};
  row.appendChild(cb);

  const mid=dv('f1');
  const titleLine=dv('row gap6');titleLine.style.flexWrap='wrap';
  const tt=sp('md',r.title);
  if(doneToday){tt.style.textDecoration='line-through';tt.style.color='var(--t3)';}
  /* A task with subtasks opens on its title: the whole family on one screen,
     away from the rest of the day. A task that carries a project inside it is
     easier to work through when nothing else is on the page. */
  if(!r.parent&&subtasksOf(r.id).length){
    tt.style.cursor='pointer';
    tt.title=t('rem-open-tree');
    tt.onclick=e=>{e.stopPropagation();STATE.taskTree=r.id;render();};
  }
  titleLine.appendChild(tt);
  if(r.flagged)titleLine.appendChild(sp('sm','🏁'));
  if(r.priority>0){const p=sp('sm w7',PRIO[r.priority][1]);p.style.color=prioColor(r.priority);titleLine.appendChild(p);}
  mid.appendChild(titleLine);

  tagsOf(r).forEach(tg=>{
    // Clicking a tag filters the board to it — the grouped view, one tap away.
    const c=bt('tagchip',tg,e=>{e.stopPropagation();toggleTagFilter(tg);render();});
    c.style.cssText+=';margin-left:2px;cursor:pointer';
    titleLine.appendChild(c);
  });
  if(r.notes){
    const nt=dv('sm dim mt2');nt.style.whiteSpace='pre-wrap';nt.textContent=r.notes;
    if(doneToday)nt.style.color='var(--t3)';
    mid.appendChild(nt);
  }

  const meta=[];
  // A subtask sits in its parent's column but keeps its own date, so the date
  // is coloured to say where it really falls: red overdue, amber due today.
  // A slot due later today is not late; it turns red only once its hour passes.
  const timePassed=!doneToday&&r.time&&r.due===tk&&
                   (r.due+'T'+r.time)<(tk+'T'+fmtTime(appNow()));
  const dueCls=late?'cr w6':(timePassed?'cr w6':(r.due===tk?'ac w6':''));
  meta.push(`<span class="${dueCls}">${late?t('rem-was-due')+' ':''}${r.due}${r.time?' · 🕐 '+r.time:''}</span>`);
  if(r.repeat)meta.push(repeatLabel(r.repeat));
  // Several times a day means the tally matters more than a tick.
  const n=doneCount(r,tk);
  if(n>0&&r.repeat&&r.repeat.unit==='hour')meta.push(`<span class="cg w6">✓ ${n}× ${t('rem-today-h').toLowerCase()}</span>`);
  if(kids)meta.push(`<span class="cp">${kids} ${kids===1?t('rem-subtask'):t('rem-subtasks')}</span>`);
  mid.appendChild(dv('xs dimmer mt2',meta.join(' · ')));

  // Two levels only, so a subtask cannot spawn its own.
  if(!r.parent&&!doneToday){
    const addSub=bt('btn-icon xs','＋ '+t('rem-subtask'),()=>{
      const title=prompt(t('rem-subtask-ask').replace('{t}',r.title));
      if(title&&title.trim()){addReminder({title:title.trim(),parent:r.id,tag:r.tag});render();}
    });
    addSub.style.cssText='padding:2px 0;font-size:11px;color:var(--t3)';
    mid.appendChild(addSub);
  }
  row.appendChild(mid);

  const tools=dv('row gap4');
  // Indent under the row above / lift back out — the touch-friendly twin of
  // dragging, and the reason no dropdown of every task is needed.
  if(r.parent){
    const out_=bt('btn-icon','⤴',()=>{outdentReminder(r.id);render();});
    out_.title=t('rem-outdent');tools.appendChild(out_);
  }else if(opts.prevTop&&!kids){
    const in_=bt('btn-icon','⤵',()=>{
      const res=indentReminder(r.id,opts.prevTop);
      if(!res.ok&&res.warn==='sub-has-kids')alert(t('rem-has-kids'));
      render();
    });
    in_.title=t('rem-indent');tools.appendChild(in_);
  }
  const ed=bt('btn-icon','✏️',()=>{STATE.editingRem=STATE.editingRem===r.id?null:r.id;render();});
  ed.title=t('rem-edit');
  tools.appendChild(ed);
  tools.appendChild(bt('btn-icon','✕',()=>{
    const kids=r.parent?0:subtasksOf(r.id).length;
    const msg=kids?t('rem-del-warn-kids').replace('{t}',r.title).replace('{n}',kids)
                  :t('rem-del-warn').replace('{t}',r.title);
    if(confirm(msg)){deleteReminder(r.id);render();}
  }));
  row.appendChild(tools);

  if(STATE.editingRem===r.id){
    const outer=dv('');outer.appendChild(row);outer.appendChild(renderReminderEditor(r));
    outer.style.cssText='background:var(--sur2);border:1px solid var(--acb);border-radius:10px;padding:0 0 10px';
    row.style.border='none';row.style.background='none';
    return outer;
  }
  return row;
}

/* ═══ MILESTONES ═════════════════════════════════════════════════════════
   The streak worth marking is the plain one: days on end that did not end
   red. Crossing certain numbers earns a moment of something — over the whole
   page, gone in a few seconds, once ever. The names climb the stoic virtues,
   which is more the point of the app than "achievement unlocked" would be.
   ═══════════════════════════════════════════════════════════════════════ */
const MILESTONES=[
  {n:10,word:'constancy'},{n:20,word:'discipline'},{n:50,word:'temperance'},
  {n:100,word:'fortitude'},{n:200,word:'virtue'},{n:500,word:'wisdom'},{n:1000,word:'ataraxia'}
];
/* Only what you keep up earns one. The rewards have streaks of their own and
   they are the opposite of an achievement, so nothing is ever awarded for a
   run of them. */
const MEDAL_KINDS=[
  {k:'day',    icon:'🔥',  name:'md-day',    hue:'#f97316', ok:d=>d.status&&d.status!=='red'},
  {k:'morning',icon:'🌅',  name:'md-morning',hue:'#f5c842', ok:d=>d.morning},
  {k:'flags',  icon:'🏁',  name:'md-flags',  hue:'#d4a017', ok:d=>d.flags},
  {k:'work',   icon:'💼',  name:'md-work',   hue:'#5b9df9', ok:d=>d.work>0},
  {k:'cleand', icon:'🧘',  name:'md-cleand', hue:'#34d399', ok:d=>!d.drugs},
  {k:'cleanp', icon:'🎯',  name:'md-cleanp', hue:'#a78bfa', ok:d=>!d.proc},
  {k:'cleano', icon:'🛡️', name:'md-cleano', hue:'#e879f9', ok:d=>!d.org}
];
/* One day reduced to the handful of yes-or-no answers a streak is built from,
   read the same way whether the day is closed or still being lived. */
function dayFacts(entry,isToday){
  if(isToday){
    const live=CALC.score(STATE.today,applyStreakOverrides(CALC.streaks(STATE.history,STATE.today)));
    const pens=STATE.today.penalties||[];
    return{status:live.status,morning:!!STATE.today.morningCompleted,flags:!!STATE.today.flagCompleted,
      work:STATE.today.work?.workDuration||0,
      drugs:pens.some(p=>p.type==='drugs'),proc:pens.some(p=>p.type==='internet'),org:pens.some(p=>p.type==='macanazo')};
  }
  const pens=entry.penalties||[];
  return{status:entry.status,
    morning:!!entry.streaks?.some(s=>s.type==='morning'&&s.active),
    flags:!!entry.streaks?.some(s=>s.type==='flags'&&s.active),
    work:entry.workDuration||0,
    drugs:pens.some(p=>p.type==='drugs'),proc:pens.some(p=>p.type==='internet'),org:pens.some(p=>p.type==='macanazo')};
}
/* Every medal ever earned, worked out from the days themselves rather than
   kept in a list somewhere. Fixing a day you logged wrong re-earns — or
   un-earns — whatever hung on it, which is the only way a record built on
   editable history can stay honest. A day never logged breaks everything. */
function medalsByDate(){
  const tk=todayKey();
  const map=histMap();
  const dates=[...new Set([...map.keys(),tk])].filter(d=>d<=tk).sort();
  const run={};MEDAL_KINDS.forEach(m=>run[m.k]=0);
  const out=new Map();
  dates.forEach(d=>{
    const isToday=d===tk;
    const e=map.get(d);
    if(!isToday&&(!e||e._gap)){MEDAL_KINDS.forEach(m=>run[m.k]=0);return;}
    const f=dayFacts(e,isToday);
    MEDAL_KINDS.forEach(m=>{
      if(!m.ok(f)){run[m.k]=0;return;}
      run[m.k]++;
      if(MILESTONES.some(x=>x.n===run[m.k])){
        if(!out.has(d))out.set(d,[]);
        out.get(d).push({kind:m,n:run[m.k]});
      }
    });
  });
  return out;
}
function checkMilestone(){
  if(document.querySelector('.ms-ov'))return;
  const tk=todayKey();
  const today=medalsByDate().get(tk)||[];
  if(!today.length)return;
  let seen=[];try{seen=JSON.parse(localStorage.getItem('st_milestones')||'[]');}catch(e){}
  const id=m=>m.kind.k+':'+m.n+':'+tk;
  const fresh=today.filter(m=>!seen.includes(id(m)));
  if(!fresh.length)return;
  // Several at once would talk over each other; the biggest speaks for them.
  const best=fresh.reduce((a,b)=>b.n>a.n?b:a);
  try{localStorage.setItem('st_milestones',JSON.stringify([...seen,...today.map(id)].slice(-300)));}catch(e){}
  showMilestone(best);
}
function showMilestone(m){
  const tier=MILESTONES.find(x=>x.n===m.n)||MILESTONES[0];
  const ov=dv('ms-ov');
  const card=dv('ms-card');
  card.style.setProperty('--ms',m.kind.hue);
  card.innerHTML=`<div class="ms-ico">${m.kind.icon}</div>`+
    `<div class="ms-n">${m.n}</div>`+
    `<div class="ms-w">${t(m.kind.name)}</div>`+
    `<div class="ms-sub">${t('ms-sub')} · ${t('ms-'+tier.word)}</div>`;
  for(let i=0;i<16;i++){
    const s=dv('ms-spark',m.kind.icon);
    const a=(Math.PI*2*i)/16+Math.random()*.4, r=120+Math.random()*160;
    s.style.setProperty('--dx',Math.cos(a)*r+'px');
    s.style.setProperty('--dy',Math.sin(a)*r+'px');
    s.style.animationDelay=(Math.random()*.35)+'s';
    card.appendChild(s);
  }
  ov.appendChild(card);
  document.body.appendChild(ov);
  // It leaves on its own; a click only asks it to leave sooner.
  const close=()=>{if(!ov.isConnected)return;ov.classList.add('out');setTimeout(()=>ov.remove(),620);};
  ov.onclick=close;
  setTimeout(close,3800);
}

/* ═══ LOGIN / SIGNUP ═══ */
function renderLogin(){
  const wrap=dv('login-wrap');
  const card=dv('card fi s12');card.style.cssText='max-width:400px;width:100%';
  card.innerHTML=`<div class="xxxl w8 ac ctr" style="letter-spacing:-.02em">🏛️ Stoic</div><div class="sm dim ctr mt4">${t('daily-tracker')}</div>`;

  const sbConfigured=!!(window._SUPABASE_URL&&window._SUPABASE_KEY);
  const info=dv('card2 mt12 sm');
  if(sbConfigured){
    info.style.cssText='background:var(--acd);border:1px solid var(--acb);padding:10px 12px';
    info.innerHTML=`<span class="ac">${t('cloud-active')}</span>`;
  } else {
    info.style.cssText='background:var(--sur2);border:1px solid var(--b2);padding:10px 12px';
    info.innerHTML=`<span class="dim">${t('guest-only')}</span>`;
  }
  card.appendChild(info);

  // tabs
  let mode='login';
  const modeRow=dv('row gap6');modeRow.style.marginTop='16px';
  const loginTab=bt('btn-ac btn-sm f1',t('log-in'),()=>{mode='login';syncTabs();});
  const signupTab=bt('btn-ghost btn-sm f1',t('sign-up'),()=>{mode='signup';syncTabs();});
  modeRow.appendChild(loginTab);modeRow.appendChild(signupTab);
  card.appendChild(modeRow);

  // fields
  const ew=dv('s4');ew.style.marginTop='12px';ew.innerHTML=`<div class="xs dimmer up ls">${t('email-lbl')}</div>`;
  const ei=ip('email','','','you@email.com');ew.appendChild(ei);card.appendChild(ew);
  const pw=dv('s4');pw.style.marginTop='8px';pw.innerHTML=`<div class="xs dimmer up ls">${t('pass-lbl')}</div>`;
  const pi=ip('password','','','min. 6 characters');pw.appendChild(pi);card.appendChild(pw);

  // feedback
  const err=dv('xs ng');err.style.marginTop='8px';card.appendChild(err);
  const succ=dv('xs cg');succ.style.marginTop='8px';card.appendChild(succ);

  // main button — declared before doAction so hoisting isn't an issue
  const actionBtn=bt('btn-ac',t('log-in'),()=>doAction());
  actionBtn.style.cssText='width:100%;margin-top:12px';
  card.appendChild(actionBtn);

  function syncTabs(){
    err.textContent='';succ.textContent='';
    if(mode==='login'){
      loginTab.className='btn-ac btn-sm f1';
      signupTab.className='btn-ghost btn-sm f1';
      actionBtn.textContent=t('log-in');
    } else {
      loginTab.className='btn-ghost btn-sm f1';
      signupTab.className='btn-ac btn-sm f1';
      actionBtn.textContent=t('create-acct');
    }
  }

  async function doAction(){
    err.textContent='';succ.textContent='';
    const email=ei.value.trim();
    const pass=pi.value;
    if(!email||!pass){err.textContent=t('enter-creds');return;}
    if(pass.length<6){err.textContent=t('pass-short');return;}
    if(!sbConfigured){err.textContent=t('not-configured');return;}

    actionBtn.disabled=true;
    actionBtn.textContent=mode==='login'?t('signing-in'):t('creating-acct');

    try{
      if(mode==='signup'){
        const sbUrl=(window._SUPABASE_URL||'').replace(/\/rest\/v1\/?$/,'').replace(/\/+$/,'');
        const sbKey=window._SUPABASE_KEY||'';
        const r=await fetch(`${sbUrl}/auth/v1/signup`,{
          method:'POST',
          headers:{'Content-Type':'application/json','apikey':sbKey,'Authorization':`Bearer ${sbKey}`},
          body:JSON.stringify({email,password:pass})
        });
        const d=await r.json();
        // Supabase returns user object on success
        if(d.id||d.user?.id||d.access_token){
          if(d.access_token){
            // email confirm disabled — logged in immediately
            SB.token=d.access_token;
            localStorage.setItem('AUTH_TOKEN',d.access_token);
            await afterLogin();
          } else {
            succ.textContent=t('acct-created');
            mode='login';syncTabs();
          }
        } else {
          err.textContent=d.msg||d.error_description||d.message||JSON.stringify(d);
        }
      } else {
        const res=await SB.login(email,pass);
        if(res.ok){
          await afterLogin();
        } else {
          err.textContent=res.error||t('login-failed');
        }
      }
    } catch(e){
      err.textContent=t('net-error')+e.message;
    }
    actionBtn.disabled=false;
    syncTabs();
  }

  async function afterLogin(){
    actionBtn.textContent=t('syncing');
    const remote=await SB.pull();
    if(remote){
      // Logging in MERGES cloud into local — it must never replace it.
      // This used to overwrite STATE.history/diary wholesale with whatever the
      // cloud had. When cloud sync had been silently dead for weeks, logging in
      // destroyed months of local days and diary entries in one shot.
      // applyRemote() merges history per-day (newest _ts wins, nothing deleted)
      // and unions the diary, so no entry can be lost from either side.
      applyRemote(remote);
      // Push the merged result straight back up, so anything the cloud was
      // missing lands there immediately instead of waiting for the next change.
      SB.push(STATE.history,STATE.today,STATE.diary,STATE.streakOverrides).catch(()=>{});
      // Save daily backup on login (once per day) — only mark done if it truly succeeded
      const _bkKey='st_last_backup';
      if(localStorage.getItem(_bkKey)!==todayKey()){
        SB.saveBackup(STATE.history,STATE.today,STATE.diary,STATE.streakOverrides).then(ok=>{
          if(ok) localStorage.setItem(_bkKey,todayKey());
        }).catch(()=>{});
      }
    }
    S.set(K.AUTH,true);STATE.authed=true;render();
  }

  pi.onkeydown=e=>{if(e.key==='Enter')doAction();};
  card.appendChild(hr());
  const gb=bt('btn-ghost',t('guest-btn'),()=>{S.set(K.AUTH,true);STATE.authed=true;render();});
  gb.style.width='100%';card.appendChild(gb);
  card.appendChild(dv('xs dimmer ctr mt8',t('guest-note')));
  wrap.appendChild(card);return wrap;
}

/* ═══ MAIN APP ═══ */
function renderApp(){
  /* loadToday already called at boot and after save */
  const tk=todayKey();
  // Tab 1 fills tab 2's numbers before anything is scored, skipping any field
  // already set by hand today.
  syncPlannerToToday();
  const sk_raw=CALC.streaks(STATE.history,STATE.today);
  // Apply manual overrides for TODAY only — does NOT affect history liveScore
  const sk_=applyStreakOverrides(sk_raw);
  // earlyBedStreak for display only — read from sk_ but don't mutate STATE here
  const sc=CALC.score(STATE.today,sk_);
  // #2: histTotal excludes today, score.total is today — no double count.
  // Long-goal points ride on the grand total only: they are big enough that
  // landing them on a day would own "best day" forever and skew every average.
  const total=CALC.histTotal(STATE.history)+sc.total+goalsTotal();

  const wrap=dv('');
  // HEADER
  const hdr=dv('ctr');hdr.style.padding='20px 0 16px';
  const now=new Date();
  const tz=appTZ();
  /* The title opens the rules. It is left looking exactly like a title —
     no border, no padding, no button about it — because that is how it
     should look; only the cursor gives it away. */
  hdr.innerHTML=`<div class="xxxl w8 ac" id="stoic-title" style="letter-spacing:-.02em;cursor:pointer;user-select:none" title="${t('rules-title')}">🏛️ Stoic</div>
    <div class="sm dim mt4">${capFirst(now.toLocaleDateString(STATE.lang==='es'?'es-MX':'en-US',{timeZone:tz,weekday:'long',year:'numeric',month:'long',day:'numeric'}))}</div>
    <div class="xs dimmer mt2 mo" id="clk" style="cursor:pointer" title="${t('tz-title')}">${now.toLocaleTimeString(STATE.lang==='es'?'es-MX':'en-US',{timeZone:tz,hour:'2-digit',minute:'2-digit',second:'2-digit'})}${tz!==TZ_HOME?' · '+tz.split('/').pop().replace(/_/g,' '):''}</div>`;

  hdr.querySelector('#stoic-title').onclick=()=>{STATE.showRules=true;render();};
  // The clock is where the day's boundary lives, so it is where you move it.
  hdr.querySelector('#clk').onclick=()=>{STATE.showTZ=true;render();};

  const sind=dv('row gap6 xs dim mt6');sind.style.justifyContent='center';
  // Tell the truth about sync. This used to print "Synced" whenever a token
  // merely existed, so a dead session looked perfectly healthy for two months.
  const cloudOn=SB.init();
  // "Held" is its own state: the connection works, but uploading was stopped
  // because this device is behind. Saying only "not syncing" would hide the
  // fact that the good copy is safe in the cloud and can be pulled down.
  const held=cloudOn&&SB.blocked==='would-shrink';
  const broken=cloudOn&&SB.status==='error'&&!held;
  const lastSync=!cloudOn?t('Local'):held?t('sync-held'):broken?t('sync-broken'):t('Synced');
  sind.innerHTML=`<span class="sdot"></span><span>${t('Auto-saved')} · ${lastSync}</span>`;
  // The indicator IS the control: clicking it opens the sync panel. A separate
  // cloud button next to a cloud indicator was one cloud too many.
  sind.style.cursor='pointer';
  sind.title=held?t('sync-held-fix'):broken?t('sync-fix'):t('sync-title');
  sind.onclick=()=>{STATE.showSyncPanel=!STATE.showSyncPanel;refresh();};
  if(broken||held){
    sind.style.color=held?'var(--cy)':'var(--cr)';
    sind.querySelector('.sdot').style.background=held?'var(--cy)':'var(--cr)';
  }
  hdr.appendChild(sind);
  const acts=dv('row gap8 mt10');acts.style.justifyContent='center';
  const themeBtn=bt('btn-ghost btn-sm',STATE.theme==='light'?t('dark'):t('light'),toggleTheme);
  acts.appendChild(themeBtn);
  
  // Difficulty switch
  const diffWrap=dv('row gap4');diffWrap.style.cssText='border:1px solid var(--b2);border-radius:9px;padding:2px;background:var(--sur2);';
  [{d:'easy',lbl:t('easy')},{d:'medium',lbl:t('medium')},{d:'hard',lbl:t('hard')}].forEach(({d,lbl})=>{
    const active=STATE.difficulty===d;
    const b=bt(active?'btn-ac btn-xs':'btn-xs',lbl,()=>{STATE.difficulty=d;localStorage.setItem('st_difficulty',d);commitAndRefresh();});
    if(!active){b.style.cssText='background:none;border:none;color:var(--t3);font-size:12px;padding:3px 8px;border-radius:5px;cursor:pointer';}
    diffWrap.appendChild(b);
  });
  acts.appendChild(diffWrap);
  acts.appendChild(bt('btn-ghost btn-sm',t('lang-btn'),toggleLang));
  hdr.appendChild(acts);wrap.appendChild(hdr);



  if(STATE.showSyncPanel)wrap.appendChild(renderSyncModal());

  /* The rules open over whichever tab you are on. They sit here, above the
     tabs, because the planner returns early below and would never reach them. */
  if(STATE.showRules)wrap.appendChild(renderRulesModal());
  if(STATE.showTZ)wrap.appendChild(renderTZModal());
  if(STATE.taskTree)wrap.appendChild(renderTaskTreeModal(STATE.taskTree));

  /* ── TABS ── */
  const st=plannerTodayStats();
  const tabs=dv('row gap6 mt4 mb4');
  tabs.style.cssText='justify-content:center;border:1px solid var(--b2);border-radius:11px;padding:3px;background:var(--sur2);max-width:420px;margin-left:auto;margin-right:auto';
  [['plan',`📋 ${t('tab-plan')}`,st.total?`${st.done}/${st.total}`:''],
   ['score',`📊 ${t('tab-score')}`,'']].forEach(([id,label,badge])=>{
    const active=STATE.tab===id;
    const b=bt(active?'btn-ac btn-sm f1':'btn-sm f1',label+(badge?`  ${badge}`:''),()=>{
      STATE.tab=id;localStorage.setItem('st_tab',id);render();
    });
    if(!active)b.style.cssText='background:none;border:none;color:var(--t3);flex:1';
    else b.style.flex='1';
    tabs.appendChild(b);
  });
  wrap.appendChild(tabs);

  if(STATE.tab==='plan'){
    wrap.appendChild(renderPlanner());
    wrap.appendChild(dv('xs dimmer ctr mt16 mb16',t('made-by')));
    return wrap;
  }

  const grid=dv('g4 mt4');
  const c1=dv('s12');c1.appendChild(renderScoreCard(total,sc,sk_));c1.appendChild(renderWorkCard(sk_));grid.appendChild(c1);
  grid.appendChild(renderTasksCard(sc,sk_));
  const c3=dv('s12');c3.appendChild(renderPomCard());c3.appendChild(renderPenCard(sk_));grid.appendChild(c3);
  grid.appendChild(renderSleepCard(sk_));
  wrap.appendChild(grid);
  wrap.appendChild(renderStreaks(sk_));
  /* Calendar on the left, the picked day on the right — its score, its note,
     and the ✏ that opens its numbers over the page. */
  const ch=dv('g2 mt12');
  const panel=dv('');
  const drawPanel=()=>{
    // A note being typed is written before its editor is torn down, so moving
    // to another day cannot eat the last words.
    const ta=panel.querySelector('.diary-area');
    if(ta&&ta.dataset.dirty){
      const v=diaryValue(panel);
      if(v.trim())STATE.diary[ta.dataset.day]=v; else delete STATE.diary[ta.dataset.day];
      S.set(K.DIARY,STATE.diary);
      SB.push(STATE.history,STATE.today,STATE.diary,STATE.streakOverrides).catch(()=>{});
    }
    panel.innerHTML='';panel.appendChild(renderDayPanel());
  };
  ch.appendChild(renderCalendar(drawPanel));ch.appendChild(panel);drawPanel();
  wrap.appendChild(ch);
  if(STATE.histDay)wrap.appendChild(renderHistModal(STATE.histDay));
  wrap.appendChild(renderStats(total,sc));
  // Reset All — at the bottom where it's hard to hit accidentally
  const resetWrap=dv('card mt12');resetWrap.style.cssText='border-color:var(--ngb);background:var(--ngd)';
  const resetRow=dv('rowb');
  const resetInfo=dv('');
  resetInfo.innerHTML=`<div class="sm w6 ng">${t('danger-zone')}</div><div class="xs dimmer mt2">${t('erase-warn')}</div>`;
  resetRow.appendChild(resetInfo);
  resetRow.appendChild(bt('btn-ng btn-sm',t('reset-all-btn'),()=>{STATE.showReset=!STATE.showReset;refresh()}));
  resetWrap.appendChild(resetRow);
  // Reset confirmation banner — right inside danger zone
  if(STATE.showReset){
    const ban=dv('fi row gap12 mt10');ban.style.cssText='background:var(--ngd);border:1px solid var(--ngb);border-radius:10px;padding:12px 14px;justify-content:space-between';
    ban.appendChild(sp('md ng',t('del-warn')));
    const bb=dv('row gap8');
    bb.appendChild(bt('btn-ng btn-sm',t('yes-delete'),()=>{
      STATE.history=[];STATE.today={completed:0,target:0,morningCompleted:false,flagCompleted:false,pomodoros:0,penalties:[],sleep:{sleepDuration:0,napDuration:0,sleptEarly:false,earlyBedStreak:0},work:{workDuration:0},_date:todayKey()};
      STATE.diary={};STATE.streakOverrides={};
      [K.TODAY,K.HIST,K.DIARY,K.STREAK_OVR].forEach(k=>localStorage.removeItem(k));
      STATE.showReset=false;commit();refresh();
    }));bb.appendChild(bt('btn-ghost btn-sm',t('cancel'),()=>{STATE.showReset=false;refresh()}));
    ban.appendChild(bb);resetWrap.appendChild(ban);
  }
  wrap.appendChild(resetWrap);
  // Bottom — note + restore + logout
  const bottomWrap=dv('s8 mt12 mb16');bottomWrap.style.textAlign='center';

  const backupRow=dv('row gap8');backupRow.style.justifyContent='center';backupRow.style.flexWrap='wrap';

  const backupNowBtn=bt('btn-ghost btn-sm',STATE.lang==='es'?'💾 Backup ahora':'💾 Backup now',async()=>{
    backupNowBtn.disabled=true;backupNowBtn.textContent='...';
    const ok=await SB.saveBackup(STATE.history,STATE.today,STATE.diary,STATE.streakOverrides);
    backupNowBtn.disabled=false;
    backupNowBtn.textContent=STATE.lang==='es'?'💾 Backup ahora':'💾 Backup now';
    if(ok){
      localStorage.setItem('st_last_backup',todayKey());
      alert(STATE.lang==='es'?'✅ Backup guardado en la nube.':'✅ Backup saved to the cloud.');
    } else {
      alert(STATE.lang==='es'?'❌ Falló el backup. Revisa que la tabla stoic_backups exista en Supabase con RLS correcto.':'❌ Backup failed. Check that the stoic_backups table exists in Supabase with correct RLS.');
    }
  });
  backupRow.appendChild(backupNowBtn);

  const restoreBtn=bt('btn-ghost btn-sm',t('restore-from'),async()=>{
    restoreBtn.disabled=true;restoreBtn.textContent='...';
    const list=await SB.listBackups();
    restoreBtn.disabled=false;restoreBtn.textContent=t('restore-from');
    if(!list.length){alert(t('backup-empty'));return;}
    const opts=list.map(b=>`${b.backup_date} (${new Date(b.created_at).toLocaleDateString()})`).join('\n');
    const choice=prompt(`${t('restore-from')}:\n${opts}\n\nType the date (YYYY-MM-DD):`);
    if(!choice) return;
    const bk=await SB.restoreBackup(choice.trim());
    if(!bk){alert('Not found');return;}
    if(bk.history) STATE.history=bk.history;
    if(bk.today) STATE.today=bk.today;
    if(bk.diary) STATE.diary=bk.diary;
    if(bk.streak_overrides) STATE.streakOverrides=bk.streak_overrides;
    S.set(K.HIST,STATE.history);S.set(K.TODAY,STATE.today);
    S.set(K.DIARY,STATE.diary);S.set(K.STREAK_OVR,STATE.streakOverrides);
    SB.push(STATE.history,STATE.today,STATE.diary,STATE.streakOverrides).catch(()=>{});
    alert(t('backup-restored'));refresh();
  });
  backupRow.appendChild(restoreBtn);
  bottomWrap.appendChild(backupRow);

  /* ── LOCAL EXPORT / IMPORT ──────────────────────────────────────────
     The cloud is not a backup you control: the free tier keeps no database
     backups, the project pauses itself when idle, and a lapsed session can
     leave the browser holding the only copy. These two buttons give a real
     file that survives all of that.
     ────────────────────────────────────────────────────────────────── */
  const fileRow=backupRow;

  fileRow.appendChild(bt('btn-ghost btn-sm',t('export-btn'),()=>{
    const dump={};
    for(const k of Object.keys(localStorage))dump[k]=localStorage.getItem(k);
    const blob=new Blob([JSON.stringify(dump,null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`stoic-respaldo-${todayKey()}.json`;
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  }));

  fileRow.appendChild(bt('btn-ghost btn-sm',t('import-btn'),()=>{
    const picker=document.createElement('input');
    picker.type='file';picker.accept='.json,application/json';
    picker.onchange=async()=>{
      const f=picker.files&&picker.files[0];if(!f)return;
      let dump;
      try{dump=JSON.parse(await f.text());}catch{alert(t('import-bad'));return;}
      if(!dump||typeof dump!=='object'||!dump.st_hist){alert(t('import-bad'));return;}
      let incoming=0;
      try{incoming=(JSON.parse(dump.st_hist)||[]).length;}catch{alert(t('import-bad'));return;}
      const current=(STATE.history||[]).length;
      if(!confirm(t('import-warn').replace('{n}',current)))return;
      // A restore must be exact. Writing the file's keys over the existing ones
      // left anything not present in the file behind, so the result was a blend
      // of two states rather than the file.
      try{localStorage.clear();}catch{}
      Object.entries(dump).forEach(([k,v])=>{try{localStorage.setItem(k,v);}catch{}});
      // The reload right after used to pull from the cloud and merge those days
      // straight back in, quietly undoing the restore. This flag tells the next
      // boot that this file is the truth: push it up instead of pulling down.
      localStorage.setItem('st_restore_pending','1');
      alert(t('import-ok').replace('{n}',incoming));
      location.reload();
    };
    picker.click();
  }));

  bottomWrap.appendChild(dv('xs dimmer ctr',t('backup-note')));

  bottomWrap.appendChild(bt('btn-ghost btn-sm',t('logout'),()=>{S.set(K.AUTH,false);STATE.authed=false;render();}));
  wrap.appendChild(bottomWrap);
  return wrap;
}

/* ═══ SCORE CARD ═══ */
function renderScoreCard(total,sc,sk_){
  const card=dv('card s12');
  const tr=dv('rowb mb4');tr.appendChild(sp('ctit',t('score')));tr.appendChild(sbadge(sc.status));card.appendChild(tr);
  const big=dv('');
  big.innerHTML=`<div class="xxxl w8 ac mo">${total.toLocaleString()}</div><div class="sm dim mt4">${t('today-lbl')}: <span class="ac w7">${sc.total>=0?'+':''}${sc.total}</span></div>`;
  card.appendChild(big);
  const pct=sc.pct,R=28,circ=2*Math.PI*R,off=circ-(pct/100)*circ;
  const cr=dv('row gap12 mt10');cr.style.justifyContent='center';
  cr.innerHTML=`<svg width="70" height="70" class="circ" viewBox="0 0 70 70"><circle cx="35" cy="35" r="${R}" stroke="#22222e" stroke-width="7" fill="none"/><circle cx="35" cy="35" r="${R}" stroke="var(--ac)" stroke-width="7" fill="none" stroke-dasharray="${circ}" stroke-dashoffset="${off}" stroke-linecap="round" style="transition:stroke-dashoffset .4s"/></svg><div><div class="xxl w7 ac mo">${pct}%</div><div class="xs dimmer">${STATE.today.completed}/${STATE.today.target} tasks</div></div>`;
  card.appendChild(cr);
  const posRows=[[t('daily-tasks'),sc.base],[t('morning-lbl'),sc.mB],[t('flags-lbl'),sc.fB],[t('pom-lbl'),sc.pom],[t('work-lbl'),sc.wrk],[t('sleep-lbl'),sc.slp],[t('color-lbl'),sc.col]].filter(r=>r[1]>0);
  const negRows=[[t('rewards-lbl'),sc.pen],[t('late-night-lbl'),sc.latePen||0]].filter(r=>r[1]!==0);
  if(posRows.length||negRows.length){
    const bd=dv('s4 mt10');
    posRows.forEach(([l,v])=>{const r=dv('rowb');r.innerHTML=`<span class="xs dim">${l}</span><span class="xs mo w6 ac">+${v}</span>`;bd.appendChild(r);});
    negRows.forEach(([l,v])=>{const r=dv('rowb');r.innerHTML=`<span class="xs dim">${l}</span><span class="xs mo w6 ng">${v}</span>`;bd.appendChild(r);});
    card.appendChild(bd);
  }
  return card;
}

  ft.appendChild(fc);ft.appendChild(fi_);ft.onclick=()=>{STATE.today.flagCompleted=!STATE.today.flagCompleted;markManual('flagCompleted');commitAndRefresh();};card.appendChild(ft);

/* ═══ POMODORO ═══ */
function renderPomCard(){
  const card=dv('card');
  // The timer can bank part of a pomodoro, so this shows one decimal and the
  // buttons step by whole ones without ever rounding the fraction away.
  const val=Math.round((STATE.today.pomodoros||0)*10)/10;
  const shown=Number.isInteger(val)?String(val):val.toFixed(1);
  const tr=dv('rowb mb8');tr.appendChild(sp('ctit',t('pom-lbl')));tr.appendChild(sp('xxl w7 ac mo',shown));card.appendChild(tr);
  card.appendChild(sp('xs dim',`+${Math.round(val*25)} ${t('pts-each')}`));
  const step=d=>{
    STATE.today.pomodoros=Math.max(0,Math.round(((STATE.today.pomodoros||0)+d)*10)/10);
    markManual('pomodoros');commitAndRefresh();
  };
  const ct=dv('row gap8 mt10');
  ct.appendChild(bt('btn-ghost btn-sm f1','−',()=>step(-1)));
  const n=dv('f1 ctr xl w7 mo');n.textContent=shown;ct.appendChild(n);
  ct.appendChild(bt('btn-ac btn-sm f1','+',()=>step(1)));
  card.appendChild(ct);
  if(STATE.pomo&&STATE.pomo.minutesToday>0){
    card.appendChild(dv('xs dimmer mt6',`⏱ ${STATE.pomo.minutesToday} min ${t('pomo-from-timer')}`));
  }
  return card;
}

/* ═══ PENALTY CARD — #3 keep type, #4 enter = add ═══ */
function renderPenCard(sk_){
  const card=dv('card');
  card.style.borderColor='var(--ngb)';
  const penPts=STATE.today.penalties.reduce((sum,p)=>{
    const b=CALC.penBase(p);const procMins=STATE.today.penalties.filter(x=>x.type==='internet').reduce((s,x)=>s+(x.details?.minutes||0),0);
    let m=1;
    if(p.type==='drugs')m=Math.max(1,sk_.substancesPenaltyStreak);
    else if(p.type==='internet')m=CALC.procMult(procMins,sk_.procrastinationPenaltyStreak);
    else if(p.type==='macanazo')m=Math.max(1,sk_.macanazoPenaltyStreak);
    return sum+b*m;
  },0);
  const tr=dv('rowb mb10');tr.appendChild(sp('ctit',t('rewards-lbl')));if(penPts!==0)tr.appendChild(sp('md mo w7 ng',String(penPts)));card.appendChild(tr);

  // #3: use STATE.penType so selection persists after refresh
  const tEl=sk('mb8',[['drugs',t('pen-indulg')],['internet',t('pen-proc')],['macanazo',t('pen-org')]],STATE.penType);
  tEl.onchange=()=>{STATE.penType=tEl.value;updateDet();};
  card.appendChild(tEl);

  const dw=dv('mb8');
  const si=ip('number','',1,t('num-subs'));si.min=1;
  const pi=ip('text','','',t('eg-time'));
  const errD=dv('xs ng mb8');

  function doAdd(){
    errD.textContent='';
    const type=tEl.value;
    if(type==='drugs'){
      const n=parseInt(si.value)||0;if(n<1){errD.textContent=t('min-1');return;}
      STATE.today.penalties.push({id:uid(),type:'drugs',count:n,details:{substances:n},timestamp:new Date().toISOString()});
      si.value='1';
    }else if(type==='internet'){
      const r=parseDur(pi.value);if(r.v===null){errD.textContent=r.err;return;}if(r.v===0){errD.textContent=t('enter-time');return;}
      STATE.today.penalties.push({id:uid(),type:'internet',count:r.v,details:{minutes:r.v},timestamp:new Date().toISOString()});
      pi.value='';
    }else{
      STATE.today.penalties.push({id:uid(),type:'macanazo',count:1,details:{isPositive:false},timestamp:new Date().toISOString()});
    }
    // #3: do NOT reset tEl — keep selection
    commitAndRefresh();
  }
  // #4: enter key support for all penalty inputs
  si.onkeydown=e=>{if(e.key==='Enter')doAdd();};
  pi.onkeydown=e=>{if(e.key==='Enter')doAdd();};

  function updateDet(){dw.innerHTML='';if(tEl.value==='drugs')dw.appendChild(si);else if(tEl.value==='internet')dw.appendChild(pi);}
  updateDet();card.appendChild(dw);card.appendChild(errD);
  const ab=bt('btn-ng btn-sm w100',t('add-btn'),doAdd);ab.style.width='100%';card.appendChild(ab);

  if(STATE.today.penalties.length){
    const list=dv('s6 mt12');
    const procMinsTotal=STATE.today.penalties.filter(x=>x.type==='internet').reduce((s,x)=>s+(x.details?.minutes||0),0);
    STATE.today.penalties.forEach(p=>{
      const base=CALC.penBase(p);
      let mult=1;
      if(p.type==='drugs') mult=Math.max(1,sk_.substancesPenaltyStreak);
      else if(p.type==='internet') mult=CALC.procMult(procMinsTotal,sk_.procrastinationPenaltyStreak);
      else if(p.type==='macanazo') mult=Math.max(1,sk_.macanazoPenaltyStreak);
      const actual=base*mult;
      const lbl=p.type==='drugs'?`${t('indulg-x')}${p.details?.substances||1}`:p.type==='internet'?`${t('procrast-s')} ${fmtDur(p.details?.minutes||0)}`:t('pen-org').replace('💦 ','');
      const row=dv('pen-it');
      const info=dv('f1');
      // Show label + breakdown: base × streak = actual
      const breakdown = mult>1 ? `<span class="xs dimmer">${base} × ${mult} ${t('streak-lbl')}</span>` : `<span class="xs dimmer">${t('base-lbl')}</span>`;
      info.innerHTML=`<div class="md dim">${lbl}</div><div class="row gap6 mt2">${breakdown}<span class="sm mo w7 ng">${actual}</span></div>`;
      const rm=bt('btn-icon','✕',()=>{STATE.today.penalties=STATE.today.penalties.filter(x=>x.id!==p.id);commitAndRefresh();});
      row.appendChild(info);row.appendChild(rm);list.appendChild(row);
    });card.appendChild(list);
  }
  return card;
}

  card.appendChild(sp('xs dim mb8',`+${STATE.today.work.workDuration} ${t('streak-pts')}${sk_.workStreak}d`));
