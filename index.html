    });
    paint(b,sel.has(i));
    grid.appendChild(b);
  }
  function paint(b,on){
    b.className=on?'btn-ac btn-xs':'btn-xs';
    b.style.cssText=(on?'':'background:none;border:1px solid var(--b2);color:var(--t3);')+'min-width:30px;padding:3px 4px';
  }
  wrap.appendChild(grid);
  wrap.appendChild(dv('xs dimmer mt4',t('rep-31-note')));
  return{el:wrap,get:()=>[...sel].sort((a,b)=>a-b)};
}

function renderPlanner(){
  const wrap=dv('');
  const tk=todayKey();
  const s=plannerTodayStats();

  /* The day's colour, shown where the day's work is. It comes from CALC, the
     same call the score tab makes, so the two can never disagree — and it
     reflects any manual override, since those are already folded into
     STATE.today before this runs. */
  const dayPct=STATE.today.target>0?Math.round((STATE.today.completed||0)/STATE.today.target*100):0;
  const dayStatus=CALC.status(dayPct,STATE.today.flagCompleted||false);

  const top=dv('g2 mb12');
  const sum=dv('card');
  const sr=dv('rowb');
  sr.appendChild(sp('ctit',t('rem-title')));
  // The badge carries the day's colour on its own. Tinting the count and the
  // bar as well put green in two unrelated places at once — the day's standing
  // and the pomodoro's break phase — and neither read clearly.
  const right=dv('row gap8');
  right.appendChild(sbadge(dayStatus));
  right.appendChild(sp('md mo ac w7',`${s.done}/${s.total}`));
  sr.appendChild(right);
  sum.appendChild(sr);
  const bits=[`${s.total} ${t('tasks-lbl')}`];
  if(s.overdue)bits.push(`<span class="cr">${s.overdue} ${s.overdue===1?t('rem-overdue-1'):t('rem-overdue')}</span>`);
  if(s.flagsTotal)bits.push(`🏁 ${s.flagsDone}/${s.flagsTotal}`);
  sum.appendChild(dv('xs dim mt4',bits.join(' · ')));
  if(s.annihilated)sum.appendChild(dv('xs ac mt4 w6',t('goals-ann-badge')));
  const prog=dv('prog mt10');const pf=dv('prog-f');
  pf.style.cssText=`width:${Math.min(dayPct,100)}%;background:var(--ac)`;
  prog.appendChild(pf);sum.appendChild(prog);
  sum.appendChild(dv('xs dimmer mt4 ctr',`${dayPct}%`));

  /* The long goals live further down the page, so their standing is repeated
     here where the day is summarised — otherwise you have to scroll to learn
     whether this week's goals are still open. */
  // The three tiles are the way into the goals panel — a separate button next
  // to a summary that already says the same thing was one control too many.
  const gstats=dv('row gap6 mt10');
  GOAL_KINDS.forEach(kind=>{
    const list=goalsOf(kind);
    const done=list.filter(g=>g.doneOn).length;
    const all=done&&done===list.length;
    const tile=bt('goal-tile','',()=>{STATE.showGoals=true;render();});
    tile.style.cssText=`flex:1;border:1px solid ${all?'var(--gb)':'var(--b1)'};background:${all?'var(--gd)':'var(--sur2)'};border-radius:10px;padding:8px 4px;cursor:pointer;text-align:center`;
    tile.title=t('goal-'+kind).replace(/^\S+\s/,'');
    const icon={week:'📅',quarter:'📈',year:'🏆'}[kind];
    tile.innerHTML=`<div class="sm">${icon}</div>`+
      `<div class="md mo w7 ${list.length?(all?'cg':'ac'):'dimmer'}">${done}/${list.length}</div>`;
    gstats.appendChild(tile);
  });
  sum.appendChild(gstats);
  const gt=goalsTotal();
  /* A total sitting under the three tiles read as though it counted the day's
     flags as well, which it never did — the long goals are paid apart. It
     points at the tiles instead, and says what pressing one is for. */
  sum.appendChild(dv('xs ac ctr mt6 w6',t('goal-nudge')+' ↑'));

  /* The day's goals are the flagged reminders, so they live here rather than
     with the long goals — foldable, since on a busy day the list is long. */
  /* Only what is still outstanding. A finished flag has served its purpose —
     leaving it struck through kept the day's remaining work buried under a
     list of things already dealt with. */
  const flagsAll=reminders().filter(r=>r.flagged&&(r.completedOn===tk||(!r.done&&r.due<=tk)));
  const flagsLeft=flagsAll.filter(r=>r.completedOn!==tk);
  if(flagsAll.length){
    sum.appendChild(dv('xs dimmer up ls mt10 mb6',`🏁 ${t('goal-daily')} (${s.flagsDone}/${s.flagsTotal})`));
    if(!flagsLeft.length){
      const win=dv('ctr celebrate');
      win.style.cssText='position:relative;overflow:hidden;background:var(--acd);border:1px solid var(--acb);border-radius:10px;padding:14px 10px';
      win.innerHTML=`<div class="lg w8 ac">🏅 ${t('goal-day-done')}</div>`+
        `<div class="xs dim mt2">${t('goal-day-done-sub')}</div>`;
      const conf=dv('confetti');
      conf.style.cssText='position:absolute;inset:0;pointer-events:none';
      ['🎉','✨','🎊','⭐','✨','🎉'].forEach((c,i)=>{
        const s_=document.createElement('span');
        s_.textContent=c;
        s_.style.cssText=`left:${8+i*16}%;animation-delay:${i*0.13}s`;
        conf.appendChild(s_);
      });
      win.appendChild(conf);
      sum.appendChild(win);
    }else{
      const box=dv('s4');
      flagsLeft.forEach(r=>{
        const row=dv('row gap8');
        row.style.cssText='background:var(--sur2);border:1px solid var(--b1);border-radius:8px;padding:6px 9px';
        const cb=ip('checkbox','');cb.checked=false;
        // The last flags of the day leave the same way, and the one that empties
        // this list hands straight over to the celebration that replaces it.
        cb.onchange=()=>{leaveThen(row,()=>{toggleReminder(r.id);render();});};
        row.appendChild(cb);
        /* The day's flags are your three most important tasks, and this was the
           one list in the app showing a task as a plain label — the name you
           most want to sharpen sat in the only place that would not let you.
           Same words, same press, same result as everywhere else. */
        const ttl=sp('sm f1',r.title);
        editableTitle(ttl,r,render);
        row.appendChild(ttl);
        box.appendChild(row);
      });
      sum.appendChild(box);
    }
  }

  top.appendChild(sum);
  top.appendChild(renderPomoCard());
  wrap.appendChild(top);

  /* ── the list: three columns so the day fits on one screen ── */
  const list=reminders();
  /* Filtering is a view, never a fact: the counts fed to the score tab are
     computed from the whole list, so hiding tasks here can never change them. */
  /* View controls. Scope and order are yours to set and are remembered, but
     they only ever change what is drawn — never what counts. */
  const V=STATE.view;
  const ctrl=dv('row gap8 mb10');ctrl.style.flexWrap='wrap';ctrl.style.alignItems='center';
  const seg=(opts,cur,onPick)=>{
    const g=dv('row gap4');
    g.style.cssText='border:1px solid var(--b2);border-radius:9px;padding:2px;background:var(--sur2)';
    opts.forEach(([val,lbl])=>{
      const on=cur===val;
      const b=bt(on?'btn-ac btn-xs':'btn-xs',lbl,()=>onPick(val));
      if(!on)b.style.cssText='background:none;border:none;color:var(--t3)';
      g.appendChild(b);
    });
    return g;
  };
  ctrl.appendChild(seg([['today',t('view-today')],['all',t('view-all')]],V.scope,v=>{
    V.scope=v;saveView();render();
  }));
  /* List or grid, your choice, and the same choice in both scopes. The grid
     began as the answer to All being unreadable, but a day of work reads well
     that way too — and a switch says so plainly, where a rule tied to the
     scope only ever surprised you. */
  ctrl.appendChild(seg([['list','☰'],['grid','▦'],['quad','✜']],V.layout||'list',v=>{
    V.layout=v;saveView();render();
  }));
  /* The sort buttons double as a flat/grouped switch. Pressed, the list is
     strictly sorted and nesting is dropped, so a subtask due sooner sits above
     the parent it belongs to instead of being dragged down beneath it. Press
     the active one again and the same order returns with parents back in
     charge of their subtasks. */
  /* In the cross there is nothing to flatten — every task of the day is shown
     inside its box, subtasks included — so there the buttons only pick an
     order, one of them is always on, and the one you picked last stays on. */
  const isQuad=(V.layout||'list')==='quad';
  const flatView=(V.layout||'list')!=='list';
  const sortSeg=dv('row gap4');
  sortSeg.style.cssText='border:1px solid var(--b2);border-radius:9px;padding:2px;background:var(--sur2)';
  [['date-asc','📅 ↑'],['date-desc','📅 ↓'],['prio','1️⃣'],['alpha','A→Z']].forEach(([val,lbl])=>{
    const on=V.sort===val&&(flatView||V.flat);
    const b=bt(on?'btn-ac btn-xs':'btn-xs',lbl,()=>{
      if(flatView)V.sort=val;
      else if(V.sort===val&&V.flat)V.flat=false;
      else{V.sort=val;V.flat=true;}
      saveView();render();
    });
    if(!on)b.style.cssText='background:none;border:none;color:'+(V.sort===val?'var(--t2)':'var(--t3)');
    sortSeg.appendChild(b);
  });
  ctrl.appendChild(sortSeg);
  /* In the cross the sort does not decide the shape — the quadrants do — so
     saying "grouped under parents" there would describe a list that is not
     on screen. */
  ctrl.appendChild(sp('xs dimmer',isQuad
    ? t('view-quad')
    : t('sort-'+V.sort)+' · '+((V.flat||flatView)?t('view-flat'):t('view-grouped'))));

  const tags=allTags();
  let tagBar=null;
  if(tags.length){
    tagBar=dv('row gap6 mb10');tagBar.style.flexWrap='wrap';tagBar.style.alignItems='center';
    tagBar.appendChild(sp('xs dimmer up ls',t('rem-filter')));
    tags.forEach(tg=>{
      const on=(STATE.view.tags||[]).includes(tg);
      const c=bt('tagchip',tg,()=>{toggleTagFilter(tg);render();});
      c.style.cssText+=';cursor:pointer'+(on?';outline:2px solid var(--ac)':';opacity:.55');
      tagBar.appendChild(c);
    });
    /* Said out loud once a second tag is on, because that is the moment the
       list gets smaller instead of bigger and the reason has to be visible. */
    if((STATE.view.tags||[]).length>1)tagBar.appendChild(sp('xs dimmer',t('rem-filter-all')));
    if((STATE.view.tags||[]).length)tagBar.appendChild(bt('btn-icon xs','✕ '+t('rem-filter-clear'),()=>{STATE.view.tags=[];saveView();commitAndRefresh();}));
  }
  /* What is still to do. A repeating task ticked today is not finished — it has
     another turn coming — so under "All", which is the view for everything
     ahead of you, it stays on the list with the date of that next turn. Under
     "Today" it drops out, because today's turn is done. */
  /* One rule for what is still to do, used by the rows and by the subtasks
     under them alike. A repeating task ticked today is not finished — it has
     another turn coming — so under All, the view for what is ahead of you, it
     stays on the list with the date of that next turn. Under Today it drops
     out, because today's turn is done. */
  const stillOpen=r=>!r.done&&(r.completedOn!==tk||(V.scope==='all'&&!!r.repeat));
  const open=list.filter(stillOpen);
  /* A subtask is drawn under its own parent, always — a column is chosen by the
     parent's date, and the subtask keeps and shows its own. Nesting is
     structure; the date it is due is written on the row and coloured when it is
     overdue, so nothing has to be spelled out in words. */
  // kidsFor decides which subtasks a row is allowed to show; the filters run
  // through it so nothing can ride in on its parent's ticket.
  function fillCard(card,tops,kidsFor){
    if(!tops.length){card.appendChild(dv('xs dimmer ctr','—'));return;}
    const box=dv('s6');
    tops.forEach((p,i)=>{
      const kids=kidsFor(p);
      // In a flat list "the row above" is not a parent candidate, so the
      // indent arrow is left out rather than nesting things at random.
      box.appendChild(renderReminderRow(p,tk,{prevTop:V.flat?null:(i>0?tops[i-1].id:null),kids:kids.length}));
      if(kids.length&&!isCollapsed(p.id)){
        kids.forEach(c=>{
          const w=dv('rem-sub');
          w.appendChild(renderReminderRow(c,tk,{prevTop:p.id}));
          box.appendChild(w);
        });
      }
    });
    card.appendChild(box);
  }
  /* One list rather than three columns. The date on each row already says
     where it falls — red overdue, amber today — so splitting them apart only
     scattered the day across three places. Oldest first, and within the same
     date the lower quadrant leads. */
  /* Filters are judged per reminder, subtasks included. A parent that passes
     used to drag its whole brood on screen regardless of their own dates and
     tags, so a December dentist appointment showed up under "Today" filtered
     to "urgent" purely because its parent qualified.
     A parent is shown when it passes on its own OR still has a subtask that
     does — so a matching subtask is never stranded out of reach — and only
     the subtasks that pass are drawn beneath it. */
  // The chosen order applies to subtasks as well, sorted within their parent.
  /* Quadrant 1 leads, and the unassigned trail: the sort runs on quadRank,
     which is ascending, where priority ran descending on a bigger number
     meaning louder. Sorting by the raw field would have put quadrant 4 —
     the one you are meant to drop — at the top of every list. */
  const order={
    'date-asc':(a,b)=>a.due===b.due?(quadRank(a)-quadRank(b)):a.due.localeCompare(b.due),
    'date-desc':(a,b)=>a.due===b.due?(quadRank(a)-quadRank(b)):b.due.localeCompare(a.due),
    'prio':(a,b)=>quadRank(a)-quadRank(b)||a.due.localeCompare(b.due),
    // numeric:true so hand-numbered titles read 1, 2, 10 rather than 1, 10, 2,
    // and sensitivity:'base' so accents and case do not split the order.
    'alpha':(a,b)=>(a.title||'').localeCompare(b.title||'',undefined,{numeric:true,sensitivity:'base'}),
  }[V.sort]||((a,b)=>a.due.localeCompare(b.due));
  const F=STATE.view.tags||[];
  const passes=r=>(V.scope==='all'||r.due<=tk)&&passesTags(tagsOf(r));
  /* Subtasks are judged by the very same rule as the rows above them. They had
     their own, older one, so a repeating subtask ticked today vanished from
     under its parent even under All — the family read 9 on the list and 13 in
     its own window, and the four missing were the four already done. */
  const openKids=p=>subtasksOf(p.id).filter(stillOpen);
  const shownKids=p=>openKids(p).filter(passes).sort(order);
  /* A parent earns its place on its own merit only. It used to be pulled onto
     the screen by any subtask that passed, so a project dated 2027 sat at the
     top of a list scoped to today just because one daily step lived under it.
     Now a subtask whose parent is filtered out simply stands on its own row. */
  let tops,kidsFor;
  /* The grid and the cross draw one chip per task with no room to nest, so
     "grouped under parents" there did not group anything — it simply dropped
     every subtask off the screen. Both are always flat, whatever the list
     was last left as; the sort buttons still choose the order inside them. */
  if(V.flat||flatView){
    // Flat: every row stands alone, judged and placed purely by the sort.
    tops=open.filter(passes).sort(order);
    kidsFor=()=>[];
  }else{
    const topRows=open.filter(r=>!r.parent&&passes(r));
    const topIds=new Set(topRows.map(r=>r.id));
    const loose=open.filter(r=>r.parent&&passes(r)&&!topIds.has(r.parent));
    tops=[...topRows,...loose].sort(order);
    kidsFor=r=>topIds.has(r.id)?shownKids(r):[];
  }
  /* Everything the filters are keeping out of sight — subtasks included — and
     how many of the rows on show are overdue. The overdue tally used to read
     top rows only while the count beside it read every row, so the same header
     answered "3 overdue" out of "10" while six of them were late. */
  const shownIds=new Set();
  let nOver=0;
  tops.forEach(p=>{
    shownIds.add(p.id);if(p.due<tk)nOver++;
    kidsFor(p).forEach(c=>{shownIds.add(c.id);if(c.due<tk)nOver++;});
  });
  const hidden=open.length-shownIds.size;
  const card=dv('card');
  const h=dv('rowb mb10');
  const left=dv('row gap8');
  // Both lists fold, so a long day can be pushed out of the way to reach what
  // is below it.
  left.style.cssText='cursor:pointer;user-select:none;flex:1';
  left.onclick=()=>{V.closedOpen=!V.closedOpen;saveView();render();};
  left.appendChild(sp('sm dimmer',V.closedOpen?'▶':'▼'));
  left.appendChild(sp('ctit',t('rem-open-h')));
  if(nOver)left.appendChild(sp('xs cr w6',`${nOver} ${nOver===1?t('rem-overdue-1'):t('rem-overdue')}`));
  left.appendChild(sp('xs dimmer',String(shownIds.size)));
  h.appendChild(left);
  /* Pick several and act on all of them at once. Thirteen tasks that need the
     same new date, or the same priority, are thirteen trips through the editor
     otherwise — and one wrong 🗑 away from the afternoon that prompted this. */
  const selBtn=bt(STATE.selecting?'btn-ac btn-sm':'btn-ghost btn-sm','☑',()=>{
    STATE.selecting=!STATE.selecting;STATE.selected=[];render();
  });
  selBtn.title=t('sel-mode');
  h.appendChild(selBtn);
  /* The + stays a +. It used to turn into an ✕ while the form was unfolded,
     one row above a list where every ✕ deletes a task — the same mark meaning
     "close this" and "throw this away" within a thumb's width of each other. */
  const addBtn=bt('btn-ac btn-sm','＋',()=>openAddForm());
  addBtn.title=t('rem-new');
  h.appendChild(addBtn);
  card.appendChild(h);
  if(!V.closedOpen){
    card.appendChild(ctrl);
    if(tagBar)card.appendChild(tagBar);
    // At a glance, only the names on screen can be picked; on the full list,
    // everything drawn can — so "All" means the same thing in both.
    const lay=V.layout||'list';
    const grid=lay==='grid'&&tops.length;
    const quad=lay==='quad'&&tops.length;
    if(STATE.selecting)card.appendChild(renderBulkBar((grid||quad)?tops.map(r=>r.id):[...shownIds]));
    if(quad)card.appendChild(renderQuadrants(tops,tk));
    else if(grid)card.appendChild(renderCompactGrid(tops,tk));
    else fillCard(card,tops,kidsFor);
    /* What is doing the hiding. With no tag picked, the only thing that can
       hide a row is the scope, so "later ones" was true. With one picked, most
       of what is missing is missing because of the filter — and blaming the
       dates for it sends you looking for a bug that is not there. */
    if(hidden>0)card.appendChild(dv('xs dimmer ctr mt8',
      F.length?`${hidden} ${hidden===1?t('view-hidden-f-1'):t('view-hidden-f')}`
              :`${hidden} ${hidden===1?t('view-hidden-1'):t('view-hidden')}`));
  }
  wrap.appendChild(card);

  // Same rule for what was finished today: the tag filter applies per row here
  // too. Scope is not applied — anything ticked today belongs to today.
  const tagOk=r=>passesTags(tagsOf(r));
  // Same rule here: a subtask ticked today shows up even when its parent is
  // not done, standing on its own row instead of going missing.
  const doneAll=list.filter(r=>r.completedOn===tk&&tagOk(r));
  const doneTopIds=new Set(doneAll.filter(r=>!r.parent).map(r=>r.id));
  const doneKids=p=>doneTopIds.has(p.id)
    ? subtasksOf(p.id).filter(c=>c.completedOn===tk&&tagOk(c)).sort(order) : [];
  const doneTops=[
    ...doneAll.filter(r=>!r.parent),
    ...doneAll.filter(r=>r.parent&&!doneTopIds.has(r.parent))
  ].sort(order);
  /* Everything finished on an earlier day, newest first and capped, so the
     archive stays browsable without the page carrying years of it.
     Note: only reminders that close for good land here. A repeating one never
     "finishes" — it advances to its next turn — so its past rounds are not
     individually recorded. */
  const ARCHIVE_MAX=LOG_MAX;
  const past=completionLog()
    .filter(x=>x.date!==tk&&passesTags(x.tags))
    .sort((a,b)=>b.date.localeCompare(a.date));

  /* One Done, with Today and Before inside it, the way the list above has
     Today and All. Two separate cards for the same idea put the same question
     — what have I finished — in two places, each with its own fold. */
  if(doneTops.length||past.length){
    const doneTab=(V.doneTab==='before'||!doneTops.length)&&past.length?'before':'today';
    const card=dv('card mt12');
    const h=dv('rowb mb10');
    const shown=new Set();
    doneTops.forEach(p=>{shown.add(p.id);doneKids(p).forEach(c=>shown.add(c.id));});
    // The whole heading folds it, not the arrow alone — the arrow is small and
    // sits where a finger does not.
    const dleft=dv('row gap8');
    dleft.style.cssText='cursor:pointer;user-select:none;flex:1';
    dleft.onclick=()=>{V.closedDone=!V.closedDone;saveView();render();};
    dleft.appendChild(sp('sm dimmer',V.closedDone?'▶':'▼'));
    dleft.appendChild(sp('ctit cg',t('rem-done-title')));
    h.appendChild(dleft);
    h.appendChild(sp('xs dimmer',String(doneTab==='today'?shown.size:past.length)));
    card.appendChild(h);
    if(!V.closedDone){
      const tabs=dv('row gap4 mb10');
      tabs.style.cssText='border:1px solid var(--b2);border-radius:9px;padding:2px;background:var(--sur2);width:fit-content';
      [['today',t('done-tab-today'),doneTops.length],['before',t('done-tab-before'),past.length]].forEach(([id,lbl,n])=>{
        const on=doneTab===id;
        const b=bt(on?'btn-ac btn-xs':'btn-xs',`${lbl} ${n}`,()=>{V.doneTab=id;saveView();render();});
        if(!on)b.style.cssText='background:none;border:none;color:var(--t3);font-size:12px;padding:3px 8px;border-radius:5px;cursor:pointer';
        tabs.appendChild(b);
      });
      card.appendChild(tabs);
    }
    if(!V.closedDone&&doneTab==='today')fillCard(card,doneTops,doneKids);
    if(!V.closedDone&&doneTab==='before'){
      const box=dv('s6');
      past.slice(0,ARCHIVE_MAX).forEach(x=>{
        const gone=!reminders().some(r=>r.id===x.srcId);
        const row=dv('row gap8');
        row.style.cssText='background:var(--sur2);border:1px solid var(--b1);border-radius:8px;padding:7px 10px;align-items:flex-start';
        const mid=dv('f1');
        const tt=sp('sm',x.title);tt.style.color='var(--t3)';tt.style.textDecoration='line-through';
        mid.appendChild(tt);
        const meta=[`✓ ${x.date}`];
        if(x.due&&x.due!==x.date)meta.push(`${t('rem-was-due')} ${x.due}`);
        if(x.repeat)meta.push(repeatLabel(x.repeat));
        normTags(x.tags).forEach(tg=>meta.push(tg));
        if(gone)meta.push(`<span class="cy">${t('rem-gone')}</span>`);
        mid.appendChild(dv('xs dimmer mt2',meta.join(' · ')));
        row.appendChild(mid);
        const undo=bt('btn-icon','↺',()=>{restoreFromLog(x.logId);render();});
        undo.title=t('rem-reopen');
        row.appendChild(undo);
        const drop=bt('btn-icon','🗑',()=>{
          // Only the record goes; the reminder itself is left alone.
          STATE.planner.log=completionLog().filter(y=>y.logId!==x.logId);
          savePlanner();render();
        });
        drop.title=t('sel-del');
        row.appendChild(drop);
        box.appendChild(row);
      });
      card.appendChild(box);
      if(past.length>ARCHIVE_MAX)card.appendChild(dv('xs dimmer ctr mt8',
        t('rem-past-more').replace('{n}',ARCHIVE_MAX)));
    }
    wrap.appendChild(card);
  }

  /* The bin. Below the archive, closed, and it holds whole families: a parent
     restored brings back everything that went with it. */
  const bin=deletedBin();
  if(bin.length){
    const card=dv('card mt12');
    const h=dv('rowb mb10');
    const bleft=dv('row gap8');
    const openBin=!!V.openBin;
    bleft.style.cssText='cursor:pointer;user-select:none;flex:1';
    bleft.onclick=()=>{V.openBin=!openBin;saveView();render();};
    bleft.appendChild(sp('sm dimmer',openBin?'▼':'▶'));
    bleft.appendChild(sp('ctit dim',t('rem-bin-h')));
    h.appendChild(bleft);
    h.appendChild(sp('xs dimmer',String(bin.length)));
    card.appendChild(h);
    if(openBin){
      const box=dv('s6');
      bin.forEach(x=>{
        const row=dv('row gap8');
        row.style.cssText='background:var(--sur2);border:1px solid var(--b1);border-radius:8px;padding:7px 10px;align-items:flex-start';
        const mid=dv('f1');
        const tt=sp('sm',x.title);tt.style.color='var(--t3)';mid.appendChild(tt);
        const kids=x.items.length-1;
        const when=new Date(x.at).toLocaleDateString(STATE.lang==='es'?'es-MX':'en-US',{timeZone:appTZ(),month:'short',day:'numeric'});
        mid.appendChild(dv('xs dimmer mt2',[when,kids>0?`+${kids} ${t('rem-bin-kids')}`:''].filter(Boolean).join(' · ')));
        row.appendChild(mid);
        const undo=bt('btn-icon','↺',()=>{restoreDeleted(x.binId);render();});
        undo.title=t('rem-bin-undo');
        row.appendChild(undo);
        box.appendChild(row);
      });
      card.appendChild(box);
      card.appendChild(dv('xs dimmer ctr mt8',t('rem-bin-note').replace('{n}',BIN_MAX)));
    }
    wrap.appendChild(card);
  }

  if(!list.length)wrap.appendChild(dv('card ctr dim sm mt12',t('rem-empty')));

  /* Goals open over the page instead of living beneath the list, where they
     pushed the day's work off screen. Everything about them still happens
     here — adding, ticking, deleting. */
  if(STATE.showGoals){
    const close=()=>{STATE.showGoals=false;render();};
    const ov=dv('fi');
    ov.classList.add('ovl');
    ov.onclick=e=>{if(e.target===ov)close();};
    const panel=dv('card');
    panel.style.cssText='max-width:1100px;width:100%;margin:auto;max-height:none';
    const hd=dv('rowb mb4');
    hd.appendChild(sp('ctit',t('goals-title')));
    hd.appendChild(bt('btn-icon','✕',close));
    panel.appendChild(hd);
    panel.appendChild(renderGoals());
    ov.appendChild(panel);
    wrap.appendChild(ov);
  }
  return wrap;
}

/* The panel redraws itself rather than asking the whole page to. Stepping a
   completion date through a full render tore the overlay down and built it
   again for every press — the goals blinked out and back, once per click. */
function renderGoals(){
  const shell=dv('');
  const draw=()=>{shell.innerHTML='';shell.appendChild(buildGoals(draw));};
  draw();
  return shell;
}
function buildGoals(redraw){
  const wrap=dv('');
  const tk=todayKey();
  const tot=goalsTotal();
  if(tot)wrap.appendChild(dv('md mo ac w7 ctr mb10','+'+tot.toLocaleString()+' '+t('goal-earned')));

  const grid=dv('g3');
  GOAL_KINDS.forEach(kind=>{
    const card=dv('card');
    const list=goalsOf(kind);
    const max=GOAL_MAX[kind];
    const left=daysLeftIn(kind,tk);
    const h=dv('rowb mb6');
    h.appendChild(sp('ctit',t('goal-'+kind)));
    h.appendChild(sp('xs dimmer',`${list.length}/${max}`));
    card.appendChild(h);
    // What one finished right now would be worth — the incentive, in numbers.
    card.appendChild(dv('xs dim mb10',
      `${GOAL_BASE[kind].toLocaleString()} × ${left} ${left===1?t('goal-day'):t('goal-days')} = <span class="ac w6">${(GOAL_BASE[kind]*left).toLocaleString()}</span>`));

    if(!list.length)card.appendChild(dv('xs dimmer ctr','—'));
    const box=dv('s6');
    list.forEach(g=>{
      const row=dv('row gap8');
      row.style.cssText='background:var(--sur2);border:1px solid '+(g.doneOn?'var(--gb)':'var(--b1)')+';border-radius:10px;padding:9px 11px;align-items:flex-start';
      const cb=ip('checkbox','');cb.checked=!!g.doneOn;cb.style.marginTop='2px';
      cb.onchange=()=>{toggleGoal(g.id);redraw();};
      row.appendChild(cb);
      const mid=dv('f1');
      /* The wording is editable in place. Rewriting a goal used to mean
         deleting it and typing it again, which threw away the deadline it was
         committed to — and with it the whole point of having one. */
      const tt=sp('sm',g.title);
      tt.style.cssText='cursor:text';tt.title=t('goal-edit');
      if(g.doneOn){tt.style.textDecoration='line-through';tt.style.color='var(--t3)';}
      tt.onclick=()=>{
        const inp=ip('text','',g.title,'');inp.style.width='100%';
        const put=()=>{const v=inp.value.trim();if(v&&v!==g.title){g.title=v;g._ts=CLOCK.now();savePlanner();}redraw();};
        inp.onkeydown=e=>{if(e.key==='Enter')put();if(e.key==='Escape')redraw();};
        inp.onblur=put;
        mid.replaceChild(inp,tt);inp.focus();inp.select();
      };
      mid.appendChild(tt);
      if(g.doneOn){
        /* When it was finished, not when it was ticked. Remembering to tick a
           goal two days after doing it used to cost the two days: the payout
           reads the completion date, and the completion date was whenever you
           happened to remember. Now that date can be told the truth — no
           earlier than the day the goal was set, no later than today. */
        /* Stepped a day at a time rather than typed. A date field commits the
           instant the browser thinks it has read a whole date, so a half-typed
           day was saved and scored before the rest of it arrived — and typing
           a date outside the period paid for days the goal never had. Arrows
           cannot say anything out of range, and the year is not shown because
           there is only ever one it could be. */
        const floor=goalFloorDate(g);
        const shift=n=>{
          const d=new Date(g.doneOn+'T12:00:00');d.setDate(d.getDate()+n);
          const v=isoDate(d);
          if(v<floor||v>tk)return;
          g.doneOn=v;g.points=goalPoints(g);g._ts=CLOCK.now();savePlanner();redraw();
        };
        const dr=dv('row gap4 mt2');dr.style.alignItems='center';
        dr.appendChild(sp('xs cg',`+${goalPoints(g).toLocaleString()} ·`));
        const back=bt('btn-icon','‹',()=>shift(-1));
        const fwd=bt('btn-icon','›',()=>shift(1));
        [back,fwd].forEach(b=>{b.style.cssText='padding:0 5px;font-size:14px;line-height:1';b.title=t('goal-done-when');});
        const lbl=sp('xs cg mo',fmtShort(g.doneOn));
        lbl.title=t('goal-done-when');
        back.disabled=g.doneOn<=floor;fwd.disabled=g.doneOn>=tk;
        [back,fwd].forEach(b=>{if(b.disabled)b.style.opacity='.25';});
        dr.appendChild(back);dr.appendChild(lbl);dr.appendChild(fwd);
        mid.appendChild(dr);
      }else{
        // What it is worth today, and what tomorrow costs — the whole point of
        // the rule is only obvious when both numbers are on screen.
        const late=goalIsLate(g,tk);
        const now=GOAL_BASE[kind]*goalDaysLeft(g,tk);
        if(late){
          mid.appendChild(dv('xs cy mt2',`${t('goal-past-due')} ${goalDeadline(g)} · ${t('goal-worth')} ${now.toLocaleString()}`));
        }else{
          const morning=new Date(tk+'T12:00:00');morning.setDate(morning.getDate()+1);
          const tomorrow=GOAL_BASE[kind]*goalDaysLeft(g,isoDate(morning));
          mid.appendChild(dv('xs mt2',
            `<span class="ac w6">${t('goal-worth')} ${now.toLocaleString()}</span>`+
            (tomorrow<now?` <span class="dimmer">· ${t('goal-tomorrow')} ${tomorrow.toLocaleString()}</span>`:'')));
        }
      }
      row.appendChild(mid);
      const gdel=bt('btn-icon','🗑',()=>{
        if(confirm(t('rem-del-warn').replace('{t}',g.title))){deleteGoal(g.id);redraw();}
      });
      gdel.title=t('sel-del');
      row.appendChild(gdel);
      box.appendChild(row);
    });
    card.appendChild(box);

    if(list.length<max){
      const gi=ip('text','','',t('goal-new'));gi.style.marginTop='8px';
      const add=()=>{
        const v=gi.value.trim();if(!v)return;
        addGoal(kind,v);redraw();
      };
      gi.onkeydown=e=>{if(e.key==='Enter')add();};
      card.appendChild(gi);
      const b=bt('btn-ghost btn-sm w100 mt6',t('goal-add'),add);b.style.width='100%';
      card.appendChild(b);
    }else card.appendChild(dv('xs dimmer ctr mt8',t('goal-full')));
    grid.appendChild(card);
  });
  wrap.appendChild(grid);
  wrap.appendChild(dv('xs dimmer ctr mt8',t('goal-note')));
  return wrap;
}

function renderPomoCard(){
  pomoRollDay();
  const p=STATE.pomo;
  const card=dv('card');
  const focusing=p.phase==='focus';
  /* Focus is amber, rest is blue. Green collided with a green day, and tying
     rest to the day's colour was worse: the day colours mean "how you are
     doing", so seeing one on a break invites a connection that is not there.
     Blue means nothing else in this app, which is exactly the point. */
  const rest='var(--cb)';
  const accent=focusing?'var(--ac)':rest;
  const head=dv('rowb mb6');
  head.appendChild(sp('ctit',t('pomo-title')));
  head.appendChild(sp('xs dimmer',`${(p.minutesToday/POMO_UNIT).toFixed(1)} 🍅 · ${p.minutesToday} min`));
  card.appendChild(head);

  const phaseLbl=focusing?t('pomo-focus'):(p.phase==='long'?t('pomo-long'):t('pomo-short'));
  const ph=dv('ctr');
  ph.innerHTML=`<div class="xs up ls" style="color:${accent}">${phaseLbl}</div>`;
  card.appendChild(ph);

  const clock=dv('ctr xxxl w8 mo');
  clock.id='pomo-clock';
  clock.style.color=accent;
  clock.textContent=fmtClock(pomoRemaining(p));
  card.appendChild(clock);

  const bar=dv('prog mt8');const fill=dv('prog-f');
  const pct=100-Math.round(pomoRemaining(p)/pomoPhaseLen(p)*100);
  fill.style.cssText=`width:${pct}%;background:${accent}`;
  bar.appendChild(fill);card.appendChild(bar);

  const dots=dv('row gap4 mt8');dots.style.justifyContent='center';
  for(let i=0;i<Math.max(1,p.cycle);i++){
    const d=dv('');
    d.style.cssText=`width:8px;height:8px;border-radius:50%;background:${i<p.doneInCycle?'var(--ac)':'var(--b2)'}`;
    dots.appendChild(d);
  }
  card.appendChild(dots);

  const ctr=dv('row gap8 mt10');
  ctr.appendChild(bt(p.running?'btn-ghost btn-sm f1':'btn-ac btn-sm f1',p.running?'⏸ '+t('pomo-pause'):'▶ '+t('pomo-start'),()=>{
    // Both of these need a press to be allowed at all, and this is the press.
    unlockAudio();askToNotify();
    p.running?pomoPause():pomoStart();render();
  }));
  ctr.appendChild(bt('btn-ghost btn-sm',t('pomo-reset'),()=>{pomoReset();render();}));
  ctr.appendChild(bt('btn-ghost btn-sm',t('pomo-skip'),()=>{
    // Ends the leg early. A focus leg still banks the minutes truly worked.
    pomoFinishPhase(false);render();
  }));
  card.appendChild(ctr);

  /* durations */
  const cfg=dv('row gap6 mt10');cfg.style.flexWrap='wrap';
  [['focus',t('pomo-focus'),'var(--ac)'],['brk',t('pomo-short'),rest],['longBrk',t('pomo-long'),rest]].forEach(([key,lbl,col])=>{
    const w=dv('s4');w.style.flex='1';w.style.minWidth='72px';
    w.innerHTML=`<div class="xs dimmer up ls" style="color:${col}">${lbl}</div>`;
    const i=ip('number','',p[key],'');i.min=1;i.max=180;
    i.onchange=()=>{p[key]=Math.min(180,Math.max(1,parseInt(i.value)||1));savePomo();render();};
    w.appendChild(i);cfg.appendChild(w);
  });
  card.appendChild(cfg);
  card.appendChild(dv('xs dimmer mt6',t('pomo-note')));
  return card;
}

/* Notes hold real paragraphs, so they get a textarea rather than a one-line
   input — Enter inside one must make a new line, not submit anything. */
function taEl(v,ph){
  const x=document.createElement('textarea');
  x.className='diary-area';x.style.minHeight='58px';
  x.value=v||'';x.placeholder=ph||'';
  return x;
}

function renderReminderEditor(r){
  const box=dv('fi mt8');
  box.style.cssText='background:var(--sur3);border:1px solid var(--b2);border-radius:8px;padding:10px';
  /* No title field. It sat at the top of this box with the very same words
     already on the row above it, which read as two names for one task and left
     you guessing which one counted. The name is edited where the name is. */
  const no=taEl(r.notes||'',t('rem-notes-ph'));
  box.appendChild(no);

  const picker=tagPicker(tagsOf(r));
  picker.el.style.marginTop='6px';
  box.appendChild(picker.el);

  /* Date, time and quadrant on one line. The picker was built here and then
     never put on the page — it existed, it held the right value, and it saved
     that same value straight back, so it simply could not be changed. The date
     took the whole width for a number three fields wide, which is the space
     this needed. */
  const r2=dv('row gap6 mt6');r2.style.flexWrap='wrap';
  const di=ip('date','',r.due,'');di.style.cssText='flex:0 0 148px;min-width:130px';
  const hi=ip('time','',r.time||'','');hi.style.cssText='flex:0 0 104px';hi.title=t('rem-time');
  const pi=sk('',QUAD.map(q=>[String(q),q?`${quadEmoji(q)} ${quadName(q)}`:quadName(0)]),String(quadOf(r)));
  pi.style.cssText='flex:1;min-width:120px';
  r2.appendChild(di);r2.appendChild(hi);r2.appendChild(pi);box.appendChild(r2);

  /* Choosing a parent by searching. The indent arrow only reaches the row
     directly above, which is no help once sorting has put the two far apart,
     and dragging needs both on screen at once — hopeless in a list of a
     hundred. Type a few letters instead and pick from what matches. */
  const pRow=dv('mt8');
  const cur=r.parent?reminders().find(x=>x.id===r.parent):null;
  if(cur){
    const line=dv('row gap6');
    line.appendChild(sp('xs dimmer',t('rem-parent-is')));
    const chip=sp('tagchip',cur.title.slice(0,34));
    line.appendChild(chip);
    line.appendChild(bt('btn-ghost btn-xs','⤴ '+t('rem-outdent'),()=>{
      outdentReminder(r.id);STATE.editingRem=null;render();
    }));
    pRow.appendChild(line);
  }else if(subtasksOf(r.id).length){
    pRow.appendChild(dv('xs dimmer',t('rem-has-kids')));
  }else{
    const si=ip('text','','',t('rem-parent-search'));
    const res=dv('row gap6 mt6');res.style.flexWrap='wrap';
    si.oninput=()=>{
      const q=si.value.trim().toLowerCase();
      res.innerHTML='';
      if(!q)return;
      const hits=reminders().filter(x=>!x.parent&&x.id!==r.id&&
        ((x.title||'').toLowerCase().includes(q)||(x.notes||'').toLowerCase().includes(q)));
      if(!hits.length){res.appendChild(sp('xs dimmer',t('rem-parent-none')));return;}
      hits.slice(0,10).forEach(x=>{
        res.appendChild(bt('btn-ghost btn-xs','↳ '+x.title.slice(0,34),()=>{
          const out=updateReminder(r.id,{parent:x.id});
          if(!out.ok){alert(out.warn==='sub-has-kids'?t('rem-has-kids'):t('rem-bad-parent'));return;}
          STATE.editingRem=null;render();
        }));
      });
    };
    si.onkeydown=e=>{if(e.key==='Enter')e.preventDefault();};
    pRow.appendChild(si);pRow.appendChild(res);
  }
  box.appendChild(pRow);

  const r4=dv('row gap6 mt6');r4.style.flexWrap='wrap';
  const ri=sk('',[['','🔁 '+t('rep-none')],['hour',t('rep-hour')],['day',t('rep-day')],['week',t('rep-week')],['month',t('rep-month')],['year',t('rep-year')]],r.repeat?r.repeat.unit:'');
  ri.style.flex='1';ri.style.minWidth='110px';
  const ni=ip('number','',r.repeat?r.repeat.every:1,'');ni.min=1;ni.style.width='64px';
  const fl=dv(`tog ${r.flagged?'on':''}`);fl.style.flex='1';fl.style.minWidth='130px';
  const fc=ip('checkbox','');fc.checked=!!r.flagged;
  const fw=dv('f1');fw.innerHTML=`<div class="tt">🏁 ${t('rem-flag')}</div>`;
  fl.appendChild(fc);fl.appendChild(fw);
  fl.onclick=e=>{if(e.target!==fc)fc.checked=!fc.checked;fl.classList.toggle('on',fc.checked);};
  /* Part of the morning routine. Marked the same way a daily goal is marked,
     because it answers the same kind of question — is this task one of a set
     the day is scored on — and a tag could not: a tag is yours to invent and
     Stoic cannot know which of them you meant. */
  const ml=dv(`tog ${r.morning?'on':''}`);ml.style.flex='1';ml.style.minWidth='130px';
  const mcb=ip('checkbox','');mcb.checked=!!r.morning;
  const mw=dv('f1');mw.innerHTML=`<div class="tt">🌅 ${t('rem-morning')}</div>`;
  ml.appendChild(mcb);ml.appendChild(mw);
  ml.onclick=e=>{if(e.target!==mcb)mcb.checked=!mcb.checked;ml.classList.toggle('on',mcb.checked);};
  r4.appendChild(ri);r4.appendChild(ni);r4.appendChild(fl);r4.appendChild(ml);box.appendChild(r4);
  const wd=weekdayPicker(r.repeat&&r.repeat.days||[]);
  const md=monthdayPicker(r.repeat&&r.repeat.doms||[]);
  wd.el.style.display=(r.repeat&&r.repeat.unit==='week')?'':'none';
  md.el.style.display=(r.repeat&&r.repeat.unit==='month')?'':'none';
  ri.addEventListener('change',()=>{
    wd.el.style.display=ri.value==='week'?'':'none';
    md.el.style.display=ri.value==='month'?'':'none';
  });
  box.appendChild(wd.el);box.appendChild(md.el);

  const err=dv('xs ng mt6');box.appendChild(err);
  const acts=dv('row gap8 mt8');
  acts.appendChild(bt('btn-ac btn-sm f1',t('save-btn'),()=>{
    const res=updateReminder(r.id,{
      notes:no.value.replace(/\s+$/,''),tags:picker.get(),
      due:di.value||r.due,time:hi.value,priority:parseInt(pi.value)||0,flagged:fc.checked,morning:mcb.checked,
      repeat:ri.value?{unit:ri.value,every:Math.max(1,parseInt(ni.value)||1),
        ...(ri.value==='week'&&wd.get().length?{days:wd.get()}:{}),
        ...(ri.value==='month'&&md.get().length?{doms:md.get()}:{}),
        // Remember which day of the month was meant, so clamping short months
        // never drags the date down permanently.
        ...(ri.value==='month'||ri.value==='year'
            ?{dom:new Date((di.value||r.due)+'T12:00:00').getDate()}:{})}:null
    });
    if(!res.ok){err.textContent=res.warn==='sub-has-kids'?t('rem-has-kids'):t('rem-bad-parent');return;}
    STATE.editingRem=null;render();
  }));
  acts.appendChild(bt('btn-ghost btn-sm',t('cancel'),()=>{STATE.editingRem=null;render();}));
  box.appendChild(acts);
  // Escape leaves the editor from anywhere inside it, not only from the field
  // that used to be at the top of it.
  box.onkeydown=e=>{
    if(e.key!=='Escape')return;
    // Innermost first: the editor closes, and the overlay it may be sitting in
    // stays where it is.
    e.stopPropagation();STATE.editingRem=null;render();
  };
  return box;
}

/* ═══ ALL, AT A GLANCE ═══
   Under Today the list is the day's work and every detail on a row earns its
   place. Under All it is everything you have ever set yourself, and reading
   the whole of each one to find one of them is the wrong shape: a long column
   of paragraphs you scroll past. Here it is names, in a grid, small enough to
   take in at once — and any of them opens in full with a click. */
function renderCompactGrid(items,tk,redraw){
  const rd=redraw||render;
  const g=dv('rem-grid');
  items.forEach(r=>g.appendChild(remChip(r,tk,rd)));
  return g;
}

/* One task as a chip. The compact grid and the quadrant view are the same
   chips in two different arrangements, so they are built in one place — a
   tick box that ticks, a name that opens the task in full, and the few marks
   that say what kind of thing it is. */
function remChip(r,tk,redraw){
  const rd=redraw||render;
  {
    const late=r.due<tk&&r.completedOn!==tk;
    const doneToday=r.completedOn===tk;
    /* How many are inside, counted from the family itself rather than from
       what the filters happen to be showing — a project whose steps are all
       filtered out is still a project, and looking like a loose task is how
       you forget there is anything in it. */
    const kids=r.parent?0:subtasksOf(r.id).length;
    const cell=dv('rem-chip'+(late?' late':'')+(kids?' parent':'')+(isSelected(r.id)?' sel':''));
    if(STATE.selecting){
      cell.onclick=()=>{toggleSelected(r.id);rd();};
    }else{
      cell.onclick=()=>{STATE.editingRem=null;STATE.taskTree=r.id;render();};
    }
    const top=dv('row gap4');top.style.cssText='align-items:baseline;flex-wrap:nowrap';
    if(STATE.selecting){
      top.appendChild(sp('xs',isSelected(r.id)?'☑':'☐'));
    }else{
      /* Ticking a task off is the thing you do most, so it is here too. The
         box takes the press; anywhere else on the name opens it in full. */
      const cb=ip('checkbox','');cb.checked=doneToday;
      cb.style.cssText='margin:0;flex:0 0 auto';
      cb.onclick=e=>e.stopPropagation();
      // Same rule as the list: only when the chip is actually leaving the grid.
      cb.onchange=e=>{
        e.stopPropagation();
        if(doneToday||(STATE.view.scope==='all'&&r.repeat)){toggleReminder(r.id);return rd();}
        leaveThen(cell,()=>{toggleReminder(r.id);rd();});
      };
      top.appendChild(cb);
    }
    if(r.flagged)top.appendChild(sp('xs','🏁'));
    if(r.morning)top.appendChild(sp('xs','🌅'));
    // Emoji only — the words live in the tooltip, not on the row.
    if(quadOf(r)){const p=sp('xs',quadEmoji(quadOf(r)));p.title=quadName(quadOf(r));top.appendChild(p);}
    const ttl=sp('sm rem-chip-t',r.title);
    if(doneToday){ttl.style.textDecoration='line-through';ttl.style.color='var(--t3)';}
    top.appendChild(ttl);
    cell.appendChild(top);
    const meta=[r.due===tk?t('rem-today-h'):fmtShort(r.due)];
    if(kids)meta.push('↳'+kids);
    const m=dv('xs '+(late?'cr':'dimmer'));m.style.marginTop='3px';m.textContent=meta.join(' · ');
    cell.appendChild(m);
    // Standing on its own, a subtask says where it came from.
    if(r.parent){
      const par=reminders().find(x=>x.id===r.parent);
      if(par){const pl=dv('xs cp');pl.style.cssText='margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap';
        pl.textContent='↳ '+par.title;pl.title=par.title;cell.appendChild(pl);}
    }
    return cell;
  }
}

/* ═══ THE CROSS ═══
   Urgent across the top, important down the left — the arrangement everyone
   who has seen this matrix already knows, so the position of a task is read
   before its name is. Each box says what it is asking of you rather than
   just naming itself: the point of sorting into 4 is to notice how much of
   the week lives in a box whose instruction is "postpone it". */
function renderQuadrants(items,tk,redraw){
  const rd=redraw||render;
  const g=dv('quad-grid');
  [1,2,3,4].forEach(q=>{
    const cell=dv('quad-cell q'+q);
    const h=dv('quad-h');
    h.appendChild(sp('qn',quadEmoji(q)));
    // Named, but the name is the first thing a narrow screen gives up: the
    // emoji already says which box this is, and the line below says what to
    // do about it, which is the half worth the width.
    const nm=sp('xs w7 qname',quadName(q));nm.style.color=quadColor(q);
    h.appendChild(nm);
    const mine=items.filter(r=>quadOf(r)===q);
    h.appendChild(sp('xs dimmer mo',String(mine.length)));
    cell.appendChild(h);
    cell.appendChild(dv('xs dimmer quad-do',t('quad-'+q+'-do')));
    mine.forEach(r=>cell.appendChild(remChip(r,tk,rd)));
    /* The empty part of a box is the natural place to say "one more of
       these". Clicking it opens the add form with this quadrant already
       chosen — you answered the question by choosing where you clicked.
       It takes the leftover height, so a full box has almost none of it and
       an empty box is all of it, which is where you would aim anyway. Not
       while selecting: there the whole view is in another mode. */
    if(!STATE.selecting){
      const add=dv('quad-add');
      add.title=t('rem-new')+' · '+quadName(q);
      add.appendChild(sp('',' ＋'));
      add.onclick=()=>openAddForm(q);
      cell.appendChild(add);
    }
    g.appendChild(cell);
  });
  /* Anything with no quadrant yet sits under the cross rather than inside
     it — putting it in a box would be answering the question for you. */
  const rest=items.filter(r=>!quadOf(r));
  if(!rest.length)return g;
  const wrap=dv('');
  wrap.appendChild(g);
  const un=dv('card2 mt10');
  const uh=dv('rowb mb8');
  uh.appendChild(sp('xs dimmer up ls',quadName(0)));
  uh.appendChild(sp('xs dimmer mo',String(rest.length)));
  un.appendChild(uh);
  const ug=dv('rem-grid');
  rest.forEach(r=>ug.appendChild(remChip(r,tk,rd)));
  un.appendChild(ug);
  wrap.appendChild(un);
  return wrap;
}

/* ═══ SEVERAL AT ONCE ═══ */
function isSelected(id){return (STATE.selected||[]).includes(id);}
function toggleSelected(id){
  const s=STATE.selected||(STATE.selected=[]);
  const i=s.indexOf(id);
  if(i>=0)s.splice(i,1); else s.push(id);
}
/* Applied one by one through the ordinary edit, so a bulk change follows every
   rule a single change does — nothing here writes to a reminder directly. */
/* `patch` may be a function of the reminder, for changes that depend on what
   each one already holds — adding a tag rather than replacing the lot. */
function bulkApply(patch,redraw){
  (STATE.selected||[]).forEach(id=>{
    const r=reminders().find(x=>x.id===id);
    if(!r)return;
    const p=typeof patch==='function'?patch(r):patch;
    if(p)updateReminder(id,p);
  });
  (redraw||render)();
}
/* A selection means every one of them. Pressing ✏ or 🗑 on one row of a
   selection used to act on that row alone, which is the one thing selecting
   them cannot have meant. */
function inSelection(id){
  return STATE.selecting&&isSelected(id)&&(STATE.selected||[]).length>1;
}
function bulkDelete(redraw){
  const n=(STATE.selected||[]).length;
  if(!confirm(t('sel-del-warn').replace('{n}',n)))return;
  [...(STATE.selected||[])].forEach(id=>deleteReminder(id));
  STATE.selected=[];(redraw||render)();
}
// Only the ones not yet ticked, so a mixed selection all ends up done rather
// than half of it being undone.
function bulkComplete(tk,redraw){
  (STATE.selected||[]).forEach(id=>{
    const r=reminders().find(x=>x.id===id);
    if(r&&r.completedOn!==tk&&!r.done)toggleReminder(id);
  });
  (redraw||render)();
}
function renderBulkBar(visibleIds,redraw){
  const rd=redraw||render;
  const bar=dv('row gap6 mb10');
  bar.style.cssText='flex-wrap:wrap;align-items:center;background:var(--acd);border:1px solid var(--acb);border-radius:10px;padding:8px 10px';
  const n=(STATE.selected||[]).length;
  bar.appendChild(sp('sm w6 ac',`${n} ${n===1?t('sel-one'):t('sel-count')}`));

  const all=bt('btn-ghost btn-xs',t('sel-all'),()=>{
    const every=visibleIds.every(id=>isSelected(id));
    STATE.selected=every?[]:[...visibleIds];
    rd();
  });
  bar.appendChild(all);

  if(n){
    const di=ip('date','','','');di.style.cssText='flex:0 0 140px';di.title=t('sel-date');
    di.onchange=()=>{if(di.value){snapshot();bulkApply({due:di.value},rd);}};
    bar.appendChild(di);

    const pi=sk('',[['-1',t('sel-prio')],...QUAD.map(q=>[String(q),q?`${quadEmoji(q)} ${quadName(q)}`:quadName(0)])],'-1');
    pi.style.cssText='flex:0 0 130px';
    pi.onchange=()=>{if(pi.value!=='-1'){snapshot();bulkApply({priority:parseInt(pi.value)||0},rd);}};
    bar.appendChild(pi);

    /* One button that says what pressing it will do. Two — put a flag on, take
       a flag off — asked you to work out which half of a mixed selection you
       were looking at before either could be trusted. It puts them on while
       any is missing one, and takes them all off once none is. */
    /* The mark itself is the button. What it will do is in the emoji — a flag
       to add one, a struck flag to take them off — and spelled out on hover
       for anyone who has not met it yet. A row of words for marks that already
       have a picture reads as a wall of buttons. */
    const chosen=()=>(STATE.selected||[]).map(id=>reminders().find(x=>x.id===id)).filter(Boolean);
    const toggleBtn=(key,onLbl,offLbl,onIco,offIco)=>{
      const allOn=chosen().length&&chosen().every(r=>!!r[key]);
      const b=bt('btn-ghost btn-xs',allOn?offIco:onIco,()=>{
        snapshot();bulkApply({[key]:!allOn},rd);
      });
      b.title=allOn?offLbl:onLbl;
      b.style.fontSize='15px';
      return b;
    };
    bar.appendChild(toggleBtn('flagged',t('sel-flag'),t('sel-unflag'),'🏁','⚐'));
    bar.appendChild(toggleBtn('morning',t('sel-morning'),t('sel-unmorning'),'🌅','🌙'));

    /* Nest the lot under one task. Two levels is the cap, so anything that
       already has subtasks of its own cannot go under another — those are
       skipped and counted rather than silently dropped. */
    const nest=bt('btn-ghost btn-xs','↳ '+t('sel-nest'),()=>{
      const name=prompt(t('sel-nest-ask'));
      if(!name)return;
      const q=name.trim().toLowerCase();
      const hit=reminders().find(x=>!x.parent&&!STATE.selected.includes(x.id)&&
        (x.title||'').toLowerCase().includes(q));
      if(!hit){alert(t('sel-nest-none').replace('{q}',name));return;}
      snapshot();
      let bad=0;
      (STATE.selected||[]).forEach(id=>{
        if(id===hit.id)return;
        const res=updateReminder(id,{parent:hit.id});
        if(!res.ok)bad++;
      });
      if(bad)alert(t('sel-nest-some').replace('{n}',bad));
      rd();
    });
    bar.appendChild(nest);

    const doneBtn=bt('btn-ghost btn-xs','✅',()=>{snapshot();bulkComplete(todayKey(),rd);});
    doneBtn.title=t('sel-done');doneBtn.style.fontSize='15px';
    bar.appendChild(doneBtn);

    const del=bt('btn-ng btn-xs','🗑 '+t('sel-del'),()=>{
      if(!confirm(t('sel-del-warn').replace('{n}',n)))return;
      snapshot();
      // Each goes to the bin on its own, so any of them can be put back.
      [...(STATE.selected||[])].forEach(id=>deleteReminder(id));
      STATE.selected=[];rd();
    });
    bar.appendChild(del);
  }
  /* One step back. A bulk change lands on many tasks at once, which is the
     whole point of it and also why getting one wrong is expensive — so the
     list as it stood a moment ago is kept, and one press puts it back. */
  if(STATE.bulkUndo){
    const undo=bt('btn-ac btn-xs','↺ '+t('sel-undo'),()=>{
      STATE.planner.reminders=STATE.bulkUndo.reminders;
      STATE.planner.bin=STATE.bulkUndo.bin;
      STATE.bulkUndo=null;savePlanner();rd();
    });
    undo.style.marginLeft='auto';
    bar.appendChild(undo);
  }
  return bar;
}
// The list as it stands, kept whole, so one press can put it back.
function snapshot(){
  STATE.bulkUndo={
    reminders:JSON.parse(JSON.stringify(reminders())),
    bin:JSON.parse(JSON.stringify(deletedBin()))
  };
}

/* Click the words, type, done. The same on every list in the app that shows a
   task by name, because a name you can change in one list and not in another
   is a name you have to remember which list to go to. `after` is how the list
   that owns the element redraws itself; `row` is passed where the row can be
   dragged, since a draggable row fights being selected with the mouse.
   Enter and clicking away save it; Escape leaves it alone, and so does empty. */
function editableTitle(el,r,after,row){
  el.style.cursor='text';el.title=t('goal-edit');
  el.onclick=e=>{
    e.stopPropagation();
    const inp=ip('text','',r.title,t('rem-what'));
    inp.style.cssText='flex:1 1 100%;min-width:120px';
    const put=()=>{
      const v=inp.value.trim();
      if(v&&v!==r.title)updateReminder(r.id,{title:v});
      after();
    };
    inp.onkeydown=ev=>{if(ev.key==='Enter')put();if(ev.key==='Escape')after();};
    inp.onblur=put;
    if(row)row.draggable=false;
    el.replaceWith(inp);inp.focus();inp.select();
  };
  return el;
}

function renderReminderRow(r,tk,opts){
  opts=opts||{};
  /* Where this row asks to be redrawn. On the list that is the whole page;
     inside the one-task overlay it is only the overlay, which otherwise tore
     itself down and built itself again on every tick. */
  const rd=opts.redraw||render;
  const doneToday=r.completedOn===tk;
  const late=!doneToday&&r.due<tk;
  const kids=opts.kids||0;
  const row=dv('row gap10 rem-row');
  row.style.cssText='background:var(--sur2);border:1px solid '+(late?'var(--rb)':'var(--b1)')+';border-radius:10px;padding:10px 12px;align-items:flex-start';

  /* Drag to nest, on anything with a pointer. The buttons below do the same
     job for touch, so this is an accelerator and never the only way. */
  row.draggable=true;
  row.ondragstart=e=>{e.dataTransfer.setData('text/plain',r.id);e.dataTransfer.effectAllowed='move';row.style.opacity='.4';};
  row.ondragend=()=>{row.style.opacity='';row.style.outline='';};
  row.ondragover=e=>{
    const id=STATE._dragId;
    if(id&&id!==r.id&&!r.parent){e.preventDefault();row.style.outline='2px solid var(--ac)';}
  };
  row.ondragleave=()=>{row.style.outline='';};
  row.ondrop=e=>{
    e.preventDefault();row.style.outline='';
    const id=e.dataTransfer.getData('text/plain');
    if(!id||id===r.id||r.parent)return;
    const res=updateReminder(id,{parent:r.id});
    if(!res.ok)alert(res.warn==='sub-has-kids'?t('rem-has-kids'):t('rem-bad-parent'));
    rd();
  };
  row.addEventListener('dragstart',()=>{STATE._dragId=r.id;});

  // Collapse arrow — only where there is something to hide.
  if(kids){
    const ar=bt('btn-icon',isCollapsed(r.id)?'▶':'▼',()=>{toggleCollapse(r.id);rd();});
    ar.style.cssText='padding:2px 4px;font-size:11px;color:var(--t3)';
    ar.title=isCollapsed(r.id)?t('rem-expand'):t('rem-collapse');
    row.appendChild(ar);
  }

  /* In select mode the row answers a different question — is this one of the
     ones I mean — so the box that ticks it off gives way to the box that picks
     it, rather than sitting beside it waiting to be hit by mistake. */
  if(STATE.selecting){
    const sel=ip('checkbox','');sel.checked=isSelected(r.id);sel.style.cssText='margin-top:3px;accent-color:var(--ac)';
    sel.onchange=()=>{toggleSelected(r.id);rd();};
    row.appendChild(sel);
    if(isSelected(r.id)){row.style.borderColor='var(--ac)';row.style.background='var(--acd)';}
  }else{
    const cb=ip('checkbox','');cb.checked=doneToday;cb.style.marginTop='3px';
    /* Animated only when the row is genuinely about to go. A repeating task
       under All keeps its place with the date of its next turn, the one-task
       window deliberately keeps what is already done, and putting one back is
       a correction — none of those should be performed at you, and a row that
       slid away only to reappear would be a lie about what just happened. */
    const leaves=!doneToday&&!opts.keepsDone&&
                 !(STATE.view.scope==='all'&&r.repeat);
    cb.onchange=()=>{
      if(!leaves){toggleReminder(r.id);return rd();}
      leaveThen(row,()=>{toggleReminder(r.id);rd();});
    };
    row.appendChild(cb);
  }

  const mid=dv('f1 rem-mid');
  const titleLine=dv('row gap6');titleLine.style.flexWrap='wrap';
  const tt=sp('md',r.title);
  if(doneToday){tt.style.textDecoration='line-through';tt.style.color='var(--t3)';}
  /* Rewriting a task starts on the task itself, exactly the way a goal's does.
     The editor underneath carried a second copy of the title, so the name you
     were looking at was never the one that changed — you pressed ✏️, scrolled
     past a form, and found the same words again in a box. The name is the box
     now, and the editor keeps everything that genuinely needs a form. */
  editableTitle(tt,r,rd,row);
  titleLine.appendChild(tt);
  if(r.flagged)titleLine.appendChild(sp('sm','🏁'));
  if(r.morning)titleLine.appendChild(sp('sm','🌅'));
  if(quadOf(r)){const p=sp('sm',quadEmoji(quadOf(r)));p.title=quadName(quadOf(r));titleLine.appendChild(p);}
  mid.appendChild(titleLine);

  tagsOf(r).forEach(tg=>{
    // Clicking a tag filters the board to it — the grouped view, one tap away.
    const c=bt('tagchip',tg,e=>{e.stopPropagation();toggleTagFilter(tg);rd();});
    c.style.cssText+=';margin-left:2px;cursor:pointer';
    titleLine.appendChild(c);
  });
  if(r.notes){
    const nt=dv('sm dim mt2');nt.style.whiteSpace='pre-wrap';nt.textContent=r.notes;
    if(doneToday)nt.style.color='var(--t3)';
    mid.appendChild(nt);
  }

  const meta=[];
  // A subtask sits in its parent's column but keeps its own date, so the date
  // is coloured to say where it really falls: red overdue, amber due today.
  // A slot due later today is not late; it turns red only once its hour passes.
  const timePassed=!doneToday&&r.time&&r.due===tk&&
                   (r.due+'T'+r.time)<(tk+'T'+fmtTime(appNow()));
  const dueCls=late?'cr w6':(timePassed?'cr w6':(r.due===tk?'ac w6':''));
  meta.push(`<span class="${dueCls}">${late?t('rem-was-due')+' ':''}${r.due}${r.time?' · 🕐 '+r.time:''}</span>`);
  if(r.repeat)meta.push(repeatLabel(r.repeat));
  // Several times a day means the tally matters more than a tick.
  const n=doneCount(r,tk);
  if(n>0&&r.repeat&&r.repeat.unit==='hour')meta.push(`<span class="cg w6">✓ ${n}× ${t('rem-today-h').toLowerCase()}</span>`);
  /* Which task it belongs to, said out loud. Nested under its parent it is
     obvious; sorted flat, or alone in a window, a subtask gave no sign of
     where it came from — and the arrow that lifts it out named no one. */
  if(r.parent){
    const par=reminders().find(x=>x.id===r.parent);
    if(par)meta.push(`<span class="cp">↳ ${escapeHtml(par.title.slice(0,40))}</span>`);
  }
  const metaLine=dv('xs dimmer mt2',meta.join(' · '));
  /* Opening the whole family in a window of its own — the title used to do
     this, and the title now belongs to renaming. It reads better on the count
     anyway: what you press is the thing telling you there is something inside.
     Counted from the family itself, not from what the filters happen to be
     showing, so a project whose steps are all hidden still says it is one.
     Opened fresh every time: an editor left open in there used to still be
     open next time, which reads as a task already being changed — and a 🗑
     pressed in that state is a task deleted by surprise. */
  const own=r.parent?0:subtasksOf(r.id).length;
  if(own){
    if(meta.length)metaLine.appendChild(sp('',' · '));
    const openTree=bt('btn-icon xs',
      `↳ ${own} ${own===1?t('rem-subtask'):t('rem-subtasks')}`,
      e=>{e.stopPropagation();STATE.editingRem=null;STATE.taskTree=r.id;render();});
    openTree.style.cssText='padding:0 4px;color:var(--cp)';
    openTree.title=t('rem-open-tree');
    metaLine.appendChild(openTree);
  }
  mid.appendChild(metaLine);

  // Two levels only, so a subtask cannot spawn its own.
  if(!r.parent&&!doneToday){
    const addSub=bt('btn-icon xs','＋ '+t('rem-subtask'),()=>{
      const title=prompt(t('rem-subtask-ask').replace('{t}',r.title));
      if(title&&title.trim()){addReminder({title:title.trim(),parent:r.id,tag:r.tag});rd();}
    });
    addSub.style.cssText='padding:2px 0;font-size:11px;color:var(--t3)';
    mid.appendChild(addSub);
  }
  row.appendChild(mid);

  const tools=dv('row gap4 rem-tools');
  // Indent under the row above / lift back out — the touch-friendly twin of
  // dragging, and the reason no dropdown of every task is needed.
  if(r.parent){
    const out_=bt('btn-icon','⤴',()=>{outdentReminder(r.id);rd();});
    // The arrow says what it lifts you out of, not just that it lifts.
    const par=reminders().find(x=>x.id===r.parent);
    out_.title=par?`${t('rem-outdent')} — ${t('rem-parent-is')} ${par.title}`:t('rem-outdent');
    tools.appendChild(out_);
  }else if(opts.prevTop&&!kids){
    const in_=bt('btn-icon','⤵',()=>{
      const res=indentReminder(r.id,opts.prevTop);
      if(!res.ok&&res.warn==='sub-has-kids')alert(t('rem-has-kids'));
      rd();
    });
    in_.title=t('rem-indent');tools.appendChild(in_);
  }
  const ed=bt('btn-icon','✏️',()=>{STATE.editingRem=STATE.editingRem===r.id?null:r.id;rd();});
  ed.title=t('rem-edit');
  tools.appendChild(ed);
  /* 🗑 throws away, ✕ closes — one mark each, everywhere in the app. They used
     to share the ✕, so the mark that dismissed a popup and the mark that
     deleted a task were the same picture a thumb's width apart, and the wrong
     one of the two is not undoable. */
  const del=bt('btn-icon','🗑',()=>{
    const kids=r.parent?0:subtasksOf(r.id).length;
    const msg=kids?t('rem-del-warn-kids').replace('{t}',r.title).replace('{n}',kids)
                  :t('rem-del-warn').replace('{t}',r.title);
    if(confirm(msg)){deleteReminder(r.id);rd();}
  });
  del.title=t('sel-del');
  tools.appendChild(del);
  row.appendChild(tools);

  if(STATE.editingRem===r.id){
    const outer=dv('');outer.appendChild(row);outer.appendChild(renderReminderEditor(r));
    outer.style.cssText='background:var(--sur2);border:1px solid var(--acb);border-radius:10px;padding:0 0 10px';
    row.style.border='none';row.style.background='none';
    return outer;
  }
  return row;
}

/* ═══ NEW TASK — a popup, not a panel that pushes the day out of the way ═══
   The + used to unfold this form inside the list card, so writing a task began
   by shoving the list you were reading down the page, and on a phone the two
   could not be seen at once. It opens over the page now, the way everything
   else in the app opens, and closes when the task is in.

   A half-written task is the one thing in this app that a close can throw
   away, so a close with something typed in it asks first — the backdrop, the
   ✕ and Escape all come through here. */
let _addFormDirty=null;
function closeAddForm(){
  if(_addFormDirty&&_addFormDirty()&&!confirm(t('rem-discard')))return;
  _addFormDirty=null;STATE.showAddForm=false;STATE.addQuad=0;render();
}
/* The one way in, so nothing can open the form and forget to say from where.
   Called with no quadrant by the ＋ button, and with one by the cross. */
function openAddForm(quad){
  STATE.addQuad=quad||0;STATE.showAddForm=true;render();
}
function renderAddModal(){
  const ov=dv('fi');
  ov.classList.add('ovl');
  ov.onclick=e=>{if(e.target===ov)closeAddForm();};
  const panel=dv('card');
  panel.style.cssText='max-width:560px;width:100%;margin:auto';
  ov.appendChild(panel);
  const hd=dv('rowb mb10');
  hd.appendChild(sp('ctit',t('rem-new')));
  hd.appendChild(bt('btn-icon','✕',closeAddForm));
  panel.appendChild(hd);

  const ti=ip('text','','',t('rem-what'));
  const noi=taEl('',t('rem-notes-ph'));noi.style.marginTop='6px';
  panel.appendChild(ti);panel.appendChild(noi);
  const row2=dv('row gap8 mt8');row2.style.flexWrap='wrap';
  const di=ip('date','',todayKey(),'');di.style.cssText='flex:0 0 148px;min-width:130px';
  const hi=ip('time','','','');hi.style.cssText='flex:0 0 104px';hi.title=t('rem-time');
  // Opened from the empty space inside a quadrant, the form arrives with that
  // quadrant already chosen — the click said which box it belongs in, and
  // making you say it again in a dropdown would be asking twice.
  const pi=sk('',QUAD.map(q=>[String(q),q?`${quadEmoji(q)} ${quadName(q)}`:quadName(0)]),String(STATE.addQuad||0));pi.style.cssText='flex:1;min-width:120px';
  row2.appendChild(di);row2.appendChild(hi);row2.appendChild(pi);panel.appendChild(row2);
  const dl=document.createElement('datalist');dl.id='st-tags';
  allTags().forEach(tg=>{const o=document.createElement('option');o.value=tg;dl.appendChild(o);});
  panel.appendChild(dl);
  const picker=tagPicker([]);
  picker.el.style.marginTop='8px';
  panel.appendChild(picker.el);

  const row3=dv('row gap8 mt8');row3.style.flexWrap='wrap';
  const ri=sk('',[['','🔁 '+t('rep-none')],['hour',t('rep-hour')],['day',t('rep-day')],['week',t('rep-week')],['month',t('rep-month')],['year',t('rep-year')]],'');
  ri.style.flex='1';ri.style.minWidth='120px';
  const ni=ip('number','',1,'');ni.min=1;ni.style.width='70px';ni.title=t('rem-every');
  row3.appendChild(ri);row3.appendChild(ni);
  const fl=dv('tog');fl.style.flex='1';fl.style.minWidth='140px';
  const fc=ip('checkbox','');fc.checked=false;
  const fi_=dv('f1');fi_.innerHTML=`<div class="tt">🏁 ${t('rem-flag')}</div>`;
  fl.appendChild(fc);fl.appendChild(fi_);
  fl.onclick=e=>{if(e.target!==fc)fc.checked=!fc.checked;fl.classList.toggle('on',fc.checked);};
  const ml=dv('tog');ml.style.flex='1';ml.style.minWidth='140px';
  const mcb=ip('checkbox','');mcb.checked=false;
  const mi_=dv('f1');mi_.innerHTML=`<div class="tt">🌅 ${t('rem-morning')}</div>`;
  ml.appendChild(mcb);ml.appendChild(mi_);
  ml.onclick=e=>{if(e.target!==mcb)mcb.checked=!mcb.checked;ml.classList.toggle('on',mcb.checked);};
  row3.appendChild(fl);row3.appendChild(ml);panel.appendChild(row3);
  const wd=weekdayPicker([]);
  const md=monthdayPicker([]);
  wd.el.style.display='none';md.el.style.display='none';
  ri.addEventListener('change',()=>{
    wd.el.style.display=ri.value==='week'?'':'none';
    md.el.style.display=ri.value==='month'?'':'none';
  });
  panel.appendChild(wd.el);panel.appendChild(md.el);
  const err=dv('xs ng mt6');panel.appendChild(err);
  function doAdd(){
    const title=ti.value.trim();
    if(!title){err.textContent=t('rem-need-title');ti.focus();return;}
    err.textContent='';
    addReminder({title,notes:noi.value,due:di.value||todayKey(),time:hi.value,priority:parseInt(pi.value)||0,
      flagged:fc.checked,morning:mcb.checked,tags:picker.get(),
      repeat:ri.value?{unit:ri.value,every:Math.max(1,parseInt(ni.value)||1),
        ...(ri.value==='week'&&wd.get().length?{days:wd.get()}:{}),
        ...(ri.value==='month'&&md.get().length?{doms:md.get()}:{}),
        // Remember which day of the month was meant, so clamping short months
        // never drags the date down permanently.
        ...(ri.value==='month'||ri.value==='year'
            ?{dom:new Date((di.value||todayKey())+'T12:00:00').getDate()}:{})}:null});
    // The task is in; the popup goes, and the list behind it shows what landed.
    _addFormDirty=null;STATE.showAddForm=false;STATE.addQuad=0;render();
  }
  ti.onkeydown=e=>{if(e.key==='Enter')doAdd();};
  const ab=bt('btn-ac btn-sm w100 mt8',t('rem-add'),doAdd);ab.style.width='100%';
  panel.appendChild(ab);
  // What counts as "something to lose" — a title or a note. Everything else on
  // this form has a default, so a date left as today is not work in progress.
  _addFormDirty=()=>!!(ti.value.trim()||noi.value.trim());
  setTimeout(()=>ti.focus(),0);
  return ov;
}

/* ═══ MILESTONES ═════════════════════════════════════════════════════════
   The streak worth marking is the plain one: days on end that did not end
   red. Crossing certain numbers earns a moment of something — over the whole
   page, gone in a few seconds, once ever. The names climb the stoic virtues,
   which is more the point of the app than "achievement unlocked" would be.
   ═══════════════════════════════════════════════════════════════════════ */
/* The medals themselves. What earns one is any positive streak reaching the
   number; which streak it was is written on the medal, not stamped into it —
   a hundred days is a hundred days, whether they were mornings or clean ones.
   Seven of them, climbing the stoic virtues, and 200 is nowhere near the end. */
const MILESTONES=[
  {n:10,  icon:'🔥',  word:'constancy', hue:'#f97316'},
  {n:20,  icon:'⚡',  word:'discipline',hue:'#f5c842'},
  {n:50,  icon:'🌊',  word:'temperance',hue:'#34d399'},
  {n:100, icon:'🗡️', word:'fortitude', hue:'#5b9df9'},
  {n:200, icon:'🏛️', word:'virtue',    hue:'#a78bfa'},
  {n:500, icon:'🦉',  word:'wisdom',    hue:'#d4a017'},
  {n:1000,icon:'🌌',  word:'ataraxia',  hue:'#e879f9'}
];
/* Only what you keep up earns one. The rewards have streaks of their own and
   they are the opposite of an achievement, so nothing is ever awarded for a
   run of them. These say what a medal was won for, and nothing more. */
const MEDAL_KINDS=[
  {k:'day',    name:'md-day',    ok:d=>d.status&&d.status!=='red'},
  {k:'morning',name:'md-morning',ok:d=>d.morning},
  {k:'flags',  name:'md-flags',  ok:d=>d.flags},
  {k:'work',   name:'md-work',   ok:d=>d.work>0},
  {k:'cleand', name:'md-cleand', rw:'drugs',    ok:d=>!d.drugs},
  {k:'cleanp', name:'md-cleanp', rw:'internet', ok:d=>!d.proc},
  {k:'cleano', name:'md-cleano', rw:'macanazo', ok:d=>!d.org}
];
/* What a medal is called. The three reward medals were named in the language
   file — "Sin orgasmo" — which stops being true the moment that reward is
   renamed, and the medal is on the calendar forever. They ask the list
   instead, and keep their written name only while the built-in is still the
   one that shipped. */
function medalName(kind){
  if(!kind.rw)return t(kind.name);
  const r=rewardById(kind.rw);
  return isOriginal(r)?t(kind.name):t('sk-without')+' '+rewardName(r);
}
function tierOf(n){return MILESTONES.find(x=>x.n===n)||MILESTONES[0];}
/* One day reduced to the handful of yes-or-no answers a streak is built from,
   read the same way whether the day is closed or still being lived. */
function dayFacts(entry,isToday){
  if(isToday){
    const live=CALC.score(STATE.today,applyStreakOverrides(CALC.streaks(STATE.history,STATE.today)));
    const pens=STATE.today.penalties||[];
    return{status:live.status,morning:!!STATE.today.morningCompleted,flags:!!STATE.today.flagCompleted,
      work:STATE.today.work?.workDuration||0,
      drugs:pens.some(p=>p.type==='drugs'),proc:pens.some(p=>p.type==='internet'),org:pens.some(p=>p.type==='macanazo')};
  }
  const pens=entry.penalties||[];
  return{status:entry.status,
    morning:!!entry.streaks?.some(s=>s.type==='morning'&&s.active),
    flags:!!entry.streaks?.some(s=>s.type==='flags'&&s.active),
    work:entry.workDuration||0,
    drugs:pens.some(p=>p.type==='drugs'),proc:pens.some(p=>p.type==='internet'),org:pens.some(p=>p.type==='macanazo')};
}
/* Every medal ever earned, worked out from the days themselves rather than
   kept in a list somewhere. Fixing a day you logged wrong re-earns — or
   un-earns — whatever hung on it, which is the only way a record built on
   editable history can stay honest. A day never logged breaks everything. */
function medalsByDate(){
  const tk=todayKey();
  const map=histMap();
  const dates=[...new Set([...map.keys(),tk])].filter(d=>d<=tk).sort();
  const run={};MEDAL_KINDS.forEach(m=>run[m.k]=0);
  const out=new Map();
  dates.forEach(d=>{
    const isToday=d===tk;
    const e=map.get(d);
    if(!isToday&&(!e||e._gap)){MEDAL_KINDS.forEach(m=>run[m.k]=0);return;}
    const f=dayFacts(e,isToday);
    MEDAL_KINDS.forEach(m=>{
      if(!m.ok(f)){run[m.k]=0;return;}
      run[m.k]++;
      if(MILESTONES.some(x=>x.n===run[m.k])){
        if(!out.has(d))out.set(d,[]);
        out.get(d).push({kind:m,n:run[m.k]});
      }
    });
  });
  return out;
}
function checkMilestone(){
  if(document.querySelector('.ms-ov'))return;
  const tk=todayKey();
  const today=medalsByDate().get(tk)||[];
  if(!today.length)return;
  let seen=[];try{seen=JSON.parse(localStorage.getItem('st_milestones')||'[]');}catch(e){}
  const id=m=>m.kind.k+':'+m.n+':'+tk;
  const fresh=today.filter(m=>!seen.includes(id(m)));
  if(!fresh.length)return;
  // Several at once would talk over each other; the biggest speaks for them.
  const best=fresh.reduce((a,b)=>b.n>a.n?b:a);
  try{localStorage.setItem('st_milestones',JSON.stringify([...seen,...today.map(id)].slice(-300)));}catch(e){}
  showMilestone(best);
}
function showMilestone(m){
  const tier=tierOf(m.n);
  const ov=dv('ms-ov');
  const card=dv('ms-card');
  card.style.setProperty('--ms',tier.hue);
  card.innerHTML=`<div class="ms-ico">${tier.icon}</div>`+
    `<div class="ms-n">${m.n}</div>`+
    `<div class="ms-w">${t('ms-'+tier.word)}</div>`+
    `<div class="ms-sub">${medalName(m.kind)} · ${t('ms-sub')}</div>`;
  for(let i=0;i<16;i++){
    const s=dv('ms-spark',tier.icon);
    const a=(Math.PI*2*i)/16+Math.random()*.4, r=120+Math.random()*160;
    s.style.setProperty('--dx',Math.cos(a)*r+'px');
    s.style.setProperty('--dy',Math.sin(a)*r+'px');
    s.style.animationDelay=(Math.random()*.35)+'s';
    card.appendChild(s);
  }
  ov.appendChild(card);
  document.body.appendChild(ov);
  // It leaves on its own; a click only asks it to leave sooner.
  const close=()=>{if(!ov.isConnected)return;ov.classList.add('out');setTimeout(()=>ov.remove(),620);};
  ov.onclick=close;
  setTimeout(close,3800);
}

  // main button — declared before doAction so hoisting isn't an issue
  const actionBtn=bt('btn-ac',t('log-in'),()=>doAction());

  card.appendChild(actionBtn);

  function syncTabs(){
    err.textContent='';succ.textContent='';
    if(mode==='login'){
      loginTab.className='btn-ac btn-sm f1';
      signupTab.className='btn-ghost btn-sm f1';
      actionBtn.textContent=t('log-in');
    } else {
      loginTab.className='btn-ghost btn-sm f1';
      signupTab.className='btn-ac btn-sm f1';
      actionBtn.textContent=t('create-acct');
    }
  }

  async function doAction(){
    err.textContent='';succ.textContent='';
    const email=ei.value.trim();
    const pass=pi.value;
    if(!email||!pass){err.textContent=t('enter-creds');return;}
    if(pass.length<6){err.textContent=t('pass-short');return;}
    if(!sbConfigured){err.textContent=t('not-configured');return;}

    actionBtn.disabled=true;
    actionBtn.textContent=mode==='login'?t('signing-in'):t('creating-acct');

    try{
      if(mode==='signup'){
        const sbUrl=(window._SUPABASE_URL||'').replace(/\/rest\/v1\/?$/,'').replace(/\/+$/,'');
        const sbKey=window._SUPABASE_KEY||'';
        const r=await fetch(`${sbUrl}/auth/v1/signup`,{
          method:'POST',
          headers:{'Content-Type':'application/json','apikey':sbKey,'Authorization':`Bearer ${sbKey}`},
          body:JSON.stringify({email,password:pass})
        });
        const d=await r.json();
        // Supabase returns user object on success
        if(d.id||d.user?.id||d.access_token){
          if(d.access_token){
            // email confirm disabled — logged in immediately
            SB.token=d.access_token;
            localStorage.setItem('AUTH_TOKEN',d.access_token);
            await afterLogin();
          } else {
            succ.textContent=t('acct-created');
            mode='login';syncTabs();
          }
        } else {
          err.textContent=d.msg||d.error_description||d.message||JSON.stringify(d);
        }
      } else {
        const res=await SB.login(email,pass);
        if(res.ok){
          await afterLogin();
        } else {
          err.textContent=res.error||t('login-failed');
        }
      }
    } catch(e){
      err.textContent=t('net-error')+e.message;
    }
    actionBtn.disabled=false;
    syncTabs();
  }

  async function afterLogin(){
    actionBtn.textContent=t('syncing');
    const remote=await SB.pull();
    if(remote){
      // Logging in MERGES cloud into local — it must never replace it.
      // This used to overwrite STATE.history/diary wholesale with whatever the
      // cloud had. When cloud sync had been silently dead for weeks, logging in
      // destroyed months of local days and diary entries in one shot.
      // applyRemote() merges history per-day (newest _ts wins, nothing deleted)
      // and unions the diary, so no entry can be lost from either side.
      applyRemote(remote);
      // Push the merged result straight back up, so anything the cloud was
      // missing lands there immediately instead of waiting for the next change.
      SB.push(STATE.history,STATE.today,STATE.diary,STATE.streakOverrides).catch(()=>{});
      // Save daily backup on login (once per day) — only mark done if it truly succeeded
      const _bkKey='st_last_backup';
      if(localStorage.getItem(_bkKey)!==todayKey()){
        SB.saveBackup(STATE.history,STATE.today,STATE.diary,STATE.streakOverrides).then(ok=>{
          if(ok) localStorage.setItem(_bkKey,todayKey());
        }).catch(()=>{});
      }
    }
    S.set(K.AUTH,true);STATE.authed=true;render();
  }

  pi.onkeydown=e=>{if(e.key==='Enter')doAction();};
  card.appendChild(hr());
  const gb=bt('btn-ghost',t('guest-btn'),()=>{S.set(K.AUTH,true);STATE.authed=true;render();});
  gb.style.width='100%';card.appendChild(gb);
  card.appendChild(dv('xs dimmer ctr mt8',t('guest-note')));
  wrap.appendChild(card);return wrap;
}
