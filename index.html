  }
  ti.onkeydown=e=>{if(e.key==='Enter')doAdd();};
  const ab=bt('btn-ac btn-sm w100 mt8',t('rem-add'),doAdd);ab.style.width='100%';
  form.appendChild(ab);

  /* ── the list: three columns so the day fits on one screen ── */
  const list=reminders();
  /* Filtering is a view, never a fact: the counts fed to the score tab are
     computed from the whole list, so hiding tasks here can never change them. */
  /* View controls. Scope and order are yours to set and are remembered, but
     they only ever change what is drawn — never what counts. */
  const V=STATE.view;
  const ctrl=dv('row gap8 mb10');ctrl.style.flexWrap='wrap';ctrl.style.alignItems='center';
  const seg=(opts,cur,onPick)=>{
    const g=dv('row gap4');
    g.style.cssText='border:1px solid var(--b2);border-radius:9px;padding:2px;background:var(--sur2)';
    opts.forEach(([val,lbl])=>{
      const on=cur===val;
      const b=bt(on?'btn-ac btn-xs':'btn-xs',lbl,()=>onPick(val));
      if(!on)b.style.cssText='background:none;border:none;color:var(--t3)';
      g.appendChild(b);
    });
    return g;
  };
  ctrl.appendChild(seg([['today',t('view-today')],['all',t('view-all')]],V.scope,v=>{
    V.scope=v;saveView();render();
  }));
  ctrl.appendChild(seg([['date-asc','📅 ↑'],['date-desc','📅 ↓'],['prio','❗']],V.sort,v=>{
    V.sort=v;saveView();render();
  }));
  ctrl.appendChild(sp('xs dimmer',t('sort-'+V.sort)));

  const tags=allTags();
  let tagBar=null;
  if(tags.length){
    tagBar=dv('row gap6 mb10');tagBar.style.flexWrap='wrap';tagBar.style.alignItems='center';
    tagBar.appendChild(sp('xs dimmer up ls',t('rem-filter')));
    tags.forEach(tg=>{
      const on=(STATE.tagFilters||[]).includes(tg);
      const c=bt('tagchip',tg,()=>{toggleTagFilter(tg);render();});
      c.style.cssText+=';cursor:pointer'+(on?';outline:2px solid var(--ac)':';opacity:.55');
      tagBar.appendChild(c);
    });
    if((STATE.tagFilters||[]).length)tagBar.appendChild(bt('btn-icon xs','✕ '+t('rem-filter-clear'),()=>{STATE.tagFilters=[];render();}));
  }
  const open=list.filter(r=>!r.done&&r.completedOn!==tk);
  /* A subtask is drawn under its own parent, always — a column is chosen by the
     parent's date, and the subtask keeps and shows its own. Nesting is
     structure; the date it is due is written on the row and coloured when it is
     overdue, so nothing has to be spelled out in words. */
  // kidsFor decides which subtasks a row is allowed to show; the filters run
  // through it so nothing can ride in on its parent's ticket.
  function fillCard(card,tops,kidsFor){
    if(!tops.length){card.appendChild(dv('xs dimmer ctr','—'));return;}
    const box=dv('s6');
    tops.forEach((p,i)=>{
      const kids=kidsFor(p);
      box.appendChild(renderReminderRow(p,tk,{prevTop:i>0?tops[i-1].id:null,kids:kids.length}));
      if(kids.length&&!isCollapsed(p.id)){
        kids.forEach(c=>{
          const w=dv('rem-sub');
          w.appendChild(renderReminderRow(c,tk,{prevTop:p.id}));
          box.appendChild(w);
        });
      }
    });
    card.appendChild(box);
  }
  /* One list rather than three columns. The date on each row already says
     where it falls — red overdue, amber today — so splitting them apart only
     scattered the day across three places. Oldest first, and within the same
     date the higher priority leads. */
  /* Filters are judged per reminder, subtasks included. A parent that passes
     used to drag its whole brood on screen regardless of their own dates and
     tags, so a December dentist appointment showed up under "Today" filtered
     to "urgent" purely because its parent qualified.
     A parent is shown when it passes on its own OR still has a subtask that
     does — so a matching subtask is never stranded out of reach — and only
     the subtasks that pass are drawn beneath it. */
  // The chosen order applies to subtasks as well, sorted within their parent.
  const order={
    'date-asc':(a,b)=>a.due===b.due?(b.priority-a.priority):a.due.localeCompare(b.due),
    'date-desc':(a,b)=>a.due===b.due?(b.priority-a.priority):b.due.localeCompare(a.due),
    'prio':(a,b)=>b.priority-a.priority||a.due.localeCompare(b.due),
  }[V.sort]||((a,b)=>a.due.localeCompare(b.due));
  const F=STATE.tagFilters||[];
  const passes=r=>(V.scope==='all'||r.due<=tk)&&
                  (!F.length||tagsOf(r).some(tg=>F.includes(tg)));
  const openKids=p=>subtasksOf(p.id).filter(c=>!c.done&&c.completedOn!==tk);
  const shownKids=p=>openKids(p).filter(passes).sort(order);
  const inScope=r=>passes(r)||shownKids(r).length>0;
  const tops=open.filter(r=>!r.parent).filter(inScope).sort(order);
  // Everything the filters are keeping out of sight — subtasks included.
  const shownIds=new Set();
  tops.forEach(p=>{shownIds.add(p.id);shownKids(p).forEach(c=>shownIds.add(c.id));});
  const hidden=open.length-shownIds.size;
  const card=dv('card');
  const h=dv('rowb mb10');
  const left=dv('row gap8');
  left.appendChild(sp('ctit',t('rem-open-h')));
  const nOver=tops.filter(r=>r.due<tk).length;
  if(nOver)left.appendChild(sp('xs cr w6',`${nOver} ${nOver===1?t('rem-overdue-1'):t('rem-overdue')}`));
  left.appendChild(sp('xs dimmer',String(shownIds.size)));
  h.appendChild(left);
  const addBtn=bt(STATE.showAddForm?'btn-ghost btn-sm':'btn-ac btn-sm',STATE.showAddForm?'✕':'＋',()=>{
    STATE.showAddForm=!STATE.showAddForm;render();
  });
  addBtn.title=t('rem-new');
  h.appendChild(addBtn);
  card.appendChild(h);
  card.appendChild(ctrl);
  if(tagBar)card.appendChild(tagBar);
  if(STATE.showAddForm)card.appendChild(form);
  fillCard(card,tops,shownKids);
  if(hidden>0)card.appendChild(dv('xs dimmer ctr mt8',
    `${hidden} ${hidden===1?t('view-hidden-1'):t('view-hidden')}`));
  wrap.appendChild(card);

  // Same rule for what was finished today: the tag filter applies per row here
  // too. Scope is not applied — anything ticked today belongs to today.
  const tagOk=r=>!(STATE.tagFilters||[]).length||tagsOf(r).some(tg=>STATE.tagFilters.includes(tg));
  const doneKids=p=>subtasksOf(p.id).filter(c=>c.completedOn===tk&&tagOk(c)).sort(order);
  const doneTops=list.filter(r=>r.completedOn===tk&&!r.parent)
                     .filter(r=>tagOk(r)||doneKids(r).length>0).sort(order);
  if(doneTops.length){
    const card=dv('card mt12');
    const h=dv('rowb mb10');
    const shown=new Set();
    doneTops.forEach(p=>{shown.add(p.id);doneKids(p).forEach(c=>shown.add(c.id));});
    h.appendChild(sp('ctit cg',t('rem-done-h')));
    h.appendChild(sp('xs dimmer',String(shown.size)));
    card.appendChild(h);
    fillCard(card,doneTops,doneKids);
    wrap.appendChild(card);
  }

  if(!list.length)wrap.appendChild(dv('card ctr dim sm mt12',t('rem-empty')));
  wrap.appendChild(renderGoals());
  return wrap;
}

function renderGoals(){
  const wrap=dv('mt12');
  const tk=todayKey();
  const head=dv('rowb mb10');
  head.appendChild(sp('ctit',t('goals-title')));
  const tot=goalsTotal();
  if(tot)head.appendChild(sp('md mo ac w7','+'+tot.toLocaleString()));
  wrap.appendChild(head);

  const grid=dv('g3');
  GOAL_KINDS.forEach(kind=>{
    const card=dv('card');
    const list=goalsOf(kind);
    const max=GOAL_MAX[kind];
    const left=daysLeftIn(kind,tk);
    const h=dv('rowb mb6');
    h.appendChild(sp('ctit',t('goal-'+kind)));
    h.appendChild(sp('xs dimmer',`${list.length}/${max}`));
    card.appendChild(h);
    // What one finished right now would be worth — the incentive, in numbers.
    card.appendChild(dv('xs dim mb10',
      `${GOAL_BASE[kind].toLocaleString()} × ${left} ${left===1?t('goal-day'):t('goal-days')} = <span class="ac w6">${(GOAL_BASE[kind]*left).toLocaleString()}</span>`));

    if(!list.length)card.appendChild(dv('xs dimmer ctr','—'));
    const box=dv('s6');
    list.forEach(g=>{
      const row=dv('row gap8');
      row.style.cssText='background:var(--sur2);border:1px solid '+(g.doneOn?'var(--gb)':'var(--b1)')+';border-radius:10px;padding:9px 11px;align-items:flex-start';
      const cb=ip('checkbox','');cb.checked=!!g.doneOn;cb.style.marginTop='2px';
      cb.onchange=()=>{toggleGoal(g.id);render();};
      row.appendChild(cb);
      const mid=dv('f1');
      const tt=sp('sm',g.title);
      if(g.doneOn){tt.style.textDecoration='line-through';tt.style.color='var(--t3)';}
      mid.appendChild(tt);
      if(g.doneOn){
        mid.appendChild(dv('xs cg mt2',`+${goalPoints(g).toLocaleString()} · ${g.doneOn}`));
      }else{
        // What it is worth today, and what tomorrow costs — the whole point of
        // the rule is only obvious when both numbers are on screen.
        const late=goalIsLate(g,tk);
        const now=GOAL_BASE[kind]*goalDaysLeft(g,tk);
        if(late){
          mid.appendChild(dv('xs cy mt2',`${t('goal-past-due')} ${goalDeadline(g)} · ${t('goal-worth')} ${now.toLocaleString()}`));
        }else{
          const morning=new Date(tk+'T12:00:00');morning.setDate(morning.getDate()+1);
          const tomorrow=GOAL_BASE[kind]*goalDaysLeft(g,isoDate(morning));
          mid.appendChild(dv('xs mt2',
            `<span class="ac w6">${t('goal-worth')} ${now.toLocaleString()}</span>`+
            (tomorrow<now?` <span class="dimmer">· ${t('goal-tomorrow')} ${tomorrow.toLocaleString()}</span>`:'')));
        }
      }
      row.appendChild(mid);
      row.appendChild(bt('btn-icon','✕',()=>{
        if(confirm(t('rem-del-warn').replace('{t}',g.title))){deleteGoal(g.id);render();}
      }));
      box.appendChild(row);
    });
    card.appendChild(box);

    if(list.length<max){
      const gi=ip('text','','',t('goal-new'));gi.style.marginTop='8px';
      const add=()=>{
        const v=gi.value.trim();if(!v)return;
        addGoal(kind,v);render();
      };
      gi.onkeydown=e=>{if(e.key==='Enter')add();};
      card.appendChild(gi);
      const b=bt('btn-ghost btn-sm w100 mt6',t('goal-add'),add);b.style.width='100%';
      card.appendChild(b);
    }else card.appendChild(dv('xs dimmer ctr mt8',t('goal-full')));
    grid.appendChild(card);
  });
  wrap.appendChild(grid);
  wrap.appendChild(dv('xs dimmer ctr mt8',t('goal-note')));
  return wrap;
}

  head.appendChild(sp('xs dimmer',`${(p.minutesToday/POMO_UNIT).toFixed(1)} 🍅 · ${p.minutesToday} min`));
  card.appendChild(head);

  const phaseLbl=focusing?t('pomo-focus'):(p.phase==='long'?t('pomo-long'):t('pomo-short'));
  const ph=dv('ctr');
  ph.innerHTML=`<div class="xs up ls" style="color:${focusing?'var(--ac)':'var(--cg)'}">${phaseLbl}</div>`;
  card.appendChild(ph);

  const clock=dv('ctr xxxl w8 mo');
  clock.id='pomo-clock';
  clock.style.color=focusing?'var(--ac)':'var(--cg)';
  clock.textContent=fmtClock(pomoRemaining(p));
  card.appendChild(clock);

  const bar=dv('prog mt8');const fill=dv('prog-f');
  const pct=100-Math.round(pomoRemaining(p)/pomoPhaseLen(p)*100);
  fill.style.cssText=`width:${pct}%;background:${focusing?'var(--ac)':'var(--cg)'}`;
  bar.appendChild(fill);card.appendChild(bar);

  const dots=dv('row gap4 mt8');dots.style.justifyContent='center';
  for(let i=0;i<Math.max(1,p.cycle);i++){
    const d=dv('');
    d.style.cssText=`width:8px;height:8px;border-radius:50%;background:${i<p.doneInCycle?'var(--ac)':'var(--b2)'}`;
    dots.appendChild(d);
  }
  card.appendChild(dots);

  const ctr=dv('row gap8 mt10');
  ctr.appendChild(bt(p.running?'btn-ghost btn-sm f1':'btn-ac btn-sm f1',p.running?'⏸ '+t('pomo-pause'):'▶ '+t('pomo-start'),()=>{
    p.running?pomoPause():pomoStart();render();
  }));
  ctr.appendChild(bt('btn-ghost btn-sm',t('pomo-reset'),()=>{pomoReset();render();}));
  ctr.appendChild(bt('btn-ghost btn-sm',t('pomo-skip'),()=>{
    // Ends the leg early. A focus leg still banks the minutes truly worked.
    pomoFinishPhase(false);render();
  }));
  card.appendChild(ctr);

  /* durations */
  const cfg=dv('row gap6 mt10');cfg.style.flexWrap='wrap';
  [['focus',t('pomo-focus'),'var(--ac)'],['brk',t('pomo-short'),'var(--cg)'],['longBrk',t('pomo-long'),'var(--cg)']].forEach(([key,lbl,col])=>{
    const w=dv('s4');w.style.flex='1';w.style.minWidth='72px';
    w.innerHTML=`<div class="xs dimmer up ls" style="color:${col}">${lbl}</div>`;
    const i=ip('number','',p[key],'');i.min=1;i.max=180;
    i.onchange=()=>{p[key]=Math.min(180,Math.max(1,parseInt(i.value)||1));savePomo();render();};
    w.appendChild(i);cfg.appendChild(w);
  });
  card.appendChild(cfg);
  card.appendChild(dv('xs dimmer mt6',t('pomo-note')));
  return card;
}

/* Notes hold real paragraphs, so they get a textarea rather than a one-line
   input — Enter inside one must make a new line, not submit anything. */
function taEl(v,ph){
  const x=document.createElement('textarea');
  x.className='diary-area';x.style.minHeight='58px';

}

  ri.style.flex='1';ri.style.minWidth='110px';

  r4.appendChild(ri);r4.appendChild(ni);r4.appendChild(fl);box.appendChild(r4);
  const wd=weekdayPicker(r.repeat&&r.repeat.days||[]);

      title:ti.value.trim(),notes:no.value.replace(/\s+$/,''),tags:picker.get(),

function renderReminderRow(r,tk,opts){
  opts=opts||{};
  const doneToday=r.completedOn===tk;
  const late=!doneToday&&r.due<tk;
  const kids=opts.kids||0;
  const row=dv('row gap10');
  row.style.cssText='background:var(--sur2);border:1px solid '+(late?'var(--rb)':'var(--b1)')+';border-radius:10px;padding:10px 12px;align-items:flex-start';

  /* Drag to nest, on anything with a pointer. The buttons below do the same
     job for touch, so this is an accelerator and never the only way. */
  row.draggable=true;
  row.ondragstart=e=>{e.dataTransfer.setData('text/plain',r.id);e.dataTransfer.effectAllowed='move';row.style.opacity='.4';};
  row.ondragend=()=>{row.style.opacity='';row.style.outline='';};
  row.ondragover=e=>{
    const id=STATE._dragId;
    if(id&&id!==r.id&&!r.parent){e.preventDefault();row.style.outline='2px solid var(--ac)';}
  };
  row.ondragleave=()=>{row.style.outline='';};
  row.ondrop=e=>{
    e.preventDefault();row.style.outline='';
    const id=e.dataTransfer.getData('text/plain');
    if(!id||id===r.id||r.parent)return;
    const res=updateReminder(id,{parent:r.id});
    if(!res.ok)alert(res.warn==='sub-has-kids'?t('rem-has-kids'):t('rem-bad-parent'));
    render();
  };
  row.addEventListener('dragstart',()=>{STATE._dragId=r.id;});

  // Collapse arrow — only where there is something to hide.
  if(kids){
    const ar=bt('btn-icon',isCollapsed(r.id)?'▶':'▼',()=>{toggleCollapse(r.id);render();});
    ar.style.cssText='padding:2px 4px;font-size:11px;color:var(--t3)';
    ar.title=isCollapsed(r.id)?t('rem-expand'):t('rem-collapse');
    row.appendChild(ar);
  }

  const cb=ip('checkbox','');cb.checked=doneToday;cb.style.marginTop='3px';
  cb.onchange=()=>{toggleReminder(r.id);render();};
  row.appendChild(cb);

  const mid=dv('f1');
  const titleLine=dv('row gap6');titleLine.style.flexWrap='wrap';
  const tt=sp('md',r.title);
  if(doneToday){tt.style.textDecoration='line-through';tt.style.color='var(--t3)';}
  titleLine.appendChild(tt);
  if(r.flagged)titleLine.appendChild(sp('sm','🏁'));
  if(r.priority>0){const p=sp('sm w7',PRIO[r.priority][1]);p.style.color=prioColor(r.priority);titleLine.appendChild(p);}
  mid.appendChild(titleLine);

  tagsOf(r).forEach(tg=>{
    // Clicking a tag filters the board to it — the grouped view, one tap away.
    const c=bt('tagchip',tg,e=>{e.stopPropagation();toggleTagFilter(tg);render();});
    c.style.cssText+=';margin-left:2px;cursor:pointer';
    titleLine.appendChild(c);
  });
  if(r.notes){
    const nt=dv('sm dim mt2');nt.style.whiteSpace='pre-wrap';nt.textContent=r.notes;
    if(doneToday)nt.style.color='var(--t3)';
    mid.appendChild(nt);
  }

  const meta=[];
  // A subtask sits in its parent's column but keeps its own date, so the date
  // is coloured to say where it really falls: red overdue, amber due today.
  const dueCls=late?'cr w6':(r.due===tk?'ac w6':'');
  meta.push(`<span class="${dueCls}">${late?t('rem-was-due')+' ':''}${r.due}${r.time?' · 🕐 '+r.time:''}</span>`);
  if(r.repeat)meta.push(repeatLabel(r.repeat));
  // Several times a day means the tally matters more than a tick.
  const n=doneCount(r,tk);
  if(n>0&&r.repeat&&r.repeat.unit==='hour')meta.push(`<span class="cg w6">✓ ${n}× ${t('rem-today-h').toLowerCase()}</span>`);
  if(kids)meta.push(`<span class="cp">${kids} ${kids===1?t('rem-subtask'):t('rem-subtasks')}</span>`);
  mid.appendChild(dv('xs dimmer mt2',meta.join(' · ')));

  // Two levels only, so a subtask cannot spawn its own.
  if(!r.parent&&!doneToday){
    const addSub=bt('btn-icon xs','＋ '+t('rem-subtask'),()=>{
      const title=prompt(t('rem-subtask-ask').replace('{t}',r.title));
      if(title&&title.trim()){addReminder({title:title.trim(),parent:r.id,tag:r.tag});render();}
    });
    addSub.style.cssText='padding:2px 0;font-size:11px;color:var(--t3)';
    mid.appendChild(addSub);
  }
  row.appendChild(mid);

  const tools=dv('row gap4');
  // Indent under the row above / lift back out — the touch-friendly twin of
  // dragging, and the reason no dropdown of every task is needed.
  if(r.parent){
    const out_=bt('btn-icon','⤴',()=>{outdentReminder(r.id);render();});
    out_.title=t('rem-outdent');tools.appendChild(out_);
  }else if(opts.prevTop&&!kids){
    const in_=bt('btn-icon','⤵',()=>{
      const res=indentReminder(r.id,opts.prevTop);
      if(!res.ok&&res.warn==='sub-has-kids')alert(t('rem-has-kids'));
      render();
    });
    in_.title=t('rem-indent');tools.appendChild(in_);
  }
  const ed=bt('btn-icon','✏️',()=>{STATE.editingRem=STATE.editingRem===r.id?null:r.id;render();});
  ed.title=t('rem-edit');
  tools.appendChild(ed);
  tools.appendChild(bt('btn-icon','✕',()=>{
    const kids=r.parent?0:subtasksOf(r.id).length;
    const msg=kids?t('rem-del-warn-kids').replace('{t}',r.title).replace('{n}',kids)
                  :t('rem-del-warn').replace('{t}',r.title);
    if(confirm(msg)){deleteReminder(r.id);render();}
  }));
  row.appendChild(tools);

  if(STATE.editingRem===r.id){
    const outer=dv('');outer.appendChild(row);outer.appendChild(renderReminderEditor(r));
    outer.style.cssText='background:var(--sur2);border:1px solid var(--acb);border-radius:10px;padding:0 0 10px';
    row.style.border='none';row.style.background='none';
    return outer;
  }
  return row;
}

/* ═══ LOGIN / SIGNUP ═══ */
function renderLogin(){
  const wrap=dv('login-wrap');
  const card=dv('card fi s12');card.style.cssText='max-width:400px;width:100%';
  card.innerHTML=`<div class="xxxl w8 ac ctr" style="letter-spacing:-.02em">🏛️ Stoic</div><div class="sm dim ctr mt4">${t('daily-tracker')}</div>`;

  const sbConfigured=!!(window._SUPABASE_URL&&window._SUPABASE_KEY);
  const info=dv('card2 mt12 sm');
  if(sbConfigured){
    info.style.cssText='background:var(--acd);border:1px solid var(--acb);padding:10px 12px';
    info.innerHTML=`<span class="ac">${t('cloud-active')}</span>`;
  } else {
    info.style.cssText='background:var(--sur2);border:1px solid var(--b2);padding:10px 12px';
    info.innerHTML=`<span class="dim">${t('guest-only')}</span>`;
  }
  card.appendChild(info);

  // tabs
  let mode='login';
  const modeRow=dv('row gap6');modeRow.style.marginTop='16px';
  const loginTab=bt('btn-ac btn-sm f1',t('log-in'),()=>{mode='login';syncTabs();});
  const signupTab=bt('btn-ghost btn-sm f1',t('sign-up'),()=>{mode='signup';syncTabs();});
  modeRow.appendChild(loginTab);modeRow.appendChild(signupTab);
  card.appendChild(modeRow);

  // fields
  const ew=dv('s4');ew.style.marginTop='12px';ew.innerHTML=`<div class="xs dimmer up ls">${t('email-lbl')}</div>`;
  const ei=ip('email','','','you@email.com');ew.appendChild(ei);card.appendChild(ew);
  const pw=dv('s4');pw.style.marginTop='8px';pw.innerHTML=`<div class="xs dimmer up ls">${t('pass-lbl')}</div>`;
  const pi=ip('password','','','min. 6 characters');pw.appendChild(pi);card.appendChild(pw);

  // feedback
  const err=dv('xs ng');err.style.marginTop='8px';card.appendChild(err);
  const succ=dv('xs cg');succ.style.marginTop='8px';card.appendChild(succ);

  // main button — declared before doAction so hoisting isn't an issue
  const actionBtn=bt('btn-ac',t('log-in'),()=>doAction());
  actionBtn.style.cssText='width:100%;margin-top:12px';
  card.appendChild(actionBtn);

  function syncTabs(){
    err.textContent='';succ.textContent='';
    if(mode==='login'){
      loginTab.className='btn-ac btn-sm f1';
      signupTab.className='btn-ghost btn-sm f1';
      actionBtn.textContent=t('log-in');
    } else {
      loginTab.className='btn-ghost btn-sm f1';
      signupTab.className='btn-ac btn-sm f1';
      actionBtn.textContent=t('create-acct');
    }
  }

  async function doAction(){
    err.textContent='';succ.textContent='';
    const email=ei.value.trim();
    const pass=pi.value;
    if(!email||!pass){err.textContent=t('enter-creds');return;}
    if(pass.length<6){err.textContent=t('pass-short');return;}
    if(!sbConfigured){err.textContent=t('not-configured');return;}

    actionBtn.disabled=true;
    actionBtn.textContent=mode==='login'?t('signing-in'):t('creating-acct');

    try{
      if(mode==='signup'){
        const sbUrl=(window._SUPABASE_URL||'').replace(/\/rest\/v1\/?$/,'').replace(/\/+$/,'');
        const sbKey=window._SUPABASE_KEY||'';
        const r=await fetch(`${sbUrl}/auth/v1/signup`,{
          method:'POST',
          headers:{'Content-Type':'application/json','apikey':sbKey,'Authorization':`Bearer ${sbKey}`},
          body:JSON.stringify({email,password:pass})
        });
        const d=await r.json();
        // Supabase returns user object on success
        if(d.id||d.user?.id||d.access_token){
          if(d.access_token){
            // email confirm disabled — logged in immediately
            SB.token=d.access_token;
            localStorage.setItem('AUTH_TOKEN',d.access_token);
            await afterLogin();
          } else {
            succ.textContent=t('acct-created');
            mode='login';syncTabs();
          }
        } else {
          err.textContent=d.msg||d.error_description||d.message||JSON.stringify(d);
        }
      } else {
        const res=await SB.login(email,pass);
        if(res.ok){
          await afterLogin();
        } else {
          err.textContent=res.error||t('login-failed');
        }
      }
    } catch(e){
      err.textContent=t('net-error')+e.message;
    }
    actionBtn.disabled=false;
    syncTabs();
  }

  async function afterLogin(){
    actionBtn.textContent=t('syncing');
    const remote=await SB.pull();
    if(remote){
      // Logging in MERGES cloud into local — it must never replace it.
      // This used to overwrite STATE.history/diary wholesale with whatever the
      // cloud had. When cloud sync had been silently dead for weeks, logging in
      // destroyed months of local days and diary entries in one shot.
      // applyRemote() merges history per-day (newest _ts wins, nothing deleted)
      // and unions the diary, so no entry can be lost from either side.
      applyRemote(remote);
      // Push the merged result straight back up, so anything the cloud was
      // missing lands there immediately instead of waiting for the next change.
      SB.push(STATE.history,STATE.today,STATE.diary,STATE.streakOverrides).catch(()=>{});
      // Save daily backup on login (once per day) — only mark done if it truly succeeded
      const _bkKey='st_last_backup';
      if(localStorage.getItem(_bkKey)!==todayKey()){
        SB.saveBackup(STATE.history,STATE.today,STATE.diary,STATE.streakOverrides).then(ok=>{
          if(ok) localStorage.setItem(_bkKey,todayKey());
        }).catch(()=>{});
      }
    }
    S.set(K.AUTH,true);STATE.authed=true;render();
  }

  pi.onkeydown=e=>{if(e.key==='Enter')doAction();};
  card.appendChild(hr());
  const gb=bt('btn-ghost',t('guest-btn'),()=>{S.set(K.AUTH,true);STATE.authed=true;render();});
  gb.style.width='100%';card.appendChild(gb);
  card.appendChild(dv('xs dimmer ctr mt8',t('guest-note')));
  wrap.appendChild(card);return wrap;
}

/* ═══ MAIN APP ═══ */
function renderApp(){
  /* loadToday already called at boot and after save */
  const tk=todayKey();
  // Tab 1 fills tab 2's numbers before anything is scored, skipping any field
  // already set by hand today.
  syncPlannerToToday();
  const sk_raw=CALC.streaks(STATE.history,STATE.today);
  // Apply manual overrides for TODAY only — does NOT affect history liveScore
  const sk_=applyStreakOverrides(sk_raw);
  // earlyBedStreak for display only — read from sk_ but don't mutate STATE here
  const sc=CALC.score(STATE.today,sk_);
  // #2: histTotal excludes today, score.total is today — no double count.
  // Long-goal points ride on the grand total only: they are big enough that
  // landing them on a day would own "best day" forever and skew every average.
  const total=CALC.histTotal(STATE.history)+sc.total+goalsTotal();

  const wrap=dv('');
  // HEADER
  const hdr=dv('ctr');hdr.style.padding='20px 0 16px';
  const now=new Date();
  const tz='America/Cancun';
  hdr.innerHTML=`<div class="xxxl w8 ac" style="letter-spacing:-.02em">🏛️ Stoic</div>
    <div class="sm dim mt4">${capFirst(now.toLocaleDateString(STATE.lang==='es'?'es-MX':'en-US',{timeZone:tz,weekday:'long',year:'numeric',month:'long',day:'numeric'}))}</div>
    <div class="xs dimmer mt2 mo" id="clk">${now.toLocaleTimeString(STATE.lang==='es'?'es-MX':'en-US',{timeZone:tz,hour:'2-digit',minute:'2-digit',second:'2-digit'})}</div>`;

  // clock update: interval is started once at boot level
  const sind=dv('row gap6 xs dim mt6');sind.style.justifyContent='center';
  // Tell the truth about sync. This used to print "Synced" whenever a token
  // merely existed, so a dead session looked perfectly healthy for two months.
  const cloudOn=SB.init();
  // "Held" is its own state: the connection works, but uploading was stopped
  // because this device is behind. Saying only "not syncing" would hide the
  // fact that the good copy is safe in the cloud and can be pulled down.
  const held=cloudOn&&SB.blocked==='would-shrink';
  const broken=cloudOn&&SB.status==='error'&&!held;
  const lastSync=!cloudOn?t('Local'):held?t('sync-held'):broken?t('sync-broken'):t('Synced');
  sind.innerHTML=`<span class="sdot"></span><span>${t('Auto-saved')} · ${lastSync}</span>`;
  // The indicator IS the control: clicking it opens the sync panel. A separate
  // cloud button next to a cloud indicator was one cloud too many.
  sind.style.cursor='pointer';
  sind.title=held?t('sync-held-fix'):broken?t('sync-fix'):t('sync-title');
  sind.onclick=()=>{STATE.showSyncPanel=!STATE.showSyncPanel;refresh();};
  if(broken||held){
    sind.style.color=held?'var(--cy)':'var(--cr)';
    sind.querySelector('.sdot').style.background=held?'var(--cy)':'var(--cr)';
  }
  hdr.appendChild(sind);
  const acts=dv('row gap8 mt10');acts.style.justifyContent='center';
  const themeBtn=bt('btn-ghost btn-sm',STATE.theme==='light'?t('dark'):t('light'),toggleTheme);
  acts.appendChild(themeBtn);
  
  // Difficulty switch
  const diffWrap=dv('row gap4');diffWrap.style.cssText='border:1px solid var(--b2);border-radius:9px;padding:2px;background:var(--sur2);';
  [{d:'easy',lbl:t('easy')},{d:'medium',lbl:t('medium')},{d:'hard',lbl:t('hard')}].forEach(({d,lbl})=>{
    const active=STATE.difficulty===d;
    const b=bt(active?'btn-ac btn-xs':'btn-xs',lbl,()=>{STATE.difficulty=d;localStorage.setItem('st_difficulty',d);commitAndRefresh();});
    if(!active){b.style.cssText='background:none;border:none;color:var(--t3);font-size:12px;padding:3px 8px;border-radius:5px;cursor:pointer';}
    diffWrap.appendChild(b);
  });
  acts.appendChild(diffWrap);
  acts.appendChild(bt('btn-ghost btn-sm',t('lang-btn'),toggleLang));
  hdr.appendChild(acts);wrap.appendChild(hdr);



  if(STATE.showSyncPanel){
    wrap.appendChild(renderSyncPanel());
  }

  /* ── TABS ── */
  const st=plannerTodayStats();
  const tabs=dv('row gap6 mt4 mb4');

  const grid=dv('g4 mt4');

  // Reset All — at the bottom where it's hard to hit accidentally
  const resetWrap=dv('card mt12');resetWrap.style.cssText='border-color:var(--ngb);background:var(--ngd)';
  const resetRow=dv('rowb');
  const resetInfo=dv('');
  resetInfo.innerHTML=`<div class="sm w6 ng">${t('danger-zone')}</div><div class="xs dimmer mt2">${t('erase-warn')}</div>`;
  resetRow.appendChild(resetInfo);
  resetRow.appendChild(bt('btn-ng btn-sm',t('reset-all-btn'),()=>{STATE.showReset=!STATE.showReset;refresh()}));
  resetWrap.appendChild(resetRow);
  // Reset confirmation banner — right inside danger zone
  if(STATE.showReset){
    const ban=dv('fi row gap12 mt10');ban.style.cssText='background:var(--ngd);border:1px solid var(--ngb);border-radius:10px;padding:12px 14px;justify-content:space-between';
    ban.appendChild(sp('md ng',t('del-warn')));
    const bb=dv('row gap8');
    bb.appendChild(bt('btn-ng btn-sm',t('yes-delete'),()=>{
      STATE.history=[];STATE.today={completed:0,target:0,morningCompleted:false,flagCompleted:false,pomodoros:0,penalties:[],sleep:{sleepDuration:0,napDuration:0,sleptEarly:false,earlyBedStreak:0},work:{workDuration:0},_date:todayKey()};
      STATE.diary={};STATE.streakOverrides={};
      [K.TODAY,K.HIST,K.DIARY,K.STREAK_OVR].forEach(k=>localStorage.removeItem(k));
      STATE.showReset=false;commit();refresh();
    }));bb.appendChild(bt('btn-ghost btn-sm',t('cancel'),()=>{STATE.showReset=false;refresh()}));
    ban.appendChild(bb);resetWrap.appendChild(ban);
  }
  wrap.appendChild(resetWrap);
  // Bottom — note + restore + logout
  const bottomWrap=dv('s8 mt12 mb16');bottomWrap.style.textAlign='center';

  const backupRow=dv('row gap8');backupRow.style.justifyContent='center';backupRow.style.flexWrap='wrap';

  const backupNowBtn=bt('btn-ghost btn-sm',STATE.lang==='es'?'💾 Backup ahora':'💾 Backup now',async()=>{
    backupNowBtn.disabled=true;backupNowBtn.textContent='...';
    const ok=await SB.saveBackup(STATE.history,STATE.today,STATE.diary,STATE.streakOverrides);
    backupNowBtn.disabled=false;
    backupNowBtn.textContent=STATE.lang==='es'?'💾 Backup ahora':'💾 Backup now';
    if(ok){
      localStorage.setItem('st_last_backup',todayKey());
      alert(STATE.lang==='es'?'✅ Backup guardado en la nube.':'✅ Backup saved to the cloud.');
    } else {
      alert(STATE.lang==='es'?'❌ Falló el backup. Revisa que la tabla stoic_backups exista en Supabase con RLS correcto.':'❌ Backup failed. Check that the stoic_backups table exists in Supabase with correct RLS.');
    }
  });
  backupRow.appendChild(backupNowBtn);

  const restoreBtn=bt('btn-ghost btn-sm',t('restore-from'),async()=>{
    restoreBtn.disabled=true;restoreBtn.textContent='...';
    const list=await SB.listBackups();
    restoreBtn.disabled=false;restoreBtn.textContent=t('restore-from');
    if(!list.length){alert(t('backup-empty'));return;}
    const opts=list.map(b=>`${b.backup_date} (${new Date(b.created_at).toLocaleDateString()})`).join('\n');
    const choice=prompt(`${t('restore-from')}:\n${opts}\n\nType the date (YYYY-MM-DD):`);
    if(!choice) return;
    const bk=await SB.restoreBackup(choice.trim());
    if(!bk){alert('Not found');return;}
    if(bk.history) STATE.history=bk.history;
    if(bk.today) STATE.today=bk.today;
    if(bk.diary) STATE.diary=bk.diary;
    if(bk.streak_overrides) STATE.streakOverrides=bk.streak_overrides;
    S.set(K.HIST,STATE.history);S.set(K.TODAY,STATE.today);
    S.set(K.DIARY,STATE.diary);S.set(K.STREAK_OVR,STATE.streakOverrides);
    SB.push(STATE.history,STATE.today,STATE.diary,STATE.streakOverrides).catch(()=>{});
    alert(t('backup-restored'));refresh();
  });
  backupRow.appendChild(restoreBtn);
  bottomWrap.appendChild(backupRow);

  /* ── LOCAL EXPORT / IMPORT ──────────────────────────────────────────
     The cloud is not a backup you control: the free tier keeps no database
     backups, the project pauses itself when idle, and a lapsed session can
     leave the browser holding the only copy. These two buttons give a real
     file that survives all of that.
     ────────────────────────────────────────────────────────────────── */
  const fileRow=backupRow;

  fileRow.appendChild(bt('btn-ghost btn-sm',t('export-btn'),()=>{
    const dump={};
    for(const k of Object.keys(localStorage))dump[k]=localStorage.getItem(k);
    const blob=new Blob([JSON.stringify(dump,null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`stoic-respaldo-${todayKey()}.json`;
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  }));

  fileRow.appendChild(bt('btn-ghost btn-sm',t('import-btn'),()=>{
    const picker=document.createElement('input');
    picker.type='file';picker.accept='.json,application/json';
    picker.onchange=async()=>{
      const f=picker.files&&picker.files[0];if(!f)return;
      let dump;
      try{dump=JSON.parse(await f.text());}catch{alert(t('import-bad'));return;}
      if(!dump||typeof dump!=='object'||!dump.st_hist){alert(t('import-bad'));return;}
      let incoming=0;
      try{incoming=(JSON.parse(dump.st_hist)||[]).length;}catch{alert(t('import-bad'));return;}
      const current=(STATE.history||[]).length;
      if(!confirm(t('import-warn').replace('{n}',current)))return;
      // A restore must be exact. Writing the file's keys over the existing ones
      // left anything not present in the file behind, so the result was a blend
      // of two states rather than the file.
      try{localStorage.clear();}catch{}
      Object.entries(dump).forEach(([k,v])=>{try{localStorage.setItem(k,v);}catch{}});
      // The reload right after used to pull from the cloud and merge those days
      // straight back in, quietly undoing the restore. This flag tells the next
      // boot that this file is the truth: push it up instead of pulling down.
      localStorage.setItem('st_restore_pending','1');
      alert(t('import-ok').replace('{n}',incoming));
      location.reload();
    };
    picker.click();
  }));

  bottomWrap.appendChild(dv('xs dimmer ctr',t('backup-note')));

  bottomWrap.appendChild(bt('btn-ghost btn-sm',t('logout'),()=>{S.set(K.AUTH,false);STATE.authed=false;render();}));
  wrap.appendChild(bottomWrap);
  return wrap;
}

/* ═══ POMODORO ═══ */
function renderPomCard(){
  const card=dv('card');
  // The timer can bank part of a pomodoro, so this shows one decimal and the
  // buttons step by whole ones without ever rounding the fraction away.
  const val=Math.round((STATE.today.pomodoros||0)*10)/10;
  const shown=Number.isInteger(val)?String(val):val.toFixed(1);
  const tr=dv('rowb mb8');tr.appendChild(sp('ctit',t('pom-lbl')));tr.appendChild(sp('xxl w7 ac mo',shown));card.appendChild(tr);
  card.appendChild(sp('xs dim',`+${Math.round(val*25)} ${t('pts-each')}`));
  const step=d=>{
    STATE.today.pomodoros=Math.max(0,Math.round(((STATE.today.pomodoros||0)+d)*10)/10);
    markManual('pomodoros');commitAndRefresh();
  };
  const ct=dv('row gap8 mt10');
  ct.appendChild(bt('btn-ghost btn-sm f1','−',()=>step(-1)));
  const n=dv('f1 ctr xl w7 mo');n.textContent=shown;ct.appendChild(n);
  ct.appendChild(bt('btn-ac btn-sm f1','+',()=>step(1)));
  card.appendChild(ct);
  if(STATE.pomo&&STATE.pomo.minutesToday>0){
    card.appendChild(dv('xs dimmer mt6',`⏱ ${STATE.pomo.minutesToday} min ${t('pomo-from-timer')}`));
  }
  return card;
}

/* ═══ PENALTY CARD — #3 keep type, #4 enter = add ═══ */
function renderPenCard(sk_){
  const card=dv('card');
  card.style.borderColor='var(--ngb)';
  const penPts=STATE.today.penalties.reduce((sum,p)=>{
    const b=CALC.penBase(p);const procMins=STATE.today.penalties.filter(x=>x.type==='internet').reduce((s,x)=>s+(x.details?.minutes||0),0);
    let m=1;
    if(p.type==='drugs')m=Math.max(1,sk_.substancesPenaltyStreak);
    else if(p.type==='internet')m=CALC.procMult(procMins,sk_.procrastinationPenaltyStreak);
    else if(p.type==='macanazo')m=Math.max(1,sk_.macanazoPenaltyStreak);
    return sum+b*m;
  },0);
  const tr=dv('rowb mb10');tr.appendChild(sp('ctit',t('rewards-lbl')));if(penPts!==0)tr.appendChild(sp('md mo w7 ng',String(penPts)));card.appendChild(tr);

  // #3: use STATE.penType so selection persists after refresh
  const tEl=sk('mb8',[['drugs',t('pen-indulg')],['internet',t('pen-proc')],['macanazo',t('pen-org')]],STATE.penType);
  tEl.onchange=()=>{STATE.penType=tEl.value;updateDet();};
  card.appendChild(tEl);

  const dw=dv('mb8');
  const si=ip('number','',1,t('num-subs'));si.min=1;
  const pi=ip('text','','',t('eg-time'));
  const errD=dv('xs ng mb8');

  function doAdd(){
    errD.textContent='';
    const type=tEl.value;
    if(type==='drugs'){
      const n=parseInt(si.value)||0;if(n<1){errD.textContent=t('min-1');return;}
      STATE.today.penalties.push({id:uid(),type:'drugs',count:n,details:{substances:n},timestamp:new Date().toISOString()});
      si.value='1';
    }else if(type==='internet'){
      const r=parseDur(pi.value);if(r.v===null){errD.textContent=r.err;return;}if(r.v===0){errD.textContent=t('enter-time');return;}
      STATE.today.penalties.push({id:uid(),type:'internet',count:r.v,details:{minutes:r.v},timestamp:new Date().toISOString()});
      pi.value='';
    }else{
      STATE.today.penalties.push({id:uid(),type:'macanazo',count:1,details:{isPositive:false},timestamp:new Date().toISOString()});
    }
    // #3: do NOT reset tEl — keep selection
    commitAndRefresh();
  }
  // #4: enter key support for all penalty inputs
  si.onkeydown=e=>{if(e.key==='Enter')doAdd();};
  pi.onkeydown=e=>{if(e.key==='Enter')doAdd();};

  function updateDet(){dw.innerHTML='';if(tEl.value==='drugs')dw.appendChild(si);else if(tEl.value==='internet')dw.appendChild(pi);}
  updateDet();card.appendChild(dw);card.appendChild(errD);
  const ab=bt('btn-ng btn-sm w100',t('add-btn'),doAdd);ab.style.width='100%';card.appendChild(ab);

  if(STATE.today.penalties.length){
    const list=dv('s6 mt12');
    const procMinsTotal=STATE.today.penalties.filter(x=>x.type==='internet').reduce((s,x)=>s+(x.details?.minutes||0),0);
    STATE.today.penalties.forEach(p=>{
      const base=CALC.penBase(p);
      let mult=1;
      if(p.type==='drugs') mult=Math.max(1,sk_.substancesPenaltyStreak);
      else if(p.type==='internet') mult=CALC.procMult(procMinsTotal,sk_.procrastinationPenaltyStreak);
      else if(p.type==='macanazo') mult=Math.max(1,sk_.macanazoPenaltyStreak);
      const actual=base*mult;
      const lbl=p.type==='drugs'?`${t('indulg-x')}${p.details?.substances||1}`:p.type==='internet'?`${t('procrast-s')} ${fmtDur(p.details?.minutes||0)}`:t('pen-org').replace('💦 ','');
      const row=dv('pen-it');
      const info=dv('f1');
      // Show label + breakdown: base × streak = actual
      const breakdown = mult>1 ? `<span class="xs dimmer">${base} × ${mult} ${t('streak-lbl')}</span>` : `<span class="xs dimmer">${t('base-lbl')}</span>`;
      info.innerHTML=`<div class="md dim">${lbl}</div><div class="row gap6 mt2">${breakdown}<span class="sm mo w7 ng">${actual}</span></div>`;
      const rm=bt('btn-icon','✕',()=>{STATE.today.penalties=STATE.today.penalties.filter(x=>x.id!==p.id);commitAndRefresh();});
      row.appendChild(info);row.appendChild(rm);list.appendChild(row);
    });card.appendChild(list);
  }
  return card;
}

/* ═══ STREAKS — 2 colors only ═══ */
function renderStreaks(sk_){
  const card=dv('card mt12');
  const hdr=dv('rowb mb8');
  hdr.appendChild(dv('ctit',t('streaks-title')));
  const editBtn=bt('btn-ghost btn-sm',STATE.editingStreaks?'✕ Done':'✏️ Edit',()=>{STATE.editingStreaks=!STATE.editingStreaks;refresh();});

  const mutuallyExclusive={
    earlyBedStreak:'lateStreak',lateStreak:'earlyBedStreak',
    substancesStreak:'substancesPenaltyStreak',substancesPenaltyStreak:'substancesStreak',
    procrastinationStreak:'procrastinationPenaltyStreak',procrastinationPenaltyStreak:'procrastinationStreak',
    macanazoStreak:'macanazoPenaltyStreak',macanazoPenaltyStreak:'macanazoStreak',
  };

  function makeStreakItem(item, cls, numCls){
    const c=dv('skc '+cls);
    if(STATE.editingStreaks){
      // Show current value as editable input
      const cur=sk_[item.k]||0;
      const inp=ip('number','',cur===0?'':cur,'—');
      inp.min=0;inp.style.cssText='width:54px;text-align:center;font-size:1.3rem;font-weight:700;background:transparent;border:none;border-bottom:2px solid var(--ac);color:var(--ac);padding:2px 0;outline:none;';
      const lbl=dv('skl');lbl.textContent=item.l;
      c.appendChild(inp);c.appendChild(lbl);
      let committed=false;
      function commit(){
        if(committed) return;
        committed=true;
        const raw=inp.value.trim();
        if(raw===''){ refresh(); return; }
        const v=parseInt(raw);
        if(isNaN(v)||v<0){ refresh(); return; }

        const fieldMap={
          morningStreak:'morning', flagStreak:'flags',
          workStreak:'work', earlyBedStreak:'early', lateStreak:'late',
          substancesPenaltyStreak:'drugs', procrastinationPenaltyStreak:'internet', macanazoPenaltyStreak:'macanazo',
        };
        const field=fieldMap[item.k];
        const tk=todayKey();

        if(field){
          if(v===0){
            delete STATE.streakOverrides[item.k];
            if(field==='morning') STATE.today.morningCompleted=false;
            else if(field==='flags') STATE.today.flagCompleted=false;
            else if(field==='work'){ if(STATE.today.work) STATE.today.work.workDuration=0; }
            else if(field==='early'){ if(STATE.today.sleep) STATE.today.sleep.sleptEarly=false; }
            else if(field==='late'){ if(STATE.today.sleep) STATE.today.sleep.sleptLate=false; }
            else if(field==='drugs'||field==='internet'||field==='macanazo'){
              STATE.today.penalties=(STATE.today.penalties||[]).filter(p=>p.type!==field);
            }
          } else {
            // STEP 1+2 — mark TODAY so natural includes it; offset is computed afterward (STEP 4 below)
            if(field==='morning') STATE.today.morningCompleted=true;
            else if(field==='flags') STATE.today.flagCompleted=true;
            else if(field==='work'){ if(!STATE.today.work) STATE.today.work={}; if(!STATE.today.work.workDuration||STATE.today.work.workDuration<=0) STATE.today.work.workDuration=1; }
            else if(field==='early'){ if(!STATE.today.sleep) STATE.today.sleep={}; STATE.today.sleep.sleptEarly=true; if(!STATE.today.sleep.sleepDuration) STATE.today.sleep.sleepDuration=1; }
            else if(field==='late'){ if(!STATE.today.sleep) STATE.today.sleep={}; STATE.today.sleep.sleptLate=true; }
            else if(field==='drugs'||field==='internet'||field==='macanazo'){
              if(!STATE.today.penalties) STATE.today.penalties=[];
              const has=STATE.today.penalties.some(p=>p.type===field);
              if(!has) STATE.today.penalties.push({id:'streak-seed-'+Date.now(),type:field,count:field==='internet'?35:1,details:field==='drugs'?{substances:1}:field==='internet'?{minutes:35}:{isPositive:false},timestamp:new Date().toISOString()});
            }

            // STEP 3 — propagate backward ONLY into already-registered days (never invented)
            const sorted=[...STATE.history].filter(h=>!h._gap&&h.date!==tk).sort((a,b)=>a.date.localeCompare(b.date));
            const daysToMark=Math.min(Math.max(0,v-1), sorted.length);
            const startIdx=sorted.length-daysToMark;
            for(let i=startIdx;i<sorted.length;i++){
              const d=sorted[i];
              if(field==='morning'){
                if(!d.streaks) d.streaks=[{type:'morning',count:0,active:false},{type:'flags',count:0,active:false}];
                const ms=d.streaks.find(s=>s.type==='morning'); if(ms){ms.active=true;ms.count=1;}
              } else if(field==='flags'){
                if(!d.streaks) d.streaks=[{type:'morning',count:0,active:false},{type:'flags',count:0,active:false}];
                const fs=d.streaks.find(s=>s.type==='flags'); if(fs){fs.active=true;fs.count=1;}
              } else if(field==='work'){
                if(!d.workDuration||d.workDuration<=0) d.workDuration=1;
              } else if(field==='early'){
                d.sleptEarly=true; if(!d.sleepDuration) d.sleepDuration=1;
              } else if(field==='late'){
                d.sleptLate=true;
              } else if(field==='drugs'||field==='internet'||field==='macanazo'){
                if(!d.penalties) d.penalties=[];
                const has=d.penalties.some(p=>p.type===field);
                if(!has) d.penalties.push({type:field,count:field==='internet'?35:1,points:0,streak:1});
              }
            }
          }
          if(v>0){
            // Compute offset using the natural value AFTER today is marked + history propagated
            const naturalAfter=(CALC.streaks(STATE.history,STATE.today)[item.k])||0;
            STATE.streakOverrides[item.k]=v-naturalAfter;
          }
          S.set(K.HIST,STATE.history);
        }
        S.set(K.STREAK_OVR,STATE.streakOverrides);
        commitAndRefresh();
      }
      inp.onkeydown=e=>{
        if(e.key==='Enter'){commit();inp.blur();}
        else if(e.key==='Escape'){committed=true;STATE.editingStreaks=false;refresh();}
      };
      inp.onblur=()=>commit();
    } else {
      const n=dv('skn '+numCls);n.textContent=String(sk_[item.k]||0);
      const l=dv('skl');l.textContent=item.l;
      c.appendChild(n);c.appendChild(l);
    }
    return c;
  }

  card.appendChild(dv('xs dimmer up ls mb8',t('pos-streaks')));
  const pg=dv('sk-g mb16');
  [{k:'morningStreak',l:t('sk-morning')},{k:'flagStreak',l:t('sk-goals')},{k:'workStreak',l:t('sk-work')},
   {k:'earlyBedStreak',l:t('slept-early')},
   {k:'substancesStreak',l:t('sk-ci')},{k:'procrastinationStreak',l:t('sk-cp')},{k:'macanazoStreak',l:t('sk-co')}]
  .forEach(item=>pg.appendChild(makeStreakItem(item,'pos','ac')));
  card.appendChild(pg);

  card.appendChild(dv('xs dimmer up ls mb8',t('rew-streaks')));
  const ng=dv('sk-g');
  [{k:'substancesPenaltyStreak',l:t('sk-i')},{k:'procrastinationPenaltyStreak',l:t('sk-p')},{k:'macanazoPenaltyStreak',l:t('sk-o')},{k:'lateStreak',l:t('sk-l')}]
  .forEach(item=>ng.appendChild(makeStreakItem(item,'neg','ng')));
  card.appendChild(ng);

  if(STATE.editingStreaks){
    const clearBtn=bt('btn-ghost btn-sm mt10',t('clear-ovr'),()=>{STATE.streakOverrides={};STATE.editingStreaks=false;S.set(K.STREAK_OVR,{});SB.push(STATE.history,STATE.today,STATE.diary,STATE.streakOverrides).catch(()=>{});refresh();});
    clearBtn.style.marginTop='12px';card.appendChild(clearBtn);
  }
  return card;
}

/* ═══ CALENDAR — #5 pts visible, #8 flag glow ═══ */
function renderCalendar(){
  const wrap=dv('card');const now=new Date();let cY=now.getFullYear(),cM=now.getMonth(),selK=null;
  const isLight=document.body.classList.contains('light');
  const sBg=isLight
    ? {red:{bg:'#fecaca',txt:'#991b1b'},yellow:{bg:'#fef08a',txt:'#854d0e'},green:{bg:'#bbf7d0',txt:'#14532d'},purple:{bg:'#e9d5ff',txt:'#581c87'},none:{bg:'#e2e8f0',txt:'#94a3b8'}}
    : {red:{bg:'#2e0808',txt:'#fca5a5'},yellow:{bg:'#2e2008',txt:'#fde68a'},green:{bg:'#082e1a',txt:'#6ee7b7'},purple:{bg:'#16082e',txt:'#c4b5fd'},none:{bg:'#111118',txt:'#2a2a3a'}};

  function build(){
    wrap.innerHTML='';
    const hd=dv('rowb mb12');
    const pv=bt('btn-icon','‹',()=>{cM--;if(cM<0){cM=11;cY--;}build();});pv.style.fontSize='20px';
    const nx=bt('btn-icon','›',()=>{cM++;if(cM>11){cM=0;cY++;}build();});nx.style.fontSize='20px';
    hd.appendChild(pv);hd.appendChild(sp('lg w7',capFirst(new Date(cY,cM).toLocaleDateString(STATE.lang==='es'?'es-MX':'en-US',{month:'long',year:'numeric'}))));hd.appendChild(nx);wrap.appendChild(hd);

    // #6: use history with gaps filled for calendar display
    const filledHist=CALC.fillGaps(STATE.history);
    const hMap=new Map(filledHist.map(d=>[d.date,d]));
    // also merge STATE.history (gaps might not be in STATE yet)
    STATE.history.forEach(d=>hMap.set(d.date,d));

    const dim=new Date(cY,cM+1,0).getDate();const fd=new Date(cY,cM,1).getDay();
    const tk=todayKey();
    const cg=dv('cal-g mb10');
    (STATE.lang==='es'?['Do','Lu','Ma','Mi','Ju','Vi','Sa']:['Su','Mo','Tu','We','Th','Fr','Sa']).forEach(d=>cg.appendChild(dv('cal-hd',d)));
    for(let i=0;i<fd;i++)cg.appendChild(dv(''));
    for(let d=1;d<=dim;d++){
      const key=(()=>{const _d=new Date(cY,cM,d);return _d.getFullYear()+'-'+String(_d.getMonth()+1).padStart(2,'0')+'-'+String(_d.getDate()).padStart(2,'0');})();
      const entry=hMap.get(key);
      const bg=entry?sBg[entry.status]||sBg.none:sBg.none;
      const cell=dv(`cal-c${key===tk?' today':''}${key===selK?' sel':''}`);
      cell.style.background=bg.bg;
      const flagOn=entry?.streaks?.some(s=>s.type==='flags'&&s.active);
      if(flagOn){
        // #8: prominent ring + icon
        const ring=dv('cal-flag-ring');cell.appendChild(ring);
        cell.appendChild(sp('cal-flag-ico','🏅'));
      }
      const num=sp('cal-num',String(d));num.style.color=bg.txt;cell.appendChild(num);
      // #5: always show pts if entry exists
      if(entry){const pts=sp('cal-pts',String(CALC.liveScore(entry,STATE.history)));pts.style.color=bg.txt;cell.appendChild(pts);}
      cell.onclick=()=>{selK=key===selK?null:key;build();};
      cg.appendChild(cell);
    }
    wrap.appendChild(cg);
    if(selK){
      const entry=hMap.get(selK);
      if(!entry){
        // No data for this day — still allow diary
        const det=dv('card2 fi');det.style.border='1px solid var(--b2)';
        det.appendChild(sp('xs dim',selK));
        det.appendChild(sp('xs dimmer mt4',t('no-data')));
        const diaryToggle=bt('btn-ghost btn-sm','📝 '+(STATE.diary[selK]?t('edit-note'):t('add-note')),()=>{
          toggleDiaryEditor(det,selK,diaryToggle);
        });
        diaryToggle.style.marginTop='8px';det.appendChild(diaryToggle);
        if(STATE.diary[selK]){const pv=dv('xs dim mt6');pv.style.cssText='white-space:pre-wrap;max-height:60px;overflow:hidden';pv.textContent=STATE.diary[selK].slice(0,120);pv.onclick=()=>diaryToggle.click();det.appendChild(pv);}
        wrap.appendChild(det);
      }
      if(entry){
        const det=dv(`card2 fi s-${entry.status}`);det.style.border='1px solid';
        const dr=dv('rowb');dr.appendChild(sbadge(entry.status));dr.appendChild(sp('lg mo w7 ac',`${CALC.liveScore(entry,STATE.history)} pts`));det.appendChild(dr);
        // Format: Fri, Jun 12 2026 | 21/28 tasks | 20 🍅 | 🏅 ×37
        const fmtSelDate=new Date(selK+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',year:'numeric',month:'short',day:'numeric'});
        const flagActive=entry.streaks?.some(s=>s.type==='flags'&&s.active);
        const flagStreak=entry.streaksUsed?.flagStreak||entry.streaksUsed?.flagstreak||'';
        const parts=[
          fmtSelDate,
          `${entry.completedTasks||0}/${entry.totalTasks||0} tasks`,
          `${entry.pomodoros||0} 🍅`,
          ...(flagActive?[`🏅 ×${flagStreak||'?'}`]:[])
        ];
        det.appendChild(sp('xs dim mt6',parts.join(' · ')));
        if(entry._gap)det.appendChild(sp('xs ng mt4',t('day-not-logged')));
        // Diary entry
        const diaryToggle=bt('btn-ghost btn-sm','📝 '+(STATE.diary[selK]?t('edit-note'):t('add-note')),()=>{
          toggleDiaryEditor(det,selK,diaryToggle);
        });
        diaryToggle.style.marginTop='10px';
        det.appendChild(diaryToggle);
        // Show existing note preview
        if(STATE.diary[selK]){
          const noteText=STATE.diary[selK];
          const preview=dv('xs dim mt6');
          preview.style.cssText='white-space:pre-wrap;line-height:1.6';
          preview.textContent=noteText;
          det.appendChild(preview);
        }
        wrap.appendChild(det);
      }
    }
  }
  build();return wrap;
}

/* ═══ HISTORY EDITOR — #2 save triggers full refresh ═══ */
function renderHistEd(sk_){
  const wrap=dv('card');wrap.appendChild(sp('ctit',t('edit-hist')));
  let edKey=null,fst={},vis=7;
  function buildDays(){
    const days=[];const today=new Date();
    for(let i=0;i<=30;i++){
      const d=new Date(today);d.setDate(d.getDate()-i);
      const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      days.push({key,entry:STATE.history.find(h=>h.date===key),isToday:i===0});
    }return days;
  }
  function build(){
    while(wrap.children.length>1)wrap.removeChild(wrap.lastChild);
    const days=buildDays();const list=dv('s6');
    // Most recent day shown = today (i=0); that's where we show reset emojis
    const todaySt=CALC.score(STATE.today,sk_).status;
    // Most recent logged key = today if it has tasks/data, else last history entry
    const shownKeys=days.slice(0,vis).map(d=>d.key);
    const mostRecentKey=shownKeys[0]; // always today
    function resetEmojis(status){
      if(status==='red')return'💼🔄';
      if(status==='yellow')return'💊🔄';
      if(status==='green')return'💊🌐🔄';
      if(status==='purple')return'💊🌐💦🌙🔄';
      return'';
    }
    function resetTooltip(status){
      if(status==='red')return t('reset-work');
      if(status==='yellow')return t('reset-indulg');
      if(status==='green')return t('reset-ip');
      if(status==='purple')return t('reset-all');
      return'';
    }
    // Pre-pass: find most recent day key for each color (today wins for its color)
    const mostRecentForColor={};
    // today is always most recent for its own color
    mostRecentForColor[todaySt]='today';
    // scan history entries in order (days is already newest-first)
    days.slice(0,vis).forEach(({key,entry,isToday})=>{
      if(isToday)return;
      if(entry&&!entry._gap&&!mostRecentForColor[entry.status]){
        mostRecentForColor[entry.status]=key;
      }
    });
    days.slice(0,vis).forEach(({key,entry,isToday})=>{
      const isEd=edKey===key;const row=dv(`hr-row${isEd?' ed':''}`);
      const hd=dv('rowb');const lft=dv('row gap6');
      lft.appendChild(sp('sm mo dim',key));
      if(isToday){
        // TODAY badge: colored by current day status
        const b=sp(`badge s-${todaySt}`,t('Today'));b.style.marginLeft='4px';lft.appendChild(b);
        // Reset emojis only if today is the most recent of its color
        if(mostRecentForColor[todaySt]==='today'){
          const re=sp('xs dimmer',' '+resetEmojis(todaySt));re.style.marginLeft='2px';re.title=resetTooltip(todaySt);re.style.cursor='help';lft.appendChild(re);
        }
      }
      if(entry&&!isToday)lft.appendChild(sbadge(entry.status));
      if(entry?._gap)lft.appendChild(sp('xs ng',' '+t('gap-warn')));
      // Show reset emojis only on the most recent historical entry of its color
      if(!isToday&&entry&&!entry._gap&&mostRecentForColor[entry.status]===key){
        const re=sp('xs dimmer',' '+resetEmojis(entry.status));re.style.marginLeft='4px';re.title=resetTooltip(entry.status);re.style.cursor='help';lft.appendChild(re);
      }
      hd.appendChild(lft);
      const rgt=dv('row gap6');
      if(isToday){
        // Today isn't saved into history yet — use the live in-memory calculation
        // (which already includes any streak override) instead of liveScore(entry).
        const todayPts=CALC.score(STATE.today,sk_).total;
        rgt.appendChild(sp('sm mo dimmer',`${todayPts}pt`));
      } else if(entry){
        rgt.appendChild(sp('sm mo dimmer',`${CALC.liveScore(entry,STATE.history)}pt`));
      }
      const eb=bt('btn-icon',isEd?'✕':'✏',()=>{
        if(isEd){edKey=null;}
        else{
          edKey=key;const e=entry;
          fst={completed:e?.completedTasks||0,target:e?.totalTasks||0,pomodoros:e?.pomodoros||0,workDuration:e?.workDuration||0,
            sleepDuration:e?.sleepDuration||0,napDuration:e?.napDuration||0,sleptEarly:e?.sleptEarly||false,
            morningCompleted:e?.streaks?.some(s=>s.type==='morning'&&s.active)||false,
            flagCompleted:e?.streaks?.some(s=>s.type==='flags'&&s.active)||false,
            sleptLate:e?.sleptLate||false,
            substances:e?.penalties?.find(p=>p.type==='drugs')?.count||0,
            procMins:e?.penalties?.find(p=>p.type==='internet')?.count||0,
            macanazoCount:e?.penalties?.filter(p=>p.type==='macanazo')?.length||0};
        }build();
      });
      rgt.appendChild(eb);hd.appendChild(rgt);row.appendChild(hd);
      if(isEd){
        const form=dv('fi mt10');const g=dv('g2 mb10');g.style.gap='6px';
        function nf(label,val,onChange){const w=dv('s4');w.innerHTML=`<div class="xs dimmer up ls">${label}</div>`;const i=ip('number','',val,'');i.min=0;i.style.width='100%';i.oninput=()=>onChange(parseInt(i.value)||0);i.onkeydown=e=>{if(e.key==='Enter')i.blur();};w.appendChild(i);return w;}
        function df(label,val,onChange){const w=dv('s4');w.innerHTML=`<div class="xs dimmer up ls">${label}</div>`;const i=ip('text','',val?fmtDur(val):'',t('ej-dur'));i.style.width='100%';i.oninput=()=>{const r=parseDur(i.value);if(r.v!==null)onChange(r.v);};i.onkeydown=e=>{if(e.key==='Enter')i.blur();};w.appendChild(i);return w;}
        g.appendChild(nf(t('daily-tasks'),fst.completed,v=>fst.completed=v));g.appendChild(nf(t('target-ph'),fst.target,v=>fst.target=v));
        g.appendChild(nf(t('pom-lbl'),fst.pomodoros,v=>fst.pomodoros=v));g.appendChild(df(t('work-lbl'),fst.workDuration,v=>fst.workDuration=v));
        g.appendChild(df(t('main-sleep'),fst.sleepDuration,v=>fst.sleepDuration=v));g.appendChild(df(t('nap-lbl'),fst.napDuration,v=>fst.napDuration=v));
        g.appendChild(nf(t('indulg-hash'),fst.substances,v=>fst.substances=v));g.appendChild(df(t('proc-lbl'),fst.procMins,v=>fst.procMins=v));
        g.appendChild(nf(t('org-hash'),fst.macanazoCount,v=>fst.macanazoCount=v));form.appendChild(g);
        const cks=dv('row gap16 mb10');
        function ck(label,val,onChange){const w=dv('row gap6');w.style.cursor='pointer';const c=ip('checkbox','');c.checked=val;c.onchange=()=>onChange(c.checked);w.appendChild(c);w.appendChild(sp('sm',label));w.onclick=e=>{if(e.target!==c){c.checked=!c.checked;c.dispatchEvent(new Event('change'));}};return w;}
        cks.appendChild(ck(t('morning-routine'),fst.morningCompleted,v=>fst.morningCompleted=v));cks.appendChild(ck(t('goals-ann'),fst.flagCompleted,v=>fst.flagCompleted=v));cks.appendChild(ck(t('early-bed'),fst.sleptEarly,v=>fst.sleptEarly=v));cks.appendChild(ck(t('late-bed'),fst.sleptLate,v=>fst.sleptLate=v));form.appendChild(cks);
        const sb=bt('btn-ac btn-sm',t('save-btn'),()=>{
          const pens=[];
          if(fst.substances>0)pens.push({type:'drugs',count:fst.substances,points:CALC.penBase({type:'drugs',details:{substances:fst.substances}}),streak:1});
          if(fst.procMins>0)pens.push({type:'internet',count:fst.procMins,points:CALC.penBase({type:'internet',details:{minutes:fst.procMins}}),streak:1});
          for(let i=0;i<fst.macanazoCount;i++)pens.push({type:'macanazo',count:1,points:CALC.penBase({type:'macanazo',details:{isPositive:false}}),streak:1});
          const mockDay={completed:fst.completed,target:fst.target,morningCompleted:fst.morningCompleted,flagCompleted:fst.flagCompleted,pomodoros:fst.pomodoros,
            penalties:pens.map(p=>({type:p.type,count:p.count,details:p.type==='drugs'?{substances:p.count}:p.type==='internet'?{minutes:p.count}:{isPositive:false}})),
            sleep:{sleepDuration:fst.sleepDuration,napDuration:fst.napDuration,sleptEarly:fst.sleptEarly,sleptLate:fst.sleptLate||false,earlyBedStreak:1},work:{workDuration:fst.workDuration}};
          const fsk={morningStreak:1,flagStreak:1,substancesPenaltyStreak:1,procrastinationPenaltyStreak:1,macanazoPenaltyStreak:1,lateStreak:1,substancesStreak:0,procrastinationStreak:0,macanazoStreak:0,workStreak:0};
          const sc_=CALC.score(mockDay,fsk);
          upsertHist({date:key,_ts:Date.now(),todayPoints:sc_.total,status:sc_.status,completedTasks:fst.completed,totalTasks:fst.target,pomodoros:fst.pomodoros,sleepDuration:fst.sleepDuration,napDuration:fst.napDuration,sleptEarly:fst.sleptEarly,sleptLate:fst.sleptLate||false,workDuration:fst.workDuration,penalties:pens,_gap:false,
            streaks:[{type:'morning',count:fst.morningCompleted?1:0,active:fst.morningCompleted},{type:'flags',count:fst.flagCompleted?1:0,active:fst.flagCompleted}]},key);
          // Save locally AND push to Supabase immediately
          S.set(K.HIST,STATE.history);
          SB.push(STATE.history,STATE.today,STATE.diary,STATE.streakOverrides).catch(()=>{});
          edKey=null;
          refresh();
        });form.appendChild(sb);row.appendChild(form);
      }
      list.appendChild(row);
    });
    wrap.appendChild(list);
    if(vis<31){const mb=bt('btn-ghost btn-sm w100 mt8',t('show-more'),()=>{vis+=7;build();});mb.style.width='100%';wrap.appendChild(mb);}
  }
  build();return wrap;
}

/* ═══ STATS — #7 more interesting stats ═══ */
function renderStats(total,sc){
  const wrap=dv('card mt12');let open=true;
  const tog=el('button','sec-t');tog.innerHTML=`<span>${t('stats-title')}</span><span id="st-a">▲</span>`;
  const body=dv('fi');
  tog.onclick=()=>{open=!open;body.style.display=open?'':'none';document.getElementById('st-a').textContent=open?'▲':'▼';};
  wrap.appendChild(tog);

  const isEs=STATE.lang==='es';

  // ── Computed values ──────────────────────────────────────────────────────
  const allPts=STATE.history.filter(d=>!d._gap).map(d=>CALC.liveScore(d,STATE.history));
  const last7=STATE.history.filter(d=>!d._gap).slice(0,7).map(d=>CALC.liveScore(d,STATE.history));
  const best=allPts.length?Math.max(...allPts):0;
  const worst=allPts.length?Math.min(...allPts):0;
  const avg=allPts.length?Math.round(allPts.reduce((a,b)=>a+b,0)/allPts.length):0;
  const avg7=last7.length?Math.round(last7.reduce((a,b)=>a+b,0)/last7.length):0;
  const totalTracked=STATE.history.filter(d=>!d._gap).length;
  const sortedH=[...STATE.history].sort((a,b)=>new Date(a.date)-new Date(b.date));
  const momentum=avg>0?Math.round((avg7-avg)/avg*100):0;

  // Streaks
  let bStrk=0,curStrk=0;sortedH.forEach(d=>{if(d.status!=='red'&&!d._gap){curStrk++;bStrk=Math.max(bStrk,curStrk);}else curStrk=0;});
  let pfStrk=0;for(let k=0;k<sortedH.length;k++){if(!sortedH[sortedH.length-1-k].penalties?.length&&!sortedH[sortedH.length-1-k]._gap)pfStrk++;else break;}
  let bestMornStrk=0,curMorn=0;sortedH.forEach(d=>{if(d.morningCompleted&&!d._gap){curMorn++;bestMornStrk=Math.max(bestMornStrk,curMorn);}else curMorn=0;});
  let bestDFStrk=0,curDF=0;sortedH.forEach(d=>{if(!d.penalties?.some(p=>p.type==='drugs')&&!d._gap){curDF++;bestDFStrk=Math.max(bestDFStrk,curDF);}else curDF=0;});

  // Work & focus
  const totalPoms=STATE.history.reduce((s,d)=>s+(d.pomodoros||0),0)+(STATE.today.pomodoros||0);
  const totalWorkMin=STATE.history.reduce((s,d)=>s+(d.workDuration||0),0)+(STATE.today.work?.workDuration||0);
  const workDays=STATE.history.filter(d=>!d._gap&&(d.workDuration||0)>0).length;
  const workPct=totalTracked>0?Math.round(workDays/totalTracked*100):0;
  const pomPerDay=totalTracked>0?Math.round(totalPoms/totalTracked*10)/10:0;
  const totalProcMin=STATE.history.reduce((s,d)=>s+(d.penalties?.filter(p=>p.type==='internet').reduce((a,p)=>a+(p.duration||0),0)||0),0);

  // Sleep
  const totalSleepMin=STATE.history.reduce((s,d)=>s+(d.sleepDuration||0),0)+(STATE.today.sleep?.sleepDuration||0);
  const avgSleepMin=totalTracked>0?Math.round(STATE.history.filter(d=>!d._gap).reduce((s,d)=>s+(d.sleepDuration||0),0)/totalTracked):0;
  const earlyNights=STATE.history.filter(d=>d.sleptEarly).length;
  const lateNights=STATE.history.filter(d=>d.sleptLate).length;

  // Discipline %
  const drugFreeDays=STATE.history.filter(d=>!d.penalties?.some(p=>p.type==='drugs')&&!d._gap).length;
  const dfPct=totalTracked?Math.round(drugFreeDays/totalTracked*100):100;
  const procFreeDays=STATE.history.filter(d=>!d.penalties?.some(p=>p.type==='internet')&&!d._gap).length;
  const procFreePct=totalTracked?Math.round(procFreeDays/totalTracked*100):100;
  const orgFreeDays=STATE.history.filter(d=>!d.penalties?.some(p=>p.type==='macanazo')&&!d._gap).length;
  const orgFreePct=totalTracked?Math.round(orgFreeDays/totalTracked*100):100;
  const totalOrgasms=STATE.history.reduce((s,d)=>s+(d.penalties?.filter(p=>p.type==='macanazo').length||0),0);
  const totalIndulgences=STATE.history.reduce((s,d)=>s+(d.penalties?.filter(p=>p.type==='drugs').reduce((a,p)=>a+(p.count||1),0)||0),0);

  // Day color counts
  const counts={purple:0,green:0,yellow:0,red:0};STATE.history.forEach(d=>counts[d.status]=(counts[d.status]||0)+1);
  const purplePct=totalTracked?Math.round((counts.purple/totalTracked)*100):0;

  // Most productive day EVER (highest workDuration)
  let bestWorkDay=null,bestWorkMin=0;
  sortedH.filter(d=>!d._gap).forEach(d=>{if((d.workDuration||0)>bestWorkMin){bestWorkMin=d.workDuration;bestWorkDay=d.date;}});
  const prodEverStr=bestWorkDay?bestWorkDay.slice(5):'—'; // MM-DD
  const prodEverSub=bestWorkDay?fmtDur(bestWorkMin):(isEs?'Sin datos':'No data');

  // Horniest day EVER (most orgasms in one day)
  let bestOrgDay=null,bestOrgCount=0;
  sortedH.filter(d=>!d._gap).forEach(d=>{const c=d.penalties?.filter(p=>p.type==='macanazo').length||0;if(c>bestOrgCount){bestOrgCount=c;bestOrgDay=d.date;}});
  const hornEverStr=bestOrgDay?bestOrgDay.slice(5):'—';
  const hornEverSub=bestOrgDay?(bestOrgCount+' '+(isEs?'orgasmo(s)':'orgasm(s)')):(isEs?'Sin datos':'No data');

  // Most productive & horniest day OF THE WEEK (by average)
  const dowNames=isEs?['Dom','Lun','Mar','Mié','Jue','Vie','Sáb']:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const dowWork=[],dowOrg=[];for(let k=0;k<7;k++){dowWork.push([]);dowOrg.push([]);}
  sortedH.filter(d=>!d._gap).forEach(d=>{
    const dow=new Date(d.date+'T12:00:00').getDay();
    dowWork[dow].push(d.workDuration||0);
    dowOrg[dow].push(d.penalties?.filter(p=>p.type==='macanazo').length||0);
  });
  let prodDay=-1,prodAvg=0;
  dowWork.forEach((arr,k)=>{if(!arr.length)return;const a=arr.reduce((x,y)=>x+y,0)/arr.length;if(a>prodAvg){prodAvg=a;prodDay=k;}});
  let hornDay=-1,hornAvg=0;
  dowOrg.forEach((arr,k)=>{if(!arr.length)return;const a=arr.reduce((x,y)=>x+y,0)/arr.length;if(a>hornAvg){hornAvg=a;hornDay=k;}});
  const prodDayStr=prodDay>=0?dowNames[prodDay]:'—';
  const prodDaySub=prodDay>=0?('⌀ '+fmtDur(Math.round(prodAvg))):(isEs?'Sin datos':'No data');
  const hornDayStr=hornDay>=0?dowNames[hornDay]:'—';
  const hornDaySub=hornDay>=0?('⌀ '+hornAvg.toFixed(1)):(isEs?'Sin datos':'No data');

  // Insight
  let insight='';
  if(totalTracked<3)insight=isEs?'Sigue registrando días para ver estadísticas personalizadas.':'Keep logging days to see personalized insights.';
  else if(momentum>20)insight=`🚀 Momentum +${momentum}% — tu última semana supera tu promedio histórico.`;
  else if(momentum<-20)insight=`📉 ${isEs?'Semana difícil':'Tough week'} (${momentum}%). Progress isn't linear.`;
  else if(dfPct===100)insight=isEs?'🌟 100% de días sin estimulantes. Disciplina consistente.':'🌟 100% stimulant-free days. Consistent discipline.';
  else if(pfStrk>7)insight=isEs?`✨ ${pfStrk} días sin penalizaciones. ¡Racha limpia!`:`✨ ${pfStrk} days with no rewards. Clean streak!`;
  else if(totalPoms>50)insight=isEs?`🍅 ${totalPoms} pomodoros = ${Math.round(totalPoms*25/60)}h de trabajo enfocado.`:`🍅 ${totalPoms} pomodoros = ${Math.round(totalPoms*25/60)}h of focused work.`;
  else insight=isEs?'📊 Construyendo historial. Más datos = mejores estadísticas.':'📊 Building history. More data = better insights.';

  function statCard(label,value,color,sub,size='xl'){
    const s=dv('card2 ctr');const n=dv(size+' w7 mo');n.style.color=color;n.textContent=value;
    s.appendChild(n);s.appendChild(dv('xs dimmer mt4',label));if(sub)s.appendChild(dv('xs dimmer',sub));return s;
  }
  function grid4(...cards){const g=dv('g4 mb10');g.style.gap='8px';cards.forEach(c=>g.appendChild(c));return g;}

  // ── 1. Score highlights ──────────────────────────────────────────────────
  const gA=dv('g4 mb10');gA.style.gap='8px';
  [[t('best-day'),best,'var(--ac)',t('pts-s')],[t('worst-day'),worst,'var(--ac)',t('pts-s')],
   [t('all-avg'),avg,'var(--ac)',t('pts-day')],[t('last7-avg'),avg7,'var(--ac)',t('pts-s')]].forEach(([l,v,c,sub])=>{
    const s=dv('card2 ctr');const n=dv('xxl w7 mo');n.style.color=c;n.textContent=String(v);
    s.appendChild(n);s.appendChild(dv('xs dimmer mt4',l));gA.appendChild(s);
  });body.appendChild(gA);

  // ── 2. Overview ──────────────────────────────────────────────────────────
  body.appendChild(grid4(
    statCard(t('total-days-lbl'),String(totalTracked),'var(--ac)',null),
    statCard(t('best-streak'),bStrk+'d','var(--cp)',isEs?'sin rojo':'non-red'),
    statCard(t('clean-streak'),pfStrk+'d','var(--ac)',isEs?'sin penalizaciones':'no rewards'),
    statCard(isEs?'Días morados':t('purple-days'),purplePct+'%','var(--cp)',counts.purple+'d')
  ));

  // ── 3. Work: Best days ───────────────────────────────────────────────────
  body.appendChild(grid4(
    statCard(isEs?'Día más productivo (ever)':'Most productive day',prodEverStr,'var(--ac)',prodEverSub),
    statCard(isEs?'Día más productivo (semana)':'Most productive day of week',prodDayStr,'var(--ac)',prodDaySub),
    statCard(t('work-total'),fmtDur(totalWorkMin),'var(--ac)',null),
    statCard(t('work-days-lbl'),workPct+'%','var(--ac)',workDays+'d')
  ));

  // ── 4. Work: Focus & Routine ─────────────────────────────────────────────
  body.appendChild(grid4(
    statCard(t('total-poms'),String(totalPoms),'var(--ac)',null),
    statCard(t('poms-day'),String(pomPerDay),'var(--ac)',null),
    statCard(t('best-morn-lbl'),bestMornStrk+'d','var(--ac)',null),
    statCard(t('total-proc-lbl'),fmtDur(totalProcMin),'var(--ng)',null)
  ));

  // ── 5. Orgasms ───────────────────────────────────────────────────────────
  body.appendChild(grid4(
    statCard(isEs?'Día más cachondo (ever)':'Horniest day',hornEverStr,'var(--ng)',hornEverSub),
    statCard(isEs?'Día más cachondo (semana)':'Horniest day of week',hornDayStr,'var(--ng)',hornDaySub),
    statCard(isEs?'Total orgasmos':'Total orgasms',String(totalOrgasms),'var(--ng)',null),
    statCard(t('clean-org'),orgFreePct+'%','var(--ac)',orgFreeDays+'d')
  ));

  // ── 6. Discipline ────────────────────────────────────────────────────────
  body.appendChild(grid4(
    statCard(t('clean-drugs'),dfPct+'%','var(--ac)',drugFreeDays+'d'),
    statCard(t('best-drug-free'),bestDFStrk+'d','var(--cg)',null),
    statCard(isEs?'Total estimulantes':'Total stimulants',String(totalIndulgences),'var(--ng)',null),
    statCard(t('clean-proc'),procFreePct+'%','var(--ac)',procFreeDays+'d')
  ));

  // ── 7. Sleep ─────────────────────────────────────────────────────────────
  body.appendChild(grid4(
    statCard(t('sleep-total'),fmtDur(totalSleepMin),'var(--ac)',null),
    statCard(t('avg-sleep'),fmtDur(avgSleepMin),'var(--ac)',isEs?'por noche':'per night'),
    statCard(t('early-nights'),earlyNights+'d','var(--cg)',null),
    statCard(t('late-nights-lbl'),lateNights+'d','var(--ng)',null)
  ));

  // ── 8. Day color counts ───────────────────────────────────────────────────
  const dr=dv('row gap8 mb10');
  [['purple','🟣'],['green','🟢'],['yellow','🟡'],['red','🔴']].forEach(([s,e])=>dr.appendChild(sp(`badge s-${s}`,`${e} ${counts[s]}d`)));
  body.appendChild(dr);

  // ── 9. Insight ────────────────────────────────────────────────────────────
  const ib=dv('card2 s-ac fi');ib.appendChild(sp('sm dim',insight));body.appendChild(ib);

  wrap.appendChild(body);return wrap;
}
