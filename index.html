function renderSyncPanel(){
  const card=dv('card fi');
  /* Solid. The gold wash it used to carry is transparent, which is fine for a
     panel sitting on the page and no good at all for one floating over it —
     the words underneath showed straight through the words on top. */
  card.style.cssText='border:1px solid var(--acb);background:var(--sur)';
  const hd=dv('rowb mb12');
  hd.appendChild(sp('ctit',t('sync-title')));
  hd.appendChild(bt('btn-icon','✕',()=>{STATE.showSyncPanel=false;refresh()}));
  card.appendChild(hd);
  /* A device whose clock is out is compensated for silently everywhere else,
     so this is the one place it is said out loud — the numbers stay right
     either way, but a wrong clock is worth knowing about. */
  const off=Math.abs(CLOCK.offMinutes());
  if(CLOCK.checked&&off>=5){
    const w=dv('sm mt2 mb10');w.style.color='var(--cy)';
    w.textContent=t('clock-off').replace('{n}',fmtDur(off)).replace('{dir}',CLOCK.skew<0?t('clock-fast'):t('clock-slow'));
    card.appendChild(w);
  }
  const sbConfigured=!!(window._SUPABASE_URL&&window._SUPABASE_KEY);
  if(!sbConfigured){
    card.appendChild(dv('sm dim','Supabase not configured. Add window._SUPABASE_URL and window._SUPABASE_KEY to the HTML.'));
    return card;
  }
  const hasToken=!!(localStorage.getItem('AUTH_TOKEN'));
  if(hasToken){
    const info=dv('sm cg mb8');info.textContent=t('logged-in');card.appendChild(info);
    const row=dv('row gap8');
    row.appendChild(bt('btn-ac btn-sm',t('pull-cloud'),async()=>{
      // This is a deliberate FORCE pull: it throws local data away and takes the
      // cloud copy instead. That is destructive enough to require a yes, since
      // a cloud copy can easily be older than what is in this browser.
      const remote=await SB.pull();
      if(remote){
        const localDays=(STATE.history||[]).length;
        const cloudDays=(remote.history||[]).length;
        if(!confirm(t('pull-warn').replace('{local}',localDays).replace('{cloud}',cloudDays)))return;
        if(remote.history&&remote.history.length) STATE.history=remote.history.slice(0,MAX_HIST).sort((a,b)=>b.date.localeCompare(a.date));
        if(remote.today) STATE.today={...STATE.today,...remote.today};
        if(remote.diary) STATE.diary=remote.diary;
        if(remote.streak_overrides) STATE.streakOverrides=remote.streak_overrides;
        S.set(K.HIST,STATE.history);S.set(K.TODAY,STATE.today);
        S.set(K.DIARY,STATE.diary);S.set(K.STREAK_OVR,STATE.streakOverrides);
        refresh();alert(t('pull-ok'));
      } else alert(t('pull-fail'));
    }));
    row.appendChild(bt('btn-ghost btn-sm',t('push-cloud'),async()=>{
      // Deliberate: show what is being replaced before overwriting the cloud.
      const local=(STATE.history||[]).length;
      if(SB.pulledOk&&local<SB.cloudDays){
        if(!confirm(t('push-warn').replace('{local}',local).replace('{cloud}',SB.cloudDays)))return;
      }
      await SB.push(STATE.history,STATE.today,STATE.diary,STATE.streakOverrides,{force:true});
      alert(SB.status==='ok'?t('push-ok'):t('push-fail'));
      refresh();
    }));
    row.appendChild(bt('btn-ng btn-sm',t('log-out'),()=>{
      localStorage.removeItem('AUTH_TOKEN');
      localStorage.removeItem('REFRESH_TOKEN'); // leave no half-session behind
      SB.token='';SB.status='local';
      STATE.showSyncPanel=false;refresh();
    }));
    card.appendChild(row);
    return card;
  }
  // Not logged in — show login form
  card.appendChild(dv('sm dim mb10',t('sync-login-hint')));
  const ew=dv('s4 mb8');ew.innerHTML=`<div class="xs dimmer up ls">${t('email-lbl')}</div>`;
  const ei=ip('email','','','you@email.com');ew.appendChild(ei);card.appendChild(ew);
  const pw=dv('s4 mb8');pw.innerHTML=`<div class="xs dimmer up ls">${t('pass-lbl')}</div>`;
  const pi=ip('password','','',t('pass-min'));pw.appendChild(pi);card.appendChild(pw);
  const err=dv('xs ng mb8');card.appendChild(err);
  const loginBtn=bt('btn-ac btn-sm',t('log-in'),async()=>{
    err.textContent='';loginBtn.disabled=true;loginBtn.textContent=t('signing-in');
    const res=await SB.login(ei.value.trim(),pi.value);
    if(res.ok){STATE.showSyncPanel=false;refresh();}
    else{err.textContent=res.error||t('login-failed');loginBtn.disabled=false;loginBtn.textContent=t('log-in');}
  });
  pi.onkeydown=e=>{if(e.key==='Enter')loginBtn.click();};
  card.appendChild(loginBtn);
  return card;
}


/* Opens and closes the note editor for a day.
   Closing it means saving: the typed text is written straight away instead of
   waiting on the 600ms input timer (which could still be pending), and the view
   is re-rendered so the note preview and the button label update on the spot.
   Before this, a saved note only appeared after leaving the day and coming back. */
function toggleDiaryEditor(container,dateKey,button){
  const open=container.querySelector('.diary-wrap');
  if(open){
    const val=diaryValue(open);
    if(val!==null){
      if(val.trim())STATE.diary[dateKey]=val; else delete STATE.diary[dateKey];
      S.set(K.DIARY,STATE.diary);
      SB.push(STATE.history,STATE.today,STATE.diary,STATE.streakOverrides).catch(()=>{});
    }
    open.remove();
    refresh();
    return;
  }
  const dw=renderDiaryFor(dateKey,()=>toggleDiaryEditor(container,dateKey,button));
  dw.className='diary-wrap fi';
  container.appendChild(dw);
  container.querySelector('.diary-area')?.focus();
  if(button)button.textContent='💾 '+t('save-note');
}

/* ═══ DIARY (used inside calendar) ═══ */
/* A starting shape for the day's review. It is only ever offered into an empty
   note — anything already written is left exactly as it is, never merged with
   or replaced by this. The weekly-goal line reflects what is actually still
   open, and the plan line is dropped once there is nothing left to plan. */
function diaryTemplate(){
  const left=goalsOf('week').filter(g=>!g.doneOn).length;
  // → marks the line as a heading of its own. It carries a number that
  // changes, so it can never match the fixed list diaryHeadings holds.
  const weekly='→ '+(left
    ? t('tpl-weekly-left').replace('{n}',left)+'\n'+t('tpl-weekly-plan')+'\n'
    : t('tpl-weekly-done')+'\n');
  return [
    t('tpl-grateful'),'    1. ','    2. ','    3. ','',
    t('tpl-bad'),'','',
    weekly,'',
    t('tpl-why'),'','',
    t('tpl-dream'),'','',
    t('tpl-feel'),'','',
    t('tpl-feel-why'),'','',
    t('tpl-cool'),'','',
    t('tpl-improve'),'','',
    t('tpl-summary'),'','',''
  ].join('\n');
}
/* The template's headings are bolded when a note is read back. The note itself
   stays plain text, so nothing already saved changes shape or risks being
   mangled by a format it was not written in. */
function diaryHeadings(){
  return ['tpl-grateful','tpl-bad','tpl-weekly-plan','tpl-why','tpl-dream',
          'tpl-feel','tpl-feel-why','tpl-cool','tpl-improve','tpl-summary']
    .map(k=>t(k))
    // Wording these two headings once had. Notes already written keep their
    // gold instead of quietly going plain the day the template changes.
    .concat(['1 cosa chida que hice:','1 cosa que puedo mejorar:',
             '1 cool thing I did:','1 thing I can improve:']);
}
function diaryToHtml(text){
  const heads=diaryHeadings();
  const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return esc(text).split('\n').map(line=>{
    const bare=line.trim();
    // '--&gt;' is the arrow the template used to write. Notes already holding
    // it keep their gold.
    return heads.some(h=>bare===h||bare===esc(h))||bare.startsWith('→')||bare.startsWith('--&gt;')
      ? `<span class="w7 ac">${line}</span>` : line;
  }).join('\n');
}

/* A note is one string, and its first line — when it starts with '# ' — is the
   day's title. Keeping the title inside the note means nothing new has to sync
   and every note ever written already reads correctly: it simply has none. */
function noteTitle(text){const m=/^# (.*)(\n|$)/.exec(text||'');return m?m[1]:'';}
function noteBody(text){return (text||'').replace(/^# .*(\n|$)/,'');}
function noteJoin(title,body){const ti=(title||'').trim();return ti?'# '+ti+'\n'+body:body;}
/* What the open editor holds right now, its two fields back as one note. */
function diaryValue(scope){
  const ta=scope.querySelector('.diary-area');if(!ta)return null;
  return noteJoin(scope.querySelector('.diary-title')?.value,ta.value);
}

function renderDiaryFor(dateKey,onSave){
  const wrap=dv('mt10 fi');
  const existing=STATE.diary[dateKey];
  const hasNote=!!(existing&&existing.trim());

  const ti=ip('text','diary-title',noteTitle(existing),t('day-title-ph'));
  ti.style.cssText='width:100%;font-size:22px;font-weight:700;color:var(--ac);margin-bottom:8px';

  const ta=document.createElement('textarea');
  ta.className='diary-area';
  ta.placeholder=t('diary-ph');
  ta.value=hasNote?noteBody(existing):diaryTemplate();
  ta.style.minHeight='260px';
  /* Whose day this is, and whether it has been touched. Picking another day on
     the calendar tears this editor down, and what was typed has to be written
     before it goes — but an untouched template is not a note and must not be
     saved as one. */
  ta.dataset.day=dateKey;

  let saveTimer=null;
  const touch=()=>{
    ta.dataset.dirty='1';
    clearTimeout(saveTimer);
    saveTimer=setTimeout(()=>{
      const v=diaryValue(wrap);
      if(v.trim()) STATE.diary[dateKey]=v;
      else delete STATE.diary[dateKey];
      S.set(K.DIARY,STATE.diary);
      // Push immediately — no debounce, diary must sync
      SB.push(STATE.history,STATE.today,STATE.diary,STATE.streakOverrides).catch(()=>{});
    },600);
  };
  ta.oninput=touch;ti.oninput=touch;

  // Ctrl/⌘+Enter puts the note down without reaching for the button. Enter on
  // the title line goes to the body, the way a title field should.
  const put=e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();if(onSave)onSave();}};
  ta.onkeydown=put;
  ti.onkeydown=e=>{if(e.key==='Enter'&&!e.ctrlKey&&!e.metaKey){e.preventDefault();ta.focus();}else put(e);};

  wrap.appendChild(ti);wrap.appendChild(ta);
  wrap.appendChild(dv('xs dimmer mt4',t('ctrl-save')));
  return wrap;
}

/* ═══ BOOT ═══ */
/* Register the worker that lets the app open without signal. It needs https
   (or localhost), so opening the file straight off the disk simply skips it —
   and the app runs exactly as it always has. */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{});});
}
loadToday();healRepeatsStuckOnDoneDay();applyTheme();

// On boot: PULL from Supabase first (before pushing ANYTHING).
// Supabase is the single source of truth.
// 1. Load localStorage (local cache / fallback)
// 2. Pull from Supabase — Supabase wins for any day where it has newer data
// 3. Push the merged result back (includes any gap days)
// 4. Render
(async()=>{
  // A restore that just happened wins over whatever the cloud is holding —
  // otherwise the boot pull merges the old cloud days straight back in and the
  // restore silently undoes itself.
  const restoring=localStorage.getItem('st_restore_pending')==='1';
  if(restoring){
    localStorage.removeItem('st_restore_pending');
    if(SB.init()){
      // The restored file is the truth here, even if it holds fewer days.
      try{await SB.push(STATE.history,STATE.today,STATE.diary,STATE.streakOverrides,{force:true});}catch(e){}
    }
    render();
    return;
  }
  if(SB.init()){
    try{
      const remote=await SB.pull();
      if(remote){
        // On boot: Supabase is the single source of truth — only pull, NEVER push.
        // Pushing on boot can overwrite good cloud data with stale/empty local data.
        applyRemote(remote);
        // Save a daily backup on first boot of each day (if logged in) — only mark done if it truly succeeded
        const _bkKey='st_last_backup';
        if(localStorage.getItem(_bkKey)!==todayKey()){
          SB.saveBackup(STATE.history,STATE.today,STATE.diary,STATE.streakOverrides).then(ok=>{
            if(ok) localStorage.setItem(_bkKey,todayKey());
          }).catch(()=>{});
        }
      }
    }catch(e){/* Supabase unreachable — use localStorage fallback, will retry on bgSync */}
  }
  render();
})();
/* The daily backup used to happen only at boot, so a device left open for
   days — a phone that never actually closes the app — never took one, and the
   day it was needed there was nothing from that day. This asks every ten
   minutes whether today has one yet, which also covers the app being open
   across midnight. It writes at most one a day; the key is the date itself. */
setInterval(()=>{
  if(!STATE.authed||!SB.init())return;
  const key='st_last_backup';
  if(localStorage.getItem(key)===todayKey())return;
  SB.saveBackup(STATE.history,STATE.today,STATE.diary,STATE.streakOverrides)
    .then(ok=>{if(ok)localStorage.setItem(key,todayKey());}).catch(()=>{});
},10*60*1000);

/* One place decides what Escape closes. Every overlay used to assign
   document.onkeydown as it was drawn, so whichever happened to be drawn last
   owned the key — and the one you were actually looking at might not be it.
   Innermost first: what was opened last is what closes first. */
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  const ms=document.querySelector('.ms-ov');
  if(ms){ms.click();return;}
  // Its own line, because closing it can throw a half-written task away and so
  // it goes through the same question the ✕ and the backdrop ask.
  if(STATE.showAddForm){closeAddForm();return;}
  const open=['showReset','showRewards','restoreList','taskTree','histDay','showTZ','showRules','showSyncPanel','showGoals'].find(k=>STATE[k]);
  if(!open)return;
  STATE[open]=(open==='showTZ'||open==='showRules'||open==='showSyncPanel'||open==='showGoals'||open==='showRewards')?false:(open==='showReset'?0:null);
  // An editor opened inside the one-task overlay leaves with it, rather than
  // being left open on the list underneath.
  if(open==='taskTree')STATE.editingRem=null;
  render();
});

/* Scrolling is when the bubble is meant to arrive, so it answers the scroll
   itself rather than waiting for the next tick — a second of lag reads as the
   thing being slow to notice you. Throttled to one frame, and passive, so it
   can never make the scroll itself stutter. */
let _ppQueued=false;
['scroll','resize'].forEach(ev=>window.addEventListener(ev,()=>{
  if(_ppQueued)return;
  _ppQueued=true;
  requestAnimationFrame(()=>{_ppQueued=false;syncPomoPill();});
},{passive:true}));

// Start clock ticker once (not inside renderApp to prevent accumulation)
let _lastDay=todayKey();
setInterval(()=>{
  const cl=document.getElementById('clk');
  if(cl)cl.textContent=new Date().toLocaleTimeString(STATE.lang==='es'?'es-MX':'en-US',{timeZone:appTZ(),hour:'2-digit',minute:'2-digit',second:'2-digit'});
  // Pomodoro tick. The clock text is patched in place rather than re-rendering
  // the whole app every second, which would fight anything you are typing.
  const p=STATE.pomo;
  // The bubble is patched on the same beat and by the same rule as the card:
  // one second, no re-render, nothing you are typing gets touched.
  syncPomoPill();
  syncPomoTitle();
  if(p&&p.running){
    const left=pomoRemaining(p);
    const cl2=document.getElementById('pomo-clock');
    if(cl2)cl2.textContent=fmtClock(left);
    if(left<=0){
      const wasFocus=p.phase==='focus';
      pomoFinishPhase(true);
      pomoBeep();
      /* Both ends of the cycle get told, not only the end of a focus leg. The
         end of a break is the one you are least likely to be looking at the
         screen for — that is rather the point of a break — and it is also the
         one a locked phone can swallow whole, so it needs the channel that
         works when the app is not on screen. */
      notify(wasFocus?t('pomo-done'):t('pomo-break-over'));
      /* A pomodoro landing while you are writing a task must not take the
         half-written one with it. The phase has already switched either way;
         only the screen waits, and closing the popup redraws it. */
      if(!STATE.showAddForm)render();
    }
  }
  const nd=todayKey();
  if(nd!==_lastDay){
    _lastDay=nd;
    // New day — save yesterday, reset today, then render
    const sk=CALC.streaks(STATE.history,STATE.today);
    upsertHist(CALC.buildEntry(STATE.today,sk,STATE.today._date||nd),STATE.today._date||nd);
    // Reset today to zero
    STATE.today={
      completed:0,target:0,morningCompleted:false,flagCompleted:false,
      pomodoros:0,penalties:[],
      sleep:{sleepDuration:0,napDuration:0,sleptEarly:false,earlyBedStreak:STATE.today.sleep?.earlyBedStreak||0},
      work:{workDuration:0},_date:nd,_ts:CLOCK.now()
    };
    S.set(K.TODAY,STATE.today);
    S.set(K.HIST,STATE.history);
    SB.push(STATE.history,STATE.today,STATE.diary,STATE.streakOverrides).catch(()=>{});
    // Auto-save daily backup at midnight
    SB.saveBackup(STATE.history,STATE.today,STATE.diary,STATE.streakOverrides).catch(()=>{});
    render();
  }
},1000);
</script>
